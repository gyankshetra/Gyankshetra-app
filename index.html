<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gyankshetra - Result & Review</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #f7f9fa;
      color: #333;
      padding-bottom: 30px;
    }
    /* हेडर */
    header {
      background-color: #0b2239;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
    }
    header .title {
      font-size: 1.1rem;
      font-weight: bold;
    }
    
    /* कंटेनर */
    .container {
      max-width: 480px;
      margin: 0 auto;
      padding: 16px;
    }

    /* री-अटेम्प्ट बैज */
    .reattempt-badge {
      display: inline-block;
      background-color: #ffeaa7;
      color: #d63031;
      font-size: 0.8rem;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    /* रिजल्ट हेडर */
    .result-header {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.25rem;
      font-weight: 700;
      color: #b25800;
      margin-bottom: 12px;
    }

    /* छात्र का नाम */
    .user-name {
      font-size: 1.1rem;
      font-weight: 600;
      color: #0b2239;
      margin-bottom: 16px;
      text-align: center;
    }

    /* सर्कुलर प्रोग्रेस */
    .circle-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 16px 0;
    }
    .circle-score {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      border: 8px solid #00a65a;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.8rem;
      font-weight: bold;
      color: #0b2239;
    }

    /* स्टेटिस्टिक्स ग्रिड */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 20px 0;
    }
    .stat-card {
      background: #fff;
      border: 1px solid #e1e4e8;
      border-radius: 8px;
      padding: 10px 4px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .stat-card:hover {
      border-color: #0d5bb5;
      background-color: #f0f7ff;
    }
    .stat-card .value {
      font-size: 1.1rem;
      font-weight: bold;
      color: #111;
      margin-bottom: 4px;
    }
    .stat-card .label {
      font-size: 0.75rem;
      color: #666;
    }

    /* ऐक्शन बटन्स */
    .btn {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
      text-decoration: none;
    }
    .btn-review {
      background-color: #0d5bb5;
      color: #fff;
    }
    .btn-reattempt {
      background-color: #00a65a;
      color: #fff;
    }
    .btn-telegram {
      background-color: #0088cc;
      color: #fff;
    }

    /* क्वेश्चन रिव्यू सेक्शन */
    #review-section {
      display: none;
      margin-top: 20px;
    }
    .review-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .question-card {
      background: #fff;
      border: 1px solid #dfe4ea;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }
    .question-title {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 12px;
      line-height: 1.4;
    }
    .option-list {
      list-style: none;
    }
    .option-item {
      background: #f8f9fa;
      border: 1px solid #dcdde1;
      border-radius: 6px;
      padding: 10px 12px;
      margin-bottom: 8px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .option-item.correct {
      background: #e8f8f0;
      border-color: #00a65a;
      color: #00a65a;
      font-weight: 600;
    }
    .status-badge {
      font-size: 0.8rem;
      color: #555;
      margin-top: 8px;
    }
  </style>
</head>
<body>

  <!-- हेडर -->
  <header>
    <div class="title">Gyankshetra</div>
    <div>JEE/NEET</div>
  </header>

  <div class="container">
    <!-- Re-attempted लेबल -->
    <div id="reattempt-badge" class="reattempt-badge" style="display: none;">Re-attempted</div>

    <div class="result-header">
      <span>🏆</span> Result
    </div>

    <!-- छात्र का नाम -->
    <div class="user-name" id="student-name">विद्यार्थी: लोड हो रहा है...</div>

    <!-- स्कोर प्रतिशत सर्कल -->
    <div class="circle-wrap">
      <div class="circle-score" id="percentage-score">0%</div>
    </div>

    <!-- स्टेटिस्टिक्स कार्ड्स -->
    <div class="stats-grid">
      <div class="stat-card" onclick="filterQuestions('all')">
        <div class="value" id="marks-val">0 / 5</div>
        <div class="label">Marks</div>
      </div>
      <div class="stat-card" onclick="filterQuestions('correct')">
        <div class="value" id="correct-val">0</div>
        <div class="label">Correct</div>
      </div>
      <div class="stat-card" onclick="filterQuestions('wrong')">
        <div class="value" id="wrong-val">0</div>
        <div class="label">Wrong</div>
      </div>
      <div class="stat-card" onclick="filterQuestions('skipped')">
        <div class="value" id="skipped-val">5</div>
        <div class="label">Skipped</div>
      </div>
    </div>

    <!-- मुख्य ऐक्शन बटन्स -->
    <button class="btn btn-review" onclick="toggleReview()">📖 Review All Questions</button>
    <button class="btn btn-reattempt" onclick="triggerReattempt()">🔄 Reattempt</button>
    <button class="btn btn-telegram" onclick="shareToTelegram()">✈️ Share to Telegram</button>

    <!-- क्वेश्चन एनालिसिस व रिव्यू सेक्शन -->
    <div id="review-section">
      <div class="review-header">
        <h3 id="review-title">प्रश्नों का विवरण</h3>
        <button onclick="toggleReview()" style="padding: 4px 8px; cursor: pointer; border-radius: 4px; border: 1px solid #ccc;">बंद करें</button>
      </div>
      <div id="questions-container"></div>
    </div>
  </div>

  <script>
    // टेस्ट और स्टूडेंट डेटा
    const testData = {
      isReattempted: true, // दोबारा प्रयास होने पर true
      studentName: "अमित कुमार", // यहाँ लॉगिन छात्र का नाम सेट करें
      totalMarks: 5,
      questions: [
        {
          id: 1,
          text: "यदि किसी वस्तु का द्रव्यमान पृथ्वी पर 60 kg है, तो चंद्रमा की सतह पर उसका द्रव्यमान और भार क्रमशः क्या होगा? (g = 10 m/s²)",
          options: ["10 kg और 100 N", "60 kg और 600 N", "60 kg और 100 N", "10 kg और 600 N"],
          correctOption: 2,
          status: "skipped"
        },
        {
          id: 2,
          text: "केप्लर के तृतीय नियम के अनुसार, किसी ग्रह का परिक्रमण काल वर्ग (T²) सूर्य से औसत दूरी (r) के किस घात के समानुपाती होता है?",
          options: ["दूरी के वर्ग के", "दूरी के घन के", "दूरी के वर्गमूल के", "चतुर्थ घात के"],
          correctOption: 1,
          status: "skipped"
        },
        {
          id: 3,
          text: "आर्किमिडीज के सिद्धांत के अनुसार, किसी द्रव में डूबी वस्तु पर उत्प्लावन बल किस पर निर्भर करता है?",
          options: ["वस्तु के द्रव्यमान पर", "द्रव के तापमान पर", "विस्थापित द्रव के आयतन और घनत्व पर", "रासायनिक गुणों पर"],
          correctOption: 2,
          status: "skipped"
        }
      ]
    };

    // स्क्रीन लोड होते ही डेटा सेट करना
    function initScreen() {
      if (testData.isReattempted) {
        document.getElementById("reattempt-badge").style.display = "inline-block";
      }

      document.getElementById("student-name").innerText = "विद्यार्थी: " + testData.studentName;

      const correctCount = testData.questions.filter(q => q.status === "correct").length;
      const wrongCount = testData.questions.filter(q => q.status === "wrong").length;
      const skippedCount = testData.questions.filter(q => q.status === "skipped").length;

      document.getElementById("marks-val").innerText = `${correctCount} / ${testData.totalMarks}`;
      document.getElementById("correct-val").innerText = correctCount;
      document.getElementById("wrong-val").innerText = wrongCount;
      document.getElementById("skipped-val").innerText = skippedCount;

      const percentage = Math.round((correctCount / testData.totalMarks) * 100);
      document.getElementById("percentage-score").innerText = percentage + "%";
    }

    // कैटेगरी के अनुसार फ़िल्टर करना
    function filterQuestions(filterType) {
      const container = document.getElementById("questions-container");
      const reviewSection = document.getElementById("review-section");
      reviewSection.style.display = "block";

      let filtered = testData.questions;
      if (filterType !== 'all') {
        filtered = testData.questions.filter(q => q.status === filterType);
        document.getElementById("review-title").innerText = `${filterType.toUpperCase()} प्रश्न (${filtered.length})`;
      } else {
        document.getElementById("review-title").innerText = "सभी प्रश्न";
      }

      container.innerHTML = "";

      if (filtered.length === 0) {
        container.innerHTML = "<p style='color:#777; padding: 10px 0;'>इस श्रेणी में कोई प्रश्न नहीं है।</p>";
        return;
      }

      filtered.forEach((q) => {
        const card = document.createElement("div");
        card.className = "question-card";

        let optionsHtml = "";
        q.options.forEach((opt, idx) => {
          const isCorrect = idx === q.correctOption;
          optionsHtml += `
            <li class="option-item ${isCorrect ? 'correct' : ''}">
              <span>${idx + 1}. ${opt}</span>
              ${isCorrect ? '<span>✔</span>' : ''}
            </li>
          `;
        });

        card.innerHTML = `
          <div class="question-title">Question ${q.id}: ${q.text}</div>
          <ul class="option-list">${optionsHtml}</ul>
          <div class="status-badge">स्थिति: <b>${q.status.toUpperCase()}</b></div>
        `;
        container.appendChild(card);
      });

      reviewSection.scrollIntoView({ behavior: 'smooth' });
    }

    function toggleReview() {
      const section = document.getElementById("review-section");
      if (section.style.display === "block") {
        section.style.display = "none";
      } else {
        filterQuestions('all');
      }
    }

    function triggerReattempt() {
      alert("टेस्ट फिर से शुरू किया जा रहा है...");
    }

    // टेलीग्राम चैनल लिंक इंटिग्रेशन
    function shareToTelegram() {
      const channelLink = "https://t.me/gyankshetra";
      const score = document.getElementById("percentage-score").innerText;
      const marks = document.getElementById("marks-val").innerText;

      const shareText = encodeURIComponent(
        `🎯 Gyankshetra Quiz Result\n\n` +
        `👤 विद्यार्थी: ${testData.studentName}\n` +
        `📊 स्कोर: ${score}\n` +
        `📝 अंक: ${marks}\n\n` +
        `चैनल से जुड़ें:`
      );

      // Telegram शेयर API यूआरएल (जो सीधे आपके चैनल लिंक के साथ शेयर करेगा)
      const telegramUrl = `https://t.me/share/url?url=${encodeURIComponent(channelLink)}&text=${shareText}`;
      window.open(telegramUrl, "_blank");
    }

    initScreen();
  </script>
</body>
</html>
