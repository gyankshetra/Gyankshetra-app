const questions=[["यदि पृथ्वी का द्रव्यमान दोगुना कर दिया जाए और उसकी त्रिज्या आधी कर दी जाए, तो पृथ्वी की सतह पर गुरुत्वीय त्वरण (g) का मान मूल मान का कितना गुना हो जाएगा?",["2 गुना","4 गुना","8 गुना","16 गुना"],2,["गुरुत्वीय त्वरण का सूत्र g = GM/R² होता है। यदि द्रव्यमान M को 2M और त्रिज्या R को R/2 कर दिया जाए, तो नया गुरुत्वीय त्वरण g' = G(2M)/(R/2)² = 2GM/(R²/4) = 8(GM/R²) = 8g होगा। अतः यह मूल मान का 8 गुना हो जाएगा।","गुरुत्वीय त्वरण (g) का मान पृथ्वी की सतह पर लगभग 9.8 m/s² होता है।","सार्वत्रिक गुरुत्वाकर्षण नियतांक (G) का मान पूरे ब्रह्मांड में नियत रहता है, इसका मान 6.67 x 10^-11 N m²/kg² है।","G की खोज वैज्ञानिक हेनरी कैवेन्डिश ने संवेदनशील तुला के प्रयोग द्वारा की थी।","g का मान ध्रुवों (poles) पर अधिकतम और भूमध्य रेखा (equator) पर न्यूनतम होता है।","पृथ्वी के केंद्र पर गुरुत्वीय त्वरण (g) का मान शून्य होता है।","गुरुत्वीय त्वरण (g) एक सदिश राशि है जिसकी दिशा हमेशा पृथ्वी के केंद्र की ओर होती है।","g का मान गिरने वाली वस्तु के द्रव्यमान पर निर्भर नहीं करता है, इसलिए निर्वात में भारी और हल्की वस्तुएं समान दर से गिरती हैं।","पृथ्वी की सतह से ऊपर जाने पर या गहराई में जाने पर दोनों ही स्थितियों में g का मान घटता है।"]],["केप्लर के तृतीय नियम (आवर्तकाल का नियम) के अनुसार, किसी ग्रह के सूर्य के परितः परिक्रमण काल का वर्ग (T²) उसकी सूर्य से औसत दूरी (r) के किस घात के समानुपाती होता है?",["r के वर्ग के","r के घन के","r के वर्गमूल के","r के व्युत्क्रमानुपाती"],1,["केप्लर के तृतीय नियम (लॉ ऑफ पीरियड्स) के अनुसार, किसी ग्रह के सूर्य के चारों ओर परिक्रमण काल का वर्ग (T²) उसकी सूर्य से औसत दूरी के घन (r³) के समानुपाती होता है, अर्थात T² ∝ r³ या T²/r³ = नियतांक।","जोहान्स केप्लर ने डेनमार्क के खगोलविद टाइको ब्राहे के प्रेक्षणों के आधार पर ग्रहों की गति के तीन नियम दिए थे।","केप्लर का प्रथम नियम 'कक्षाओं का नियम' कहलाता है, जिसके अनुसार सभी ग्रह दीर्घवृत्ताकार कक्षाओं में गति करते हैं।","केप्लर का द्वितीय नियम 'क्षेत्रीय चाल का नियम' कोणीय संवेग संरक्षण के सिद्धांत पर आधारित है।","जब कोई ग्रह सूर्य के निकटतम बिंदु (पेरिहेलियन) पर होता है, तो उसकी कक्षीय चाल अधिकतम होती है।","जब कोई ग्रह सूर्य से दूरस्थ बिंदु (एफेलियन) पर होता है, तो उसकी कक्षीय चाल न्यूनतम होती है।","केप्लर के नियमों के गणितीय विश्लेषण से ही सर आइजक न्यूटन को व्युत्क्रम-वर्ग नियम (Inverse-square law) प्रतिपादित करने में मदद मिली।","खगोलीय दूरी को मापने के लिए पृथ्वी और सूर्य के बीच की औसत दूरी को 1 खगोलीय इकाई (1 AU) माना जाता है।","सूर्य से सबसे दूर स्थित ग्रह का परिक्रमण काल सबसे अधिक होता है, जैसे नेप्च्यून का परिक्रमण काल लगभग 165 वर्ष है।"]],["यदि किसी वस्तु का द्रव्यमान पृथ्वी पर 60 किलोग्राम (kg) है, तो चंद्रमा की सतह पर उसका द्रव्यमान और भार क्रमशः क्या होगा? (g = 10 m/s² मान लें)",["10 kg और 100 N","60 kg और 100 N","60 kg और 600 N","10 kg और 600 N"],1,["द्रव्यमान (Mass) एक अदिश राशि है जो स्थान बदलने पर नहीं बदलती, इसलिए चंद्रमा पर भी द्रव्यमान 60 kg ही रहेगा। पृथ्वी पर भार W = m x g = 60 x 10 = 600 N होगा। चंद्रमा पर गुरुत्वाकर्षण बल पृथ्वी का 1/6 होता है, इसलिए चंद्रमा पर भार 600/6 = 100 N होगा।","द्रव्यमान वस्तु में समाहित पदार्थ की मात्रा है, जबकि भार उस वस्तु पर लगने वाला गुरुत्वाकर्षण बल है।","द्रव्यमान का मात्रक किलोग्राम (kg) है और भार का मात्रक न्यूटन (N) होता है।","किसी वस्तु का द्रव्यमान कभी भी शून्य नहीं हो सकता, लेकिन भार शून्य हो सकता है (जैसे अंतरिक्ष या पृथ्वी के केंद्र में)।","चंद्रमा का द्रव्यमान और त्रिज्या पृथ्वी से कम होने के कारण वहां गुरुत्वीय त्वरण पृथ्वी का लगभग 1/6 गुना होता है।","भार को मापने के लिए कमानीदार तुला (Spring balance) का उपयोग किया जाता है जो बल के सिद्धांत पर कार्य करती है।","द्रव्यमान को मापने के लिए भौतिक तुला या दंड तुला (Beam balance) का उपयोग किया जाता है।","भूमध्य रेखा से ध्रुवों की ओर जाने पर g का मान बढ़ने के कारण वस्तु का भार भी बढ़ जाता है।","कृत्रिम उपग्रहों के भीतर अंतरिक्ष यात्री भारहीनता (Weightlessness) का अनुभव करते हैं क्योंकि वे मुक्त रूप से गिरती हुई अवस्था में होते हैं।"]],["जब किसी ठोस वस्तु को किसी द्रव में पूरी तरह या आंशिक रूप से डुबोया जाता है, तो वह ऊपर की ओर एक बल का अनुभव करती है जो उसके द्वारा विस्थापित द्रव के भार के बराबर होता है। इस सिद्धांत को क्या कहते हैं और यह बल क्या कहलाता है?",["पास्कल का नियम, दाब","आर्किमिडीज का सिद्धांत, उत्प्लावन बल","न्यूटन का नियम, गुरुत्वाकर्षण बल","बर्नौली का सिद्धांत, श्यान बल"],1,["इस सिद्धांत को आर्किमिडीज का सिद्धांत कहा जाता है। द्रव द्वारा ऊपर की ओर लगाए जाने वाले इस बल को उत्प्लावन बल (Buoyant Force) कहते हैं। यह बल विस्थापित द्रव के भार के बराबर होता है।","आर्किमिडीज का सिद्धांत जहाजों और पनडुब्बियों के डिजाइन और निर्माण में मुख्य रूप से उपयोग किया जाता है।","लैक्टोमीटर, जो दूध के किसी नमूने की शुद्धता मापने के लिए उपयोग किया जाता है, इसी सिद्धांत पर आधारित है।","हाइड्रोमीटर, जिसका उपयोग द्रवों के घनत्व या विशिष्ट गुरुत्व को मापने के लिए किया जाता है, आर्किमिडीज के सिद्धांत पर कार्य करता है।","उत्प्लावन बल का परिमाण विस्थापित द्रव के आयतन और द्रव के घनत्व पर निर्भर करता है, न कि वस्तु के पदार्थ पर।","यदि वस्तु का घनत्व द्रव के घनत्व से कम है, तो वस्तु द्रव की सतह पर तैरेगी (प्लवन का नियम)।","आपेक्षिक घनत्व (Relative Density) किसी पदार्थ के घनत्व और पानी के घनत्व का अनुपात होता है, इसका कोई मात्रक नहीं होता।","पानी का घनत्व 4 डिग्री सेल्सियस पर अधिकतम (1000 kg/m³) होता है।","लोहे की कील पानी में डूब जाती है क्योंकि उसका घनत्व पानी से अधिक होता है, लेकिन लोहे का बड़ा जहाज पानी विस्थापित करने के विशेष आकार के कारण तैरता रहता है।"]],["पृथ्वी की सतह से किसी पिंड को अंतरिक्ष में भेजने के लिए आवश्यक न्यूनतम वेग (पलायन वेग - Escape Velocity) का मान कितना होता है और क्या यह पिंड के द्रव्यमान पर निर्भर करता है?",["11.2 km/s, हाँ निर्भर करता है","9.8 km/s, नहीं निर्भर नहीं करता","11.2 km/s, नहीं निर्भर नहीं करता","8.0 km/s, हाँ निर्भर करता है"],2,["पृथ्वी के लिए पलायन वेग का मान लगभग 11.2 km/s होता है। पलायन वेग का सूत्र Ve = √(2GM/R) = √(2gR) होता है। इस सूत्र में प्रक्षेपित पिंड का द्रव्यमान (m) शामिल नहीं है, इसलिए पलायन वेग पिंड के द्रव्यमान पर निर्भर नहीं करता है।","पलायन वेग वह न्यूनतम वेग है जिससे किसी पिंड को फेंकने पर वह पृथ्वी के गुरुत्वीय आकर्षण को पार कर जाता है और वापस नहीं लौटता।","चंद्रमा पर पलायन वेग का मान बहुत कम (लगभग 2.38 km/s) होता है, जिसके कारण वहां गैस के अणु ठहर नहीं पाते और वायुमंडल का अभाव है।","कक्षीय वेग (Orbital Velocity) वह वेग है जिससे कोई उपग्रह पृथ्वी के चारों ओर अपनी कक्षा में चक्कर लगाता है, इसका मान सतह के निकट लगभग 7.9 km/s होता है।","पलायन वेग और कक्षीय वेग के बीच संबंध Ve = √2 x Vo (यानी पलायन वेग कक्षीय वेग का लगभग 1.414 गुना) होता है।","भू-स्थिर उपग्रह (Geostationary Satellite) का परिक्रमण काल पृथ्वी के घूर्णन काल के बराबर यानी 24 घंटे होता है।","भू-स्थिर उपग्रह को पृथ्वी की भूमध्यरेखीय कक्षा में लगभग 36,000 किलोमीटर की ऊंचाई पर स्थापित किया जाता है।","ध्रुवीय उपग्रह (Polar Satellites) कम ऊंचाई पर (लगभग 500-800 किमी) ध्रुवों के ऊपर से गुजरते हैं और मौसम तथा जासूसी के लिए उपयोगी होते हैं।","ब्लैक होल का गुरुत्वाकर्षण इतना तीव्र होता है कि वहां से पलायन वेग प्रकाश की गति (3 x 10^8 m/s) से भी अधिक होता है, इसलिए प्रकाश भी वहां से बाहर नहीं निकल पाता।"]]];

function L(k){return (LANG[currentLang]&&LANG[currentLang][k])||LANG.hi[k]||k}
function applyLanguage(){document.documentElement.lang=currentLang==='bh'?'bho':currentLang;document.querySelectorAll('[data-k]').forEach(e=>e.textContent=L(e.dataset.k));document.querySelectorAll('input[name="lang"]').forEach(r=>r.checked=r.value===currentLang);renderLists();if($('loginModal').classList.contains('open'))renderAuth();updateProfile()}
function setLanguage(l){currentLang=l;localStorage.setItem('gyankshetraLang',l);applyLanguage();if(running)render();if(reviewOpen())renderReview();if($('saved').classList.contains('active'))renderSaved();if(viewerOpen())renderViewer();updateResume()}
function toggleDrawer(){$('drawer').classList.toggle('open')}
function nav(id){$('drawer').classList.remove('open');go(id)}
function sub(id,arr){const e=$(id),o=!e.classList.contains('open');e.classList.toggle('open',o);$(arr).textContent=o?'▾':'▸'}
function soon(){alert(L('soon'))}
function users(){const m=JSON.parse(localStorage.getItem('gyankshetraUsers')||'{}');const id=localStorage.getItem('gyankshetraUserId');if(id&&!m[id])m[id]=localStorage.getItem('gyankshetraUserName')||'';return m}
function getUser(){const id=localStorage.getItem('gyankshetraUserId')||'';return{name:localStorage.getItem('gyankshetraUserName')||'',id,logged:!!id&&localStorage.getItem('gyankshetraLoggedIn')!=='0'}}
let cur='home',lastScreen='home';
function toggleSavedNav(){cur==='saved'?go(lastScreen):go('saved')}
function go(id){if(cur==='quiz'&&id!=='quiz')pauseQuiz();if(cur!==id&&cur!=='saved'&&cur!=='profile')lastScreen=cur==='quiz'?'home':cur;cur=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));const m={home:'navHome',tests:'navTests',practice:'navPractice',saved:'navSaved',study:'navStudy'};if(m[id])$(m[id]).classList.add('active');if(id==='saved')openSaved();updateProfile();scrollTo(0,0)}
function requireUser(a){if(getUser().logged)a();else{pendingAction=a;openAuth()}}
let authMode='register';
function openAuth(mode){authMode=mode||(Object.keys(users()).length?'login':'register');renderAuth();$('loginModal').classList.add('open');setTimeout(()=>$('nameInput').focus(),100)}
function renderAuth(){const r=authMode==='register',has=Object.keys(users()).length>0;$('authTitle').textContent=r?L('authNewT'):L('authLoginT');$('authHelp').textContent=r?L('authHelpReg'):L('authHelpLogin');$('authLabel').textContent=r?L('lblName'):L('lblId');$('nameInput').value='';$('nameInput').placeholder=r?L('phName'):L('phId');$('authBtn').textContent=r?L('btnStart'):L('btnLogin');$('authBtn').onclick=r?saveUser:loginById;$('authSwitch').textContent=r?L('swToLogin'):L('swToReg');$('authSwitch').style.display=(r&&!has)?'none':'block'}
function switchAuth(){authMode=authMode==='register'?'login':'register';renderAuth()}
function loginById(){const e=$('nameInput').value.trim().toUpperCase(),m=users(),id=Object.keys(m).find(k=>k.toUpperCase()===e);if(!id){alert(L('wrongId'));return}localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraUserName',m[id]);localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function logout(){pauseQuiz();localStorage.setItem('gyankshetraLoggedIn','0');updateProfile();go('home')}
function toggleProfile(){cur==='profile'?go(lastScreen):go('profile')}
function closeAuth(){$('loginModal').classList.remove('open');pendingAction=null}
function makeId(name,n){const w=name.trim().split(/\s+/)[0].replace(/[^\p{L}\p{N}]+/gu,'').toUpperCase();return '@'+String(n).padStart(2,'0')+'-'+w}
function saveUser(){const n=$('nameInput').value.trim();if(!n){alert(L('needName'));return}const num=Number(localStorage.getItem('gyankshetraNextNumber')||1),id=makeId(n,num),m=users();m[id]=n;localStorage.setItem('gyankshetraUsers',JSON.stringify(m));localStorage.setItem('gyankshetraUserName',n);localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraNextNumber',String(num+1));localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function updateProfile(){const u=getUser();$('profileName').textContent=u.logged?u.name:'Gyankshetra '+L('student');$('profileId').textContent=u.logged?'🆔 '+u.id:L('loginPrompt');$('welcome').textContent=L('hello')+' '+(u.logged?u.name:L('student'))+' 👋';$('profileLoginBtn').style.display=u.logged?'none':'block';$('profileLogoutBtn').style.display=u.logged?'block':'none';const h=JSON.parse(localStorage.getItem('gyankshetraHistory')||'[]');$('historyText').textContent=h.length?`${h.length} ${L('histN')} • ${L('histLast')}: ${h[h.length-1].marks}/${TOTAL}`:L('histNone');$('bestScore').textContent=h.reduce((m,x)=>Math.max(m,Number(x.marks)||0),0)+' / '+TOTAL;updateResume()}
function startQuiz(){qi=0;ans=Array(TOTAL).fill(null);time=0;reviewIndex=0;running=true;clearInterval(timerHandle);go('quiz');render();saveProgress();timerHandle=setInterval(tick,1000)}
function pKey(){return 'gyankshetraProgress_20261008-090322_'+(localStorage.getItem('gyankshetraUserId')||'')}
function saveProgress(){if(running)localStorage.setItem(pKey(),JSON.stringify({qi,ans,time}))}
function getProgress(){try{const p=JSON.parse(localStorage.getItem(pKey())||'null');return p&&Array.isArray(p.ans)&&p.time>0?p:null}catch(e){return null}}
function pauseQuiz(){if(!running)return;saveProgress();running=false;clearInterval(timerHandle);timerHandle=null}
function tick(){if(time<TIME){time++;renderTimer();if(time>=TIME)finish();else if(time%5===0)saveProgress()}else finish()}
function resumeQuiz(){const p=getProgress();if(!p){startQuiz();return}qi=p.qi;ans=p.ans;time=p.time;running=true;clearInterval(timerHandle);go('quiz');render();timerHandle=setInterval(tick,1000)}
function updateResume(){const p=getUser().logged?getProgress():null;document.querySelectorAll('.resumebtn').forEach(b=>{b.style.display=p?'block':'none';if(p)b.textContent='▶ '+L('resume')+' • '+L('q')+' '+(p.qi+1)+'/'+TOTAL+' • '+fmt(TIME-p.time)})}
function fmt(t){t=Math.max(0,t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function renderTimer(){$('timer').textContent=fmt(TIME-time)}
function render(){const q=questions[qi];$('qn').textContent=(qi+1)+'/'+TOTAL;$('question').textContent=q[0];$('options').innerHTML=q[1].map((o,i)=>`<div class="option ${ans[qi]===i?'sel':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join('');$('nextBtn').textContent=qi===TOTAL-1?L('submit'):L('next');$('starBtn').textContent=saved.includes(qi)?'★':'☆';renderTimer()}
function choose(i){ans[qi]=i;saveProgress();render()}
function next(){if(qi<TOTAL-1){qi++;saveProgress();render()}else if(confirm(L('submitQ')))finish()}
function prev(){if(qi>0){qi--;saveProgress();render()}}
function toggleSave(){const p=saved.indexOf(qi);if(p>=0)saved.splice(p,1);else saved.push(qi);localStorage.setItem('gyankshetraSaved_20261008-090322',JSON.stringify(saved));render()}
let vMode='saved',vOrder=[],vi=0,reMode=true,vAtt={},solOpen=false,qFilter='';
function savedItems(){return [...saved].reverse().filter(i=>!qFilter||questions[i][0].includes(qFilter))}
function toggleSearch(){const e=$('sq'),o=e.style.display==='none';e.style.display=o?'block':'none';if(o)e.focus();else{e.value='';qFilter='';renderSaved()}}
function openSaved(){closeViewer();renderSaved()}
function renderSaved(){const a=savedItems();$('savedList').innerHTML=a.length?a.map(i=>`<div class="scard" onclick="openViewer(${i})"><b>${questions[i][0]}</b><small>${L('q')} ${i+1}</small><button class="dots" onclick="dotsClick(event,${i})">⋮</button></div>`).join(''):`<div class="savedempty">${L('empty')}</div>`;if(viewerOpen())renderViewer()}
function dotsClick(e,i){e.stopPropagation();const c=e.target.parentNode,had=c.querySelector('.dmenu');document.querySelectorAll('.dmenu').forEach(x=>x.remove());if(had)return;const m=document.createElement('div');m.className='dmenu';m.textContent=L('del');m.onclick=ev=>{ev.stopPropagation();saved=saved.filter(x=>x!==i);localStorage.setItem('gyankshetraSaved_20261008-090322',JSON.stringify(saved));renderSaved()};c.appendChild(m)}
document.addEventListener('click',()=>document.querySelectorAll('.dmenu').forEach(x=>x.remove()));
function viewerOpen(){return $('viewer').classList.contains('open')}
function openViewer(i){vMode='saved';vOrder=savedItems();vi=Math.max(0,vOrder.indexOf(i));solOpen=false;$('viewer').classList.add('open');renderViewer();$('vbody').scrollTop=0}
function closeViewer(){$('viewer').classList.remove('open');langSheet(false)}
function langSheet(o){$('lsheet').classList.toggle('open',o);$('lsTitle').textContent=L('selLang')}
function toggleMode(){reMode=!reMode;if(reMode)vAtt={};solOpen=false;renderViewer()}
function vChoose(k){const i=vOrder[vi];if(vMode==='saved'&&reMode&&vAtt[i]===undefined){vAtt[i]=k;renderViewer()}}
function vStar(){const i=vOrder[vi];saved=saved.includes(i)?saved.filter(x=>x!==i):[...saved,i];localStorage.setItem('gyankshetraSaved_20261008-090322',JSON.stringify(saved));renderViewer()}
function vSol(){const i=vOrder[vi];if(vMode==='review'||!reMode||vAtt[i]!==undefined){solOpen=!solOpen;renderViewer()}}
function vGo(d){const n=vi+d;if(n<0||n>=vOrder.length)return;vi=n;solOpen=(vMode==='review');renderViewer();$('vbody').scrollTop=0}
function showReview(f){f=f||'all';vMode='review';vOrder=[...Array(TOTAL).keys()].filter(i=>f==='all'||(f==='ok'&&ans[i]===questions[i][2])||(f==='bad'&&ans[i]!==null&&ans[i]!==questions[i][2])||(f==='skip'&&ans[i]===null));if(!vOrder.length){alert(L('noItems'));return}vi=0;solOpen=true;$('viewer').classList.add('open');renderViewer();$('vbody').scrollTop=0}
function renderViewer(){const i=vOrder[vi];if(i===undefined){closeViewer();return}const q=questions[i],rv=vMode==='review',att=rv?ans[i]:vAtt[i],tried=att!==undefined&&att!==null,reveal=rv||!reMode||tried;
$('vtitle').textContent=rv?L('review'):L('savedTitle');$('vmode').textContent=rv?(vi+1)+' / '+vOrder.length:L('mode');$('sw').style.display=rv?'none':'inline-block';$('sw').classList.toggle('on',reMode);
const opts=q[1].map((o,k)=>{const c=reveal&&k===q[2]?'ok':(tried&&k===att?'bad':'');return `<div class="vopt ${c}" onclick="vChoose(${k})"><i>${k+1}.</i>${o}<span class="mk">${c==='ok'?'✓':(c==='bad'?'✗':'')}</span></div>`}).join('');
const status=rv?`<p style="font-size:14px;margin:12px 0 0">${tried?(att===q[2]?'✅ '+L('correct'):'❌ '+L('wrong')):'⏭ '+L('skipped')} • ${L('yours')}: <b>${tried?(att+1)+'. '+q[1][att]:L('none')}</b></p>`:'';
const sol=solOpen&&reveal?`<div class="vsolbox"><b>${L('corrIs')} ${q[2]+1}</b><h4>${L('sol')}</h4><p><b>${L('right')} – ${q[1][q[2]]}</b></p><h3>🔑 ${L('keyp')}</h3><ul>${q[3].map(x=>`<li>${x}</li>`).join('')}</ul></div>`:'';
$('vbody').innerHTML=`<div class="vmeta"><span>${L('q')} ${i+1}</span><button onclick="vStar()">${saved.includes(i)?'★':'☆'}</button></div><div class="vq" style="cursor:pointer" onclick="vSol()">${q[0]}</div>${opts}${status}<button class="vsol ${reveal?'':'dis'}" onclick="vSol()">${solOpen&&reveal?L('hideSol'):L('viewSol')}</button>${reveal?'':`<div class="vhint">${L('hint')}</div>`}${sol}`;
$('vprev').style.visibility=vi===0?'hidden':'visible';$('vnext').style.visibility=vi===vOrder.length-1?'hidden':'visible'}
function starSaved(i,b){const on=saved.includes(i);saved=on?saved.filter(x=>x!==i):[...saved,i];localStorage.setItem('gyankshetraSaved_20261008-090322',JSON.stringify(saved));b.textContent=on?'☆':'★'}
function unsave(i){saved=saved.filter(x=>x!==i);localStorage.setItem('gyankshetraSaved_20261008-090322',JSON.stringify(saved));renderSaved()}
function finish(){if(!running)return;localStorage.removeItem(pKey());running=false;clearInterval(timerHandle);timerHandle=null;const c=ans.filter((a,i)=>a===questions[i][2]).length,w=ans.filter((a,i)=>a!==null&&a!==questions[i][2]).length,s=ans.filter(a=>a===null).length;const h=JSON.parse(localStorage.getItem('gyankshetraHistory')||'[]');h.push({day:new Date().toISOString().slice(0,10),date:new Date().toLocaleString('hi-IN'),test:"9th physics gravitation",marks:c,correct:c,wrong:w,skipped:s});localStorage.setItem('gyankshetraHistory',JSON.stringify(h));$('score').textContent=Math.round(c/TOTAL*100)+'%';$('marks').textContent=c+' / '+TOTAL;$('correct').textContent=c;$('wrong').textContent=w;$('skip').textContent=s;lastRes={c,w,s};paintResult();go('result')}
let analysisOpen=false;
function reviewOpen(){return $('review').classList.contains('active')}
function renderReview(){const q=questions[reviewIndex],a=ans[reviewIndex],ok=a===q[2];$('reviewCard').innerHTML=`<small>${L('q')} ${reviewIndex+1} / ${TOTAL}</small><h3 style="cursor:pointer" onclick="toggleAnalysis()">${q[0]}</h3>${q[1].map((o,i)=>`<div class="option ${i===q[2]?'rv-ok':(i===a?'rv-bad':'')}">${String.fromCharCode(65+i)}. ${o}${i===q[2]?' ☑️':(i===a?' ❌':'')}</div>`).join('')}<p class="reviewstate ${ok?'ok':'bad'}"><b>${ok?'✅ '+L('correct'):'❌ '+L('wrong')}</b></p><p>${L('right')}: <b>${String.fromCharCode(65+q[2])}. ${q[1][q[2]]}</b><br>${L('yours')}: <b>${a===null?L('none'):String.fromCharCode(65+a)+'. '+q[1][a]}</b></p>`;$('analysisBox').innerHTML='<ol>'+q[3].map(x=>`<li>${x}</li>`).join('')+'</ol>';$('analysisBox').classList.toggle('open',analysisOpen);$('analysisBtn').textContent=analysisOpen?L('analysisClose'):L('analysis')}
function toggleAnalysis(){analysisOpen=!analysisOpen;$('analysisBox').classList.toggle('open',analysisOpen);$('analysisBtn').textContent=analysisOpen?L('analysisClose'):L('analysis')}
function reviewNext(){if(reviewIndex<TOTAL-1){reviewIndex++;renderReview()}}
function reviewPrev(){if(reviewIndex>0){reviewIndex--;renderReview()}}
function reattempt(){requireUser(startQuiz)}
const SWIPE_RIGHT_IS_NEXT=false;
(function(){let x0=0,y0=0;const w=$('reviewWrap');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;const right=dx>0;if(right===SWIPE_RIGHT_IS_NEXT)reviewNext();else reviewPrev();const c=$('reviewCard');c.classList.remove('slide');void c.offsetWidth;c.classList.add('slide')},{passive:true})})();
(function(){let x0=0,y0=0;const w=$('vbody');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;vGo((dx>0)===SWIPE_RIGHT_IS_NEXT?1:-1)},{passive:true})})();

const SUBJ=[['s_phy','⚛️',1],['s_chem','🧪',0],['s_bio','🧬',0],['s_hist','🏛️',0],['s_pol','⚖️',0],['s_gs','🔬',0]];
function subRow(s,act){return `<div class="examrow" onclick="${act}"><span>${s[1]}</span><div><b>${L(s[0])}</b><small>${s[2]?'9th physics gravitation':L('comingSub')}</small></div><i>›</i></div>`}
const STUDY={notes:[],ncert:[],papers:[]}; /* फ़ाइल जोड़ने के लिए: notes:[{title:'नाम',url:'https://...pdf'}] */
let studySec=null;
function renderStudy(){const ic={notes:'📝',ncert:'📚',papers:'📃'};$('studyBody').innerHTML=['notes','ncert','papers'].map(k=>{const a=STUDY[k];return `<div class="examrow" onclick="openStudy('${k}')"><span>${ic[k]}</span><div><b>${L(k)}</b><small>${a.length?a.length+' '+L('files'):L('noFile')}</small></div><i>${studySec===k?'⌄':'›'}</i></div>`+(studySec===k?(a.length?a.map(f=>`<a class="card" style="display:block;color:#075fc3;text-decoration:none;font-weight:700" href="${f.url}" target="_blank" rel="noopener">${f.title} ↗</a>`).join(''):`<div class="card"><small>${L('noFile')}</small></div>`):'')}).join('')}
function openStudy(k){studySec=studySec===k?null:k;renderStudy()}
function showStudy(k){studySec=k;renderStudy();nav('study')}
function renderLists(){$('homeSubjects').innerHTML=SUBJ.map(s=>subRow(s,s[2]?"go('tests')":'soon()')).join('');
$('testsBody').innerHTML=SUBJ.map(s=>subRow(s,s[2]?'':'soon()')+(s[2]?`<div class="card"><b>🧪 9th physics gravitation</b><small>${L('testMeta')}</small><button class="primary" onclick="requireUser(startQuiz)">${L('startTest')}</button></div>`:'')).join('');
$('practiceBody').innerHTML=SUBJ.map(s=>subRow(s,s[2]?'requireUser(startQuiz)':'soon()')).join('');renderStudy();renderExam()}
function setExam(x){try{localStorage.setItem('gyankshetraExam',x)}catch(e){}renderExam()}
function renderExam(){let ex='STET';try{ex=localStorage.getItem('gyankshetraExam')||'STET'}catch(e){}document.querySelectorAll('#examChips button').forEach(b=>b.classList.toggle('on',b.dataset.ex===ex))}
/* Test UI: palette + swipe */
function openPalette(){$('palGrid').innerHTML=questions.map((q,i)=>`<button class="${ans[i]!==null&&ans[i]!==undefined?'a':''} ${i===qi?'cur':''}" onclick="jumpQ(${i})">${i+1}</button>`).join('');$('palette').classList.add('open')}
function closePalette(){$('palette').classList.remove('open')}
function jumpQ(i){qi=i;closePalette();saveProgress();render()}
(function(){let x0=0,y0=0;const w=$('quiz');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;if((dx>0)===SWIPE_RIGHT_IS_NEXT){if(qi<TOTAL-1){qi++;saveProgress();render()}}else prev()},{passive:true})})();
/* Result */
let lastRes={c:0,w:0,s:0};
function paintResult(){const {c,w,s}=lastRes,a=c/TOTAL*100,b=a+w/TOTAL*100;$('donut').style.background=`conic-gradient(#1f9d55 0 ${a}%,#e03a3a ${a}% ${b}%,#c9d1dc ${b}% 100%)`;const u=getUser();$('resName').textContent='👤 '+(u.logged?u.name:L('student'))}
function shareResult(){const {c,w,s}=lastRes,u=getUser(),p=Math.round(c/TOTAL*100),link=location.href.split('#')[0].split('?')[0];
const text=`${L('shHead')}\n👤 ${u.logged?u.name:L('student')}\n🏆 ${L('marks')}: ${c}/${TOTAL} (${p}%)\n✅ ${L('correct')}: ${c}  ❌ ${L('wrong')}: ${w}  ⏭ ${L('skipped')}: ${s}\n📢 ${L('shTg')}: https://t.me/gyankshetra\n🔗 ${L('shLink')}: ${link}`;
window.open('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text),'_blank')}
/* Download */
function downloadTest(){const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');const t='<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Gyankshetra</title></head><body style="font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:16px"><h1>Gyankshetra — 9th physics gravitation</h1>'+questions.map((q,i)=>`<h3>${i+1}. ${esc(q[0])}</h3><ol type="A">${q[1].map(o=>`<li>${esc(o)}</li>`).join('')}</ol><p><b>${esc(L('right'))}:</b> ${String.fromCharCode(65+q[2])}. ${esc(q[1][q[2]])}</p><ul>${q[3].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('<hr>')+'<p>📢 https://t.me/gyankshetra</p></body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download='gyankshetra-physics-gravitation.html';document.body.appendChild(a);a.click();a.remove();$('drawer').classList.remove('open')}
applyLanguage();go('home');
</script>
