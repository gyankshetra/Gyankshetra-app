<script>
const $=id=>document.getElementById(id);
const ROOT=/\/(tests|quiz|practice|notes)\/[^\/]*$/.test(location.pathname)?'../':'';
/*GK_DATA_START*/
const TOTAL=5,TIME=300,TEST_NAME="9th physics gravitation",TEST_ID="20261008-090322";
const questions=[["यदि पृथ्वी का द्रव्यमान दोगुना कर दिया जाए और उसकी त्रिज्या आधी कर दी जाए, तो पृथ्वी की सतह पर गुरुत्वीय त्वरण (g) का मान मूल मान का कितना गुना हो जाएगा?",["2 गुना","4 गुना","8 गुना","16 गुना"],2,["गुरुत्वीय त्वरण का सूत्र g = GM/R² होता है। यदि द्रव्यमान M को 2M और त्रिज्या R को R/2 कर दिया जाए, तो नया गुरुत्वीय त्वरण g' = G(2M)/(R/2)² = 2GM/(R²/4) = 8(GM/R²) = 8g होगा। अतः यह मूल मान का 8 गुना हो जाएगा।","गुरुत्वीय त्वरण (g) का मान पृथ्वी की सतह पर लगभग 9.8 m/s² होता है।","सार्वत्रिक गुरुत्वाकर्षण नियतांक (G) का मान पूरे ब्रह्मांड में नियत रहता है, इसका मान 6.67 x 10^-11 N m²/kg² है।","G की खोज वैज्ञानिक हेनरी कैवेन्डिश ने संवेदनशील तुला के प्रयोग द्वारा की थी।","g का मान ध्रुवों (poles) पर अधिकतम और भूमध्य रेखा (equator) पर न्यूनतम होता है।","पृथ्वी के केंद्र पर गुरुत्वीय त्वरण (g) का मान शून्य होता है।","गुरुत्वीय त्वरण (g) एक सदिश राशि है जिसकी दिशा हमेशा पृथ्वी के केंद्र की ओर होती है।","g का मान गिरने वाली वस्तु के द्रव्यमान पर निर्भर नहीं करता है, इसलिए निर्वात में भारी और हल्की वस्तुएं समान दर से गिरती हैं।","पृथ्वी की सतह से ऊपर जाने पर या गहराई में जाने पर दोनों ही स्थितियों में g का मान घटता है।"]],["केप्लर के तृतीय नियम (आवर्तकाल का नियम) के अनुसार, किसी ग्रह के सूर्य के परितः परिक्रमण काल का वर्ग (T²) उसकी सूर्य से औसत दूरी (r) के किस घात के समानुपाती होता है?",["r के वर्ग के","r के घन के","r के वर्गमूल के","r के व्युत्क्रमानुपाती"],1,["केप्लर के तृतीय नियम (लॉ ऑफ पीरियड्स) के अनुसार, किसी ग्रह के सूर्य के चारों ओर परिक्रमण काल का वर्ग (T²) उसकी सूर्य से औसत दूरी के घन (r³) के समानुपाती होता है, अर्थात T² ∝ r³ या T²/r³ = नियतांक।","जोहान्स केप्लर ने डेनमार्क के खगोलविद टाइको ब्राहे के प्रेक्षणों के आधार पर ग्रहों की गति के तीन नियम दिए थे।","केप्लर का प्रथम नियम 'कक्षाओं का नियम' कहलाता है, जिसके अनुसार सभी ग्रह दीर्घवृत्ताकार कक्षाओं में गति करते हैं।","केप्लर का द्वितीय नियम 'क्षेत्रीय चाल का नियम' कोणीय संवेग संरक्षण के सिद्धांत पर आधारित है।","जब कोई ग्रह सूर्य के निकटतम बिंदु (पेरिहेलियन) पर होता है, तो उसकी कक्षीय चाल अधिकतम होती है।","जब कोई ग्रह सूर्य से दूरस्थ बिंदु (एफेलियन) पर होता है, तो उसकी कक्षीय चाल न्यूनतम होती है।","केप्लर के नियमों के गणितीय विश्लेषण से ही सर आइजक न्यूटन को व्युत्क्रम-वर्ग नियम (Inverse-square law) प्रतिपादित करने में मदद मिली।","खगोलीय दूरी को मापने के लिए पृथ्वी और सूर्य के बीच की औसत दूरी को 1 खगोलीय इकाई (1 AU) माना जाता है।","सूर्य से सबसे दूर स्थित ग्रह का परिक्रमण काल सबसे अधिक होता है, जैसे नेप्च्यून का परिक्रमण काल लगभग 165 वर्ष है।"]],["यदि किसी वस्तु का द्रव्यमान पृथ्वी पर 60 किलोग्राम (kg) है, तो चंद्रमा की सतह पर उसका द्रव्यमान और भार क्रमशः क्या होगा? (g = 10 m/s² मान लें)",["10 kg और 100 N","60 kg और 100 N","60 kg और 600 N","10 kg और 600 N"],1,["द्रव्यमान (Mass) एक अदिश राशि है जो स्थान बदलने पर नहीं बदलती, इसलिए चंद्रमा पर भी द्रव्यमान 60 kg ही रहेगा। पृथ्वी पर भार W = m x g = 60 x 10 = 600 N होगा। चंद्रमा पर गुरुत्वाकर्षण बल पृथ्वी का 1/6 होता है, इसलिए चंद्रमा पर भार 600/6 = 100 N होगा।","द्रव्यमान वस्तु में समाहित पदार्थ की मात्रा है, जबकि भार उस वस्तु पर लगने वाला गुरुत्वाकर्षण बल है।","द्रव्यमान का मात्रक किलोग्राम (kg) है और भार का मात्रक न्यूटन (N) होता है।","किसी वस्तु का द्रव्यमान कभी भी शून्य नहीं हो सकता, लेकिन भार शून्य हो सकता है (जैसे अंतरिक्ष या पृथ्वी के केंद्र में)।","चंद्रमा का द्रव्यमान और त्रिज्या पृथ्वी से कम होने के कारण वहां गुरुत्वीय त्वरण पृथ्वी का लगभग 1/6 गुना होता है।","भार को मापने के लिए कमानीदार तुला (Spring balance) का उपयोग किया जाता है जो बल के सिद्धांत पर कार्य करती है।","द्रव्यमान को मापने के लिए भौतिक तुला या दंड तुला (Beam balance) का उपयोग किया जाता है।","भूमध्य रेखा से ध्रुवों की ओर जाने पर g का मान बढ़ने के कारण वस्तु का भार भी बढ़ जाता है।","कृत्रिम उपग्रहों के भीतर अंतरिक्ष यात्री भारहीनता (Weightlessness) का अनुभव करते हैं क्योंकि वे मुक्त रूप से गिरती हुई अवस्था में होते हैं।"]],["जब किसी ठोस वस्तु को किसी द्रव में पूरी तरह या आंशिक रूप से डुबोया जाता है, तो वह ऊपर की ओर एक बल का अनुभव करती है जो उसके द्वारा विस्थापित द्रव के भार के बराबर होता है। इस सिद्धांत को क्या कहते हैं और यह बल क्या कहलाता है?",["पास्कल का नियम, दाब","आर्किमिडीज का सिद्धांत, उत्प्लावन बल","न्यूटन का नियम, गुरुत्वाकर्षण बल","बर्नौली का सिद्धांत, श्यान बल"],1,["इस सिद्धांत को आर्किमिडीज का सिद्धांत कहा जाता है। द्रव द्वारा ऊपर की ओर लगाए जाने वाले इस बल को उत्प्लावन बल (Buoyant Force) कहते हैं। यह बल विस्थापित द्रव के भार के बराबर होता है।","आर्किमिडीज का सिद्धांत जहाजों और पनडुब्बियों के डिजाइन और निर्माण में मुख्य रूप से उपयोग किया जाता है।","लैक्टोमीटर, जो दूध के किसी नमूने की शुद्धता मापने के लिए उपयोग किया जाता है, इसी सिद्धांत पर आधारित है।","हाइड्रोमीटर, जिसका उपयोग द्रवों के घनत्व या विशिष्ट गुरुत्व को मापने के लिए किया जाता है, आर्किमिडीज के सिद्धांत पर कार्य करता है।","उत्प्लावन बल का परिमाण विस्थापित द्रव के आयतन और द्रव के घनत्व पर निर्भर करता है, न कि वस्तु के पदार्थ पर।","यदि वस्तु का घनत्व द्रव के घनत्व से कम है, तो वस्तु द्रव की सतह पर तैरेगी (प्लवन का नियम)।","आपेक्षिक घनत्व (Relative Density) किसी पदार्थ के घनत्व और पानी के घनत्व का अनुपात होता है, इसका कोई मात्रक नहीं होता।","पानी का घनत्व 4 डिग्री सेल्सियस पर अधिकतम (1000 kg/m³) होता है।","लोहे की कील पानी में डूब जाती है क्योंकि उसका घनत्व पानी से अधिक होता है, लेकिन लोहे का बड़ा जहाज पानी विस्थापित करने के विशेष आकार के कारण तैरता रहता है।"]],["पृथ्वी की सतह से किसी पिंड को अंतरिक्ष में भेजने के लिए आवश्यक न्यूनतम वेग (पलायन वेग - Escape Velocity) का मान कितना होता है और क्या यह पिंड के द्रव्यमान पर निर्भर करता है?",["11.2 km/s, हाँ निर्भर करता है","9.8 km/s, नहीं निर्भर नहीं करता","11.2 km/s, नहीं निर्भर नहीं करता","8.0 km/s, हाँ निर्भर करता है"],2,["पृथ्वी के लिए पलायन वेग का मान लगभग 11.2 km/s होता है। पलायन वेग का सूत्र Ve = √(2GM/R) = √(2gR) होता है। इस सूत्र में प्रक्षेपित पिंड का द्रव्यमान (m) शामिल नहीं है, इसलिए पलायन वेग पिंड के द्रव्यमान पर निर्भर नहीं करता है।","पलायन वेग वह न्यूनतम वेग है जिससे किसी पिंड को फेंकने पर वह पृथ्वी के गुरुत्वीय आकर्षण को पार कर जाता है और वापस नहीं लौटता।","चंद्रमा पर पलायन वेग का मान बहुत कम (लगभग 2.38 km/s) होता है, जिसके कारण वहां गैस के अणु ठहर नहीं पाते और वायुमंडल का अभाव है।","कक्षीय वेग (Orbital Velocity) वह वेग है जिससे कोई उपग्रह पृथ्वी के चारों ओर अपनी कक्षा में चक्कर लगाता है, इसका मान सतह के निकट लगभग 7.9 km/s होता है।","पलायन वेग और कक्षीय वेग के बीच संबंध Ve = √2 x Vo (यानी पलायन वेग कक्षीय वेग का लगभग 1.414 गुना) होता है।","भू-स्थिर उपग्रह (Geostationary Satellite) का परिक्रमण काल पृथ्वी के घूर्णन काल के बराबर यानी 24 घंटे होता है।","भू-स्थिर उपग्रह को पृथ्वी की भूमध्यरेखीय कक्षा में लगभग 36,000 किलोमीटर की ऊंचाई पर स्थापित किया जाता है।","ध्रुवीय उपग्रह (Polar Satellites) कम ऊंचाई पर (लगभग 500-800 किमी) ध्रुवों के ऊपर से गुजरते हैं और मौसम तथा जासूसी के लिए उपयोगी होते हैं।","ब्लैक होल का गुरुत्वाकर्षण इतना तीव्र होता है कि वहां से पलायन वेग प्रकाश की गति (3 x 10^8 m/s) से भी अधिक होता है, इसलिए प्रकाश भी वहां से बाहर नहीं निकल पाता।"]]];

const TR={"en": [["If the mass of the Earth is doubled and its radius is halved, by what factor will the acceleration due to gravity (g) at the Earth's surface change?", ["2 times", "4 times", "8 times", "16 times"], ["The formula for gravitational acceleration is g = GM/R². If M becomes 2M and R becomes R/2, the new g' = G(2M)/(R/2)² = 2GM/(R²/4) = 8(GM/R²) = 8g. So it becomes 8 times the original value.", "The value of g at the Earth's surface is about 9.8 m/s².", "The universal gravitational constant (G) is the same throughout the universe; its value is 6.67 × 10^-11 N m²/kg².", "G was determined by the scientist Henry Cavendish using a sensitive torsion balance experiment.", "g is maximum at the poles and minimum at the equator.", "The value of g at the centre of the Earth is zero.", "g is a vector quantity and its direction is always towards the centre of the Earth.", "g does not depend on the mass of the falling object, so heavy and light objects fall at the same rate in a vacuum.", "The value of g decreases both when going above the Earth's surface and when going deep below it."]], ["According to Kepler's third law (law of periods), the square of the orbital period (T²) of a planet around the Sun is proportional to which power of its mean distance (r) from the Sun?", ["Square of r", "Cube of r", "Square root of r", "Inversely proportional to r"], ["According to Kepler's third law (law of periods), the square of the orbital period (T²) of a planet around the Sun is proportional to the cube of its mean distance (r³), i.e. T² ∝ r³ or T²/r³ = constant.", "Johannes Kepler gave three laws of planetary motion based on the observations of the Danish astronomer Tycho Brahe.", "Kepler's first law is called the 'law of orbits': all planets move in elliptical orbits.", "Kepler's second law, the 'law of areas', is based on the conservation of angular momentum.", "When a planet is at the point nearest to the Sun (perihelion), its orbital speed is maximum.", "When a planet is at the farthest point from the Sun (aphelion), its orbital speed is minimum.", "Mathematical analysis of Kepler's laws helped Sir Isaac Newton formulate the inverse-square law.", "To measure astronomical distances, the mean Earth–Sun distance is taken as 1 astronomical unit (1 AU).", "The planet farthest from the Sun has the longest orbital period; for example, Neptune's period is about 165 years."]], ["If an object has a mass of 60 kg on Earth, what will its mass and weight be on the Moon's surface respectively? (Take g = 10 m/s²)", ["10 kg and 100 N", "60 kg and 100 N", "60 kg and 600 N", "10 kg and 600 N"], ["Mass is a scalar quantity that does not change with location, so the mass on the Moon is still 60 kg. On Earth the weight is W = m × g = 60 × 10 = 600 N. Gravity on the Moon is 1/6 of Earth's, so the weight on the Moon is 600/6 = 100 N.", "Mass is the quantity of matter in an object, while weight is the gravitational force acting on it.", "The unit of mass is the kilogram (kg) and the unit of weight is the newton (N).", "The mass of an object can never be zero, but its weight can be zero (for example in space or at the Earth's centre).", "Because the Moon's mass and radius are smaller than the Earth's, its gravitational acceleration is about 1/6 that of Earth.", "Weight is measured with a spring balance, which works on the principle of force.", "Mass is measured with a physical balance or beam balance.", "Moving from the equator towards the poles, g increases, so the weight of an object also increases.", "Astronauts inside artificial satellites experience weightlessness because they are in a state of free fall."]], ["When a solid object is fully or partially immersed in a liquid, it experiences an upward force equal to the weight of the liquid it displaces. What is this principle called, and what is this force called?", ["Pascal's law, pressure", "Archimedes' principle, buoyant force", "Newton's law, gravitational force", "Bernoulli's principle, viscous force"], ["This principle is called Archimedes' principle. The upward force exerted by the liquid is called the buoyant force, and it equals the weight of the displaced liquid.", "Archimedes' principle is mainly used in the design and construction of ships and submarines.", "The lactometer, used to check the purity of a milk sample, is based on this principle.", "The hydrometer, used to measure the density or specific gravity of liquids, works on Archimedes' principle.", "The magnitude of the buoyant force depends on the volume of liquid displaced and the density of the liquid, not on the material of the object.", "If the density of the object is less than that of the liquid, the object floats on the surface (law of flotation).", "Relative density is the ratio of the density of a substance to the density of water; it has no unit.", "The density of water is maximum (1000 kg/m³) at 4 °C.", "An iron nail sinks in water because its density is higher than water's, but a large iron ship floats because of its special shape that displaces a lot of water."]], ["What is the minimum velocity (escape velocity) required to send an object from the Earth's surface into space, and does it depend on the mass of the object?", ["11.2 km/s, yes it depends", "9.8 km/s, no it does not depend", "11.2 km/s, no it does not depend", "8.0 km/s, yes it depends"], ["The escape velocity of the Earth is about 11.2 km/s. The formula is Ve = √(2GM/R) = √(2gR). The mass (m) of the projected object does not appear in the formula, so escape velocity does not depend on the mass of the object.", "Escape velocity is the minimum velocity with which an object, when thrown, overcomes the Earth's gravitational pull and does not return.", "The escape velocity on the Moon is very low (about 2.38 km/s), which is why gas molecules cannot stay there and the Moon has no atmosphere.", "Orbital velocity is the velocity with which a satellite revolves around the Earth in its orbit; near the surface it is about 7.9 km/s.", "The relation between escape velocity and orbital velocity is Ve = √2 × Vo (about 1.414 times the orbital velocity).", "The period of a geostationary satellite equals the Earth's rotation period, i.e. 24 hours.", "A geostationary satellite is placed in the Earth's equatorial orbit at a height of about 36,000 km.", "Polar satellites pass over the poles at low altitude (about 500–800 km) and are useful for weather and surveillance.", "A black hole's gravity is so strong that the escape velocity there exceeds the speed of light (3 × 10^8 m/s), so even light cannot escape."]]], "bh": [["अगर पृथ्वी के द्रव्यमान दुगुना कर दिहल जाव आ ओकर त्रिज्या आधा कर दिहल जाव, त पृथ्वी के सतह पर गुरुत्वीय त्वरण (g) के मान मूल मान के केतना गुना हो जाई?", ["2 गुना", "4 गुना", "8 गुना", "16 गुना"], ["गुरुत्वीय त्वरण के सूत्र g = GM/R² होला। अगर द्रव्यमान M के 2M आ त्रिज्या R के R/2 कर दिहल जाव, त नया g' = G(2M)/(R/2)² = 2GM/(R²/4) = 8(GM/R²) = 8g हो जाई। एहसे ई मूल मान के 8 गुना हो जाई।", "पृथ्वी के सतह पर g के मान लगभग 9.8 m/s² होला।", "सार्वत्रिक गुरुत्वाकर्षण नियतांक (G) के मान पूरा ब्रह्मांड में एके रहेला, एकर मान 6.67 x 10^-11 N m²/kg² बा।", "G के खोज वैज्ञानिक हेनरी कैवेन्डिश संवेदनशील तुला के प्रयोग से कइले रहलन।", "g के मान ध्रुवन पर सबसे जादे आ भूमध्य रेखा पर सबसे कम होला।", "पृथ्वी के केंद्र पर g के मान शून्य होला।", "g एगो सदिश राशि ह, जेकर दिशा हमेशा पृथ्वी के केंद्र के ओर रहेला।", "g के मान गिरे वाला वस्तु के द्रव्यमान पर निर्भर ना करे, एहसे निर्वात में भारी आ हल्का वस्तु एके रफ्तार से गिरेला।", "पृथ्वी के सतह से ऊपर जाए भा गहिराई में जाए, दूनो हालत में g के मान घटेला।"]], ["केप्लर के तीसरा नियम (आवर्तकाल के नियम) के अनुसार, कवनो ग्रह के सूरुज के चारो ओर परिक्रमण काल के वर्ग (T²) ओकर सूरुज से औसत दूरी (r) के कवन घात के समानुपाती होला?", ["r के वर्ग के", "r के घन के", "r के वर्गमूल के", "r के व्युत्क्रमानुपाती"], ["केप्लर के तीसरा नियम के अनुसार, कवनो ग्रह के सूरुज के चारो ओर परिक्रमण काल के वर्ग (T²) ओकर सूरुज से औसत दूरी के घन (r³) के समानुपाती होला, यानी T² ∝ r³ भा T²/r³ = नियतांक।", "जोहान्स केप्लर डेनमार्क के खगोलविद टाइको ब्राहे के प्रेक्षण के आधार पर ग्रह के गति के तीन नियम देले रहलन।", "केप्लर के पहिला नियम 'कक्षा के नियम' कहाला, जेकरा अनुसार सब ग्रह दीर्घवृत्ताकार कक्षा में चलेला।", "केप्लर के दूसरा नियम 'क्षेत्रीय चाल के नियम' कोणीय संवेग संरक्षण के सिद्धांत पर आधारित बा।", "जब कवनो ग्रह सूरुज के सबसे नजदीक बिंदु (पेरिहेलियन) पर रहेला, त ओकर कक्षीय चाल सबसे जादे होला।", "जब कवनो ग्रह सूरुज से सबसे दूर बिंदु (एफेलियन) पर रहेला, त ओकर कक्षीय चाल सबसे कम होला।", "केप्लर के नियम के गणितीय विश्लेषण से ही सर आइजक न्यूटन के व्युत्क्रम-वर्ग नियम बनावे में मदद मिलल।", "खगोलीय दूरी नापे खातिर पृथ्वी आ सूरुज के बीच के औसत दूरी के 1 खगोलीय इकाई (1 AU) मानल जाला।", "सूरुज से सबसे दूर के ग्रह के परिक्रमण काल सबसे जादे होला, जइसे नेप्च्यून के परिक्रमण काल लगभग 165 साल बा।"]], ["अगर कवनो वस्तु के द्रव्यमान पृथ्वी पर 60 किलोग्राम (kg) बा, त चंद्रमा के सतह पर ओकर द्रव्यमान आ भार क्रम से का होई? (g = 10 m/s² मान लीं)", ["10 kg आ 100 N", "60 kg आ 100 N", "60 kg आ 600 N", "10 kg आ 600 N"], ["द्रव्यमान एगो अदिश राशि ह जे जगह बदलला पर ना बदले, एहसे चंद्रमा पर भी द्रव्यमान 60 kg ही रही। पृथ्वी पर भार W = m x g = 60 x 10 = 600 N होला। चंद्रमा पर गुरुत्वाकर्षण बल पृथ्वी के 1/6 होला, एहसे चंद्रमा पर भार 600/6 = 100 N होई।", "द्रव्यमान वस्तु में मौजूद पदार्थ के मात्रा ह, जबकि भार ओह वस्तु पर लागे वाला गुरुत्वाकर्षण बल ह।", "द्रव्यमान के मात्रक किलोग्राम (kg) आ भार के मात्रक न्यूटन (N) होला।", "कवनो वस्तु के द्रव्यमान कबो शून्य ना हो सके, लेकिन भार शून्य हो सकेला (जइसे अंतरिक्ष भा पृथ्वी के केंद्र में)।", "चंद्रमा के द्रव्यमान आ त्रिज्या पृथ्वी से कम होखे के कारण उहाँ गुरुत्वीय त्वरण पृथ्वी के लगभग 1/6 गुना होला।", "भार नापे खातिर कमानीदार तुला (Spring balance) के इस्तेमाल होला, जे बल के सिद्धांत पर काम करेला।", "द्रव्यमान नापे खातिर भौतिक तुला भा दंड तुला (Beam balance) के इस्तेमाल होला।", "भूमध्य रेखा से ध्रुवन के ओर जाए पर g के मान बढ़ेला, एहसे वस्तु के भार भी बढ़ जाला।", "कृत्रिम उपग्रह के भीतर अंतरिक्ष यात्री भारहीनता महसूस करेलन, काहे कि उ मुक्त रूप से गिरत हालत में रहेलन।"]], ["जब कवनो ठोस वस्तु के कवनो द्रव में पूरा तरह भा आंशिक रूप से डुबावल जाला, त उ ऊपर के ओर एगो बल महसूस करेले जे ओकरा से विस्थापित द्रव के भार के बराबर होला। एह सिद्धांत के का कहल जाला आ ई बल का कहाला?", ["पास्कल के नियम, दाब", "आर्किमिडीज के सिद्धांत, उत्प्लावन बल", "न्यूटन के नियम, गुरुत्वाकर्षण बल", "बर्नौली के सिद्धांत, श्यान बल"], ["एह सिद्धांत के आर्किमिडीज के सिद्धांत कहल जाला। द्रव के ओर से ऊपर लागे वाला एह बल के उत्प्लावन बल (Buoyant Force) कहल जाला। ई बल विस्थापित द्रव के भार के बराबर होला।", "आर्किमिडीज के सिद्धांत जहाज आ पनडुब्बी के डिजाइन आ निर्माण में मुख्य रूप से काम आवेला।", "लैक्टोमीटर, जे दूध के शुद्धता नापे में काम आवेला, एहि सिद्धांत पर आधारित बा।", "हाइड्रोमीटर, जेकरा से द्रव के घनत्व भा विशिष्ट गुरुत्व नापल जाला, आर्किमिडीज के सिद्धांत पर काम करेला।", "उत्प्लावन बल के परिमाण विस्थापित द्रव के आयतन आ द्रव के घनत्व पर निर्भर करेला, वस्तु के पदार्थ पर ना।", "अगर वस्तु के घनत्व द्रव से कम बा, त वस्तु द्रव के सतह पर तैरी (प्लवन के नियम)।", "आपेक्षिक घनत्व (Relative Density) कवनो पदार्थ के घनत्व आ पानी के घनत्व के अनुपात होला, एकर कवनो मात्रक ना होला।", "पानी के घनत्व 4 डिग्री सेल्सियस पर सबसे जादे (1000 kg/m³) होला।", "लोहा के कील पानी में डूब जाले काहे कि ओकर घनत्व पानी से जादे बा, बाकिर लोहा के बड़ जहाज पानी विस्थापित करे वाला खास आकार के कारण तैरत रहेला।"]], ["पृथ्वी के सतह से कवनो पिंड के अंतरिक्ष में भेजे खातिर जरूरी न्यूनतम वेग (पलायन वेग - Escape Velocity) के मान केतना होला आ का ई पिंड के द्रव्यमान पर निर्भर करेला?", ["11.2 km/s, हँ, निर्भर करेला", "9.8 km/s, ना, निर्भर ना करे", "11.2 km/s, ना, निर्भर ना करे", "8.0 km/s, हँ, निर्भर करेला"], ["पृथ्वी खातिर पलायन वेग के मान लगभग 11.2 km/s होला। पलायन वेग के सूत्र Ve = √(2GM/R) = √(2gR) ह। एह सूत्र में फेंकल जाए वाला पिंड के द्रव्यमान (m) नइखे, एहसे पलायन वेग पिंड के द्रव्यमान पर निर्भर ना करे।", "पलायन वेग उ न्यूनतम वेग ह जेकरा से कवनो पिंड के फेंकला पर उ पृथ्वी के गुरुत्वीय आकर्षण पार कर जाला आ वापस ना लौटे।", "चंद्रमा पर पलायन वेग के मान बहुत कम (लगभग 2.38 km/s) होला, एहसे उहाँ गैस के अणु ना ठहर पावेला आ वायुमंडल नइखे।", "कक्षीय वेग (Orbital Velocity) उ वेग ह जेकरा से कवनो उपग्रह पृथ्वी के चारो ओर आपन कक्षा में चक्कर लगावेला, सतह के नजदीक एकर मान लगभग 7.9 km/s होला।", "पलायन वेग आ कक्षीय वेग के बीच संबंध Ve = √2 x Vo (यानी पलायन वेग कक्षीय वेग के लगभग 1.414 गुना) होला।", "भू-स्थिर उपग्रह (Geostationary Satellite) के परिक्रमण काल पृथ्वी के घूर्णन काल के बराबर यानी 24 घंटा होला।", "भू-स्थिर उपग्रह के पृथ्वी के भूमध्यरेखीय कक्षा में लगभग 36,000 किलोमीटर के ऊँचाई पर स्थापित कइल जाला।", "ध्रुवीय उपग्रह (Polar Satellites) कम ऊँचाई पर (लगभग 500-800 किमी) ध्रुवन के ऊपर से गुजरेला आ मौसम आ जासूसी खातिर काम के होला।", "ब्लैक होल के गुरुत्वाकर्षण एतना तेज होला कि उहाँ से पलायन वेग प्रकाश के गति (3 x 10^8 m/s) से भी जादे होला, एहसे प्रकाश भी बाहर ना निकल पावे।"]]]};

function L(k){return (LANG[currentLang]&&LANG[currentLang][k])||LANG.hi[k]||k}
function applyLanguage(){document.documentElement.lang=currentLang==='bh'?'bho':currentLang;document.querySelectorAll('[data-k]').forEach(e=>e.textContent=L(e.dataset.k));document.querySelectorAll('input[name="lang"]').forEach(r=>r.checked=r.value===currentLang);renderLists();adminUI();if($('loginModal').classList.contains('open'))renderAuth();updateProfile()}
function setLanguage(l){currentLang=l;localStorage.setItem('gyankshetraLang',l);applyLanguage();slideBuild();if($('result').classList.contains('active'))paintResult();if(running)render();if(reviewOpen())renderReview();if($('saved').classList.contains('active'))renderSaved();if(viewerOpen())renderViewer();updateResume()}
function toggleDrawer(){$('drawer').classList.toggle('open')}
function nav(id){$('drawer').classList.remove('open');go(id)}
function sub(id,arr){const e=$(id),o=!e.classList.contains('open');e.classList.toggle('open',o);$(arr).textContent=o?'▾':'▸'}
function soon(){alert(L('soon'))}
function users(){const m=JSON.parse(localStorage.getItem('gyankshetraUsers')||'{}');const id=localStorage.getItem('gyankshetraUserId');if(id&&!m[id])m[id]=localStorage.getItem('gyankshetraUserName')||'';return m}
function getUser(){const id=localStorage.getItem('gyankshetraUserId')||'';return{name:localStorage.getItem('gyankshetraUserName')||'',id,logged:!!id&&localStorage.getItem('gyankshetraLoggedIn')!=='0'}}
let cur='home',lastScreen='home';
function toggleSavedNav(){cur==='saved'?go(lastScreen):go('saved')}
function go(id){if(cur==='quiz'&&id!=='quiz')pauseQuiz();if(cur!==id&&cur!=='saved'&&cur!=='profile')lastScreen=cur==='quiz'?'home':cur;cur=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));const m={home:'navHome',tests:'navTests',practice:'navPractice',saved:'navSaved',study:'navStudy'};if(m[id])$(m[id]).classList.add('active');if(id==='saved')openSaved();if(id==='downloads')renderDownloads();updateProfile();scrollTo(0,0)}
function requireUser(a){if(getUser().logged)a();else{pendingAction=a;openAuth()}}
let authMode='register';
function openAuth(mode){authMode=mode||(Object.keys(users()).length?'login':'register');renderAuth();$('loginModal').classList.add('open');setTimeout(()=>$('nameInput').focus(),100)}
function renderAuth(){const r=authMode==='register',has=Object.keys(users()).length>0;$('authTitle').textContent=r?L('authNewT'):L('authLoginT');$('authHelp').textContent=r?L('authHelpReg'):L('authHelpLogin');$('authLabel').textContent=r?L('lblName'):L('lblId');$('nameInput').value='';$('nameInput').placeholder=r?L('phName'):L('phId');$('authBtn').textContent=r?L('btnStart'):L('btnLogin');$('authBtn').onclick=r?saveUser:loginById;$('authSwitch').textContent=r?L('swToLogin'):L('swToReg');$('authSwitch').style.display=(r&&!has)?'none':'block'}
function switchAuth(){authMode=authMode==='register'?'login':'register';renderAuth()}
function loginById(){const e=$('nameInput').value.trim().toUpperCase(),m=users(),id=Object.keys(m).find(k=>k.toUpperCase()===e);if(!id){alert(L('wrongId'));return}localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraUserName',m[id]);localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function logout(){pauseQuiz();localStorage.setItem('gyankshetraLoggedIn','0');updateProfile();go('home')}
function toggleProfile(){cur==='profile'?go(lastScreen):go('profile')}
function closeAuth(){$('loginModal').classList.remove('open');pendingAction=null}
function makeId(name,n){const w=name.trim().split(/\s+/)[0].replace(/[^\p{L}\p{N}]+/gu,'').toUpperCase();return '@'+String(n).padStart(2,'0')+'-'+w}
function saveUser(){const n=$('nameInput').value.trim();if(!n){alert(L('needName'));return}const num=Number(localStorage.getItem('gyankshetraNextNumber')||1),id=makeId(n,num),m=users();m[id]=n;localStorage.setItem('gyankshetraUsers',JSON.stringify(m));localStorage.setItem('gyankshetraUserName',n);localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraNextNumber',String(num+1));localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function updateProfile(){const u=getUser();$('profileName').textContent=u.logged?u.name:'Gyankshetra '+L('student');$('profileId').textContent=u.logged?'🆔 '+u.id:L('loginPrompt');$('welcome').textContent=L('hello')+' '+(u.logged?u.name:L('student'))+' 👋';$('profileLoginBtn').style.display=u.logged?'none':'block';$('profileLogoutBtn').style.display=u.logged?'block':'none';const h=JSON.parse(localStorage.getItem('gyankshetraHistory')||'[]');$('historyText').textContent=h.length?`${h.length} ${L('histN')} • ${L('histLast')}: ${h[h.length-1].marks}/${h[h.length-1].total||TOTAL}`:L('histNone');{const b=h.reduce((m,x)=>{const t=x.total||TOTAL;return (Number(x.marks)||0)/t>(m?m.marks/m.t:-1)?{marks:Number(x.marks)||0,t}:m},null);$('bestScore').textContent=b?b.marks+' / '+b.t:'0 / '+TOTAL}updateResume()}
function startQuiz(){qi=0;ans=Array(TOTAL).fill(null);time=0;reviewIndex=0;running=true;clearInterval(timerHandle);go('quiz');render();saveProgress();timerHandle=setInterval(tick,1000)}
function pKey(){return 'gyankshetraProgress_'+TEST_ID+'_'+(localStorage.getItem('gyankshetraUserId')||'')}
function saveProgress(){if(running)localStorage.setItem(pKey(),JSON.stringify({qi,ans,time}))}
function getProgress(){try{const p=JSON.parse(localStorage.getItem(pKey())||'null');return p&&Array.isArray(p.ans)&&p.time>0?p:null}catch(e){return null}}
function pauseQuiz(){if(!running)return;saveProgress();running=false;clearInterval(timerHandle);timerHandle=null}
function tick(){if(time<TIME){time++;renderTimer();if(time>=TIME)finish();else if(time%5===0)saveProgress()}else finish()}
function resumeQuiz(){const p=getProgress();if(!p){startQuiz();return}qi=p.qi;ans=p.ans;time=p.time;running=true;clearInterval(timerHandle);go('quiz');render();timerHandle=setInterval(tick,1000)}
function updateResume(){const p=getUser().logged?getProgress():null;document.querySelectorAll('.resumebtn').forEach(b=>{b.style.display=p?'block':'none';if(p)b.textContent='▶ '+L('resume')+' • '+L('q')+' '+(p.qi+1)+'/'+TOTAL+' • '+fmt(TIME-p.time)})}
function fmt(t){t=Math.max(0,t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function renderTimer(){$('timer').textContent=fmt(TIME-time);$('timer').parentElement.classList.toggle('low',TIME-time<=60)}
function render(){const q=Q(qi);$('qn').textContent=(qi+1)+'/'+TOTAL;$('question').textContent=q[0];$('options').innerHTML=q[1].map((o,i)=>`<div class="option ${ans[qi]===i?'sel':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join('');$('nextBtn').textContent=qi===TOTAL-1?L('submit'):L('next');$('starBtn').textContent=saved.includes(qi)?'★':'☆';$('starBtn').classList.toggle('on',saved.includes(qi));renderTimer()}

const BUILTIN_NOTES=[{id:'oxidation',title:'Chemistry — ऑक्सीकरण (Notes)',html:"<h2>ऑक्सीकरण (Oxidation)<\/h2>\n<h3>1. परिभाषा<\/h3>\n<p>किसी पदार्थ में <b>ऑक्सीजन का जुड़ना<\/b> या <b>हाइड्रोजन का हटना<\/b> ऑक्सीकरण कहलाता है। इलेक्ट्रॉन के आधार पर: जब कोई परमाणु या आयन <b>इलेक्ट्रॉन त्यागता<\/b> है और उसका ऑक्सीकरण अंक बढ़ता है, तो वह ऑक्सीकृत होता है।<\/p>\n<h3>2. ऑक्सीकरण और अपचयन की तुलना<\/h3>\n<table><tr><th>आधार<\/th><th>ऑक्सीकरण<\/th><th>अपचयन<\/th><\/tr>\n<tr><td>ऑक्सीजन<\/td><td>जुड़ना<\/td><td>हटना<\/td><\/tr>\n<tr><td>हाइड्रोजन<\/td><td>हटना<\/td><td>जुड़ना<\/td><\/tr>\n<tr><td>इलेक्ट्रॉन<\/td><td>त्यागना (हानि)<\/td><td>ग्रहण करना (लाभ)<\/td><\/tr>\n<tr><td>ऑक्सीकरण अंक<\/td><td>बढ़ना<\/td><td>घटना<\/td><\/tr><\/table>\n<h3>3. याद रखने की ट्रिक<\/h3>\n<p><b>OIL RIG<\/b> — Oxidation Is Loss, Reduction Is Gain (इलेक्ट्रॉन की)।<\/p>\n<h3>4. रेडॉक्स अभिक्रिया<\/h3>\n<p>जिस अभिक्रिया में ऑक्सीकरण और अपचयन <b>एक साथ<\/b> होते हैं, उसे रेडॉक्स (Redox) अभिक्रिया कहते हैं।<\/p>\n<ul><li>2Mg + O₂ → 2MgO : Mg का ऑक्सीकरण, O₂ का अपचयन।<\/li>\n<li>CuO + H₂ → Cu + H₂O : H₂ का ऑक्सीकरण, CuO का अपचयन।<\/li><\/ul>\n<h3>5. ऑक्सीकारक और अपचायक<\/h3>\n<table><tr><th>पदार्थ<\/th><th>कार्य<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>ऑक्सीकारक<\/td><td>दूसरे को ऑक्सीकृत करता है, स्वयं अपचयित होता है<\/td><td>O₂, KMnO₄, K₂Cr₂O₇<\/td><\/tr>\n<tr><td>अपचायक<\/td><td>दूसरे का अपचयन करता है, स्वयं ऑक्सीकृत होता है<\/td><td>H₂, C, Zn, Mg<\/td><\/tr><\/table>\n<h3>6. दैनिक जीवन में ऑक्सीकरण<\/h3>\n<ul><li><b>जंग लगना:<\/b> हवा और नमी में लोहे पर भूरी परत (Fe₂O₃·xH₂O) बनती है।<\/li>\n<li><b>दहन:<\/b> ईंधन का ऑक्सीजन से ऑक्सीकरण, ऊष्मा और प्रकाश निकलता है।<\/li>\n<li><b>श्वसन:<\/b> कोशिकाओं में ग्लूकोज़ का ऑक्सीकरण, ऊर्जा मिलती है।<\/li>\n<li><b>विकृतगंधिता (Rancidity):<\/b> तेल या वसा का ऑक्सीकरण, खाने में बुरी गंध और स्वाद आता है।<\/li>\n<li><b>ताँबे पर हरी परत:<\/b> हवा और नमी से ताँबे का संक्षारण।<\/li><\/ul>\n<h3>7. ऑक्सीकरण से बचाव<\/h3>\n<ul><li>पेंट, तेल या ग्रीस लगाना।<\/li>\n<li>गैल्वनीकरण: लोहे पर जस्ते की परत चढ़ाना।<\/li>\n<li>मिश्रधातु बनाना, जैसे स्टेनलेस स्टील।<\/li>\n<li>खाद्य पदार्थों में एंटीऑक्सीडेंट मिलाना।<\/li>\n<li>चिप्स के पैकेट में नाइट्रोजन गैस भरना।<\/li><\/ul>\n<h3>8. ऑक्सीकरण अंक के मुख्य नियम<\/h3>\n<ol><li>मुक्त तत्व का ऑक्सीकरण अंक 0 होता है।<\/li>\n<li>सरल आयन का ऑक्सीकरण अंक उसके आवेश के बराबर होता है (Na⁺ = +1)।<\/li>\n<li>यौगिक में सभी परमाणुओं के ऑक्सीकरण अंकों का योग 0 होता है।<\/li>\n<li>ऑक्सीजन प्रायः −2 (पेरॉक्साइड में −1) होती है।<\/li>\n<li>हाइड्रोजन प्रायः +1 (धात्विक हाइड्राइड में −1) होता है।<\/li><\/ol>\n<h3>9. परीक्षा के लिए महत्वपूर्ण बिंदु<\/h3>\n<ul><li>ऑक्सीकरण और अपचयन हमेशा साथ-साथ होते हैं।<\/li>\n<li>मैग्नीशियम रिबन जलने पर तेज़ सफ़ेद रोशनी के साथ MgO बनाता है।<\/li>\n<li>धातुओं के ऑक्साइड प्रायः क्षारीय और अधातुओं के ऑक्साइड प्रायः अम्लीय होते हैं।<\/li>\n<li>H₂O₂ ऑक्सीकारक और अपचायक, दोनों की तरह व्यवहार कर सकता है।<\/li><\/ul>"}];

const KINDS={tests:['test','mock'],practice:['quiz','practice','pyq']};
let openSub={tests:null,practice:null};
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function subjOf(t,page){return ((page==='tests'?SUBJ_MAP_T:SUBJ_MAP_Q)[t.subject])||'other'}
function regItems(page,sk){return REG.tests.filter(t=>KINDS[page].includes(t.type)&&subjOf(t,page)===sk)}
function loadReg(){try{const c=JSON.parse(localStorage.getItem('gyankshetraReg')||'null');if(c&&c.tests&&c.study)REG=c}catch(e){}
const g=u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
Promise.all([g(ROOT+'content/generated_tests.json'),g(ROOT+'content/study_material.json')]).then(([t,s])=>{if(!Array.isArray(t)&&!Array.isArray(s))return;REG={tests:Array.isArray(t)?t:REG.tests,study:Array.isArray(s)?s:REG.study};try{localStorage.setItem('gyankshetraReg',JSON.stringify(REG))}catch(e){}renderLists()})}
function itemCard(t){return `<div class="card" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><b>${escH(t.title)}</b><small>${t.questions?t.questions+' '+L('qWord'):''}</small><button class="primary">${L('startTest')}</button>${isAdmin()?`<button class="delbtn" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑 Delete</button>`:''}</div>`}
/* ---- Admin (GitHub token login; GitHub itself enforces permission) ---- */
const ADMIN_USER='gyankshetra';
function ghOwner(){return location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:ADMIN_USER}
function ghRepo(){return location.pathname.split('/').filter(Boolean)[0]||'Gyankshetra-app'}
function adminTok(){try{return localStorage.getItem('gyankshetraAdminToken')||''}catch(e){return ''}}
function isAdmin(){return !!adminTok()&&localStorage.getItem('gyankshetraAdminOk')==='1'}
function gh(path,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+adminTok(),'Accept':'application/vnd.github+json'},opt.headers||{});return fetch('https://api.github.com'+path,opt)}
function b64d(c){return new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\n/g,'')),x=>x.charCodeAt(0)))}
function b64e(t){return btoa(unescape(encodeURIComponent(t)))}
const SLIDE_K=['s_sci','s_soc','s_bgk','s_ca'];let bIdx=0,bPause=0;
function bStep(){const c=$('bTrack').children;return c.length>1?c[1].offsetLeft-c[0].offsetLeft:0}
function bDot(i){document.querySelectorAll('#bDots i').forEach((d,k)=>d.classList.toggle('on',k===i))}
function slideBuild(){const t=$('bTrack');if(!t)return;const msg=k=>escH(L('slideP').replace('{x}',L(k)));
t.innerHTML=SLIDE_K.concat([SLIDE_K[0]]).map(k=>`<div class="banner bslide" onclick="openSection('${k}')"><span>🎯</span><div class="btxt"><b>${escH(L('bannerT'))}</b><small class="slide">${msg(k)}</small></div><button class="bstart"><span>${escH(L('startT'))}</span><i>→</i></button></div>`).join('');
$('bDots').innerHTML=SLIDE_K.map(()=>'<i></i>').join('');const st=bStep();t.style.scrollSnapType='none';t.scrollLeft=bIdx*st;requestAnimationFrame(()=>t.style.scrollSnapType='');bDot(bIdx)}
function openSection(k){openSub.tests=k;go('tests');renderLists()}
function bNext(){const t=$('bTrack'),st=bStep();if(!st)return;t.scrollTo({left:(Math.round(t.scrollLeft/st)+1)*st,behavior:'smooth'})}
(function(){const t=$('bTrack');let tm;t.addEventListener('scroll',()=>{const st=bStep();if(!st)return;bDot(Math.round(t.scrollLeft/st)%4);clearTimeout(tm);tm=setTimeout(()=>{let i=Math.round(t.scrollLeft/st);if(i>=SLIDE_K.length){t.style.scrollSnapType='none';t.scrollLeft=0;requestAnimationFrame(()=>t.style.scrollSnapType='');i=0}bIdx=i;bDot(i)},100)},{passive:true});
['touchstart','mousedown','wheel'].forEach(e=>t.addEventListener(e,()=>{bPause=Date.now()+5000},{passive:true}))})();
setInterval(()=>{if(cur==='home'&&Date.now()>bPause)bNext()},2800);
function goApp(){if(ROOT)location.href=ROOT+'index.html';else go('home')}
function nav_admin(){$('drawer').classList.remove('open');openAdmin()}
function openAdmin(){if(isAdmin()){if(confirm('Admin Logout?'))adminLogout();return}$('tokInput').value='';$('adminModal').classList.add('open')}
function closeAdmin(){$('adminModal').classList.remove('open')}
function adminLogout(){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');adminUI();renderLists()}
function adminUI(){const b=$('adminMenuBtn');if(b)b.textContent=isAdmin()?'🚪 '+L('adminOut'):'🔐 '+L('adminIn')}
async function adminLogin(){const t=$('tokInput').value.trim();if(!t)return;localStorage.setItem('gyankshetraAdminToken',t);try{const u=await (await gh('/user')).json();if(!u.login||u.login.toLowerCase()!==ADMIN_USER)throw 'ID';const r=await (await gh('/repos/'+ghOwner()+'/'+ghRepo())).json();if(!r.permissions||!r.permissions.push)throw 'perm';localStorage.setItem('gyankshetraAdminOk','1');closeAdmin();adminUI();renderLists();alert('✅ Admin login: '+u.login)}catch(e){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');alert('❌ Login nahi hua. Token ya permission galat hai.')}}
function repoPath(u){try{const x=new URL(u,location.href);if(x.origin!==location.origin)return null;let p=decodeURIComponent(x.pathname);const base='/'+ghRepo()+'/';if(location.hostname.endsWith('.github.io')){if(!p.startsWith(base))return null;p=p.slice(base.length)}else p=p.replace(/^\//,'');return p}catch(e){return null}}
async function ghErr(r){let m='';try{m=(await r.json()).message||''}catch(e){}return 'HTTP '+r.status+(m?' — '+m:'')}
async function delTest(u){if(!isAdmin())return;const t=REG.tests.find(x=>x.url===u);if(!t||!confirm('"'+t.title+'" delete karna hai?'))return;const o=ghOwner(),r=ghRepo(),jp='content/generated_tests.json',ep='/repos/'+o+'/'+r+'/contents/'+jp,J={'Content-Type':'application/json'};try{
for(let k=0;k<2;k++){const g=await gh(ep+'?ref='+Date.now());if(!g.ok)throw await ghErr(g);const gj=await g.json();const arr=JSON.parse(b64d(gj.content));if(!Array.isArray(arr))throw 'content/generated_tests.json ka format galat hai';const n=arr.filter(x=>x.url!==u);
const p=await gh(ep,{method:'PUT',headers:J,body:JSON.stringify({message:'Delete test: '+t.title,content:b64e(JSON.stringify(n,null,2)),sha:gj.sha})});if(p.ok)break;if(p.status===409&&k===0)continue;throw await ghErr(p)}
const fp=repoPath(u);if(fp&&/\.(html|json)$/.test(fp)&&fp!=='index.html'&&!fp.startsWith('content/')&&!fp.includes('..')){const fe='/repos/'+o+'/'+r+'/contents/'+fp.split('/').map(encodeURIComponent).join('/');const f=await gh(fe);if(f.ok){const fj=await f.json();if(fj.sha)await gh(fe,{method:'DELETE',headers:J,body:JSON.stringify({message:'Delete test file: '+fp,sha:fj.sha})})}}
REG.tests=REG.tests.filter(x=>x.url!==u);try{localStorage.setItem('gyankshetraReg',JSON.stringify(REG))}catch(e){}renderLists();alert('🗑 Delete ho gaya.')}catch(e){const m=String(e);alert('❌ Delete nahi hua: '+m+(/40[134]|not accessible|permission|Bad credentials/i.test(m)?'\n\nToken me is repo ke liye "Contents: Read and write" permission dein (GitHub → Settings → Developer settings → Fine-grained tokens), phir Admin Logout karke naya token daalein.':''))}}
function builtinCard(){return `<div class="card"><b>🧪 ${TEST_NAME}</b><small>${L('testMeta')}</small><button class="primary" onclick="requireUser(startQuiz)">${L('startTest')}</button></div>`}
function subjBlock(page){const list=SUBJS[page],keys=list.map(s=>s[0]).concat(['other']);
return keys.map(k=>{const s=list.find(x=>x[0]===k)||['sOther','📂',0];const items=regItems(page,k),own=(OWN[page]===k)?1:0,n=items.length+own;
if(k==='other'&&!n)return '';
const open=openSub[page]===k;
return `<div class="examrow" onclick="${n?`toggleSub('${page}','${k}')`:'soon()'}"><span>${s[1]}</span><div><b>${L(s[0])}</b><small>${n?n+' '+L('testsWord'):L('comingSub')}</small></div><i>${open?'⌄':'›'}</i></div>`+(open&&n?(own?builtinRow():'')+items.map(itemRow).join(''):'')}).join('')}
function itemRow(t){return `<div class="qrow" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><span>${escH(t.title)}</span>${isAdmin()?`<button class="qdel" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑</button>`:''}<i>›</i></div>`}
function builtinRow(){return `<div class="qrow" onclick="requireUser(startQuiz)"><span>🧪 ${escH(TEST_NAME)}</span><i>›</i></div>`}
function toggleSub(p,k){openSub[p]=openSub[p]===k?null:k;renderLists()}
function renderLists(){
const all=REG.tests.slice(0,3);$('homeNew').innerHTML=all.length?all.map(itemCard).join(''):`<div class="card"><small>${L('noNew')}</small></div>`;
$('testsBody').innerHTML=subjBlock('tests');$('practiceBody').innerHTML=subjBlock('practice');renderStudy();renderExam()}
function setExam(x){try{localStorage.setItem('gyankshetraExam',x)}catch(e){}renderExam()}
function renderExam(){let ex='STET';try{ex=localStorage.getItem('gyankshetraExam')||'STET'}catch(e){}document.querySelectorAll('#examChips button').forEach(b=>b.classList.toggle('on',b.dataset.ex===ex))}
/* Test UI: palette + swipe */
function openPalette(){$('palGrid').innerHTML=questions.map((q,i)=>`<button class="${ans[i]!==null&&ans[i]!==undefined?'a':''} ${i===qi?'cur':''}" onclick="jumpQ(${i})">${i+1}</button>`).join('');$('palette').classList.add('open')}
function closePalette(){$('palette').classList.remove('open')}
function jumpQ(i){qi=i;closePalette();saveProgress();render()}
(function(){let x0=0,y0=0;const w=$('quiz');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;if((dx>0)===SWIPE_RIGHT_IS_NEXT){if(qi<TOTAL-1){qi++;saveProgress();render()}}else prev()},{passive:true})})();
/* Result */
let lastRes={c:0,w:0,s:0},lastAttempt=1;
function paintResult(){const {c,w,s}=lastRes,a=c/TOTAL*100,b=a+w/TOTAL*100;$('donut').style.background=`conic-gradient(#1f9d55 0 ${a}%,#e03a3a ${a}% ${b}%,#c9d1dc ${b}% 100%)`;const u=getUser();$('resName').textContent='👤 '+(u.logged?u.name:L('student'));$('reTag').classList.toggle('on',lastAttempt>1);$('anBtn').textContent='📚 Analysis';$('tipHint').textContent=({hi:'किसी भी बॉक्स पर टैप करें — उसका Analysis खुलेगा',en:'Tap any box to open its analysis',bh:'कवनो बॉक्स पर टैप करीं — ओकर विश्लेषण खुली'})[currentLang];$('backBtn').textContent=({hi:'🏠 ऐप पर वापस जाएँ',en:'🏠 Back to App',bh:'🏠 ऐप पर लौटीं'})[currentLang]}
function shareResult(){const {c,w,s}=lastRes,u=getUser(),p=Math.round(c/TOTAL*100),link=location.href.split('#')[0].split('?')[0];
const text=`${L('shHead')}\n👤 ${u.logged?u.name:L('student')}\n🏆 ${L('marks')}: ${c}/${TOTAL} (${p}%)\n✅ ${L('correct')}: ${c}  ❌ ${L('wrong')}: ${w}  ⏭ ${L('skipped')}: ${s}\n📢 ${L('shTg')}: https://t.me/gyankshetra\n🔗 ${L('shLink')}: ${link}`;
window.open('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text),'_blank')}
/* Download */
function downloadTest(){const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');const t='<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Gyankshetra</title></head><body style="font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:16px"><h1>Gyankshetra — '+TEST_NAME.replace(/</g,'&lt;')+'</h1>'+questions.map((q0,i)=>{const q=Q(i);return `<h3>${i+1}. ${esc(q[0])}</h3><ol type="A">${q[1].map(o=>`<li>${esc(o)}</li>`).join('')}</ol><p><b>${esc(L('right'))}:</b> ${String.fromCharCode(65+q[2])}. ${esc(q[1][q[2]])}</p><ul>${q[3].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}).join('<hr>')+'<p>📢 https://t.me/gyankshetra</p></body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download='gyankshetra-physics-gravitation.html';document.body.appendChild(a);a.click();a.remove();$('drawer').classList.remove('open')}
applyLanguage();loadStudy();loadReg();adminUI();slideBuild();go('home');if(ROOT){const p=getProgress();requireUser(getUser().logged&&p?resumeQuiz:startQuiz)}
</script>
