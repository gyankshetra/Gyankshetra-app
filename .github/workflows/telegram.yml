name: Gyankshetra AI Test Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gyankshetra-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Gyankshetra Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import re
          import json
          import time
          import html
          import requests
          from datetime import datetime
          from urllib.parse import quote

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          TG = "https://api.telegram.org/bot" + BOT_TOKEN
          GROQ = "https://api.groq.com/openai/v1/chat/completions"

          MODEL = "openai/gpt-oss-20b"

          def tg(method, data=None):
              url = TG + "/" + method
              r = requests.post(url, json=data or {}, timeout=60)
              r.raise_for_status()
              return r.json()

          def send(chat_id, text):
              return tg("sendMessage", {
                  "chat_id": chat_id,
                  "text": text,
                  "disable_web_page_preview": False
              })

          def parse_command(text):
              parts = text.strip().split()

              if not parts:
                  return None

              command = parts[0].lower()

              allowed = [
                  "/test",
                  "/mock",
                  "/quiz",
                  "/practice",
                  "/pyq"
              ]

              if command not in allowed:
                  return None

              if len(parts) < 3:
                  return {
                      "command": command,
                      "topic": "सामान्य विज्ञान",
                      "count": 10
                  }

              try:
                  count = int(parts[-1])
                  topic = " ".join(parts[1:-1]).strip()
              except:
                  count = 10
                  topic = " ".join(parts[1:]).strip()

              if count < 1:
                  count = 1

              if count > 100:
                  count = 100

              if not topic:
                  topic = "सामान्य विज्ञान"

              return {
                  "command": command,
                  "topic": topic,
                  "count": count
              }

          def command_info(command):
              if command == "/quiz":
                  return {
                      "folder": "quiz",
                      "box": "quiz",
                      "label": "Quiz",
                      "emoji": "🎯"
                  }

              if command == "/practice":
                  return {
                      "folder": "practice",
                      "box": "practice",
                      "label": "Practice",
                      "emoji": "📝"
                  }

              if command == "/pyq":
                  return {
                      "folder": "practice",
                      "box": "pyq",
                      "label": "PYQ Practice",
                      "emoji": "📚"
                  }

              if command == "/mock":
                  return {
                      "folder": "tests",
                      "box": "test",
                      "label": "Mock Test",
                      "emoji": "🎯"
                  }

              return {
                  "folder": "tests",
                  "box": "test",
                  "label": "Test Series",
                  "emoji": "📝"
              }

          def groq_batch(topic, count, previous, mode):
              previous_text = ""

              if previous:
                  previous_text = (
                      "\nइन पहले बने प्रश्नों को दोहराना नहीं है:\n"
                      + "\n".join(previous[-10:])
                  )

              mode_text = mode

              prompt = """
          तुम Gyankshetra परीक्षा ऐप के लिए उच्च-स्तरीय MCQ प्रश्न तैयार कर रहे हो।

          विषय: TOPIC
          प्रश्नों की संख्या: COUNT
          प्रकार: MODE

          नियम:
          1. सभी प्रश्न मौलिक और परीक्षा-उपयोगी हों।
          2. प्रश्न हिन्दी में बनाओ।
          3. चार विकल्प A, B, C, D दो।
          4. सही उत्तर केवल 0, 1, 2 या 3 में दो।
          5. हर प्रश्न की व्याख्या स्पष्ट हो।
          6. हर प्रश्न के साथ 8 महत्वपूर्ण तथ्य दो।
          7. प्रश्न दोहराए नहीं जाने चाहिए।
          8. तथ्य प्रश्न से सीधे संबंधित हों।
          9. गलत तथ्य या मनगढ़ंत जानकारी नहीं हो।
          10. यदि प्रकार PYQ Practice है तो इसे वास्तविक प्रमाणित PYQ मत बताओ।
              यह केवल PYQ-style practice है।
          11. केवल JSON लौटाओ।
          12. Markdown, ```json या अतिरिक्त text बिल्कुल मत दो।

          JSON का exact format:

          {
            "questions": [
              {
                "question": "प्रश्न",
                "options": ["विकल्प A", "विकल्प B", "विकल्प C", "विकल्प D"],
                "answer": 0,
                "explanation": "व्याख्या",
                "facts": [
                  "तथ्य 1",
                  "तथ्य 2",
                  "तथ्य 3",
                  "तथ्य 4",
                  "तथ्य 5",
                  "तथ्य 6",
                  "तथ्य 7",
                  "तथ्य 8"
                ]
              }
            ]
          }
          """

              prompt = prompt.replace("TOPIC", topic)
              prompt = prompt.replace("COUNT", str(count))
              prompt = prompt.replace("MODE", mode_text)
              prompt += previous_text

              payload = {
                  "model": MODEL,
                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.4,
                  "reasoning_effort": "low",
                  "reasoning_format": "hidden",
                  "max_completion_tokens": 7000,
                  "response_format": {
                      "type": "json_object"
                  }
              }

              last_error = ""

              for attempt in range(4):
                  try:
                      r = requests.post(
                          GROQ,
                          headers={
                              "Authorization": "Bearer " + GROQ_KEY,
                              "Content-Type": "application/json"
                          },
                          json=payload,
                          timeout=120
                      )

                      if r.status_code == 429:
                          time.sleep(5 + attempt * 5)
                          continue

                      if r.status_code >= 400:
                          raise Exception(
                              "Groq HTTP "
                              + str(r.status_code)
                              + ": "
                              + r.text[:1000]
                          )

                      data = r.json()

                      content = data["choices"][0]["message"]["content"]

                      content = content.strip()

                      if content.startswith("```"):
                          content = re.sub(
                              r"^```(?:json)?",
                              "",
                              content
                          )
                          content = re.sub(
                              r"```$",
                              "",
                              content
                          )
                          content = content.strip()

                      obj = json.loads(content)

                      qs = obj.get("questions", [])

                      if not isinstance(qs, list):
                          raise Exception(
                              "Groq response में questions array नहीं मिला"
                          )

                      clean = []

                      for q in qs:
                          if not isinstance(q, dict):
                              continue

                          question = str(
                              q.get("question", "")
                          ).strip()

                          options = q.get("options", [])
                          answer = q.get("answer", 0)
                          explanation = str(
                              q.get("explanation", "")
                          ).strip()

                          facts = q.get("facts", [])

                          if not isinstance(options, list):
                              continue

                          if len(options) != 4:
                              continue

                          try:
                              answer = int(answer)
                          except:
                              answer = 0

                          if answer < 0 or answer > 3:
                              answer = 0

                          if not isinstance(facts, list):
                              facts = []

                          facts = [
                              str(x).strip()
                              for x in facts
                              if str(x).strip()
                          ]

                          if not question:
                              continue

                          clean.append({
                              "question": question,
                              "options": [
                                  str(x).strip()
                                  for x in options
                              ],
                              "answer": answer,
                              "explanation": explanation,
                              "facts": facts[:10]
                          })

                      if not clean:
                          raise Exception(
                              "Groq ने valid questions नहीं दिए"
                          )

                      return clean

                  except Exception as e:
                      last_error = str(e)
                      time.sleep(2)

              raise Exception(last_error or "Groq generation failed")

          def generate_questions(topic, count, mode):
              all_questions = []
              previous = []

              while len(all_questions) < count:
                  remaining = count - len(all_questions)
                  batch = min(5, remaining)

                  qs = groq_batch(
                      topic,
                      batch,
                      previous,
                      mode
                  )

                  for q in qs:
                      if len(all_questions) >= count:
                          break

                      signature = q["question"].strip().lower()

                      if signature in previous:
                          continue

                      all_questions.append(q)
                      previous.append(signature)

                  if not qs:
                      break

              return all_questions[:count]

          def safe_slug(text):
              text = re.sub(
                  r"[^\w\u0900-\u097F]+",
                  "-",
                  text,
                  flags=re.UNICODE
              )

              text = text.strip("-")

              if not text:
                  text = "test"

              return text[:80]

          def make_question_arrays(questions):
              result = []

              for q in questions:
                  result.append([
                      q["question"],
                      q["options"],
                      q["answer"],
                      q.get("facts", [])
                  ])

              return result

          def patch_master_ui(topic, count, questions):
              master_path = "index.html"

              if not os.path.exists(master_path):
                  raise Exception(
                      "Master index.html नहीं मिला"
                  )

              with open(
                  master_path,
                  "r",
                  encoding="utf-8"
              ) as f:
                  source = f.read()

              arrays = make_question_arrays(questions)

              questions_js = json.dumps(
                  arrays,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

              source = re.sub(
                  r"<title>.*?</title>",
                  "<title>Gyankshetra — "
                  + html.escape(topic)
                  + " "
                  + str(count)
                  + "Q</title>",
                  source,
                  count=1,
                  flags=re.S
              )

              source = re.sub(
                  r"const TOTAL\s*=\s*20\s*,\s*TIME\s*=\s*20\s*\*\s*60\s*;",
                  "const TOTAL="
                  + str(count)
                  + ",TIME="
                  + str(count)
                  + "*60;",
                  source,
                  count=1
              )

              source = re.sub(
                  r"const questions\s*=\s*\[.*?\];",
                  "const questions="
                  + questions_js
                  + ";",
                  source,
                  count=1,
                  flags=re.S
              )

              source = source.replace(
                  "विलयन",
                  topic
              )

              source = source.replace(
                  "20Q",
                  str(count) + "Q"
              )

              source = source.replace(
                  "20 Questions",
                  str(count) + " Questions"
              )

              source = source.replace(
                  "20 प्रश्न",
                  str(count) + " प्रश्न"
              )

              source = source.replace(
                  "20 Marks",
                  str(count) + " Marks"
              )

              source = source.replace(
                  "20 अंक",
                  str(count) + " अंक"
              )

              source = source.replace(
                  "20 Minutes",
                  str(count) + " Minutes"
              )

              source = source.replace(
                  "20 मिनट",
                  str(count) + " मिनट"
              )

              source = source.replace(
                  "c+' / 20'",
                  "c+' / "
                  + str(count)
                  + "'"
              )

              source = source.replace(
                  "test:'विलयन'",
                  "test:"
                  + json.dumps(
                      topic,
                      ensure_ascii=False
                  )
              )

              source = source.replace(
                  "let qi=0,ans=Array(TOTAL).fill(null),time=TIME,",
                  "let qi=0,ans=Array(TOTAL).fill(null),time=0,"
              )

              old_timer = """timerHandle=setInterval(()=>{
      if(time>0){time--;renderTimer()}else finish()
    },1000)"""

              new_timer = """timerHandle=setInterval(()=>{
      if(time<TIME){
        time++;
        renderTimer();
      }else{
        finish();
      }
    },1000)"""

              source = source.replace(
                  old_timer,
                  new_timer
              )

              source = source.replace(
                  'timer.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")',
                  'timer.textContent=String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")'
              )

              source = source.replace(
                  'timer.textContent=String(m).padStart(2,\'0\')+\':\'+String(s).padStart(2,\'0\')',
                  'timer.textContent=String(m).padStart(2,\'0\')+\':\'+String(s).padStart(2,\'0\')'
              )

              return source

          def update_registry(
              topic,
              count,
              command,
              url,
              timestamp
          ):
              os.makedirs(
                  "content",
                  exist_ok=True
              )

              path = "content/generated_tests.json"

              if os.path.exists(path):
                  try:
                      with open(
                          path,
                          "r",
                          encoding="utf-8"
                      ) as f:
                          registry = json.load(f)
                  except:
                      registry = []
              else:
                  registry = []

              if not isinstance(registry, list):
                  registry = []

              info = command_info(command)

              item = {
                  "id": timestamp,
                  "topic": topic,
                  "count": count,
                  "command": command,
                  "box": info["box"],
                  "label": info["label"],
                  "emoji": info["emoji"],
                  "url": url,
                  "created": timestamp
              }

              registry.insert(0, item)

              registry = registry[:200]

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:
                  json.dump(
                      registry,
                      f,
                      ensure_ascii=False,
                      indent=2
                  )

          def update_home_registry():
              path = "index.html"

              if not os.path.exists(path):
                  return

              with open(
                  path,
                  "r",
                  encoding="utf-8"
              ) as f:
                  source = f.read()

              marker = "<!-- GYANKSHETRA_GENERATED_TESTS -->"

              if marker in source:
                  return

              script = """
          <!-- GYANKSHETRA_GENERATED_TESTS -->
          <script>
          (function(){
            const base =
              location.pathname.includes('/tests/') ||
              location.pathname.includes('/quiz/') ||
              location.pathname.includes('/practice/')
                ? '../'
                : './';

            fetch(base + 'content/generated_tests.json')
              .then(r => r.ok ? r.json() : [])
              .then(items => {
                if(!Array.isArray(items)) return;

                const testsBox =
                  document.getElementById('tests');

                const practiceBox =
                  document.getElementById('practice');

                if(!testsBox && !practiceBox) return;

                function addCard(box,item){
                  if(!box) return;

                  const card =
                    document.createElement('div');

                  card.className='card';

                  const title =
                    document.createElement('b');

                  title.textContent =
                    (item.emoji || '📝') +
                    ' ' +
                    item.topic +
                    ' ' +
                    item.count +
                    'Q';

                  const small =
                    document.createElement('small');

                  small.textContent =
                    item.label +
                    ' • ' +
                    item.count +
                    ' Questions';

                  const button =
                    document.createElement('button');

                  button.className='primary';

                  button.textContent='Start Test';

                  button.onclick=function(){
                    location.href =
                      base + item.url;
                  };

                  card.appendChild(title);
                  card.appendChild(small);
                  card.appendChild(button);

                  box.appendChild(card);
                }

                items.forEach(function(item){
                  if(item.box==='test'){
                    addCard(testsBox,item);
                  }else{
                    addCard(practiceBox,item);
                  }
                });
              })
              .catch(function(){});
          })();
          </script>
          """

              source = source.replace(
                  "</body>",
                  script + "\n</body>"
              )

              with open(
                  path,
                  "w",
                  encoding="utf-8"
              ) as f:
                  f.write(source)

          def process(update):
              message = update.get("message", {})
              chat = message.get("chat", {})
              chat_id = chat.get("id")
              text = message.get("text", "")

              if not chat_id:
                  return

              if text.strip().lower() == "/start":
                  send(
                      chat_id,
                      "🤖 Gyankshetra AI Bot तैयार है!\n\n"
                      "/test इतिहास 20\n"
                      "/quiz इतिहास 10\n"
                      "/practice विज्ञान 20\n"
                      "/mock रसायन 30\n"
                      "/pyq BPSC TRE Science 20"
                  )
                  return

              cmd = parse_command(text)

              if not cmd:
                  return

              command = cmd["command"]
              topic = cmd["topic"]
              count = cmd["count"]

              info = command_info(command)

              send(
                  chat_id,
                  "🤖 Groq AI प्रश्न तैयार कर रहा है...\n\n"
                  + info["emoji"]
                  + " "
                  + topic
                  + "\n"
                  + "📌 "
                  + info["label"]
                  + "\n"
                  + "📝 प्रश्न: "
                  + str(count)
                  + "\n\n"
                  + "थोड़ा समय लगेगा..."
              )

              try:
                  questions = generate_questions(
                      topic,
                      count,
                      info["label"]
                  )

                  if len(questions) < count:
                      raise Exception(
                          "मांगे गए "
                          + str(count)
                          + " में केवल "
                          + str(len(questions))
                          + " प्रश्न बने"
                      )

                  now = datetime.utcnow().strftime(
                      "%Y%m%d-%H%M%S"
                  )

                  slug = safe_slug(topic)

                  filename = (
                      slug
                      + "-"
                      + str(count)
                      + "q-"
                      + now
                      + ".html"
                  )

                  folder = info["folder"]

                  os.makedirs(
                      folder,
                      exist_ok=True
                  )

                  generated = patch_master_ui(
                      topic,
                      count,
                      questions
                  )

                  output_path = os.path.join(
                      folder,
                      filename
                  )

                  with open(
                      output_path,
                      "w",
                      encoding="utf-8"
                  ) as f:
                      f.write(generated)

                  url = (
                      "https://gyankshetra.github.io/"
                      "Gyankshetra-app/"
                      + folder
                      + "/"
                      + quote(filename)
                  )

                  update_registry(
                      topic,
                      count,
                      command,
                      folder + "/" + filename,
                      now
                  )

                  update_home_registry()

                  send(
                      chat_id,
                      "✅ Test तैयार है!\n\n"
                      + info["emoji"]
                      + " विषय: "
                      + topic
                      + "\n"
                      + "📌 प्रकार: "
                      + info["label"]
                      + "\n"
                      + "📝 प्रश्न: "
                      + str(count)
                      + "\n"
                      + "🎯 Generated: "
                      + str(len(questions))
                      + "\n\n"
                      + "🔗 LIVE TEST:\n"
                      + url
                  )

              except Exception as e:
                  error_text = str(e)

                  if len(error_text) > 2500:
                      error_text = error_text[:2500]

                  send(
                      chat_id,
                      "❌ Test generate नहीं हो पाया\n\n"
                      + "Error:\n"
                      + error_text
                  )

          offset = 0

          start_time = time.time()

          while time.time() - start_time < 210:
              try:
                  result = tg(
                      "getUpdates",
                      {
                          "timeout": 20,
                          "offset": offset
                      }
                  )

                  updates = result.get(
                      "result",
                      []
                  )

                  for update in updates:
                      offset = update["update_id"] + 1

                      try:
                          process(update)
                      except Exception as e:
                          print(
                              "PROCESS ERROR:",
                              str(e)
                          )

              except Exception as e:
                  print(
                      "POLL ERROR:",
                      str(e)
                  )

                  time.sleep(3)

          print("Gyankshetra Telegram Bot finished.")
          PY

      - name: Commit generated tests
        run: |
          git config user.name "gyankshetra"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tests quiz practice pyq content index.html || true

          if git diff --cached --quiet; then
            echo "No generated files to commit."
          else
            git commit -m "Generate AI test from Telegram"
            git push
          fi
