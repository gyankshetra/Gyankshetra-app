name: Gyankshetra Telegram AI Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

concurrency:
  group: gyankshetra-telegram-bot
  cancel-in-progress: true

jobs:
  telegram-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Run Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import requests

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          TG_URL = f"https://api.telegram.org/bot{BOT_TOKEN}"
          GROQ_URL = "https://api.groq.com/openai/v1/chat/completions"

          def telegram(method, data=None):
              r = requests.post(
                  f"{TG_URL}/{method}",
                  json=data or {},
                  timeout=60
              )
              r.raise_for_status()
              return r.json()

          def send_message(chat_id, text):
              # Telegram message limit
              for i in range(0, len(text), 3900):
                  telegram("sendMessage", {
                      "chat_id": chat_id,
                      "text": text[i:i+3900]
                  })

          def parse_command(text):
              parts = text.strip().split()
              if not parts:
                  return None, None, 20

              command = parts[0].lower()

              count = 20
              if parts and parts[-1].isdigit():
                  count = int(parts[-1])
                  parts = parts[:-1]

              topic = " ".join(parts[1:]).strip()

              if count < 1:
                  count = 1
              if count > 100:
                  count = 100

              return command, topic, count

          def generate_batch(topic, count, command):
              if command == "/pyq":
                  type_instruction = """
                  केवल verified/authentic PYQ की तरह दावा मत करना।
                  यदि वास्तविक PYQ source उपलब्ध नहीं है तो प्रश्न को
                  'PYQ-style practice question' के रूप में तैयार करो।
                  """
              elif command == "/mock":
                  type_instruction = "Mock Test के लिए उच्च स्तर के परीक्षा-उपयोगी प्रश्न बनाओ।"
              elif command == "/practice":
                  type_instruction = "Practice Test के लिए concept + application आधारित प्रश्न बनाओ।"
              else:
                  type_instruction = "Test Series के लिए उच्च स्तर के MCQ बनाओ।"

              prompt = f"""
          तुम Gyankshetra के परीक्षा-प्रश्न निर्माता हो।

          विषय: {topic}
          प्रश्नों की संख्या: {count}

          {type_instruction}

          परीक्षा स्तर:
          STET / BPSC TRE स्तर का कठिन और उपयोगी स्तर रखो।

          नियम:
          1. हर प्रश्न MCQ हो।
          2. प्रत्येक प्रश्न में 4 विकल्प हों।
          3. केवल एक सही उत्तर हो।
          4. प्रश्न दोहराए नहीं जाएँ।
          5. तथ्यात्मक रूप से सही उत्तर दो।
          6. हिंदी में प्रश्न बनाओ।
          7. आवश्यक English/scientific terms को English में ही रख सकते हो।
          8. प्रत्येक प्रश्न के साथ छोटा लेकिन उपयोगी explanation दो।
          9. महत्वपूर्ण परीक्षा तथ्य भी दो।
          10. गलत या काल्पनिक PYQ को authentic PYQ मत बताना।

          केवल JSON दो। कोई अतिरिक्त text नहीं।

          JSON format:
          {{
            "questions": [
              {{
                "question": "प्रश्न",
                "options": [
                  "A. विकल्प",
                  "B. विकल्प",
                  "C. विकल्प",
                  "D. विकल्प"
                ],
                "answer": "A",
                "explanation": "व्याख्या",
                "facts": [
                  "महत्वपूर्ण तथ्य 1",
                  "महत्वपूर्ण तथ्य 2",
                  "महत्वपूर्ण तथ्य 3"
                ]
              }}
            ]
          }}
          """

              payload = {
                  "model": "openai/gpt-oss-20b",
                  "messages": [
                      {
                          "role": "system",
                          "content": "You generate accurate educational MCQs and return valid JSON only."
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "response_format": {
                      "type": "json_object"
                  },
                  "max_completion_tokens": 6000
              }

              r = requests.post(
                  GROQ_URL,
                  headers={
                      "Authorization": f"Bearer {GROQ_KEY}",
                      "Content-Type": "application/json"
                  },
                  json=payload,
                  timeout=120
              )

              if r.status_code != 200:
                  raise Exception(
                      f"Groq API Error {r.status_code}: {r.text[:1000]}"
                  )

              data = r.json()

              content = data["choices"][0]["message"]["content"]

              result = json.loads(content)

              questions = result.get("questions", [])

              if not isinstance(questions, list):
                  raise Exception("AI ने questions list नहीं भेजी।")

              return questions

          def main():
              print("Gyankshetra Telegram Bot started")

              # Telegram polling offset
              offset = 0

              start_time = time.time()

              while time.time() - start_time < 240:

                  try:
                      result = telegram(
                          "getUpdates",
                          {
                              "offset": offset,
                              "timeout": 30,
                              "allowed_updates": ["message"]
                          }
                      )

                      updates = result.get("result", [])

                      for update in updates:
                          offset = update["update_id"] + 1

                          message = update.get("message", {})
                          chat = message.get("chat", {})
                          chat_id = chat.get("id")
                          text = message.get("text", "")

                          if not chat_id or not text:
                              continue

                          print("Message:", text)

                          command, topic, count = parse_command(text)

                          if command == "/start":
                              send_message(
                                  chat_id,
                                  "🚀 Gyankshetra AI Bot तैयार है।\n\n"
                                  "Commands:\n"
                                  "/test इतिहास 20\n"
                                  "/test विलयन 50\n"
                                  "/mock विज्ञान 20\n"
                                  "/practice रसायन 30\n"
                                  "/pyq BPSC TRE Science 20"
                              )

                          elif command in [
                              "/test",
                              "/mock",
                              "/practice",
                              "/pyq"
                          ]:

                              if not topic:
                                  send_message(
                                      chat_id,
                                      "❌ विषय लिखें।\n\n"
                                      "उदाहरण:\n"
                                      "/test इतिहास 20"
                                  )
                                  continue

                              send_message(
                                  chat_id,
                                  f"🤖 Groq AI प्रश्न तैयार कर रहा है...\n\n"
                                  f"📚 विषय: {topic}\n"
                                  f"📝 प्रश्न: {count}\n"
                                  f"⚡ Command: {command}"
                              )

                              all_questions = []

                              remaining = count

                              while remaining > 0:
                                  batch_size = min(10, remaining)

                                  try:
                                      questions = generate_batch(
                                          topic,
                                          batch_size,
                                          command
                                      )

                                      all_questions.extend(questions)

                                  except Exception as e:
                                      error_text = str(e)

                                      send_message(
                                          chat_id,
                                          "❌ AI प्रश्न बनाने में समस्या आई।\n\n"
                                          + error_text[:3000]
                                      )

                                      break

                                  remaining -= batch_size

                              if len(all_questions) > 0:

                                  all_questions = all_questions[:count]

                                  output = (
                                      f"✅ Gyankshetra AI Test तैयार!\n\n"
                                      f"📚 विषय: {topic}\n"
                                      f"📝 Requested: {count}\n"
                                      f"✅ Generated: {len(all_questions)}\n\n"
                                  )

                                  for i, q in enumerate(
                                      all_questions,
                                      start=1
                                  ):
                                      output += (
                                          f"{i}. {q.get('question','')}\n"
                                      )

                                      options = q.get("options", [])

                                      for option in options:
                                          output += f"{option}\n"

                                      output += (
                                          f"✅ उत्तर: {q.get('answer','')}\n"
                                          f"📖 व्याख्या: "
                                          f"{q.get('explanation','')}\n\n"
                                      )

                                  send_message(chat_id, output)

                          else:
                              send_message(
                                  chat_id,
                                  "❓ Unknown command.\n\n"
                                  "उदाहरण:\n"
                                  "/test इतिहास 20"
                              )

                  except Exception as e:
                      print("Polling error:", str(e))
                      time.sleep(5)

              print("Polling cycle finished")

          if __name__ == "__main__":
              main()
          PY
