name: Gyankshetra AI Test Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gyankshetra-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Gyankshetra Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import re
          import html
          import requests
          from pathlib import Path
          from datetime import datetime

          BOT = os.environ["TELEGRAM_BOT_TOKEN"]
          GROQ = os.environ["GROQ_API_KEY"]

          TG_URL = f"https://api.telegram.org/bot{BOT}"
          GROQ_URL = "https://api.groq.com/openai/v1/chat/completions"

          OFFSET_FILE = Path(".telegram_offset")
          REGISTRY_FILE = Path("content/generated_tests.json")

          REGISTRY_FILE.parent.mkdir(
              parents=True,
              exist_ok=True
          )

          if REGISTRY_FILE.exists():
              try:
                  registry = json.loads(
                      REGISTRY_FILE.read_text(
                          encoding="utf-8"
                      )
                  )
              except Exception:
                  registry = []
          else:
              registry = []

          def send_message(chat_id, text):
              requests.post(
                  TG_URL + "/sendMessage",
                  json={
                      "chat_id": chat_id,
                      "text": text,
                      "disable_web_page_preview": False
                  },
                  timeout=30
              )

          def get_offset():
              if not OFFSET_FILE.exists():
                  return 0

              try:
                  return int(
                      OFFSET_FILE.read_text().strip()
                  )
              except Exception:
                  return 0

          def save_offset(value):
              OFFSET_FILE.write_text(
                  str(value),
                  encoding="utf-8"
              )

          def parse_command(text):

              parts = text.strip().split()

              if not parts:
                  return None

              command = parts[0].lower()

              types = {
                  "/test": "test",
                  "/mock": "mock",
                  "/quiz": "quiz",
                  "/practice": "practice",
                  "/pyq": "pyq"
              }

              if command not in types:
                  return None

              if len(parts) == 1:
                  return {
                      "type": types[command],
                      "topic": "सामान्य",
                      "count": 10
                  }

              count = 10

              if parts[-1].isdigit():
                  count = int(parts[-1])
                  topic = " ".join(
                      parts[1:-1]
                  ).strip()
              else:
                  topic = " ".join(
                      parts[1:]
                  ).strip()

              count = max(
                  1,
                  min(count, 100)
              )

              if not topic:
                  topic = "सामान्य"

              return {
                  "type": types[command],
                  "topic": topic,
                  "count": count
              }

          def clean_json(text):

              text = text.strip()

              text = re.sub(
                  r"^```json\s*",
                  "",
                  text,
                  flags=re.I
              )

              text = re.sub(
                  r"^```\s*",
                  "",
                  text
              )

              text = re.sub(
                  r"\s*```$",
                  "",
                  text
              )

              return text.strip()

          def groq_batch(topic, count, previous):

              previous_text = "\n".join(
                  previous[-15:]
              )

              prompt = f"""
          Gyankshetra के लिए {count} MCQ प्रश्न बनाइए।

          विषय: {topic}

          स्तर:
          STET / BPSC TRE / शिक्षक भर्ती / प्रतियोगी परीक्षा

          केवल JSON लौटाइए।

          JSON का format:

          {{
            "questions": [
              {{
                "question": "प्रश्न",
                "options": [
                  "विकल्प A",
                  "विकल्प B",
                  "विकल्प C",
                  "विकल्प D"
                ],
                "answer": 0,
                "explanation": "संक्षिप्त व्याख्या",
                "facts": [
                  "महत्वपूर्ण तथ्य 1",
                  "महत्वपूर्ण तथ्य 2",
                  "महत्वपूर्ण तथ्य 3"
                ]
              }}
            ]
          }}

          नियम:

          1. ठीक {count} प्रश्न बनाइए।
          2. प्रत्येक प्रश्न में ठीक 4 विकल्प हों।
          3. answer केवल 0, 1, 2 या 3 हो।
          4. एक ही सही उत्तर हो।
          5. प्रश्न मौलिक और तथ्यात्मक हों।
          6. प्रश्न दोहराए नहीं जाएँ।
          7. हिन्दी में प्रश्न बनाइए।
          8. Scientific/English names आवश्यक होने पर English में रखें।
          9. facts में 3 छोटे महत्वपूर्ण तथ्य दें।
          10. Markdown बिल्कुल नहीं।
          11. JSON के बाहर कोई text नहीं।

          पहले से बने प्रश्न:
          {previous_text}
          """

              payload = {
                  "model": "openai/gpt-oss-20b",

                  "messages": [
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],

                  "temperature": 0.4,

                  "reasoning_effort": "low",

                  "reasoning_format": "hidden",

                  "max_completion_tokens": 5000,

                  "response_format": {
                      "type": "json_object"
                  }
              }

              for attempt in range(5):

                  response = requests.post(
                      GROQ_URL,

                      headers={
                          "Authorization":
                              f"Bearer {GROQ}",
                          "Content-Type":
                              "application/json"
                      },

                      json=payload,

                      timeout=180
                  )

                  print(
                      "Groq status:",
                      response.status_code
                  )

                  if response.status_code == 429:

                      wait = 30 * (attempt + 1)

                      print(
                          "Rate limit. Waiting:",
                          wait
                      )

                      time.sleep(wait)

                      continue

                  if response.status_code >= 400:

                      print(
                          "Groq error:",
                          response.text[:3000]
                      )

                      raise RuntimeError(
                          "Groq API "
                          + str(response.status_code)
                          + ": "
                          + response.text[:1500]
                      )

                  data = response.json()

                  content = (
                      data["choices"][0]
                      ["message"]["content"]
                  )

                  content = clean_json(content)

                  try:
                      result = json.loads(content)

                  except Exception as error:

                      print(
                          "JSON parse error:",
                          error
                      )

                      print(
                          "Raw content:",
                          content[:3000]
                      )

                      raise RuntimeError(
                          "Groq ने valid JSON नहीं दिया"
                      )

                  questions = result.get(
                      "questions",
                      []
                  )

                  if not isinstance(
                      questions,
                      list
                  ):
                      raise RuntimeError(
                          "questions array नहीं मिला"
                      )

                  return questions

              raise RuntimeError(
                  "Groq rate limit बार-बार आया"
              )

          def generate_questions(
              topic,
              total
          ):

              final = []
              seen = set()

              while len(final) < total:

                  remaining = (
                      total - len(final)
                  )

                  batch_size = min(
                      4,
                      remaining
                  )

                  old_questions = [
                      q["question"]
                      for q in final
                  ]

                  questions = groq_batch(
                      topic,
                      batch_size,
                      old_questions
                  )

                  added = 0

                  for q in questions:

                      try:

                          question = str(
                              q["question"]
                          ).strip()

                          options = q["options"]

                          answer = int(
                              q["answer"]
                          )

                          explanation = str(
                              q.get(
                                  "explanation",
                                  ""
                              )
                          ).strip()

                          facts = q.get(
                              "facts",
                              []
                          )

                          if not question:
                              continue

                          if question in seen:
                              continue

                          if (
                              not isinstance(
                                  options,
                                  list
                              )
                              or len(options) != 4
                          ):
                              continue

                          if answer not in [
                              0, 1, 2, 3
                          ]:
                              continue

                          if not isinstance(
                              facts,
                              list
                          ):
                              facts = []

                          item = {
                              "question":
                                  question,

                              "options": [
                                  str(x)
                                  for x in options
                              ],

                              "answer":
                                  answer,

                              "explanation":
                                  explanation,

                              "facts": [
                                  str(x)
                                  for x in facts[:3]
                              ]
                          }

                          final.append(item)

                          seen.add(
                              question
                          )

                          added += 1

                          if len(final) >= total:
                              break

                      except Exception as error:

                          print(
                              "Invalid question:",
                              error
                          )

                  print(
                      "Questions:",
                      len(final),
                      "/",
                      total
                  )

                  if added == 0:
                      time.sleep(3)

              return final[:total]

          def safe_slug(text):

              value = text.lower()

              value = re.sub(
                  r"[^a-zA-Z0-9\u0900-\u097F]+",
                  "-",
                  value
              )

              value = value.strip("-")

              return value[:40] or "test"

          def make_html(
              title,
              topic,
              questions
          ):

              data = json.dumps(
                  questions,
                  ensure_ascii=False
              )

              escaped_title = html.escape(
                  title
              )

              return f"""<!DOCTYPE html>
          <html lang="hi">

          <head>

          <meta charset="UTF-8">

          <meta name="viewport"
                content="width=device-width,initial-scale=1">

          <meta name="theme-color"
                content="#111827">

          <title>
          Gyankshetra — {escaped_title}
          </title>

          <style>

          * {{
            box-sizing:border-box;
          }}

          body {{
            margin:0;
            background:#f4f6f9;
            color:#172033;
            font-family:Arial,
            "Noto Sans Devanagari",
            sans-serif;
          }}

          .top {{
            height:58px;
            background:#111827;
            color:white;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 15px;
          }}

          .brand {{
            font-size:20px;
            font-weight:800;
          }}

          .wrap {{
            max-width:700px;
            margin:auto;
            padding:14px;
          }}

          .quizbar {{
            background:white;
            padding:12px 15px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            border-bottom:1px solid #ddd;
          }}

          .questionline {{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:12px 15px;
            font-weight:bold;
          }}

          .qcard {{
            background:white;
            border-radius:14px;
            padding:16px;
            box-shadow:0 2px 10px #00000012;
          }}

          .qcard h2 {{
            line-height:1.5;
            font-size:20px;
          }}

          .option {{
            width:100%;
            text-align:left;
            background:#f8fafc;
            border:1px solid #d8dee8;
            padding:13px;
            border-radius:10px;
            margin:8px 0;
          }}

          .selected {{
            border:2px solid #2563eb;
            background:#eff6ff;
          }}

          .actions {{
            display:flex;
            gap:10px;
            margin-top:18px;
          }}

          .actions button {{
            flex:1;
            padding:12px;
            border:0;
            border-radius:10px;
          }}

          .next {{
            background:#2563eb;
            color:white;
          }}

          .star {{
            border:0;
            background:none;
            font-size:27px;
          }}

          .hide {{
            display:none;
          }}

          .result {{
            background:white;
            padding:20px;
            border-radius:14px;
            margin-top:20px;
            text-align:center;
          }}

          .score {{
            font-size:38px;
            font-weight:900;
          }}

          .review {{
            background:white;
            padding:18px;
            border-radius:14px;
          }}

          .facts {{
            background:#f8fafc;
            padding:12px;
            border-radius:10px;
            line-height:1.7;
          }}

          </style>

          </head>

          <body>

          <div class="top">
            <div class="brand">
              Gyankshetra
            </div>
          </div>

          <div id="quiz">

            <div class="quizbar">
              <button onclick="history.back()">
                ‹
              </button>

              <b>
                {escaped_title}
              </b>

              <span>☰</span>
            </div>

            <div class="questionline">

              <span>
                प्रश्न
                <span id="qn">
                  1/{len(questions)}
                </span>
              </span>

              <button
                id="star"
                class="star"
                onclick="saveQuestion()">
                ☆
              </button>

              <span>
                ⏱
                <span id="timer">
                  00:00
                </span>
              </span>

            </div>

            <div class="wrap">

              <div class="qcard">

                <h2 id="question"></h2>

                <div id="options"></div>

                <div class="actions">

                  <button
                    onclick="prev()">
                    ← पिछला
                  </button>

                  <button
                    id="next"
                    class="next"
                    onclick="next()">
                    अगला →
                  </button>

                </div>

              </div>

            </div>

          </div>

          <div id="result"
               class="wrap hide">

            <div class="result">

              <h2>
                🎉 Test Result
              </h2>

              <div
                id="score"
                class="score">
                0/{len(questions)}
              </div>

              <p id="resultText"></p>

              <div class="actions">

                <button
                  onclick="review()">
                  Review
                </button>

                <button
                  class="next"
                  onclick="startQuiz()">
                  Reattempt
                </button>

              </div>

            </div>

          </div>

          <div id="review"
               class="wrap hide">

            <div class="review">

              <b id="reviewTitle"></b>

              <h2
                id="reviewQuestion">
              </h2>

              <p>
                <b>आपका उत्तर:</b>
                <span id="userAnswer"></span>
              </p>

              <p>
                <b>सही उत्तर:</b>
                <span id="correctAnswer"></span>
              </p>

              <p>
                <b>व्याख्या:</b>
                <span id="explanation"></span>
              </p>

              <div class="facts">

                <b>
                  महत्वपूर्ण तथ्य
                </b>

                <div id="facts"></div>

              </div>

              <div class="actions">

                <button
                  onclick="reviewPrev()">
                  ← पिछला
                </button>

                <button
                  class="next"
                  onclick="reviewNext()">
                  अगला →
                </button>

              </div>

            </div>

          </div>

          <script>

          const questions =
          {data};

          const TOTAL =
          questions.length;

          const MAX_TIME =
          TOTAL * 60;

          let qi = 0;

          let answers =
          Array(TOTAL).fill(null);

          let elapsed = 0;

          let timerHandle = null;

          let reviewIndex = 0;

          function $(id) {{
            return document.getElementById(id);
          }}

          function startQuiz() {{

            qi = 0;

            answers =
            Array(TOTAL).fill(null);

            elapsed = 0;

            clearInterval(
              timerHandle
            );

            $("quiz")
              .classList.remove(
                "hide"
              );

            $("result")
              .classList.add(
                "hide"
              );

            $("review")
              .classList.add(
                "hide"
              );

            render();

            $("timer").textContent =
              "00:00";

            timerHandle =
              setInterval(
                function() {{

                  elapsed++;

                  let m =
                    Math.floor(
                      elapsed / 60
                    );

                  let s =
                    elapsed % 60;

                  $("timer")
                    .textContent =
                    String(m)
                    .padStart(2,"0")
                    + ":" +
                    String(s)
                    .padStart(2,"0");

                  if (
                    elapsed >= MAX_TIME
                  ) {{
                    finish();
                  }}

                }},
                1000
              );
          }}

          function render() {{

            const q =
            questions[qi];

            $("qn").textContent =
              (qi + 1)
              + "/"
              + TOTAL;

            $("question")
              .textContent =
              q.question;

            const box =
            $("options");

            box.innerHTML = "";

            q.options.forEach(
              function(opt,i) {{

                const button =
                document.createElement(
                  "button"
                );

                button.className =
                  "option";

                button.textContent =
                  String.fromCharCode(
                    65+i
                  )
                  + ". "
                  + opt;

                if (
                  answers[qi] === i
                ) {{
                  button.classList.add(
                    "selected"
                  );
                }}

                button.onclick =
                function() {{

                  answers[qi] = i;

                  render();
                }};

                box.appendChild(
                  button
                );

              }
            );

            $("next")
              .textContent =
              qi === TOTAL - 1
              ? "Submit Test"
              : "अगला →";

            $("star")
              .textContent =
              savedQuestion(qi)
              ? "★"
              : "☆";
          }}

          function prev() {{

            if (qi > 0) {{

              qi--;

              render();

              window.scrollTo(
                0,0
              );
            }}
          }}

          function next() {{

            if (qi < TOTAL - 1) {{

              qi++;

              render();

              window.scrollTo(
                0,0
              );

            }} else {{

              finish();

            }}
          }}

          function finish() {{

            clearInterval(
              timerHandle
            );

            let correct = 0;

            questions.forEach(
              function(q,i) {{

                if (
                  answers[i] ===
                  q.answer
                ) {{
                  correct++;
                }}

              }
            );

            $("quiz")
              .classList.add(
                "hide"
              );

            $("result")
              .classList.remove(
                "hide"
              );

            $("score")
              .textContent =
              correct
              + "/"
              + TOTAL;

            let wrong =
              answers.filter(
                function(x,i) {{
                  return x !== null
                  &&
                  x !==
                  questions[i].answer;
                }}
              ).length;

            let skipped =
              answers.filter(
                function(x) {{
                  return x === null;
                }}
              ).length;

            $("resultText")
              .textContent =
              "सही: "
              + correct
              + " • गलत: "
              + wrong
              + " • छोड़े: "
              + skipped
              + " • प्रतिशत: "
              + Math.round(
                  correct / TOTAL * 100
                )
              + "%";
          }}

          function review() {{

            reviewIndex = 0;

            $("result")
              .classList.add(
                "hide"
              );

            $("review")
              .classList.remove(
                "hide"
              );

            renderReview();
          }}

          function renderReview() {{

            const q =
            questions[reviewIndex];

            $("reviewTitle")
              .textContent =
              "Review "
              + (reviewIndex+1)
              + "/"
              + TOTAL;

            $("reviewQuestion")
              .textContent =
              q.question;

            $("userAnswer")
              .textContent =
              answers[reviewIndex]
              === null
              ? "छोड़ा गया"
              : q.options[
                  answers[reviewIndex]
                ];

            $("correctAnswer")
              .textContent =
              q.options[q.answer];

            $("explanation")
              .textContent =
              q.explanation || "—";

            $("facts")
              .innerHTML =
              (q.facts || [])
              .map(
                x => "• " + x
              )
              .join("<br>");

            window.scrollTo(
              0,0
            );
          }}

          function reviewPrev() {{

            if (
              reviewIndex > 0
            ) {{

              reviewIndex--;

              renderReview();

            }}
          }}

          function reviewNext() {{

            if (
              reviewIndex <
              TOTAL - 1
            ) {{

              reviewIndex++;

              renderReview();

            }}
          }}

          function savedQuestion(i) {{

            try {{

              const saved =
              JSON.parse(
                localStorage.getItem(
                  "gyankshetra_saved"
                ) || "[]"
              );

              return saved.some(
                x =>
                x.title ===
                document.title
                &&
                x.index === i
              );

            }} catch(e) {{

              return false;

            }}
          }}

          function saveQuestion() {{

            const key =
            "gyankshetra_saved";

            let saved = [];

            try {{

              saved =
              JSON.parse(
                localStorage.getItem(
                  key
                ) || "[]"
              );

            }} catch(e) {{

              saved = [];

            }}

            const title =
              document.title;

            const found =
              saved.findIndex(
                x =>
                x.title === title
                &&
                x.index === qi
              );

            if (found >= 0) {{

              saved.splice(
                found,
                1
              );

            }} else {{

              saved.push({{
                title:title,
                index:qi,
                question:
                  questions[qi]
                  .question
              }});

            }}

            localStorage.setItem(
              key,
              JSON.stringify(saved)
            );

            render();
          }}

          startQuiz();

          </script>

          </body>
          </html>"""

          def create_test(
              chat_id,
              cmd
          ):

              topic = cmd["topic"]
              count = cmd["count"]
              qtype = cmd["type"]

              names = {
                  "test": "Test",
                  "mock": "Mock Test",
                  "quiz": "Quiz",
                  "practice": "Practice",
                  "pyq": "PYQ Practice"
              }

              label = names[qtype]

              send_message(
                  chat_id,
                  "🤖 Groq AI प्रश्न तैयार कर रहा है...\n\n"
                  f"📚 {topic}\n"
                  f"📝 {label}\n"
                  f"❓ प्रश्न: {count}\n\n"
                  "थोड़ा समय लगेगा..."
              )

              questions = generate_questions(
                  topic,
                  count
              )

              if qtype in [
                  "test",
                  "mock"
              ]:
                  folder = "tests"

              elif qtype == "quiz":
                  folder = "quiz"

              elif qtype == "practice":
                  folder = "practice"

              else:
                  folder = "pyq"

              Path(folder).mkdir(
                  parents=True,
                  exist_ok=True
              )

              stamp = datetime.now().strftime(
                  "%Y%m%d-%H%M%S"
              )

              filename = (
                  safe_slug(topic)
                  + "-"
                  + str(count)
                  + "q-"
                  + stamp
                  + ".html"
              )

              path = (
                  Path(folder)
                  / filename
              )

              title = (
                  topic
                  + " "
                  + str(count)
                  + "Q"
              )

              page = make_html(
                  title,
                  topic,
                  questions
              )

              path.write_text(
                  page,
                  encoding="utf-8"
              )

              url = (
                  "https://gyankshetra.github.io/"
                  "Gyankshetra-app/"
                  + folder
                  + "/"
                  + filename
              )

              registry.insert(
                  0,
                  {
                      "type": qtype,
                      "title": title,
                      "topic": topic,
                      "questions": count,
                      "url": url,
                      "created":
                          datetime.now().isoformat()
                  }
              )

              REGISTRY_FILE.write_text(
                  json.dumps(
                      registry[:200],
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

              send_message(
                  chat_id,
                  "✅ Gyankshetra Test तैयार है!\n\n"
                  f"📚 विषय: {topic}\n"
                  f"📝 प्रश्न: {count}\n"
                  f"🎯 Type: {label}\n"
                  "❌ Negative Marking: नहीं\n\n"
                  "🌐 Test खोलें:\n"
                  + url
              )

          offset = get_offset()

          print(
              "Gyankshetra bot started"
          )

          try:

              response = requests.get(
                  TG_URL + "/getUpdates",
                  params={
                      "offset": offset + 1,
                      "timeout": 10
                  },
                  timeout=20
              )

              data = response.json()

              if not data.get("ok"):
                  raise RuntimeError(
                      str(data)
                  )

              updates = data.get(
                  "result",
                  []
              )

              for update in updates:

                  update_id = update[
                      "update_id"
                  ]

                  save_offset(update_id)

                  message = update.get(
                      "message",
                      {}
                  )

                  chat = message.get(
                      "chat",
                      {}
                  )

                  chat_id = chat.get(
                      "id"
                  )

                  text = message.get(
                      "text",
                      ""
                  ).strip()

                  if not chat_id:
                      continue

                  if text.startswith(
                      "/start"
                  ):

                      send_message(
                          chat_id,
                          "👋 Gyankshetra Bot\n\n"
                          "/test इतिहास 10\n"
                          "/mock विज्ञान 20\n"
                          "/quiz इतिहास 10\n"
                          "/practice रसायन 20\n"
                          "/pyq इतिहास 20"
                      )

                      continue

                  command = parse_command(
                      text
                  )

                  if not command:
                      continue

                  try:

                      create_test(
                          chat_id,
                          command
                      )

                  except Exception as error:

                      print(
                          "CREATE ERROR:",
                          repr(error)
                      )

                      send_message(
                          chat_id,
                          "❌ Test generate नहीं हो पाया।\n\n"
                          "Error:\n"
                          + str(error)[:2500]
                      )

          except Exception as error:

              print(
                  "BOT ERROR:",
                  repr(error)
              )

              raise

          REGISTRY_FILE.write_text(
              json.dumps(
                  registry[:200],
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print(
              "Gyankshetra bot cycle completed"
          )
          PY

