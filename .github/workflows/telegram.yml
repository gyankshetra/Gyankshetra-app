name: Gyankshetra AI Test Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gyankshetra-ai-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install requests
        run: pip install requests

      - name: Gyankshetra Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import re
          import html
          import requests
          from pathlib import Path
          from datetime import datetime

          BOT = os.environ["TELEGRAM_BOT_TOKEN"]
          GROQ = os.environ["GROQ_API_KEY"]

          TG = f"https://api.telegram.org/bot{BOT}"
          GROQ_URL = "https://api.groq.com/openai/v1/chat/completions"

          ROOT = Path(".")
          REGISTRY = ROOT / "content" / "generated_tests.json"
          OFFSET_FILE = ROOT / ".telegram_offset"

          REGISTRY.parent.mkdir(parents=True, exist_ok=True)

          if REGISTRY.exists():
              try:
                  registry = json.loads(REGISTRY.read_text(encoding="utf-8"))
              except Exception:
                  registry = []
          else:
              registry = []

          def tg_send(chat_id, text):
              try:
                  requests.post(
                      TG + "/sendMessage",
                      json={
                          "chat_id": chat_id,
                          "text": text,
                          "disable_web_page_preview": False
                      },
                      timeout=30
                  )
              except Exception as e:
                  print("Telegram send error:", e)

          def get_offset():
              if OFFSET_FILE.exists():
                  try:
                      return int(OFFSET_FILE.read_text().strip())
                  except Exception:
                      return 0
              return 0

          def save_offset(offset):
              OFFSET_FILE.write_text(str(offset), encoding="utf-8")

          def safe_slug(text):
              text = text.strip().lower()
              text = re.sub(r"[^a-zA-Z0-9\u0900-\u097F]+", "-", text)
              text = text.strip("-")
              return text[:45] or "general"

          def command_parse(text):
              parts = text.strip().split()

              if not parts:
                  return None

              cmd = parts[0].lower()

              allowed = {
                  "/test": "test",
                  "/mock": "mock",
                  "/quiz": "quiz",
                  "/practice": "practice",
                  "/pyq": "pyq"
              }

              if cmd not in allowed:
                  return None

              if len(parts) < 2:
                  return {
                      "type": allowed[cmd],
                      "topic": "सामान्य",
                      "count": 10
                  }

              count = 10

              try:
                  if parts[-1].isdigit():
                      count = int(parts[-1])
                      topic = " ".join(parts[1:-1]).strip()
                  else:
                      topic = " ".join(parts[1:]).strip()
              except Exception:
                  topic = " ".join(parts[1:]).strip()

              count = max(1, min(count, 100))

              return {
                  "type": allowed[cmd],
                  "topic": topic or "सामान्य",
                  "count": count
              }

                   def groq_batch(topic, count, previous):
              previous_text = "\n".join(previous[-20:])

              prompt = f"""
          Create exactly {count} multiple choice questions in Hindi.

          Topic: {topic}

          Level:
          STET / BPSC TRE / Teacher Recruitment / Competitive Exam

          IMPORTANT:
          Return ONLY valid JSON.
          Do not use markdown.
          Do not use ```.

          JSON must have exactly this structure:

          {{
            "questions": [
              {{
                "question": "question text",
                "options": ["option A", "option B", "option C", "option D"],
                "answer": 0,
                "explanation": "short explanation",
                "facts": ["fact 1", "fact 2", "fact 3"]
              }}
            ]
          }}

          Rules:
          - Exactly {count} questions.
          - Exactly 4 options per question.
          - answer must be 0, 1, 2 or 3.
          - facts must contain exactly 3 short facts.
          - Do not repeat previous questions.
          - Questions must be original and factual.
          - Use pure Hindi where possible.

          Previous questions:
          {previous_text}
          """

              payload = {
                  "model": "openai/gpt-oss-20b",
                  "messages": [
                      {
                          "role": "system",
                          "content": "Return only valid JSON. Never return markdown."
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.2,
                  "max_completion_tokens": 4000,
                  "response_format": {
                      "type": "json_object"
                  }
              }

              for attempt in range(5):

                  r = requests.post(
                      GROQ_URL,
                      headers={
                          "Authorization": f"Bearer {GROQ}",
                          "Content-Type": "application/json"
                      },
                      json=payload,
                      timeout=120
                  )

                  print("Groq status:", r.status_code)

                  if r.status_code == 429:
                      wait = 25 * (attempt + 1)
                      print("Rate limit. Waiting:", wait)
                      time.sleep(wait)
                      continue

                  if r.status_code >= 400:

                      print("Groq error:", r.text[:3000])

                      # JSON validation failure होने पर
                      # बिना response_format दोबारा कोशिश
                      if (
                          r.status_code == 400
                          and "failed_generation" in r.text
                      ):

                          fallback = dict(payload)
                          fallback.pop("response_format", None)

                          r2 = requests.post(
                              GROQ_URL,
                              headers={
                                  "Authorization": f"Bearer {GROQ}",
                                  "Content-Type": "application/json"
                              },
                              json=fallback,
                              timeout=120
                          )

                          print(
                              "Fallback status:",
                              r2.status_code
                          )

                          if r2.status_code < 400:

                              data2 = r2.json()

                              content2 = data2[
                                  "choices"
                              ][0]["message"]["content"]

                              content2 = re.sub(
                                  r"^```json\s*",
                                  "",
                                  content2.strip(),
                                  flags=re.I
                              )

                              content2 = re.sub(
                                  r"\s*```$",
                                  "",
                                  content2.strip()
                              )

                              try:
                                  obj2 = json.loads(content2)

                                  qs2 = obj2.get(
                                      "questions",
                                      []
                                  )

                                  if isinstance(qs2, list):
                                      return qs2

                              except Exception as e:
                                  print(
                                      "Fallback JSON error:",
                                      e
                                  )

                      raise RuntimeError(
                          f"Groq API {r.status_code}: "
                          f"{r.text[:1500]}"
                      )

                  data = r.json()

                  content = data[
                      "choices"
                  ][0]["message"]["content"]

                  content = re.sub(
                      r"^```json\s*",
                      "",
                      content.strip(),
                      flags=re.I
                  )

                  content = re.sub(
                      r"\s*```$",
                      "",
                      content.strip()
                  )

                  try:
                      obj = json.loads(content)
                  except Exception:
                      match = re.search(
                          r"\{.*\}",
                          content,
                          re.S
                      )

                      if not match:
                          raise RuntimeError(
                              "Groq ने valid JSON नहीं दिया"
                          )

                      obj = json.loads(
                          match.group(0)
                      )

                  qs = obj.get(
                      "questions",
                      []
                  )

                  if not isinstance(qs, list):
                      raise RuntimeError(
                          "questions array नहीं मिला"
                      )

                  return qs

              raise RuntimeError(
                  "Groq rate limit बार-बार आया"
              )

              raise RuntimeError("Groq rate limit बार-बार आया")

          def generate_questions(topic, total):
              all_q = []
              seen = set()

              while len(all_q) < total:
                  remaining = total - len(all_q)
                  batch = min(5, remaining)

                  qs = groq_batch(
                      topic,
                      batch,
                      [q["question"] for q in all_q]
                  )

                  added = 0

                  for q in qs:
                      try:
                          question = str(q["question"]).strip()
                          options = q["options"]
                          answer = int(q["answer"])
                          explanation = str(q.get("explanation", "")).strip()
                          facts = q.get("facts", [])

                          if not question:
                              continue

                          if question in seen:
                              continue

                          if not isinstance(options, list) or len(options) != 4:
                              continue

                          if answer not in [0, 1, 2, 3]:
                              continue

                          if not isinstance(facts, list):
                              facts = []

                          q["question"] = question
                          q["options"] = [str(x) for x in options]
                          q["answer"] = answer
                          q["explanation"] = explanation
                          q["facts"] = [str(x) for x in facts[:5]]

                          seen.add(question)
                          all_q.append(q)
                          added += 1

                          if len(all_q) >= total:
                              break

                      except Exception:
                          continue

                  if added == 0:
                      time.sleep(3)

                  print("Generated:", len(all_q), "/", total)

              return all_q[:total]

          def make_test_html(title, topic, qtype, questions):
              data = json.dumps(
                  questions,
                  ensure_ascii=False,
                  separators=(",", ":")
              )

              title_js = json.dumps(title, ensure_ascii=False)
              topic_js = json.dumps(topic, ensure_ascii=False)

              return f'''<!DOCTYPE html>
          <html lang="hi">
          <head>
          <meta charset="UTF-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <meta name="theme-color" content="#111827">
          <title>Gyankshetra — {html.escape(title)}</title>
          <style>
          *{{box-sizing:border-box}}
          body{{margin:0;background:#f4f6f9;color:#172033;font-family:Arial,"Noto Sans Devanagari",sans-serif}}
          button{{font:inherit}}
          .top{{height:58px;background:#111827;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:5}}
          .brand{{font-size:20px;font-weight:800}}
          .top button{{background:none;border:0;color:white;font-size:22px}}
          .wrap{{max-width:700px;margin:auto;padding:14px}}
          .card,.qcard,.resultcard,.reviewcard{{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000012}}
          .hero{{font-size:18px;font-weight:800}}
          .small{{display:block;color:#687386;margin-top:5px;font-size:13px}}
          .primary,.next{{background:#2563eb;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:700}}
          .secondary{{background:#e5e7eb;border:0;border-radius:10px;padding:12px 18px}}
          .quizbar{{display:flex;align-items:center;justify-content:space-between;background:white;padding:12px 15px;border-bottom:1px solid #eee}}
          .quizbar button{{border:0;background:none;font-size:22px}}
          .questionline{{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;font-weight:700}}
          .star{{border:0;background:none;font-size:27px}}
          .timer{{font-variant-numeric:tabular-nums}}
          .qcard h2{{font-size:20px;line-height:1.5}}
          .option{{display:block;width:100%;text-align:left;background:#f8fafc;border:1px solid #d8dee8;padding:13px;border-radius:10px;margin:9px 0}}
          .option.selected{{border:2px solid #2563eb;background:#eff6ff}}
          .actions{{display:flex;gap:10px;justify-content:space-between;margin-top:18px}}
          .actions button{{flex:1}}
          .facts{{background:#f8fafc;padding:12px;border-radius:10px;margin-top:12px;line-height:1.6}}
          .hide{{display:none}}
          .score{{font-size:34px;font-weight:900;text-align:center}}
          .nav{{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:10px;text-align:center}}
          </style>
          </head>
          <body>

          <div class="top">
            <div class="brand">Gyankshetra</div>
            <button onclick="alert('Gyankshetra Test')">☰</button>
          </div>

          <div id="home" class="wrap">
            <div class="card">
              <div class="hero">{html.escape(title)}</div>
              <span class="small">{len(questions)} प्रश्न • {len(questions)} अंक • {len(questions)} मिनट • No Negative</span>
              <br>
              <button class="primary" onclick="startQuiz()">Start Test</button>
            </div>
          </div>

          <div id="quiz" class="hide">
            <div class="quizbar">
              <button onclick="confirmBack()">‹</button>
              <b>{html.escape(title)}</b>
              <button>☰</button>
            </div>

            <div class="questionline">
              <span>प्रश्न <span id="qn">1/{len(questions)}</span></span>
              <button id="star" class="star" onclick="saveQuestion()">☆</button>
              <span>⏱ <span id="timer">00:00</span></span>
            </div>

            <div class="wrap">
              <div class="qcard">
                <h2 id="question"></h2>
                <div id="options"></div>
                <div class="actions">
                  <button class="secondary" onclick="prev()">← पिछला</button>
                  <button id="next" class="next" onclick="next()">अगला →</button>
                </div>
              </div>
            </div>
          </div>

          <div id="result" class="wrap hide">
            <div class="resultcard">
              <h2>🎉 Test Result</h2>
              <div class="score" id="score">0/{len(questions)}</div>
              <p id="resultText"></p>
              <div class="actions">
                <button class="secondary" onclick="review()">Review</button>
                <button class="primary" onclick="startQuiz()">Reattempt</button>
              </div>
            </div>
          </div>

          <div id="review" class="wrap hide">
            <div class="reviewcard">
              <b id="reviewTitle"></b>
              <h2 id="reviewQuestion"></h2>
              <p><b>आपका उत्तर:</b> <span id="userAnswer"></span></p>
              <p><b>सही उत्तर:</b> <span id="correctAnswer"></span></p>
              <p><b>व्याख्या:</b> <span id="explanation"></span></p>
              <div class="facts">
                <b>महत्वपूर्ण तथ्य</b>
                <div id="facts"></div>
              </div>
              <div class="actions">
                <button class="secondary" onclick="reviewPrev()">← पिछला</button>
                <button class="next" onclick="reviewNext()">अगला →</button>
              </div>
            </div>
          </div>

          <div class="nav">
            Gyankshetra • {html.escape(topic)}
          </div>

          <script>
          const questions={data};
          const TOTAL=questions.length;
          const TEST_TITLE={title_js};
          const TOPIC={topic_js};
          const MAX_TIME=TOTAL*60;

          let qi=0;
          let answers=Array(TOTAL).fill(null);
          let elapsed=0;
          let timerHandle=null;
          let reviewIndex=0;

          function $(id){{return document.getElementById(id)}}

          function startQuiz(){{
            qi=0;
            answers=Array(TOTAL).fill(null);
            elapsed=0;

            clearInterval(timerHandle);

            $("home").classList.add("hide");
            $("result").classList.add("hide");
            $("review").classList.add("hide");
            $("quiz").classList.remove("hide");

            render();

            timerHandle=setInterval(function(){{
              elapsed++;

              let m=Math.floor(elapsed/60);
              let s=elapsed%60;

              $("timer").textContent=
                String(m).padStart(2,"0")+":"+
                String(s).padStart(2,"0");

              if(elapsed>=MAX_TIME){{
                finish();
              }}
            }},1000);
          }}

          function render(){{
            let q=questions[qi];

            $("qn").textContent=(qi+1)+"/"+TOTAL;
            $("question").textContent=q.question;

            let box=$("options");
            box.innerHTML="";

            q.options.forEach(function(opt,i){{
              let b=document.createElement("button");
              b.className="option";
              b.textContent=String.fromCharCode(65+i)+". "+opt;

              if(answers[qi]===i){{
                b.classList.add("selected");
              }}

              b.onclick=function(){{
                answers[qi]=i;
                render();
              }};

              box.appendChild(b);
            }});

            $("next").textContent=
              qi===TOTAL-1 ? "Submit Test" : "अगला →";

            $("star").textContent=
              savedQuestion(qi) ? "★" : "☆";
          }}

          function prev(){{
            if(qi>0){{
              qi--;
              render();
              window.scrollTo(0,0);
            }}
          }}

          function next(){{
            if(qi<TOTAL-1){{
              qi++;
              render();
              window.scrollTo(0,0);
            }}else{{
              finish();
            }}
          }}

          function finish(){{
            clearInterval(timerHandle);

            let correct=0;

            questions.forEach(function(q,i){{
              if(answers[i]===q.answer) correct++;
            }});

            $("quiz").classList.add("hide");
            $("result").classList.remove("hide");

            $("score").textContent=correct+"/"+TOTAL;

            $("resultText").textContent=
              "सही: "+correct+
              " • गलत: "+answers.filter((x,i)=>x!==null&&x!==questions[i].answer).length+
              " • छोड़े: "+answers.filter(x=>x===null).length+
              " • प्रतिशत: "+Math.round(correct/TOTAL*100)+"%";
          }}

          function review(){{
            reviewIndex=0;

            $("result").classList.add("hide");
            $("review").classList.remove("hide");

            renderReview();
          }}

          function renderReview(){{
            let q=questions[reviewIndex];

            $("reviewTitle").textContent=
              "Review "+(reviewIndex+1)+"/"+TOTAL;

            $("reviewQuestion").textContent=q.question;

            $("userAnswer").textContent=
              answers[reviewIndex]===null
              ? "छोड़ा गया"
              : q.options[answers[reviewIndex]];

            $("correctAnswer").textContent=
              q.options[q.answer];

            $("explanation").textContent=
              q.explanation || "—";

            $("facts").innerHTML=
              (q.facts||[]).map(x=>"• "+x).join("<br>");

            window.scrollTo(0,0);
          }}

          function reviewPrev(){{
            if(reviewIndex>0){{
              reviewIndex--;
              renderReview();
            }}
          }}

          function reviewNext(){{
            if(reviewIndex<TOTAL-1){{
              reviewIndex++;
              renderReview();
            }}
          }}

          function savedQuestion(i){{
            try{{
              let x=JSON.parse(localStorage.getItem("gyankshetra_saved")||"[]");
              return x.some(a=>a.title===TEST_TITLE && a.index===i);
            }}catch(e){{
              return false;
            }}
          }}

          function saveQuestion(){{
            let key="gyankshetra_saved";

            let list=[];

            try{{
              list=JSON.parse(localStorage.getItem(key)||"[]");
            }}catch(e){{
              list=[];
            }}

            let found=list.findIndex(
              x=>x.title===TEST_TITLE && x.index===qi
            );

            if(found>=0){{
              list.splice(found,1);
            }}else{{
              list.push({{
                title:TEST_TITLE,
                topic:TOPIC,
                index:qi,
                question:questions[qi].question
              }});
            }}

            localStorage.setItem(key,JSON.stringify(list));

            render();
          }}

          function confirmBack(){{
            if(confirm("क्या आप टेस्ट छोड़ना चाहते हैं?")){{
              clearInterval(timerHandle);
              location.reload();
            }}
          }}

          startQuiz();
          </script>
          </body>
          </html>'''

          def update_registry(item):
              global registry

              registry = [
                  x for x in registry
                  if x.get("url") != item.get("url")
              ]

              registry.insert(0, item)

              registry = registry[:200]

              REGISTRY.write_text(
                  json.dumps(
                      registry,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )

          def update_master_index():
              index = ROOT / "index.html"

              if not index.exists():
                  print("index.html नहीं मिला")
                  return

              text = index.read_text(encoding="utf-8")

              start_marker = "<!-- GYANKSHETRA_GENERATED_CONTENT_START -->"
              end_marker = "<!-- GYANKSHETRA_GENERATED_CONTENT_END -->"

              block = f'''
          {start_marker}
          <script>
          (function(){{
            fetch("content/generated_tests.json?ts="+Date.now())
              .then(r=>r.json())
              .then(items=>{{
                const tests=document.getElementById("tests");
                const practice=document.getElementById("practice");

                if(!tests && !practice) return;

                function addBox(parent,title,items){{
                  if(!parent || !items.length) return;

                  let old=parent.querySelector(
                    '[data-generated-box="'+title+'"]'
                  );

                  if(old) old.remove();

                  let box=document.createElement("div");
                  box.setAttribute("data-generated-box",title);
                  box.className="card";

                  let h=document.createElement("h3");
                  h.textContent=title;
                  box.appendChild(h);

                  items.forEach(function(x){{
                    let c=document.createElement("div");
                    c.style.cssText=
                      "background:#fff;border:1px solid #e5e7eb;border-radius:12px;padding:12px;margin:8px 0";

                    let b=document.createElement("b");
                    b.textContent=x.title;
                    c.appendChild(b);

                    let s=document.createElement("small");
                    s.style.display="block";
                    s.style.margin="5px 0";
                    s.textContent=
                      x.questions+" Questions • "+
                      x.questions+" Marks • "+
                      x.questions+" Minutes • No Negative";
                    c.appendChild(s);

                    let a=document.createElement("a");
                    a.href=x.url;
                    a.textContent="Start Test";
                    a.style.cssText=
                      "display:inline-block;background:#2563eb;color:white;text-decoration:none;padding:10px 14px;border-radius:9px;font-weight:bold";
                    c.appendChild(a);

                    box.appendChild(c);
                  }});

                  parent.appendChild(box);
                }}

                addBox(
                  tests,
                  "🤖 AI Generated Tests",
                  items.filter(x=>x.type==="test"||x.type==="mock")
                );

                addBox(
                  practice,
                  "🎯 AI Generated Quiz",
                  items.filter(x=>x.type==="quiz")
                );

                addBox(
                  practice,
                  "⚡ AI Generated Practice",
                  items.filter(x=>x.type==="practice")
                );

                addBox(
                  practice,
                  "🎯 PYQ Practice",
                  items.filter(x=>x.type==="pyq")
                );
              }})
              .catch(()=>{{}});
          }})();
          </script>
          {end_marker}
          '''

              if start_marker in text and end_marker in text:
                  a=text.index(start_marker)
                  b=text.index(end_marker)+len(end_marker)
                  text=text[:a]+block.strip()+text[b:]
              else:
                  pos=text.lower().rfind("</body>")

                  if pos!=-1:
                      text=text[:pos]+block+"\n"+text[pos:]
                  else:
                      text += block

              index.write_text(text,encoding="utf-8")

          def create_test(cmd):
              qtype=cmd["type"]
              topic=cmd["topic"]
              count=cmd["count"]

              type_names={
                  "test":"Test",
                  "mock":"Mock Test",
                  "quiz":"Quiz",
                  "practice":"Practice",
                  "pyq":"PYQ Practice"
              }

              label=type_names[qtype]

              if qtype=="pyq":
                  label="PYQ-style Practice"

              title=f"{topic} {count}Q"

              tg_send(
                  CURRENT_CHAT,
                  f"🤖 Groq AI प्रश्न तैयार कर रहा है...\n\n"
                  f"📚 {topic}\n"
                  f"📝 {label}\n"
                  f"❓ प्रश्न: {count}\n\n"
                  f"थोड़ा समय लगेगा..."
              )

              questions=generate_questions(topic,count)

              if qtype in ["test","mock"]:
                  folder="tests"
              elif qtype=="quiz":
                  folder="quiz"
              elif qtype=="practice":
                  folder="practice"
              else:
                  folder="pyq"

              Path(folder).mkdir(parents=True,exist_ok=True)

              stamp=datetime.now().strftime("%Y%m%d-%H%M%S")
              slug=safe_slug(topic)
              filename=f"{slug}-{count}q-{stamp}.html"

              path=Path(folder)/filename

              page=make_test_html(
                  title,
                  topic,
                  qtype,
                  questions
              )

              path.write_text(page,encoding="utf-8")

              url=(
                  "https://gyankshetra.github.io/"
                  f"Gyankshetra-app/{folder}/{filename}"
              )

              item={
                  "type":qtype,
                  "title":title,
                  "topic":topic,
                  "questions":count,
                  "url":url,
                  "created":datetime.now().isoformat()
              }

              update_registry(item)
              update_master_index()

              tg_send(
                  CURRENT_CHAT,
                  f"✅ {label} तैयार है!\n\n"
                  f"📚 विषय: {topic}\n"
                  f"📝 प्रश्न: {count}\n"
                  f"🎯 Generated: {len(questions)}\n\n"
                  f"🔗 LIVE TEST:\n{url}"
              )

          offset=get_offset()

          print("Gyankshetra Bot started")
          print("Offset:",offset)

          # केवल एक polling cycle; GitHub Actions schedule इसे हर 5 मिनट में चलाएगा.
          try:
              response=requests.get(
                  TG+"/getUpdates",
                  params={
                      "offset":offset+1,
                      "timeout":10,
                      "allowed_updates":["message"]
                  },
                  timeout=20
              )

              data=response.json()

              if not data.get("ok"):
                  raise RuntimeError(str(data))

              updates=data.get("result",[])

              for upd in updates:
                  new_offset=upd["update_id"]
                  save_offset(new_offset)

                  message=upd.get("message",{})
                  chat=message.get("chat",{})
                  chat_id=chat.get("id")
                  text=message.get("text","").strip()

                  if not chat_id:
                      continue

                  if text.startswith("/start"):
                      tg_send(
                          chat_id,
                          "👋 Gyankshetra Bot में आपका स्वागत है!\n\n"
                          "Commands:\n"
                          "/test इतिहास 10\n"
                          "/mock विज्ञान 20\n"
                          "/quiz इतिहास 10\n"
                          "/practice रसायन 20\n"
                          "/pyq BPSC TRE Science 20"
                      )
                      continue

                  parsed=command_parse(text)

                  if not parsed:
                      continue

                  CURRENT_CHAT=chat_id

                  try:
                      create_test(parsed)
                  except Exception as e:
                      print("ERROR:",repr(e))

                      tg_send(
                          chat_id,
                          "❌ Test generate नहीं हो पाया।\n\n"
                          "Error:\n"+
                          str(e)[:2500]
                      )

          except Exception as e:
              print("Polling ERROR:",repr(e))

          # Registry को हमेशा save करें
          REGISTRY.write_text(
              json.dumps(
                  registry,
                  ensure_ascii=False,
                  indent=2
              ),
              encoding="utf-8"
          )

          print("Bot cycle completed")
          PY

      - name: Commit generated tests
        run: |
          git config user.name "Gyankshetra AI"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .

          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "AI generated Gyankshetra tests"
            git push
          fi
