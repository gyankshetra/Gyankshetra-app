name: Gyankshetra AI Command Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  telegram-bot:
    runs-on: ubuntu-latest

    steps:
      - name: AI Test Generator
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import html
          import re

          BOT_TOKEN = os.environ["BOT_TOKEN"]
          GEMINI_KEY = os.environ["GEMINI_API_KEY"]

          TELEGRAM_API = f"https://api.telegram.org/bot{BOT_TOKEN}"

          def telegram(method, params=None):
              data = None

              if params:
                  data = urllib.parse.urlencode(params).encode()

              req = urllib.request.Request(
                  TELEGRAM_API + "/" + method,
                  data=data
              )

              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode())

          def send(chat_id, message):
              telegram("sendMessage", {
                  "chat_id": chat_id,
                  "text": message,
                  "parse_mode": "HTML"
              })

          # -----------------------------------------
          # Gemini
          # -----------------------------------------

          def ask_gemini(topic, count, test_type):

              prompt = f"""
          आप Gyankshetra नाम के भारतीय प्रतियोगी परीक्षा प्लेटफॉर्म के
          expert question setter हैं।

          विषय: {topic}
          Test Type: {test_type}
          प्रश्नों की संख्या: {count}

          STET / BPSC TRE स्तर के उच्च-गुणवत्ता वाले MCQ बनाइए।

          प्रत्येक प्रश्न में:
          1. प्रश्न
          2. चार विकल्प A, B, C, D
          3. सही उत्तर
          4. संक्षिप्त लेकिन सटीक explanation
          5. 3-5 महत्वपूर्ण exam facts

          प्रश्न factual, स्पष्ट और परीक्षा-उपयोगी हों।
          अस्पष्ट या दो सही उत्तर वाले प्रश्न न बनाएं।

          केवल JSON दें।

          Format:
          {{
            "questions": [
              {{
                "question": "...",
                "options": {{
                  "A": "...",
                  "B": "...",
                  "C": "...",
                  "D": "..."
                }},
                "answer": "A",
                "explanation": "...",
                "facts": [
                  "...",
                  "...",
                  "..."
                ]
              }}
            ]
          }}
          """

              url = (
                  "https://generativelanguage.googleapis.com/"
                  "v1beta/models/gemini-2.5-flash:generateContent"
                  "?key=" + urllib.parse.quote(GEMINI_KEY)
              )

              body = {
                  "contents": [
                      {
                          "parts": [
                              {
                                  "text": prompt
                              }
                          ]
                      }
                  ],
                  "generationConfig": {
                      "temperature": 0.2,
                      "responseMimeType": "application/json"
                  }
              }

              req = urllib.request.Request(
                  url,
                  data=json.dumps(body).encode(),
                  headers={
                      "Content-Type": "application/json"
                  }
              )

              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read().decode())

              text = result["candidates"][0]["content"]["parts"][0]["text"]

              return json.loads(text)

          # -----------------------------------------
          # Telegram Updates
          # -----------------------------------------

          updates = telegram("getUpdates", {
              "limit": 20,
              "timeout": 5
          })

          items = updates.get("result", [])

          last_update_id = None

          for update in items:

              last_update_id = update["update_id"]

              message = update.get("message", {})
              chat = message.get("chat", {})
              chat_id = chat.get("id")
              text = (message.get("text") or "").strip()

              if not chat_id:
                  continue

              # -------------------------------------
              # START
              # -------------------------------------

              if text.startswith("/start"):

                  send(
                      chat_id,
                      "🎓 <b>Gyankshetra AI Bot</b>\n\n"
                      "अब AI से Test बनाएं:\n\n"
                      "<code>/test इतिहास 20</code>\n"
                      "<code>/test भूगोल 50</code>\n"
                      "<code>/practice विज्ञान 30</code>\n"
                      "<code>/mock BPSC TRE-4 50</code>\n\n"
                      "🤖 Gemini AI प्रश्न बनाएगा।"
                  )

                  continue

              # -------------------------------------
              # HELP
              # -------------------------------------

              if text.startswith("/help"):

                  send(
                      chat_id,
                      "🤖 <b>Gyankshetra AI Commands</b>\n\n"
                      "📝 /test इतिहास 50\n"
                      "🎯 /practice रसायन विज्ञान 30\n"
                      "🧪 /mock BPSC TRE-4 50\n\n"
                      "AI प्रश्न + उत्तर + Explanation + Facts बनाएगा।"
                  )

                  continue

              # -------------------------------------
              # COMMAND
              # -------------------------------------

              match = re.match(
                  r"^/(test|practice|mock)(?:@\w+)?\s+(.+)$",
                  text,
                  re.IGNORECASE
              )

              if not match:

                  if text.startswith("/"):
                      send(
                          chat_id,
                          "❓ Command समझ नहीं आया।\n\n"
                          "उदाहरण:\n"
                          "<code>/test इतिहास 20</code>"
                      )

                  continue

              command = match.group(1).lower()
              content = match.group(2).strip()

              number_match = re.search(r"(\d+)\s*$", content)

              if number_match:
                  count = int(number_match.group(1))
                  topic = content[:number_match.start()].strip()
              else:
                  count = 20
                  topic = content

              if count < 1:
                  count = 20

              if count > 100:
                  count = 100

              type_name = {
                  "test": "Test",
                  "practice": "Practice",
                  "mock": "Mock Test"
              }[command]

              # -------------------------------------
              # Processing message
              # -------------------------------------

              processing = telegram("sendMessage", {
                  "chat_id": chat_id,
                  "text": (
                      "🤖 <b>AI प्रश्न तैयार हो रहे हैं...</b>\n\n"
                      f"📚 विषय: {html.escape(topic)}\n"
                      f"📝 प्रश्न: {count}\n\n"
                      "⏳ कृपया प्रतीक्षा करें..."
                  ),
                  "parse_mode": "HTML"
              })

              # -------------------------------------
              # Gemini generation
              # -------------------------------------

              try:

                  data = ask_gemini(
                      topic,
                      count,
                      type_name
                  )

                  questions = data.get("questions", [])

                  if not questions:
                      raise Exception("No questions generated")

                  # Telegram preview
                  preview = questions[:3]

                  reply = (
                      "✅ <b>AI Test तैयार है!</b>\n\n"
                      f"📚 <b>विषय:</b> {html.escape(topic)}\n"
                      f"📝 <b>मांगे गए प्रश्न:</b> {count}\n"
                      f"🤖 <b>AI Generated:</b> {len(questions)}\n\n"
                  )

                  for i, q in enumerate(preview, 1):

                      reply += (
                          f"<b>{i}. "
                          f"{html.escape(q.get('question',''))}</b>\n"
                          f"A. {html.escape(q.get('options',{}).get('A',''))}\n"
                          f"B. {html.escape(q.get('options',{}).get('B',''))}\n"
                          f"C. {html.escape(q.get('options',{}).get('C',''))}\n"
                          f"D. {html.escape(q.get('options',{}).get('D',''))}\n"
                          f"✅ उत्तर: {html.escape(q.get('answer',''))}\n\n"
                      )

                  reply += (
                      "ℹ️ पहले 3 प्रश्न preview में दिखाए गए हैं।\n"
                      "अगले चरण में इन्हें सीधे Gyankshetra Test UI में भेजेंगे।"
                  )

                  send(chat_id, reply)

              except Exception as e:

                  print("AI ERROR:", str(e))

                  send(
                      chat_id,
                      "❌ <b>AI Test नहीं बन पाया।</b>\n\n"
                      "संभावित कारण:\n"
                      "• Gemini API limit\n"
                      "• API key समस्या\n"
                      "• Model/API temporary error\n\n"
                      "कुछ देर बाद फिर कोशिश करें।"
                  )

          # -----------------------------------------
          # Acknowledge processed updates
          # -----------------------------------------

          if last_update_id is not None:

              telegram("getUpdates", {
                  "offset": last_update_id + 1,
                  "limit": 1
              })

          print(f"Processed {len(items)} update(s).")

          PY
