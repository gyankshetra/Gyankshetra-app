name: Gyankshetra Universal Command Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read

jobs:
  telegram-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Universal Telegram Command System
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          APP_URL: https://gyankshetra.github.io/Gyankshetra-app/
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse
          import html
          import re

          TOKEN = os.environ["BOT_TOKEN"]
          APP_URL = os.environ["APP_URL"]

          API = f"https://api.telegram.org/bot{TOKEN}"

          def api(method, params=None):
              data = None

              if params:
                  data = urllib.parse.urlencode(params).encode()

              req = urllib.request.Request(
                  API + "/" + method,
                  data=data
              )

              with urllib.request.urlopen(req, timeout=30) as response:
                  return json.loads(response.read().decode())

          def send(chat_id, text):
              api("sendMessage", {
                  "chat_id": chat_id,
                  "text": text,
                  "parse_mode": "HTML",
                  "disable_web_page_preview": False
              })

          # -----------------------------
          # Telegram Updates
          # -----------------------------

          updates = api("getUpdates", {
              "limit": 100,
              "timeout": 5
          })

          if not updates.get("ok"):
              raise SystemExit("Telegram API error")

          items = updates.get("result", [])

          last_update_id = None

          # -----------------------------
          # Process Messages
          # -----------------------------

          for update in items:

              last_update_id = update["update_id"]

              message = update.get("message", {})
              chat = message.get("chat", {})
              chat_id = chat.get("id")

              text = (message.get("text") or "").strip()

              if not chat_id:
                  continue

              # =====================================
              # START
              # =====================================

              if text.startswith("/start"):

                  reply = (
                      "🎓 <b>Gyankshetra Universal Command Bot</b>\n\n"
                      "अब आप अलग-अलग विषय और प्रश्न संख्या के साथ command भेज सकते हैं।\n\n"

                      "📝 <b>Test</b>\n"
                      "<code>/test इतिहास 50</code>\n"
                      "<code>/test भूगोल 40</code>\n"
                      "<code>/test विज्ञान 20</code>\n\n"

                      "🎯 <b>Practice</b>\n"
                      "<code>/practice रसायन विज्ञान 30</code>\n\n"

                      "🧪 <b>Mock Test</b>\n"
                      "<code>/mock BPSC TRE-4 100</code>\n\n"

                      "📚 <b>PYQ</b>\n"
                      "<code>/pyq BPSC TRE-3 Science 40</code>\n\n"

                      "❓ <b>Help</b>\n"
                      "<code>/help</code>"
                  )

                  send(chat_id, reply)
                  continue

              # =====================================
              # HELP
              # =====================================

              if text.startswith("/help"):

                  reply = (
                      "🤖 <b>Gyankshetra Universal Commands</b>\n\n"

                      "📝 <b>/test</b>\n"
                      "<code>/test इतिहास 50</code>\n"
                      "विषय के अनुसार Test\n\n"

                      "🎯 <b>/practice</b>\n"
                      "<code>/practice जीव विज्ञान 30</code>\n"
                      "Practice Questions\n\n"

                      "🧪 <b>/mock</b>\n"
                      "<code>/mock BPSC TRE-4 100</code>\n"
                      "Full Mock Test\n\n"

                      "📚 <b>/pyq</b>\n"
                      "<code>/pyq BPSC TRE-3 Science 40</code>\n"
                      "Previous Year Questions\n\n"

                      "📌 <b>Question Count</b>\n"
                      "20, 30, 40, 50, 100 आदि दे सकते हैं।\n\n"

                      "💡 भविष्य में AI जोड़ने के बाद यही command "
                      "AI से प्रश्न भी generate करेगी।"
                  )

                  send(chat_id, reply)
                  continue

              # =====================================
              # UNIVERSAL COMMAND PARSER
              # =====================================

              command_match = re.match(
                  r"^/(test|mock|practice|pyq)(?:@\w+)?\s+(.+)$",
                  text,
                  re.IGNORECASE
              )

              if command_match:

                  command = command_match.group(1).lower()
                  content = command_match.group(2).strip()

                  # अंतिम number = question count
                  number_match = re.search(r"(\d+)\s*$", content)

                  if number_match:

                      count = int(number_match.group(1))

                      topic = content[:number_match.start()].strip()

                  else:

                      count = 20
                      topic = content.strip()

                  # Question limit
                  if count < 1:
                      count = 20

                  if count > 200:
                      count = 200

                  # ---------------------------------
                  # Command Name
                  # ---------------------------------

                  names = {
                      "test": "Test",
                      "mock": "Mock Test",
                      "practice": "Practice",
                      "pyq": "PYQ"
                  }

                  command_name = names.get(command, "Test")

                  # ---------------------------------
                  # URL Parameters
                  # ---------------------------------

                  params = urllib.parse.urlencode({
                      "type": command,
                      "topic": topic,
                      "count": count
                  })

                  test_url = APP_URL + "?" + params

                  # ---------------------------------
                  # Response
                  # ---------------------------------

                  reply = (
                      f"✅ <b>Gyankshetra {command_name} तैयार है</b>\n\n"

                      f"📚 <b>विषय:</b> {html.escape(topic)}\n"
                      f"📝 <b>प्रश्न:</b> {count}\n"
                      f"🎯 <b>Type:</b> {command_name}\n"
                      f"❌ <b>Negative Marking:</b> नहीं\n\n"

                      f"🌐 <a href=\"{html.escape(test_url)}\">"
                      "Test खोलें</a>"
                  )

                  send(chat_id, reply)
                  continue

              # =====================================
              # UNKNOWN COMMAND
              # =====================================

              if text.startswith("/"):

                  reply = (
                      "❓ <b>Command समझ नहीं आया</b>\n\n"
                      "उदाहरण:\n\n"

                      "<code>/test इतिहास 50</code>\n"
                      "<code>/test भूगोल 40</code>\n"
                      "<code>/practice विज्ञान 30</code>\n"
                      "<code>/mock BPSC TRE-4 100</code>\n"
                      "<code>/pyq BPSC TRE-3 Science 40</code>\n\n"

                      "सभी commands देखने के लिए:\n"
                      "<code>/help</code>"
                  )

                  send(chat_id, reply)

          # =====================================
          # ACKNOWLEDGE UPDATES
          # =====================================

          if last_update_id is not None:

              api("getUpdates", {
                  "offset": last_update_id + 1,
                  "limit": 1
              })

          print(
              f"Processed {len(items)} Telegram update(s)."
          )

          PY
