name: Gyankshetra AI Test Generator

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: gyankshetra-ai-generator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python
        run: pip install --no-cache-dir requests

      - name: Gyankshetra Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          REPO: ${{ github.repository }}

        run: |
          python3 <<'PY'
          import os
          import json
          import time
          import re
          import html
          import hashlib
          import requests
          import subprocess
          from pathlib import Path
          from datetime import datetime

          # =========================================================
          # CONFIG
          # =========================================================

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]
          REPO = os.environ["REPO"]

          TG = f"https://api.telegram.org/bot{BOT_TOKEN}"
          GROQ_URL = "https://api.groq.com/openai/v1/chat/completions"

          MODEL = "openai/gpt-oss-20b"

          TEMPLATE = Path("index.html")
          OFFSET_FILE = Path(".telegram_offset")
          REGISTRY_FILE = Path("content/generated_tests.json")

          BATCH_SIZE = 4
          POLL_SECONDS = 240

          OWNER, REPO_NAME = REPO.split("/", 1)

          BASE_URL = (
              f"https://{OWNER}.github.io/"
              f"{REPO_NAME}/"
          )

          # =========================================================
          # TELEGRAM
          # =========================================================

          def tg(method, data=None, timeout=60):

              r = requests.post(
                  f"{TG}/{method}",
                  json=data or {},
                  timeout=timeout
              )

              r.raise_for_status()

              result = r.json()

              if not result.get("ok"):
                  raise Exception(
                      f"Telegram error: {result}"
                  )

              return result


          def send(chat_id, text):

              text = str(text)

              for i in range(0, len(text), 3900):

                  tg(
                      "sendMessage",
                      {
                          "chat_id": chat_id,
                          "text": text[i:i+3900],
                          "disable_web_page_preview": False
                      }
                  )


          # =========================================================
          # COMMAND PARSER
          # =========================================================

          COMMANDS = {
              "/test",
              "/quiz",
              "/practice",
              "/mock",
              "/pyq"
          }


          def parse_command(text):

              parts = text.strip().split()

              if not parts:
                  return None, "", 20

              command = parts[0].lower()

              command = command.split("@")[0]

              if command in ["/start", "/help"]:
                  return command, "", 20

              if command not in COMMANDS:
                  return None, "", 20

              count = 20

              if len(parts) >= 2 and parts[-1].isdigit():

                  count = int(parts[-1])

                  parts = parts[:-1]

              topic = " ".join(parts[1:]).strip()

              count = max(1, min(count, 100))

              return command, topic, count


          # =========================================================
          # REGISTRY
          # =========================================================

          def load_registry():

              if not REGISTRY_FILE.exists():
                  return []

              try:

                  data = json.loads(
                      REGISTRY_FILE.read_text(
                          encoding="utf-8"
                      )
                  )

                  return data if isinstance(data, list) else []

              except Exception:

                  return []


          def save_registry(items):

              REGISTRY_FILE.parent.mkdir(
                  parents=True,
                  exist_ok=True
              )

              REGISTRY_FILE.write_text(
                  json.dumps(
                      items,
                      ensure_ascii=False,
                      indent=2
                  ),
                  encoding="utf-8"
              )


          def find_update_in_registry(update_id):

              for item in load_registry():

                  if item.get("update_id") == update_id:
                      return item

              return None


          # =========================================================
          # INDEX UI
          # =========================================================

          REGISTRY_SCRIPT = r'''
          <script id="generatedContentScript">
          (function(){

            async function loadGeneratedContent(){

              try{

                const response =
                  await fetch(
                    'content/generated_tests.json?v='
                    + Date.now()
                  );

                if(!response.ok) return;

                const items = await response.json();

                if(!Array.isArray(items)) return;

                const esc = function(value){

                  return String(value ?? '')
                    .replace(
                      /[&<>"']/g,
                      function(m){
                        return {
                          '&':'&amp;',
                          '<':'&lt;',
                          '>':'&gt;',
                          '"':'&quot;',
                          "'":'&#39;'
                        }[m];
                      }
                    );

                };


                function renderBox(
                  id,
                  heading,
                  icon,
                  types
                ){

                  const box =
                    document.getElementById(id);

                  if(!box) return;

                  const rows =
                    items.filter(function(item){
                      return types.includes(item.type);
                    });

                  if(!rows.length){
                    box.innerHTML = '';
                    return;
                  }

                  let out =
                    '<h3 style="margin:14px 0 8px">'
                    + icon + ' '
                    + heading
                    + '</h3>';


                  rows.forEach(function(item){

                    let extra = '';

                    if(item.type === 'mock'){
                      extra = ' • Mock';
                    }

                    if(item.type === 'pyq'){
                      extra = ' • PYQ-style';
                    }

                    out +=
                      '<div class="card">'
                      + '<b>'
                      + esc(item.title)
                      + '</b>'
                      + '<small>'
                      + esc(item.questions)
                      + ' Questions • '
                      + esc(item.minutes)
                      + ' Minutes'
                      + extra
                      + '</small>'
                      + '<a '
                      + 'href="' + esc(item.url) + '" '
                      + 'class="primary" '
                      + 'style="display:inline-block;'
                      + 'text-decoration:none;'
                      + 'margin-top:9px">'
                      + 'Start Test →'
                      + '</a>'
                      + '</div>';

                  });

                  box.innerHTML = out;

                }


                renderBox(
                  'generatedTests',
                  'AI Test Series',
                  '📝',
                  ['test','mock']
                );


                renderBox(
                  'generatedQuiz',
                  'AI Quiz',
                  '🎯',
                  ['quiz']
                );


                renderBox(
                  'generatedPractice',
                  'AI Practice',
                  '⚡',
                  ['practice']
                );


                renderBox(
                  'generatedPyq',
                  'PYQ Practice',
                  '📄',
                  ['pyq']
                );


                const home =
                  document.getElementById(
                    'generatedHome'
                  );

                if(home){

                  const latest =
                    items.slice(0,5);

                  let out = '';

                  latest.forEach(function(item){

                    out +=
                      '<div class="card">'
                      + '<b>'
                      + esc(item.title)
                      + '</b>'
                      + '<small>'
                      + esc(item.questions)
                      + ' Questions • '
                      + esc(item.minutes)
                      + ' Minutes'
                      + '</small>'
                      + '<a '
                      + 'href="' + esc(item.url) + '" '
                      + 'class="primary" '
                      + 'style="display:inline-block;'
                      + 'text-decoration:none;'
                      + 'margin-top:8px">'
                      + 'Open →'
                      + '</a>'
                      + '</div>';

                  });

                  home.innerHTML = out;

                }

              }
              catch(error){

                console.log(
                  'Generated content:',
                  error
                );

              }

            }


            const path =
              location.pathname;

            if(
              path.endsWith('/')
              ||
              path.endsWith('/index.html')
            ){

              loadGeneratedContent();

            }

          })();
          </script>
          '''


          def ensure_index_ui():

              if not TEMPLATE.exists():

                  raise Exception(
                      "index.html नहीं मिला।"
                  )

              text = TEMPLATE.read_text(
                  encoding="utf-8"
              )

              original = text

              text = text.replace(
                  "\r\n",
                  "\n"
              )


              # -----------------------------------------------------
              # HOME BOX
              # -----------------------------------------------------

              if 'id="generatedHome"' not in text:

                  text = text.replace(
                      "<h3>आज का टेस्ट</h3>",
                      "<h3>आज का टेस्ट</h3>"
                      '<div id="generatedHome"></div>',
                      1
                  )


              # -----------------------------------------------------
              # TEST BOX
              # -----------------------------------------------------

              if 'id="generatedTests"' not in text:

                  marker = (
                      '<main id="tests" '
                      'class="screen">'
                      '<h2>📝 Test Series</h2>'
                  )

                  replacement = (
                      marker
                      '<div id="generatedTests"></div>'
                  )

                  text = text.replace(
                      marker,
                      replacement,
                      1
                  )


              # -----------------------------------------------------
              # QUIZ / PRACTICE / PYQ BOXES
              # -----------------------------------------------------

              if 'id="generatedQuiz"' not in text:

                  marker = (
                      '<main id="practice" '
                      'class="screen">'
                      '<h2>🎯 Quiz</h2>'
                  )

                  replacement = (
                      marker
                      '<div id="generatedQuiz"></div>'
                      '<div id="generatedPractice"></div>'
                      '<div id="generatedPyq"></div>'
                  )

                  text = text.replace(
                      marker,
                      replacement,
                      1
                  )


              # -----------------------------------------------------
              # HIDE QUESTION PALETTE
              # -----------------------------------------------------

              if (
                  "#popupPalette,#paletteHint"
                  not in text
              ):

                  text = text.replace(
                      "</style>",
                      """
          #popupPalette,
          #paletteHint,
          .palette{
            display:none!important;
          }
          </style>
          """,
                      1
                  )


              # -----------------------------------------------------
              # COUNT-UP TIMER
              # Starts 00:00
              # -----------------------------------------------------

              if (
                  "GYANKSHETRA_COUNTUP_TIMER_V1"
                  not in text
              ):

                  pattern = re.compile(
                      r"function startQuiz\(\)\{.*?"
                      r"\}\s*function renderTimer",
                      re.S
                  )

                  replacement = """
          // GYANKSHETRA_COUNTUP_TIMER_V1
          function startQuiz(){
            qi=0;
            ans=Array(TOTAL).fill(null);
            time=0;
            reviewIndex=0;
            clearInterval(timerHandle);
            go('quiz');
            render();
            renderTimer();

            timerHandle=setInterval(()=>{
              if(time<TIME){
                time++;
                renderTimer();

                if(time>=TIME){
                  finish();
                }
              }
            },1000);
          }

          function renderTimer"""

                  text, changed = pattern.subn(
                      replacement,
                      text,
                      count=1
                  )


              text = text.replace(
                  '<span id="timer">20:00</span>',
                  '<span id="timer">00:00</span>',
                  1
              )


              # -----------------------------------------------------
              # DYNAMIC MARKS
              # -----------------------------------------------------

              text = text.replace(
                  "marks.textContent=c+' / 20'",
                  "marks.textContent=c+' / '+TOTAL",
                  1
              )

              text = text.replace(
                  "bestScore.textContent=(h.reduce((m,x)=>Math.max(m,x.marks),0))+' / 20'",
                  "bestScore.textContent=(h.reduce((m,x)=>Math.max(m,Number(x.marks)||0),0))+' / '+TOTAL",
                  1
              )


              # -----------------------------------------------------
              # REGISTRY SCRIPT
              # -----------------------------------------------------

              if (
                  'id="generatedContentScript"'
                  not in text
              ):

                  text = text.replace(
                      "</body>",
                      REGISTRY_SCRIPT
                      + "\n</body>",
                      1
                  )


              if text != original:

                  TEMPLATE.write_text(
                      text,
                      encoding="utf-8"
                  )

              return text


          # =========================================================
          # GROQ SCHEMA
          # =========================================================

          SCHEMA = {
              "type": "object",
              "properties": {
                  "questions": {
                      "type": "array",
                      "items": {
                          "type": "object",
                          "properties": {
                              "question": {
                                  "type": "string"
                              },
                              "options": {
                                  "type": "array",
                                  "items": {
                                      "type": "string"
                                  }
                              },
                              "answer": {
                                  "type": "integer"
                              },
                              "explanation": {
                                  "type": "string"
                              },
                              "facts": {
                                  "type": "array",
                                  "items": {
                                      "type": "string"
                                  }
                              }
                          },
                          "required": [
                              "question",
                              "options",
                              "answer",
                              "explanation",
                              "facts"
                          ],
                          "additionalProperties": False
                      }
                  }
              },
              "required": [
                  "questions"
              ],
              "additionalProperties": False
          }


          # =========================================================
          # GROQ BATCH
          # =========================================================

          def groq_batch(
              topic,
              count,
              command,
              avoid=""
          ):

              if command == "/pyq":

                  instruction = """
          Create PYQ-style practice questions.
          Do NOT claim they are authentic PYQs unless
          a verified source was provided.
          """

              elif command == "/mock":

                  instruction = """
          Create full mock-test level questions.
          Use conceptual, application and exam-oriented
          difficulty.
          """

              elif command == "/practice":

                  instruction = """
          Create concept and application based practice
          questions.
          """

              elif command == "/quiz":

                  instruction = """
          Create engaging high-quality quiz questions
          with medium-to-high difficulty.
          """

              else:

                  instruction = """
          Create high-level Test Series questions.
          """


              prompt = f"""
          You are Gyankshetra's official AI question generator.

          Topic:
          {topic}

          Generate exactly:
          {count} questions

          Exam level:
          STET / BPSC TRE

          {instruction}

          Rules:

          1. Every question must be MCQ.
          2. Exactly 4 options.
          3. Only one correct answer.
          4. answer must be 0,1,2 or 3.
          5. Questions must not repeat.
          6. Questions must be factually accurate.
          7. Write questions primarily in Hindi.
          8. Keep necessary scientific/English terms in English.
          9. Give a concise explanation.
          10. Give exactly 10 useful exam facts.
          11. Medium to high difficulty.
          12. Do not invent facts.
          13. Do not falsely call generated questions authentic PYQs.
          14. Return JSON only.

          Avoid repeating these previous questions:
          {avoid}

          JSON structure:

          {{
            "questions": [
              {{
                "question": "...",
                "options": [
                  "...",
                  "...",
                  "...",
                  "..."
                ],
                "answer": 0,
                "explanation": "...",
                "facts": [
                  "...",
                  "...",
                  "...",
                  "...",
                  "...",
                  "...",
                  "...",
                  "...",
                  "...",
                  "..."
                ]
              }}
            ]
          }}
          """


              payload = {
                  "model": MODEL,

                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "Return only valid JSON "
                              "matching the supplied schema."
                          )
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],

                  "response_format": {
                      "type": "json_schema",
                      "json_schema": {
                          "name": "question_set",
                          "strict": True,
                          "schema": SCHEMA
                      }
                  },

                  "max_completion_tokens": 3500,

                  "reasoning_effort": "low"
              }


              for attempt in range(6):

                  r = requests.post(
                      GROQ_URL,
                      headers={
                          "Authorization":
                              f"Bearer {GROQ_KEY}",
                          "Content-Type":
                              "application/json"
                      },
                      json=payload,
                      timeout=180
                  )


                  if r.status_code == 429:

                      retry_after = (
                          r.headers.get(
                              "Retry-After"
                          )
                      )

                      wait = 25

                      if retry_after:

                          try:
                              wait = int(
                                  float(retry_after)
                              )
                          except:
                              pass

                      else:

                          m = re.search(
                              r"try again in ([0-9.]+)s",
                              r.text,
                              re.I
                          )

                          if m:

                              wait = int(
                                  float(m.group(1))
                              ) + 2

                      wait = min(
                          max(wait, 5),
                          90
                      )

                      print(
                          f"Groq 429. Waiting {wait}s"
                      )

                      time.sleep(wait)

                      continue


                  if r.status_code >= 500:

                      time.sleep(
                          5 * (attempt + 1)
                      )

                      continue


                  if not r.ok:

                      raise Exception(
                          "Groq API Error "
                          f"{r.status_code}: "
                          f"{r.text[:2000]}"
                      )


                  data = r.json()

                  content = (
                      data["choices"][0]
                      ["message"]["content"]
                  )

                  result = json.loads(
                      content
                  )

                  questions = result.get(
                      "questions",
                      []
                  )

                  if not isinstance(
                      questions,
                      list
                  ):

                      raise Exception(
                          "Groq ने questions array नहीं दिया।"
                      )

                  valid = []

                  for q in questions:

                      if not isinstance(
                          q,
                          dict
                      ):
                          continue

                      question = str(
                          q.get(
                              "question",
                              ""
                          )
                      ).strip()

                      options = q.get(
                          "options",
                          []
                      )

                      answer = q.get(
                          "answer",
                          0
                      )

                      explanation = str(
                          q.get(
                              "explanation",
                              ""
                          )
                      ).strip()

                      facts = q.get(
                          "facts",
                          []
                      )


                      if (
                          not question
                          or not isinstance(
                              options,
                              list
                          )
                          or len(options) != 4
                          or not isinstance(
                              facts,
                              list
                          )
                      ):
                          continue


                      try:

                          answer = int(answer)

                      except:

                          continue


                      if answer not in range(4):
                          continue


                      options = [
                          str(x).strip()
                          for x in options
                      ]

                      facts = [
                          str(x).strip()
                          for x in facts
                          if str(x).strip()
                      ]


                      if len(facts) < 3:
                          continue


                      valid.append({
                          "question": question,
                          "options": options,
                          "answer": answer,
                          "explanation": explanation,
                          "facts": facts[:10]
                      })


                  return valid


              raise Exception(
                  "Groq लगातार retry के बाद भी response नहीं दे पाया।"
              )


          # =========================================================
          # GENERATE TOTAL
          # =========================================================

          def generate_questions(
              topic,
              total,
              command
          ):

              result = []

              seen = set()

              empty_rounds = 0


              while len(result) < total:

                  batch = min(
                      BATCH_SIZE,
                      total - len(result)
                  )


                  avoid = "\n".join(
                      q["question"]
                      for q in result[-8:]
                  )


                  qs = groq_batch(
                      topic,
                      batch,
                      command,
                      avoid
                  )


                  added = 0


                  for q in qs:

                      key = re.sub(
                          r"\s+",
                          " ",
                          q["question"].strip().lower()
                      )


                      if key in seen:
                          continue


                      seen.add(key)

                      result.append(q)

                      added += 1


                      if len(result) >= total:
                          break


                  if added == 0:

                      empty_rounds += 1

                      if empty_rounds >= 3:

                          raise Exception(
                              "AI ने लगातार duplicate/invalid "
                              "questions दिए।"
                          )

                  else:

                      empty_rounds = 0


                  time.sleep(1)


              return result[:total]


          # =========================================================
          # CREATE GENERATED HTML
          # =========================================================

          def create_generated_page(
              topic,
              questions,
              command
          ):

              template = ensure_index_ui()

              total = len(questions)

              time_seconds = total * 60


              old_format = []


              for q in questions:

                  options = q["options"]

                  options = (
                      options + ["", "", "", ""]
                  )[:4]


                  answer = int(
                      q["answer"]
                  )


                  facts = [
                      str(x)
                      for x in q.get(
                          "facts",
                          []
                      )
                  ]


                  old_format.append(
                      [
                          str(q["question"]),
                          options,
                          answer,
                          facts
                      ]
                  )


              js_questions = json.dumps(
                  old_format,
                  ensure_ascii=False,
                  separators=(",", ":")
              )


              # Protect </script>
              js_questions = js_questions.replace(
                  "</",
                  "<\\/"
              )


              topic_json = json.dumps(
                  topic,
                  ensure_ascii=False
              ).replace(
                  "</",
                  "<\\/"
              )


              escaped_topic = html.escape(
                  topic
              )


              # -----------------------------------------------------
              # TOTAL / TIME
              # -----------------------------------------------------

              text = re.sub(
                  r"const TOTAL=.*?;",
                  (
                      f"const TOTAL={total},"
                      f"TIME={time_seconds};"
                  ),
                  template,
                  count=1
              )


              # -----------------------------------------------------
              # QUESTION ARRAY
              # -----------------------------------------------------

              q_start = text.find(
                  "const questions=["
              )

              q_marker = "];\nlet qi=0,"

              q_end = text.find(
                  q_marker,
                  q_start
              )


              if (
                  q_start == -1
                  or q_end == -1
              ):

                  raise Exception(
                      "Master UI में current "
                      "question block नहीं मिला।"
                  )


              text = (
                  text[:q_start]
                  + "const questions="
                  + js_questions
                  + ";"
                  + text[q_end + 2:]
              )


              # -----------------------------------------------------
              # GENERATED TOPIC
              # -----------------------------------------------------

              qi_pos = text.find(
                  "let qi=0,"
              )


              text = (
                  text[:qi_pos]
                  + f"const GENERATED_TOPIC={topic_json};\n"
                  + text[qi_pos:]
              )


              # -----------------------------------------------------
              # TITLE
              # -----------------------------------------------------

              text = re.sub(
                  r"<title>.*?</title>",
                  (
                      f"<title>"
                      f"Gyankshetra — "
                      f"{escaped_topic} "
                      f"{total}Q"
                      f"</title>"
                  ),
                  text,
                  count=1,
                  flags=re.S
              )


              # -----------------------------------------------------
              # QUIZ HEADER
              # -----------------------------------------------------

              text = re.sub(
                  r"(<main id=\"quiz\".*?"
                  r"<div class=\"quizbar\">"
                  r"<button[^>]*>‹</button>"
                  r"<b>).*?(</b>)",
                  lambda m:
                      m.group(1)
                      + escaped_topic
                      + m.group(2),
                  text,
                  count=1,
                  flags=re.S
              )


              # Back button -> main app
              back_button = (
                  '<button '
                  f'onclick="location.href=\''
                  f'{BASE_URL}'
                  f'\'">‹</button>'
              )


              text = re.sub(
                  r'<button onclick="go\(\'tests\'\)">‹</button>',
                  back_button,
                  text,
                  count=1
              )


              # -----------------------------------------------------
              # QUESTION COUNT
              # -----------------------------------------------------

              text = re.sub(
                  r'<span id="qn">.*?</span>',
                  f'<span id="qn">1/{total}</span>',
                  text,
                  count=1
              )


              # Timer starts at 00:00
              text = re.sub(
                  r'<span id="timer">.*?</span>',
                  '<span id="timer">00:00</span>',
                  text,
                  count=1
              )


              # -----------------------------------------------------
              # COUNT-UP TIMER
              # -----------------------------------------------------

              start_pattern = re.compile(
                  r"function startQuiz\(\)\{.*?"
                  r"\}\s*function renderTimer",
                  re.S
              )


              start_replacement = """
          function startQuiz(){
            qi=0;
            ans=Array(TOTAL).fill(null);
            time=0;
            reviewIndex=0;
            clearInterval(timerHandle);
            go('quiz');
            render();
            renderTimer();

            timerHandle=setInterval(()=>{
              if(time<TIME){
                time++;
                renderTimer();

                if(time>=TIME){
                  finish();
                }
              }
            },1000);
          }

          function renderTimer"""


              text, changed = (
                  start_pattern.subn(
                      start_replacement,
                      text,
                      count=1
                  )
              )


              if changed != 1:

                  raise Exception(
                      "Timer function नहीं मिला।"
                  )


              # -----------------------------------------------------
              # DYNAMIC FINISH
              # -----------------------------------------------------

              finish_pattern = re.compile(
                  r"function finish\(\)\{.*?"
                  r"\}\s*function showReview",
                  re.S
              )


              finish_replacement = """
          function finish(){
            if(!quiz.classList.contains('active'))return;

            clearInterval(timerHandle);
            timerHandle=null;

            closePopup();

            let c=ans.filter(
              (v,i)=>v!==null &&
              v===questions[i][2]
            ).length;

            let w=ans.filter(
              (v,i)=>v!==null &&
              v!==questions[i][2]
            ).length;

            let s=ans.filter(
              v=>v===null
            ).length;

            let item={
              date:new Date().toLocaleString('hi-IN'),
              test:GENERATED_TOPIC,
              marks:c,
              total:TOTAL,
              correct:c,
              wrong:w,
              skipped:s
            };

            let h=JSON.parse(
              localStorage.getItem('history')||'[]'
            );

            h.push(item);

            localStorage.setItem(
              'history',
              JSON.stringify(h)
            );

            score.textContent=
              Math.round(c/TOTAL*100)+'%';

            marks.textContent=
              c+' / '+TOTAL;

            correct.textContent=c;
            wrong.textContent=w;
            skipped.textContent=s;

            go('result');
          }

          function showReview"""


              text, changed = (
                  finish_pattern.subn(
                      finish_replacement,
                      text,
                      count=1
                  )
              )


              if changed != 1:

                  raise Exception(
                      "Finish function नहीं मिला।"
                  )


              # -----------------------------------------------------
              # HIDE QUESTION PALETTE
              # -----------------------------------------------------

              text = text.replace(
                  "</style>",
                  """
          #popupPalette,
          #paletteHint,
          .palette{
            display:none!important;
          }
          </style>
          """,
                  1
              )


              # -----------------------------------------------------
              # AUTO START
              # -----------------------------------------------------

              boot = f"""
          <script id="generatedBoot">
          window.addEventListener(
            'load',
            function(){{
              try{{
                var title =
                  document.querySelector(
                    '#quiz .quizbar b'
                  );

                if(title){{
                  title.textContent =
                    GENERATED_TOPIC;
                }}

                requireUser(startQuiz);

              }}catch(e){{
                console.error(e);
              }}
            }}
          );
          </script>
          """

              text = text.replace(
                  "</body>",
                  boot + "\n</body>",
                  1
              )


              # -----------------------------------------------------
              # FOLDER
              # -----------------------------------------------------

              folders = {
                  "/test": "tests",
                  "/mock": "tests",
                  "/quiz": "quiz",
                  "/practice": "practice",
                  "/pyq": "pyq"
              }


              folder = folders.get(
                  command,
                  "tests"
              )


              stamp = datetime.utcnow().strftime(
                  "%Y%m%d-%H%M%S"
              )


              short_hash = hashlib.sha1(
                  (
                      topic
                      + str(time.time())
                  ).encode(
                      "utf-8"
                  )
              ).hexdigest()[:6]


              slug = (
                  command[1:]
                  + "-"
                  + stamp
                  + "-"
                  + short_hash
              )


              directory = Path(folder)

              directory.mkdir(
                  parents=True,
                  exist_ok=True
              )


              filepath = (
                  directory
                  / f"{slug}.html"
              )


              filepath.write_text(
                  text,
                  encoding="utf-8"
              )


              relative_url = (
                  f"{folder}/{slug}.html"
              )


              return (
                  filepath,
                  relative_url
              )


          # =========================================================
          # GIT
          # =========================================================

          def git_config():

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.name",
                      "Gyankshetra Bot"
                  ],
                  check=True
              )

              subprocess.run(
                  [
                      "git",
                      "config",
                      "user.email",
                      "bot@gyankshetra.github.io"
                  ],
                  check=True
              )


          def git_publish(message):

              git_config()

              subprocess.run(
                  ["git", "add", "-A"],
                  check=True
              )


              status = subprocess.run(
                  [
                      "git",
                      "diff",
                      "--cached",
                      "--quiet"
                  ]
              )


              if status.returncode == 0:

                  return


              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      message
                  ],
                  check=True
              )


              result = subprocess.run(
                  [
                      "git",
                      "push",
                      "origin",
                      "HEAD:main"
                  ]
              )


              if result.returncode != 0:

                  raise Exception(
                      "GitHub push failed."
                  )


          # =========================================================
          # OFFSET
          # =========================================================

          def get_offset():

              try:

                  return int(
                      OFFSET_FILE.read_text(
                          encoding="utf-8"
                      ).strip()
                  )

              except:

                  return 0


          def save_offset(update_id):

              OFFSET_FILE.write_text(
                  str(update_id + 1),
                  encoding="utf-8"
              )


          # =========================================================
          # MAIN
          # =========================================================

          def main():

              print(
                  "Gyankshetra AI Generator started"
              )


              offset = get_offset()

              started = time.time()


              while (
                  time.time() - started
                  < POLL_SECONDS
              ):

                  response = tg(
                      "getUpdates",
                      {
                          "offset": offset,
                          "timeout": 25,
                          "allowed_updates": [
                              "message"
                          ]
                      },
                      timeout=40
                  )


                  updates = response.get(
                      "result",
                      []
                  )


                  for update in updates:

                      update_id = update[
                          "update_id"
                      ]

                      message = update.get(
                          "message",
                          {}
                      )

                      chat = message.get(
                          "chat",
                          {}
                      )

                      chat_id = chat.get(
                          "id"
                      )

                      text = message.get(
                          "text",
                          ""
                      )


                      if (
                          not chat_id
                          or not text
                      ):

                          offset = update_id + 1

                          save_offset(
                              update_id
                          )

                          continue


                      print(
                          "Telegram command:",
                          text
                      )


                      # ------------------------------------------------
                      # Duplicate generated request recovery
                      # ------------------------------------------------

                      previous = (
                          find_update_in_registry(
                              update_id
                          )
                      )


                      if previous:

                          try:

                              send(
                                  chat_id,
                                  "🔗 आपका LIVE TEST पहले से तैयार है:\n\n"
                                  + BASE_URL
                                  + previous["url"]
                              )

                              save_offset(
                                  update_id
                              )

                              git_publish(
                                  "Update Telegram offset"
                              )

                          except Exception as e:

                              print(
                                  "Recovery error:",
                                  e
                              )

                          offset = update_id + 1

                          continue


                      command, topic, count = (
                          parse_command(text)
                      )


                      # ------------------------------------------------
                      # START / HELP
                      # ------------------------------------------------

                      if command in [
                          "/start",
                          "/help"
                      ]:

                          try:

                              send(
                                  chat_id,

                                  "🚀 Gyankshetra AI Bot\n\n"

                                  "/test इतिहास 20\n"
                                  "/quiz इतिहास 10\n"
                                  "/practice रसायन 20\n"
                                  "/mock विज्ञान 30\n"
                                  "/pyq BPSC TRE Science 20\n\n"

                                  "1–100 प्रश्न बनाए जा सकते हैं।\n\n"

                                  "Command लिखते ही AI test "
                                  "बनाकर GitHub Pages पर publish होगा।"
                              )

                              save_offset(
                                  update_id
                              )

                              git_publish(
                                  "Update Telegram offset"
                              )

                          except Exception as e:

                              print(e)

                          offset = update_id + 1

                          continue


                      # ------------------------------------------------
                      # INVALID
                      # ------------------------------------------------

                      if command is None:

                          offset = update_id + 1

                          continue


                      if not topic:

                          try:

                              send(
                                  chat_id,
                                  "❌ Topic लिखिए।\n\n"
                                  "उदाहरण:\n"
                                  "/quiz इतिहास 10"
                              )

                              save_offset(
                                  update_id
                              )

                              git_publish(
                                  "Update Telegram offset"
                              )

                          except Exception as e:

                              print(e)

                          offset = update_id + 1

                          continue


                      # ------------------------------------------------
                      # PROGRESS
                      # ------------------------------------------------

                      try:

                          send(
                              chat_id,
                              "⏳ Gyankshetra AI काम कर रहा है...\n\n"
                              f"Command: {command}\n"
                              f"Topic: {topic}\n"
                              f"Questions: {count}\n\n"
                              "Groq AI प्रश्न बना रहा है।"
                          )


                          # --------------------------------------------
                          # GENERATE
                          # --------------------------------------------

                          questions = generate_questions(
                              topic,
                              count,
                              command
                          )


                          if len(questions) != count:

                              raise Exception(
                                  "AI ने requested संख्या में "
                                  "questions नहीं दिए।"
                              )


                          # --------------------------------------------
                          # CREATE PAGE
                          # --------------------------------------------

                          filepath, relative_url = (
                              create_generated_page(
                                  topic,
                                  questions,
                                  command
                              )
                          )


                          # --------------------------------------------
                          # REGISTRY ENTRY
                          # --------------------------------------------

                          if command == "/test":

                              title = (
                                  f"📝 {topic} "
                                  f"{count}Q"
                              )

                          elif command == "/mock":

                              title = (
                                  f"🧪 Mock — {topic} "
                                  f"{count}Q"
                              )

                          elif command == "/quiz":

                              title = (
                                  f"🎯 {topic} "
                                  f"{count}Q"
                              )

                          elif command == "/practice":

                              title = (
                                  f"⚡ Practice — {topic} "
                                  f"{count}Q"
                              )

                          else:

                              title = (
                                  f"📄 PYQ-style — "
                                  f"{topic} {count}Q"
                              )


                          entry = {

                              "update_id":
                                  update_id,

                              "type":
                                  command[1:],

                              "topic":
                                  topic,

                              "title":
                                  title,

                              "url":
                                  relative_url,

                              "questions":
                                  count,

                              "minutes":
                                  count,

                              "created_at":
                                  datetime.utcnow().isoformat()
                                  + "Z",

                              "pyq_authentic":
                                  False
                                  if command == "/pyq"
                                  else None

                          }


                          registry = (
                              load_registry()
                          )


                          registry = [
                              entry
                          ] + [
                              x for x in registry
                              if x.get("url")
                              != relative_url
                          ]


                          registry = registry[:100]


                          save_registry(
                              registry
                          )


                          # --------------------------------------------
                          # PUBLISH
                          # --------------------------------------------

                          git_publish(
                              f"Gyankshetra AI: {title}"
                          )


                          # --------------------------------------------
                          # LIVE LINK
                          # --------------------------------------------

                          live_url = (
                              BASE_URL
                              + relative_url
                          )


                          send(
                              chat_id,

                              "✅ TEST READY!\n\n"

                              f"📚 {title}\n"
                              f"❓ Questions: {count}\n"
                              f"⏱ Time: {count} Minutes\n"
                              "➕ No Negative Marking\n\n"

                              "🔗 LIVE TEST:\n"
                              + live_url
                          )


                          # --------------------------------------------
                          # SAVE OFFSET
                          # --------------------------------------------

                          save_offset(
                              update_id
                          )

                          git_publish(
                              "Update Telegram offset"
                          )


                      except Exception as e:

                          error_text = str(e)

                          print(
                              "ERROR:",
                              error_text
                          )


                          try:

                              send(
                                  chat_id,
                                  "❌ Test नहीं बन पाया।\n\n"
                                  "Error:\n"
                                  + error_text[:3000]
                              )

                              save_offset(
                                  update_id
                              )

                              git_publish(
                                  "Update Telegram offset"
                              )

                          except Exception as inner:

                              print(
                                  "Error sending failure:",
                                  inner
                              )


                      offset = update_id + 1


              print(
                  "Gyankshetra bot polling finished."
              )


          if __name__ == "__main__":

              main()

          PY
