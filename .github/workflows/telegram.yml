hapter": "मानसून", "q": "भारत में दक्षिण-पश्चिम मानसून के आगमन को प्रभावित करने वाली प्रमुख भौगोलिक व्यवस्था कौन-सी है?", "opts": ["स्थल-समुद्र के तापीय अंतर और दाब-प्रणाली", "केवल हिमपात", "केवल समुद्री ज्वार", "केवल भूमध्य रेखा की स्थिति"], "ans": 0, "facts": ["भारतीय मानसून seasonal wind reversal से जुड़ा है।", "भूमि और समुद्र के अलग-अलग heating से pressure gradients बनते हैं।", "दक्षिण-पश्चिम मानसून सामान्यतः जून के आसपास भारत पहुँचता है।", "अरब सागर और बंगाल की खाड़ी दोनों शाखाएँ महत्वपूर्ण हैं।", "पश्चिमी घाट के windward भाग में orographic rainfall अधिक हो सकता है।", "हिमालयीय अवरोध मानसूनी circulation को प्रभावित करता है।", "ENSO और Indian Ocean Dipole जैसे ocean-atmosphere factors भी variability से जुड़े हैं।", "मानसून कृषि और जल संसाधनों के लिए अत्यंत महत्वपूर्ण है।"]}, {"subject": "राजव्यवस्था", "chapter": "निर्वाचन", "q": "भारत में लोकसभा के सामान्य चुनाव में मतदान की न्यूनतम आयु कितनी है?", "opts": ["18 वर्ष", "21 वर्ष", "25 वर्ष", "30 वर्ष"], "ans": 0, "facts": ["भारत में मतदान की न्यूनतम आयु 18 वर्ष है।", "61वें संविधान संशोधन अधिनियम, 1988 ने आयु 21 से घटाकर 18 वर्ष की।", "यह परिवर्तन 1989 के आम चुनावों से प्रभावी हुआ।", "मतदाता बनने के लिए भारतीय नागरिकता और कानूनी पात्रता आवश्यक है।", "मतदाता सूची में नाम का पंजीकरण चुनावी भागीदारी की मूल शर्त है।", "भारत में चुनाव आयोग एक संवैधानिक निकाय है।", "अनुच्छेद 324 चुनाव आयोग से संबंधित है।", "मतदान की आयु और लोकसभा सदस्य बनने की न्यूनतम आयु अलग अवधारणाएँ हैं।"]}];
let qi=0,ans=Array(TOTAL).fill(null),time=TIME,timerHandle=null,pendingAction=null,submitted=false;
function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');scrollTo(0,0);updateProfile();}
function drawer(){document.getElementById('drawer').classList.toggle('open')}
function getUser(){return {name:localStorage.getItem('gyankshetraUserName')||'',id:localStorage.getItem('gyankshetraUserId')||''}}
function shortName(n){return (n.trim().split(/\s+/)[0]||'Name').replace(/[^\p{L}\p{N}]/gu,'')}
function nextNo(){return Number(localStorage.getItem('gyankshetraNextNumber')||1)}
function previewId(){let n=nextNo();let name=shortName(document.getElementById('nameInput').value)||'Name';document.getElementById('idPreview').textContent='आपकी ID: @'+String(n).padStart(2,'0')+name}
function requireUser(action){if(getUser().name){action()}else{pendingAction=action;document.getElementById('loginModal').classList.add('open');setTimeout(()=>document.getElementById('nameInput').focus(),100);previewId()}}
function saveUser(){let name=document.getElementById('nameInput').value.trim();if(!name){alert('कृपया अपना नाम दर्ज करें।');return}let n=nextNo();let id='@'+String(n).padStart(2,'0')+shortName(name);localStorage.setItem('gyankshetraUserName',name);localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraNextNumber',String(n+1));document.getElementById('loginModal').classList.remove('open');updateProfile();let a=pendingAction;pendingAction=null;if(a)a()}
function changeUser(){localStorage.removeItem('gyankshetraUserName');localStorage.removeItem('gyankshetraUserId');document.getElementById('nameInput').value='';previewId();document.getElementById('loginModal').classList.add('open')}
function updateProfile(){let u=getUser();document.getElementById('profileName').textContent=u.name||'Gyankshetra Student';document.getElementById('profileId').textContent=u.id||'Login करके अपनी ID बनाएँ';document.getElementById('welcome').textContent=u.name?'नमस्ते '+u.name+' 👋':'नमस्ते विद्यार्थी 👋';document.getElementById('quizUser').textContent=u.id?u.name+' • '+u.id:'';document.getElementById('resultUser').textContent=u.id?u.name+' • '+u.id:'';let h=JSON.parse(localStorage.getItem('gyankshetraHistory')||'[]');document.getElementById('historyText').textContent=h.length?`${h.length} टेस्ट पूरे किए • पिछला: ${h[h.length-1].marks}/50`:'अभी कोई टेस्ट नहीं दिया गया।';let best=h.reduce((m,x)=>Math.max(m,Number(x.marks)||0),0);document.getElementById('bestScore').textContent=best+' / 50'}
function openPopup(){document.getElementById('questionPopup').classList.add('open');renderPopup()}
function closePopup(){document.getElementById('questionPopup').classList.remove('open')}
function renderPopup(){document.getElementById('popupPalette').innerHTML=questions.map((_,i)=>`<span class="p ${ans[i]!==null?'done':''} ${i===qi?'cur':''}" onclick="jumpQuestion(${i})">${i+1}</span>`).join('')}
function jumpQuestion(i){qi=i;closePopup();render()}
function startQuiz(){qi=0;ans=Array(TOTAL).fill(null);time=TIME;submitted=false;clearInterval(timerHandle);go('quiz');render();timerHandle=setInterval(()=>{if(time>0){time--;renderTimer()}else finish()},1000)}
function reattempt(){startQuiz()}
function renderTimer(){let m=Math.floor(time/60),s=time%60;document.getElementById('timer').textContent=String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function render(){let q=questions[qi];document.getElementById('qn').textContent=(qi+1)+'/50';document.getElementById('num').textContent=qi+1;document.getElementById('question').innerHTML=`<div class="tagline">${q.subject} • ${q.chapter}</div>${q.q}`;document.getElementById('options').innerHTML=q.opts.map((o,i)=>`<div class="option ${ans[qi]===i?'sel':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join('');document.getElementById('analysis').hidden=true;document.getElementById('palette').innerHTML=questions.map((_,i)=>`<span class="p ${ans[i]!==null?'done':''} ${i===qi?'cur':''}" onclick="qi=${i};render()">${i+1}</span>`).join('');renderTimer()}
function choose(i){ans[qi]=i;render();renderPopup()}
function next(){if(qi<TOTAL-1){qi++;render()}else finish()}
function prev(){if(qi>0){qi--;render()}}
function finish(){if(submitted)return;submitted=true;clearInterval(timerHandle);timerHandle=null;closePopup();let c=ans.filter((a,i)=>a===questions[i].ans).length,w=ans.filter((a,i)=>a!==null&&a!==questions[i].ans).length,s=ans.filter(a=>a===null).length;let u=getUser();let item={date:new Date().toLocaleString('hi-IN'),test:'BPSC TRE-4 / STET • 50Q High Level',marks:c,percentage:Math.round(c/TOTAL*100),correct:c,wrong:w,skipped:s,userId:u.id};let h=JSON.parse(localStorage.getItem('gyankshetraHistory')||'[]');h.push(item);localStorage.setItem('gyankshetraHistory',JSON.stringify(h));document.getElementById('score').textContent=item.percentage+'%';document.getElementById('correct').textContent=c;document.getElementById('wrong').textContent=w;document.getElementById('skip').textContent=s;document.getElementById('marks').textContent=c+' / 50';go('result')}
function showReview(){go('review');let list=document.getElementById('reviewList');list.innerHTML='';questions.forEach((q,i)=>{let ok=ans[i]===q.ans;let userAns=ans[i]===null?'नहीं दिया':q.opts[ans[i]];let d=document.createElement('div');d.className='reviewitem';d.innerHTML=`<div class="reviewhead"><span>प्रश्न ${i+1} / 50</span><span class="subjectbadge">${q.subject} • ${q.chapter}</span></div><p><b>${q.q}</b></p><p>${q.opts.map((o,j)=>`${String.fromCharCode(65+j)}. ${o}`).join('<br>')}</p><p class="state ${ok?'ok':'bad'}">${ok?'✅ सही':'❌ गलत'}</p><p>आपका उत्तर: <b>${userAns}</b><br>सही उत्तर: <b>${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}</b></p><div class="important"><b>📚 8 Important Facts / Analysis</b><ol>${q.facts.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;list.appendChild(d)})}
let points='';questions.forEach((q,i)=>points+=`<div class="point"><b>प्रश्न ${i+1}: ${q.subject} • ${q.chapter}</b><small>सही उत्तर: ${String.fromCharCode(65+q.ans)}. ${q.opts[q.ans]}<br>${q.facts.slice(0,3).join(' • ')}</small></div>`);document.getElementById('pointsList').innerHTML=points;updateProfile();
</script>
</body>
</html>
