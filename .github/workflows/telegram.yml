name: Gyankshetra Telegram Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

jobs:
  telegram-bot:
    runs-on: ubuntu-latest

    steps:
      - name: Run Gyankshetra AI Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python3 <<'PY'
          import os
          import json
          import urllib.request
          import urllib.parse

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          GROQ_KEY = os.environ["GROQ_API_KEY"]

          TG = f"https://api.telegram.org/bot{BOT_TOKEN}"
          offset_file = "/tmp/telegram_offset.txt"

          try:
              offset = int(open(offset_file).read().strip())
          except:
              offset = 0

          def tg(method, data):
              url = f"{TG}/{method}"
              req = urllib.request.Request(
                  url,
                  data=urllib.parse.urlencode(data).encode(),
                  method="POST"
              )
              with urllib.request.urlopen(req, timeout=60) as r:
                  return json.loads(r.read().decode())

          def send(chat_id, text):
              tg("sendMessage", {
                  "chat_id": chat_id,
                  "text": text
              })

          def groq_questions(topic, count):
              schema = {
                  "name": "mcq_test",
                  "strict": True,
                  "schema": {
                      "type": "object",
                      "additionalProperties": False,
                      "properties": {
                          "questions": {
                              "type": "array",
                              "items": {
                                  "type": "object",
                                  "additionalProperties": False,
                                  "properties": {
                                      "question": {"type": "string"},
                                      "A": {"type": "string"},
                                      "B": {"type": "string"},
                                      "C": {"type": "string"},
                                      "D": {"type": "string"},
                                      "answer": {
                                          "type": "string",
                                          "enum": ["A", "B", "C", "D"]
                                      },
                                      "explanation": {"type": "string"},
                                      "facts": {
                                          "type": "array",
                                          "items": {"type": "string"}
                                      }
                                  },
                                  "required": [
                                      "question",
                                      "A",
                                      "B",
                                      "C",
                                      "D",
                                      "answer",
                                      "explanation",
                                      "facts"
                                  ]
                              }
                          }
                      },
                      "required": ["questions"]
                  }
              }

              prompt = f"""
              आप Gyankshetra के परीक्षा-प्रश्न निर्माता हैं।

              विषय/अध्याय: {topic}
              कुल प्रश्न: {count}

              STET, BPSC TRE और अन्य प्रतियोगी परीक्षाओं के स्तर के
              उच्च-गुणवत्ता वाले मौलिक MCQ तैयार करें।

              नियम:
              1. हर प्रश्न में केवल एक सही उत्तर हो।
              2. चार विकल्प A, B, C, D दें।
              3. प्रश्न तथ्यात्मक और परीक्षा-उपयोगी हों।
              4. प्रश्नों में अनावश्यक दोहराव न हो।
              5. सही उत्तर explanation में भी स्पष्ट करें।
              6. प्रत्येक प्रश्न के साथ 5 महत्वपूर्ण exam facts दें।
              7. भाषा सरल और शुद्ध हिन्दी रखें।
              8. जहाँ आवश्यक हो English scientific terms को वैसे ही रखें।
              9. केवल मांगे गए JSON format में उत्तर दें।
              """

              body = {
                  "model": "openai/gpt-oss-20b",
                  "messages": [
                      {
                          "role": "system",
                          "content": "आप एक सटीक और परीक्षा-केंद्रित MCQ generator हैं।"
                      },
                      {
                          "role": "user",
                          "content": prompt
                      }
                  ],
                  "temperature": 0.3,
                  "max_completion_tokens": 7000,
                  "response_format": {
                      "type": "json_schema",
                      "json_schema": schema
                  }
              }

              req = urllib.request.Request(
                  "https://api.groq.com/openai/v1/chat/completions",
                  data=json.dumps(body).encode(),
                  headers={
                      "Authorization": f"Bearer {GROQ_KEY}",
                      "Content-Type": "application/json"
                  },
                  method="POST"
              )

              with urllib.request.urlopen(req, timeout=120) as r:
                  result = json.loads(r.read().decode())

              content = result["choices"][0]["message"]["content"]
              return json.loads(content)

          # Telegram updates
          try:
              updates = tg("getUpdates", {
                  "offset": offset,
                  "timeout": 5
              }).get("result", [])
          except Exception as e:
              print("Telegram ERROR:", e)
              raise

          for update in updates:
              offset = update["update_id"] + 1

              message = update.get("message", {})
              chat = message.get("chat", {})
              chat_id = chat.get("id")
              text = message.get("text", "")

              if not chat_id:
                  continue

              text = text.strip()

              if text == "/start":
                  send(chat_id,
                       "🎓 Gyankshetra AI Command Bot\n\n"
                       "अब AI से प्रश्न बनाए जा सकते हैं।\n\n"
                       "उदाहरण:\n"
                       "/test इतिहास 5\n"
                       "/test भूगोल 10\n"
                       "/test विज्ञान 20\n"
                       "/practice रसायन विज्ञान 10\n"
                       "/mock BPSC TRE-4 20\n\n"
                       "🤖 AI: Groq")

              elif text == "/help":
                  send(chat_id,
                       "📚 Gyankshetra Commands\n\n"
                       "/test विषय संख्या\n"
                       "/practice विषय संख्या\n"
                       "/mock विषय संख्या\n\n"
                       "उदाहरण:\n"
                       "/test इतिहास 5\n"
                       "/test विलयन 10\n"
                       "/mock BPSC TRE-4 विज्ञान 20")

              elif text.startswith(("/test ", "/practice ", "/mock ")):
                  parts = text.split()

                  command = parts[0]
                  numbers = [x for x in parts if x.isdigit()]

                  if not numbers:
                      send(chat_id,
                           "❌ प्रश्न संख्या नहीं मिली।\n\n"
                           "उदाहरण:\n"
                           "/test इतिहास 5")
                      continue

                  count = int(numbers[-1])

                  if count < 1 or count > 50:
                      send(chat_id,
                           "❌ अभी 1 से 50 प्रश्न तक बनाए जा सकते हैं।")
                      continue

                  topic_parts = parts[1:-1]
                  topic = " ".join(topic_parts).strip()

                  if not topic:
                      send(chat_id,
                           "❌ विषय बताइए।\n\n"
                           "उदाहरण:\n"
                           "/test इतिहास 5")
                      continue

                  send(chat_id,
                       "🤖 Groq AI प्रश्न तैयार कर रहा है...\n\n"
                       f"📚 विषय: {topic}\n"
                       f"📝 प्रश्न: {count}\n\n"
                       "⏳ कृपया प्रतीक्षा करें...")

                  try:
                      data = groq_questions(topic, count)
                      questions = data["questions"]

                      reply = (
                          "✅ AI Test तैयार है!\n\n"
                          f"📚 विषय: {topic}\n"
                          f"📝 प्रश्न: {len(questions)}\n"
                          f"🎯 Command: {command}\n\n"
                      )

                      # पहले 3 प्रश्न Telegram में preview
                      for i, q in enumerate(questions[:3], 1):
                          reply += (
                              f"Q{i}. {q['question']}\n"
                              f"A) {q['A']}\n"
                              f"B) {q['B']}\n"
                              f"C) {q['C']}\n"
                              f"D) {q['D']}\n"
                              f"✅ उत्तर: {q['answer']}\n"
                              f"💡 {q['explanation']}\n\n"
                          )

                      if len(questions) > 3:
                          reply += (
                              f"📌 बाकी {len(questions)-3} प्रश्न भी AI ने तैयार किए हैं।"
                          )

                      send(chat_id, reply)

                  except Exception as e:
                      print("GROQ ERROR:", repr(e))

                      send(chat_id,
                           "❌ Groq AI Test नहीं बन पाया।\n\n"
                           "संभावित कारण:\n"
                           "• API key समस्या\n"
                           "• Groq limit\n"
                           "• Model/API error\n\n"
                           "GitHub Actions log में error देखें।")

              else:
                  send(chat_id,
                       "❓ Command समझ नहीं आया।\n\n"
                       "उदाहरण:\n"
                       "/test इतिहास 5")

          open(offset_file, "w").write(str(offset))
          print("Bot run completed.")
          PY
