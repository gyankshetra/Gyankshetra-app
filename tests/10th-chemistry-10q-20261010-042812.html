<script>
const testData = {"isReattempted":false,"studentName":"छात्र","topic":"10th chemistry","questions":[{"id":1,"text":"सोडियम क्लोराइड (NaCl) के घुलनशीलता गुणांक (solubility product) के बारे में सही कथन कौन-सा है?","options":["यह 25°C पर 1.0×10⁻⁹ है","यह 25°C पर 1.0×10⁻⁶ है","यह 25°C पर 1.0×10⁻⁴ है","यह 25°C पर 1.0×10⁻⁵ है"],"correctOption":1,"selected":null,"status":"skipped","facts":["सोडियम क्लोराइड अत्यधिक घुलनशील है और इसका Ksp बहुत बड़ा होता है, परन्तु सामान्यतः Ksp को 25°C पर 1.0×10⁻⁶ के रूप में प्रयोगशाला डेटा में दिया जाता है।","NaCl का घुलनशीलता 25°C पर लगभग 36 g/100 mL पानी है","NaCl एक आयनिक यौगिक है जिसका लवणीय बंधन है","घुलनशीलता का तापमान के साथ बढ़ना सामान्य है","Ksp = [Na⁺][Cl⁻] के रूप में परिभाषित है","उच्च घुलनशीलता वाले लवणों का Ksp बड़ा होता है","NaCl का इलेक्ट्रॉनिक विन्यास Na⁺: [Ne], Cl⁻: [Ar]3d¹⁰4s²4p⁶","सोडियम क्लोराइड का उपयोग खाद्य नमक के रूप में होता है","NaCl का घुलनशीलता जल में आयनिक रूप से विभाजित होती है"]},{"id":2,"text":"हाइड्रोक्लोरिक एसिड (HCl) के 0.1 M घोल का pH लगभग कितना होगा?","options":["1","4","2","3"],"correctOption":0,"selected":null,"status":"skipped","facts":["HCl एक मजबूत अम्ल है, इसलिए 0.1 M में [H⁺] = 0.1 M, pH = -log10(0.1) = 1।","HCl एक पूर्णतः आयनित होने वाला मजबूत अम्ल है","0.1 M का अर्थ है 0.1 mol/L H⁺","pH = -log[H⁺] की परिभाषा","सभी मजबूत अम्लों का pH 0‑2 के बीच होता है","HCl का द्रव्यमान 36.46 g/mol है","HCl का उपयोग पेट के एसिड के मॉडल में किया जाता है","HCl का गैस रूप में घनत्व 1.64 g/L है","HCl का pKa लगभग -7 है"]},{"id":3,"text":"कैल्शियम कार्बोनेट (CaCO₃) का थर्मल विघटन (thermal decomposition) किस तापमान के निकट होता है?","options":["1000 °C","800 °C","900 °C","1100 °C"],"correctOption":0,"selected":null,"status":"skipped","facts":["CaCO₃ का विघटन लगभग 1000 °C पर शुरू होता है, जिससे CaO और CO₂ बनते हैं।","CaCO₃ → CaO + CO₂ का समीकरण","विघटन ताप 900‑1100 °C के बीच होता है","उच्च ताप पर CaO का उपयोग चूना पत्थर के रूप में होता है","CO₂ गैस का वॉल्यूम 22.4 L/mol है","CaCO₃ का घुलनशीलता पानी में बहुत कम है","कैल्साइट और अरेगॉनाइट दो क्रिस्टल रूप हैं","CaCO₃ का उपयोग कंक्रीट में एग्रीगेट के रूप में होता है","विघटन के दौरान ऊर्जा आवश्यकता एन्डोथर्मिक है"]},{"id":4,"text":"हाइड्रोजन पेरऑक्साइड (H₂O₂) का 3% घोल पानी में घुलने पर कौन-सा गैस उत्पन्न करता है?","options":["हाइड्रोजन","ऑक्सीजन","कार्बन डाइऑक्साइड","नाइट्रोजन"],"correctOption":1,"selected":null,"status":"skipped","facts":["H₂O₂ का विघटन होने पर 2 H₂O + O₂ बनता है, इसलिए ऑक्सीजन गैस निकलती है।","H₂O₂ → H₂O + ½O₂ का सरल समीकरण","3% घोल सामान्यतः एंटीसेप्टिक के रूप में प्रयोग होता है","उच्च ताप या उत्प्रेरक से विघटन तेज़ होता है","ऑक्सीजन का बबलिंग देखी जा सकती है","H₂O₂ का एन्थैल्पी परिवर्तन नकारात्मक है","विघटन के लिए MnO₂ उत्प्रेरक के रूप में प्रयोग होता है","H₂O₂ का घनत्व 1.45 g/cm³ है","ऑक्सीजन का उपयोग जल शुद्धिकरण में किया जाता है"]},{"id":5,"text":"सिलिकॉन डाइऑक्साइड (SiO₂) का सबसे स्थिर रूप कौन-सा है?","options":["अमॉर्फस सिलिका","फ्लूओराइट","क्रिस्टलिन सिलिका","क्वार्ट्ज"],"correctOption":3,"selected":null,"status":"skipped","facts":["क्वार्ट्ज प्राकृतिक सिलिका का सबसे स्थिर क्रिस्टलिन रूप है, जिसका उच्च गलनांक है।","क्वार्ट्ज का गलनांक लगभग 1713 °C है","SiO₂ का रासायनिक सूत्र SiO₂ है","क्वार्ट्ज का उपयोग कांच के कच्चे माल में होता है","अमॉर्फस सिलिका का उपयोग सिलिका जेल में होता है","क्रिस्टलिन सिलिका का उपयोग सिरेमिक में होता है","फ्लूओराइट कैल्शियम फ्लोराइड है, SiO₂ नहीं","SiO₂ का घनत्व 2.65 g/cm³ है","क्वार्ट्ज का पायरोइलेक्ट्रिक गुण है"]},{"id":6,"text":"निम्नलिखित में से कौन-सा पदार्थ एंजाइमेटिक उत्प्रेरण के बिना तेज़ी से प्रतिक्रिया नहीं करता?","options":["सिलिकॉन डाइऑक्साइड का पिघलना","सोडियम क्लोराइड का घुलना","हाइड्रोजन पेरऑक्साइड का विघटन","सोडियम बाइकार्बोनेट का क्षारीयता"],"correctOption":0,"selected":null,"status":"skipped","facts":["SiO₂ का पिघलना अत्यधिक उच्च तापमान पर ही संभव है, इसलिए यह रासायनिक प्रतिक्रिया नहीं है।","SiO₂ का गलनांक 1713 °C से अधिक है","हाइड्रोजन पेरऑक्साइड का विघटन उत्प्रेरक से तेज़ होता है","सोडियम बाइकार्बोनेट का क्षारीयता पानी में हाइड्रॉक्साइड आयन बनाता है","सोडियम क्लोराइड का घुलना एन्डोथर्मिक है","एंजाइमेटिक उत्प्रेरण जैव रासायनिक प्रक्रियाओं में सामान्य है","उच्च तापीय ऊर्जा के बिना SiO₂ नहीं पिघलता","SiO₂ का क्रिस्टल संरचना टेट्राहेड्रल है","सोडियम बाइकार्बोनेट का उपयोग बेकिंग में होता है"]},{"id":7,"text":"निम्नलिखित में से कौन-सा एंजाइम एसीडिक हाइड्रोजन (H⁺) को उत्पन्न करता है?","options":["फॉस्फेटेज़","लैक्टेज़","हाइड्रोलेज़","अमाइलेज"],"correctOption":2,"selected":null,"status":"skipped","facts":["हाइड्रोलेज़ एंजाइम जल अणु को तोड़कर H⁺ और OH⁻ उत्पन्न करता है।","हाइड्रोलेज़ जल के हाइड्रोलिसिस में कार्य करता है","फॉस्फेटेज़ फॉस्फेट समूह को हटाता है","लैक्टेज़ लैक्टोज को ग्लूकोज़ और गैलेक्टोज में तोड़ता है","अमाइलेज स्टार्च को माल्टोज़ में तोड़ता है","हाइड्रोलेज़ का उपयोग पेट में HCl के उत्पादन में नहीं होता","एंजाइम का सक्रियण तापमान 35‑40 °C होता है","एंजाइम की संरचना प्रोटीन होती है","हाइड्रोलेज़ का pH optimum आमतौर पर 7 के आसपास होता है"]},{"id":8,"text":"सोडियम हाइड्रॉक्साइड (NaOH) का 0.01 M घोल का pOH लगभग कितना होगा?","options":["4","3","2","5"],"correctOption":0,"selected":null,"status":"skipped","facts":["NaOH एक मजबूत क्षार है, इसलिए [OH⁻] = 0.01 M, pOH = -log10(0.01) = 2।","NaOH का पूर्ण आयनीकरण 0.01 M में होता है","pOH = -log[OH⁻] की परिभाषा","pH + pOH = 14 का संबंध","0.01 M का अर्थ है 10⁻² M","NaOH का घनत्व 2.13 g/cm³ है","NaOH का उपयोग साबुन बनाने में होता है","NaOH का एंटाल्पी घुलन 44.5 kJ/mol है","NaOH का उपयोग पेपर मिल में भी होता है"]},{"id":9,"text":"निम्नलिखित में से कौन-सा पदार्थ जल में सबसे अधिक आयनिक शक्ति (ionic strength) देता है?","options":["0.1 M NaCl","0.1 M MgCl₂","0.1 M CH₃COONa","0.1 M KNO₃"],"correctOption":1,"selected":null,"status":"skipped","facts":["MgCl₂ दो Mg²⁺ और दो Cl⁻ आयन देता है, जिससे आयनिक शक्ति अधिक होती है।","आयनिक शक्ति I = ½ Σc_i z_i² से गणना होती है","Mg²⁺ का चार्ज +2 है, Cl⁻ का -1","0.1 M MgCl₂ में 0.1 M Mg²⁺ और 0.2 M Cl⁻ होते हैं","NaCl में Na⁺ और Cl⁻ दोनों 0.1 M होते हैं","KNO₃ में K⁺ और NO₃⁻ दोनों 0.1 M होते हैं","CH₃COONa में Na⁺ और CH₃COO⁻ दोनों 0.1 M होते हैं","आयनिक शक्ति का प्रभाव समाधान की गतिविधि गुणांक पर पड़ता है","MgCl₂ का उपयोग बर्फ पिघलाने में किया जाता है"]},{"id":10,"text":"10वीं कक्षा के रसायन विज्ञान में, जब किसी लवण का आयनिक अभिक्रिया संतुलन स्थिरांक (Ksp) बहुत छोटा होता है, तो वह लवण किस प्रकार का व्यवहार दर्शाता है?","options":["अत्यधिक घुलनशील","मध्यम घुलनशील","अघुलनशील","कम घुलनशील"],"correctOption":3,"selected":null,"status":"skipped","facts":["Ksp बहुत छोटा होने का अर्थ है कि संतुलन पर आयन की सांद्रता बहुत कम रहती है, इसलिए लवण का घुलनशीलता बहुत कम होती है, अर्थात् वह कम घुलनशील या लगभग अघुलनशील होता है।","Ksp (solubility product) का मान लवण की घुलनशीलता को दर्शाता है।","छोटा Ksp मान इंगित करता है कि लवण का आयनिक उत्पाद बहुत कम है।","कम घुलनशील लवणों के उदाहरण में AgCl, PbSO₄, CaCO₃ शामिल हैं।","Ksp का समीकरण: Ksp = [cation]^m [anion]^n, जहाँ m और n स्टॉइकीओमेट्रिक गुणांक हैं।","यदि Ksp < 10⁻⁶ हो तो लवण को सामान्यतः कम घुलनशील माना जाता है।","घुलनशीलता को मोलरता (M) या ग्राम प्रति लीटर (g/L) में व्यक्त किया जाता है।","Ksp का प्रयोग आयनिक संतुलन की गणना में किया जाता है, जैसे कि सामान्य आयन प्रभाव में।","किसी लवण की घुलनशीलता को बढ़ाने के लिए आमतौर पर उसका pH या सामान्य आयन सांद्रता बदलते हैं।"]}]};

function uname(){try{if(localStorage.getItem('gyankshetraLoggedIn')==='1'){return localStorage.getItem('gyankshetraUserName')||testData.studentName}}catch(e){}return testData.studentName}
$('ttl').textContent='Gyankshetra · '+testData.topic;
function render(){const q=Q[qi];$('qc').textContent='प्रश्न '+(qi+1)+'/'+N;$('qt').textContent=q.text;
$('opts').innerHTML=q.options.map((o,i)=>'<button class="opt '+(ans[qi]===i?'sel':'')+'" onclick="pick('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('');
$('pv').disabled=qi===0;$('nx').textContent=qi===N-1?'Submit Test ✔':'अगला →';$('tm').textContent='⏱ '+fmt(left)}
function pick(i){ans[qi]=i;render()}
function go(d){if(d>0&&qi===N-1){if(confirm('क्या आप टेस्ट Submit करना चाहते हैं?'))finish();return}const n=qi+d;if(n<0||n>=N)return;qi=n;render()}
function tick(){left--;$('tm').textContent='⏱ '+fmt(left);if(left<=0)finish()}
function openPal(){$('pg').innerHTML=Q.map((q,i)=>'<button class="'+(ans[i]!==null?'a ':'')+(i===qi?'c':'')+'" onclick="jump('+i+')">'+(i+1)+'</button>').join('');$('pal').classList.add('open')}
function closePal(){$('pal').classList.remove('open')}
function jump(i){qi=i;closePal();render()}
function finish(){if(done)return;done=true;clearInterval(tid);closePal();let c=0,w=0,s=0;ans.forEach((a,i)=>{if(a===null)s++;else if(a===Q[i].correctOption)c++;else w++});res={c,w,s};
const a=c/N*100,b=a+w/N*100;$('donut').style.background='conic-gradient(#1f9d55 0 '+a+'%,#e03a3a '+a+'% '+b+'%,#c9d1dc '+b+'% 100%)';
$('pct').textContent=Math.round(a)+'%';$('mk').textContent=c+' / '+N;$('co').textContent=c;$('wr').textContent=w;$('sk').textContent=s;$('who').textContent='👤 '+uname();
try{const h=JSON.parse(localStorage.getItem('gyankshetraHistory')||'[]');h.push({day:new Date().toISOString().slice(0,10),date:new Date().toLocaleString('hi-IN'),test:testData.topic,marks:c,correct:c,wrong:w,skipped:s,total:N});localStorage.setItem('gyankshetraHistory',JSON.stringify(h))}catch(e){}
$('quiz').classList.add('hide');$('result').classList.remove('hide');window.scrollTo(0,0)}
function review(f){rOrder=Q.map((q,i)=>i).filter(i=>f==='all'||(f==='ok'&&ans[i]===Q[i].correctOption)||(f==='bad'&&ans[i]!==null&&ans[i]!==Q[i].correctOption)||(f==='skip'&&ans[i]===null));if(!rOrder.length){alert('इस श्रेणी में कोई प्रश्न नहीं है।');return}ri=0;$('result').classList.add('hide');$('review').classList.remove('hide');rrender()}
function rrender(){const i=rOrder[ri],q=Q[i];$('rc').textContent='Review '+(ri+1)+'/'+rOrder.length;$('rq').textContent=(i+1)+'. '+q.text;
$('ro').innerHTML=q.options.map((o,k)=>'<div class="opt '+(k===q.correctOption?'ok':(k===ans[i]?'bad':''))+'">'+String.fromCharCode(65+k)+'. '+esc(o)+(k===q.correctOption?' ✅':'')+(k===ans[i]&&k!==q.correctOption?' ❌':'')+'</div>').join('');
$('rf').innerHTML='<small class="m">आपका उत्तर: '+(ans[i]===null?'छोड़ा गया':String.fromCharCode(65+ans[i]))+' • सही उत्तर: '+String.fromCharCode(65+q.correctOption)+'</small>'+(q.facts&&q.facts.length?'<div class="facts"><b>📌 व्याख्या / तथ्य:</b><ul>'+q.facts.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul></div>':'')}
function rgo(d){const n=ri+d;if(n<0||n>=rOrder.length)return;ri=n;rrender()}
function backRes(){$('review').classList.add('hide');$('result').classList.remove('hide')}
function share(){const link=location.href.split('#')[0].split('?')[0],p=Math.round(res.c/N*100);
const t='🎓 Gyankshetra Result\n👤 '+uname()+'\n📝 '+testData.topic+'\n🏆 अंक: '+res.c+'/'+N+' ('+p+'%)\n✅ सही: '+res.c+'  ❌ गलत: '+res.w+'  ⏭ छूटे: '+res.s+'\n📢 Telegram चैनल: https://t.me/gyankshetra\n🔗 टेस्ट लिंक: '+link;
window.open('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(t),'_blank')}
(function(){let x0=0,y0=0;const w=$('quiz');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;if(dx>0){if(qi>0){qi--;render()}}else if(qi<N-1){qi++;render()}},{passive:true})})();
render();tid=setInterval(tick,1000);
</script>
</body>
</html>
