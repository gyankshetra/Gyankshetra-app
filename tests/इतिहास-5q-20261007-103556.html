<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111827">
<title>Gyankshetra — इतिहास 5Q</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f6f9;color:#172033;font-family:Arial,"Noto Sans Devanagari",sans-serif}
button{font:inherit}
.top{height:58px;background:#111827;color:white;display:flex;align-items:center;justify-content:space-between;padding:0 15px;position:sticky;top:0;z-index:5}
.brand{font-size:20px;font-weight:800}
.top button{background:none;border:0;color:white;font-size:22px}
.wrap{max-width:700px;margin:auto;padding:14px}
.card,.qcard,.resultcard,.reviewcard{background:white;border-radius:14px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000012}
.hero{font-size:18px;font-weight:800}
.small{display:block;color:#687386;margin-top:5px;font-size:13px}
.primary,.next{background:#2563eb;color:white;border:0;border-radius:10px;padding:12px 18px;font-weight:700}
.secondary{background:#e5e7eb;border:0;border-radius:10px;padding:12px 18px}
.quizbar{display:flex;align-items:center;justify-content:space-between;background:white;padding:12px 15px;border-bottom:1px solid #eee}
.quizbar button{border:0;background:none;font-size:22px}
.questionline{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;font-weight:700}
.star{border:0;background:none;font-size:27px}
.timer{font-variant-numeric:tabular-nums}
.qcard h2{font-size:20px;line-height:1.5}
.option{display:block;width:100%;text-align:left;background:#f8fafc;border:1px solid #d8dee8;padding:13px;border-radius:10px;margin:9px 0}
.option.selected{border:2px solid #2563eb;background:#eff6ff}
.actions{display:flex;gap:10px;justify-content:space-between;margin-top:18px}
.actions button{flex:1}
.facts{background:#f8fafc;padding:12px;border-radius:10px;margin-top:12px;line-height:1.6}
.hide{display:none}
.score{font-size:34px;font-weight:900;text-align:center}
.nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid #ddd;padding:10px;text-align:center}
</style>
</head>
<body>

<div class="top">
  <div class="brand">Gyankshetra</div>
  <button onclick="alert('Gyankshetra Test')">☰</button>
</div>

<div id="home" class="wrap">
  <div class="card">
    <div class="hero">इतिहास 5Q</div>
    <span class="small">5 प्रश्न • 5 अंक • 5 मिनट • No Negative</span>
    <br>
    <button class="primary" onclick="startQuiz()">Start Test</button>
  </div>
</div>

<div id="quiz" class="hide">
  <div class="quizbar">
    <button onclick="confirmBack()">‹</button>
    <b>इतिहास 5Q</b>
    <button>☰</button>
  </div>

  <div class="questionline">
    <span>प्रश्न <span id="qn">1/5</span></span>
    <button id="star" class="star" onclick="saveQuestion()">☆</button>
    <span>⏱ <span id="timer">00:00</span></span>
  </div>

  <div class="wrap">
    <div class="qcard">
      <h2 id="question"></h2>
      <div id="options"></div>
      <div class="actions">
        <button class="secondary" onclick="prev()">← पिछला</button>
        <button id="next" class="next" onclick="next()">अगला →</button>
      </div>
    </div>
  </div>
</div>

<div id="result" class="wrap hide">
  <div class="resultcard">
    <h2>🎉 Test Result</h2>
    <div class="score" id="score">0/5</div>
    <p id="resultText"></p>
    <div class="actions">
      <button class="secondary" onclick="review()">Review</button>
      <button class="primary" onclick="startQuiz()">Reattempt</button>
    </div>
  </div>
</div>

<div id="review" class="wrap hide">
  <div class="reviewcard">
    <b id="reviewTitle"></b>
    <h2 id="reviewQuestion"></h2>
    <p><b>आपका उत्तर:</b> <span id="userAnswer"></span></p>
    <p><b>सही उत्तर:</b> <span id="correctAnswer"></span></p>
    <p><b>व्याख्या:</b> <span id="explanation"></span></p>
    <div class="facts">
      <b>महत्वपूर्ण तथ्य</b>
      <div id="facts"></div>
    </div>
    <div class="actions">
      <button class="secondary" onclick="reviewPrev()">← पिछला</button>
      <button class="next" onclick="reviewNext()">अगला →</button>
    </div>
  </div>
</div>

<div class="nav">
  Gyankshetra • इतिहास
</div>

<script>
const questions=[{"question":"मध्यकालीन भारत में 1526 में मुग़ल वंश की स्थापना किस शासक ने की?","options":["अकबर","बाबर","हुमायूँ","शाहजहाँ"],"answer":1,"explanation":"1526 में इब्राहीमख़ान की हार के बाद बाबर ने दिल्ली पर कब्जा कर मुग़ल वंश की स्थापना की।","facts":["इब्राहीमख़ान की हार 21 जून 1526 को हुई।","बाबर के पिता शीराज़ के शासक थे।","बाबर ने तुर्की वंश से भारत में प्रवेश किया।","बाबर का जन्म 1483 में हुआ।","बाबर ने 1526 में दिल्ली पर कब्जा किया।"]},{"question":"भारत के स्वतंत्रता संग्राम में 'सविनय अवज्ञा आंदोलन' का नेतृत्व किसने किया?","options":["भगत सिंह","महात्मा गांधी","जवाहरलाल नेहरू","सुभाष चंद्र बोस"],"answer":1,"explanation":"सविनय अवज्ञा आंदोलन का नेतृत्व महात्मा गांधी ने किया, जिसे 1930 में दांडी मार्च के साथ शुरू किया गया।","facts":["1930 में दांडी मार्च से शुरू हुआ।","अहिंसा का सिद्धांत अपनाया गया।","ब्रिटिश सरकार पर दबाव डाला गया।","1934 में गांधी को बंदी बनाया गया।","सविनय अवज्ञा का मूल लक्ष्य ब्रिटिश शासन को समाप्त करना था।"]},{"question":"प्राचीन भारत की सबसे पुरानी लिखित भाषा कौन सी है?","options":["संस्कृत","प्राकृत","अवधी","प्राचीन संस्कृत"],"answer":0,"explanation":"वेदों में प्रयुक्त संस्कृत प्राचीन भारत की सबसे पुरानी लिखित भाषा है।","facts":["वेदों में 1500 ईसा पूर्व से उपयोग।","ब्राह्मणिक ग्रंथों का आधार।","शास्त्रीय संस्कृत का प्रारंभिक रूप।","संस्कृत भारतीय उपमहाद्वीप की मूल भाषा।","आज भी धार्मिक ग्रंथों में उपयोग।"]},{"question":"भारत के पहले राष्ट्रपति कौन थे?","options":["डॉ. राजेंद्र प्रसाद","डॉ. ए.पी.जे. अब्दुल कलाम","डॉ. सर्वपल्ली राधाकृष्णन","डॉ. म. व. सिंग"],"answer":0,"explanation":"डॉ. राजेंद्र प्रसाद ने 1950 में भारत के पहले राष्ट्रपति के रूप में पदभार संभाला।","facts":["1950 में पद ग्रहण किया।","स्वतंत्रता संग्राम के प्रमुख नेता।","भारतीय संविधान के निर्माता।","1977 में पद से हटाए गए।","1977 के बाद भी सम्मानित रहे।"]},{"question":"भारत के सबसे बड़े तटवर्ती राज्य का नाम क्या है?","options":["महाराष्ट्र","तमिलनाडु","गोवा","गुजरात"],"answer":0,"explanation":"महाराष्ट्र की तटरेखा 3,287 किमी है, जिससे यह भारत का सबसे बड़ा तटवर्ती राज्य बनता है।","facts":["तटरेखा 3,287 किमी।","2011 जनगणना में सबसे बड़ा।","मुंबई, नाशिक, पुणे आदि प्रमुख शहर।","समुद्री उद्योग यहाँ प्रमुख है।","पर्यटन के लिए तटवर्ती क्षेत्र महत्वपूर्ण।"]}];
const TOTAL=questions.length;
const TEST_TITLE="इतिहास 5Q";
const TOPIC="इतिहास";
const MAX_TIME=TOTAL*60;

let qi=0;
let answers=Array(TOTAL).fill(null);
let elapsed=0;
let timerHandle=null;
let reviewIndex=0;

function $(id){return document.getElementById(id)}

function startQuiz(){
  qi=0;
  answers=Array(TOTAL).fill(null);
  elapsed=0;

  clearInterval(timerHandle);

  $("home").classList.add("hide");
  $("result").classList.add("hide");
  $("review").classList.add("hide");
  $("quiz").classList.remove("hide");

  render();

  timerHandle=setInterval(function(){
    elapsed++;

    let m=Math.floor(elapsed/60);
    let s=elapsed%60;

    $("timer").textContent=
      String(m).padStart(2,"0")+":"+
      String(s).padStart(2,"0");

    if(elapsed>=MAX_TIME){
      finish();
    }
  },1000);
}

function render(){
  let q=questions[qi];

  $("qn").textContent=(qi+1)+"/"+TOTAL;
  $("question").textContent=q.question;

  let box=$("options");
  box.innerHTML="";

  q.options.forEach(function(opt,i){
    let b=document.createElement("button");
    b.className="option";
    b.textContent=String.fromCharCode(65+i)+". "+opt;

    if(answers[qi]===i){
      b.classList.add("selected");
    }

    b.onclick=function(){
      answers[qi]=i;
      render();
    };

    box.appendChild(b);
  });

  $("next").textContent=
    qi===TOTAL-1 ? "Submit Test" : "अगला →";

  $("star").textContent=
    savedQuestion(qi) ? "★" : "☆";
}

function prev(){
  if(qi>0){
    qi--;
    render();
    window.scrollTo(0,0);
  }
}

function next(){
  if(qi<TOTAL-1){
    qi++;
    render();
    window.scrollTo(0,0);
  }else{
    finish();
  }
}

function finish(){
  clearInterval(timerHandle);

  let correct=0;

  questions.forEach(function(q,i){
    if(answers[i]===q.answer) correct++;
  });

  $("quiz").classList.add("hide");
  $("result").classList.remove("hide");

  $("score").textContent=correct+"/"+TOTAL;

  $("resultText").textContent=
    "सही: "+correct+
    " • गलत: "+answers.filter((x,i)=>x!==null&&x!==questions[i].answer).length+
    " • छोड़े: "+answers.filter(x=>x===null).length+
    " • प्रतिशत: "+Math.round(correct/TOTAL*100)+"%";
}

function review(){
  reviewIndex=0;

  $("result").classList.add("hide");
  $("review").classList.remove("hide");

  renderReview();
}

function renderReview(){
  let q=questions[reviewIndex];

  $("reviewTitle").textContent=
    "Review "+(reviewIndex+1)+"/"+TOTAL;

  $("reviewQuestion").textContent=q.question;

  $("userAnswer").textContent=
    answers[reviewIndex]===null
    ? "छोड़ा गया"
    : q.options[answers[reviewIndex]];

  $("correctAnswer").textContent=
    q.options[q.answer];

  $("explanation").textContent=
    q.explanation || "—";

  $("facts").innerHTML=
    (q.facts||[]).map(x=>"• "+x).join("<br>");

  window.scrollTo(0,0);
}

function reviewPrev(){
  if(reviewIndex>0){
    reviewIndex--;
    renderReview();
  }
}

function reviewNext(){
  if(reviewIndex<TOTAL-1){
    reviewIndex++;
    renderReview();
  }
}

function savedQuestion(i){
  try{
    let x=JSON.parse(localStorage.getItem("gyankshetra_saved")||"[]");
    return x.some(a=>a.title===TEST_TITLE && a.index===i);
  }catch(e){
    return false;
  }
}

function saveQuestion(){
  let key="gyankshetra_saved";

  let list=[];

  try{
    list=JSON.parse(localStorage.getItem(key)||"[]");
  }catch(e){
    list=[];
  }

  let found=list.findIndex(
    x=>x.title===TEST_TITLE && x.index===qi
  );

  if(found>=0){
    list.splice(found,1);
  }else{
    list.push({
      title:TEST_TITLE,
      topic:TOPIC,
      index:qi,
      question:questions[qi].question
    });
  }

  localStorage.setItem(key,JSON.stringify(list));

  render();
}

function confirmBack(){
  if(confirm("क्या आप टेस्ट छोड़ना चाहते हैं?")){
    clearInterval(timerHandle);
    location.reload();
  }
}

startQuiz();
</script>
</body>
</html>
