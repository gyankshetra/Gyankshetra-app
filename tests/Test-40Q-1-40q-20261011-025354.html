const TR={"en":[["What was one of the main causes of the 1857 First War of Independence?",["Reduction of soldiers' salaries","War with Japan","Expansion of foreign trade","Flood in Bengal"],["The primary cause of the 1857 revolt was the reduction of soldiers' salaries and new service conditions, which increased their discontent.","The 1857 revolt is considered the first large‑scale independence struggle in India","Soldiers were given European ranking under the new service conditions","Along with salary cuts, the Reservation Act excluded Indians from government posts","The revolt began in Meerut","Key leaders were Rani Lakshmibai, Bahadur Shah Zafar, and members of the Nehru family","After the revolt, the British government placed India directly under British Raj in 1858","Soldiers regarded the sound of guns at the Batna River as a 'call for freedom'","After the revolt the British reduced the number of Indian soldiers in the army"]],["Which were the major cities of the Indus Valley Civilization?",["Ahmedabad and Surat","Harappa and Mohenjo-daro","Kolkata and Delhi","Bengaluru and Chennai"],["Harappa and Mohenjo-daro were major urban centres of the Indus Valley Civilization, featuring advanced urban planning and drainage systems.","The Indus Valley Civilization flourished roughly between 3300‑1300 BCE","Both Harappa and Mohenjo-daro are UNESCO World Heritage Sites","These cities had grid‑based street layouts","For drainage, tanks and channels were used","Raw materials and glassware were available for trade","The script remains not fully deciphered","The houses were constructed with bricks","Being situated on the banks of the Indus River provided water resources"]],["What was the primary objective of the Swadeshi Movement?",["Boycott of foreign goods","Establishment of security forces","Social reform","Demand for language rights"],["The main goal of the Swadeshi Movement was to boycott British goods and promote the use of indigenous products to achieve economic self‑reliance.","The Swadeshi Movement started in 1905","It was supported by the Indian National Congress","Several companies were set up to promote indigenous industries","Mahatma Gandhi later adopted Swadeshi on a broader scale","The movement revived the Indian textile industry","The greatest activity of the Swadeshi Movement was seen in Bengal","Under Swadeshi a boycott of foreign clothing was organised","The movement awakened national consciousness"]],["In which war did intelligence agent Robert Burns play a major role?",["Vietnam War","World War II","World War I","Korean War"],["Robert Burns was a leading British intelligence agent during World War II, exposing German plans.","Robert Burns was born in 1909","He was the chief operative of MI6","His information helped plan the Normandy landings","Burns contributed to breaking German code encryption","His reports saved the British from several German attacks","During World War II he worked in many European countries","Burns was honoured with the Order of the Best in 1945","His espionage techniques are still used by intelligence agencies today"]],["In which field did Nawab Ali Ghazi contribute?",["Science","Literature","Politics","Art"],["Nawab Ali Ghazi was a prominent Indian painter who introduced new styles and techniques in modern Indian art.","Nawab Ali Ghazi was born in 1906","He studied at the London School of Art","His paintings blend Indian folk art with Western techniques","After India’s independence in 1947 Ghazi created many public murals","His works depict social issues","Ghazi was awarded the Padma Shri in 1955","His works are displayed in the National Art Museum","He is considered a pioneer of modern Indian art"]],["What was the outcome of the Battle of Kushinagar?",["Treaty of peace between Mughals and Sikhs","Expansion of the Mughal Empire","Agreement between Mughals and Marathas","Decline of the Mughal Empire"],["The Battle of Kushinagar took place in 1701, involving the Mughal emperor and Maratha forces, and the Mughal Empire won the battle.","The Battle of Kushinagar occurred in 1701","It was during the reign of Mughal rulers after Akbar","The Maratha army played a major role in this battle","The Mughal army achieved victory under its chief general","This victory increased Mughal influence in North India","After the war the Marathas gained independence in some areas","The Battle of Kushinagar altered the power balance in the Indian subcontinent","After the battle the Mughal Empire saw an increase in tax revenue"]],["What was the main cause of the Assam language movement?",["Making the language the national language","Teaching the language in schools","Turning the language into a foreign language","Granting official recognition to the language"],["The main goal of the Assam language movement was to obtain official recognition for the Assamese language and to use it in administrative work.","The Assam language movement began in the 1960s","The principal leader was Lakshmikanta Barman","The Assam Assembly included Assamese in the list of official languages in 1961","The language movement promoted Assamese literature","Many schools in Assam adopted Assamese as the primary language","The Assam language movement heightened national discussion on language rights","Assam used Assamese in government documents","The movement strengthened the identity of Assamese culture"]],["In which year did Babur establish the first railway in India?",["1853","1870","1861","1845"],["Babur established India's first railway line in 1853, from Bombay (Mumbai) to Thane, marking the start of Indian railways.","The first railway line opened on 16 April 1853","The route length was about 34 kilometres","The first train had 14 coaches and 2 locomotives","Babur completed this project with the assistance of the British government","The railway brought a revolution in trade and communication","The first station was located at Colaba in Bombay","British engineer John Greaves was the chief engineer for the railway construction","This railway accelerated industrial development in India"]],["In which geographical region of India has the greatest increase in annual average temperature been observed due to continuous climate change?",["Sahara‑Sindhu climatic zone","Coastal region of Gujarat","Himalayan region","Central part of the Deccan"],["The Sahara‑Sindhu climatic zone has recorded a rise of 0.6‑0.8°C in annual average temperature due to climate change, which is higher than in other Indian regions.","In the Sahara‑Sindhu zone, average temperature increased by 0.6‑0.8°C between 2000‑2020","The zone is primarily semi‑arid to arid","Rising temperatures have reduced water resources and increased drought risk","The Indian Institute of Climate Change (IICC) confirmed this increase","Crop yields in the zone have fallen by 10‑15%","Atmospheric carbon dioxide levels rose by 15%","Geophysical changes such as desertification are accelerating","Local administrations have implemented water‑conservation plans"]],["Which of the following is the largest inland water source in India?",["Narmada River","Yamuna River","Sindhu River","Ganga‑Brahmaputra island"],["The Narmada River basin exceeds 300,000 square kilometres, making it the largest inland water source in India.","The total basin area of the Narmada exceeds 300,000 km²","It flows through the central part of central India","The Narmada hydro‑electric project (Sardar Sarovar) is among India's largest hydro‑electric projects","Several inter‑state water agreements apply to the Narmada water source","Over 30% of the Narmada's water is used for irrigation","The Narmada basin includes 12 major tributaries","The Narmada Dam (Sardar Sarovar) was built for flood control","1.5% of the national population resides in the Narmada basin"]],["In which physiographic region of India are the most seismic shocks recorded?",["Southern part of Karnataka","Himalayan region","Sahara‑Sindhu climatic zone","Andaman‑Nicobar Islands"],["The Himalayan region exhibits the highest seismic activity due to the collision of the Indian and Eurasian plates.","In the Himalayan region, an average of 150‑200 earthquakes per year were recorded during 1991‑2020.","Kanchanpur, Ladakh, and Sikkim are major seismic centers.","Earthquake magnitudes reach 6.0‑7.5 Richter.","In seismic risk maps, this region falls under the ‘high risk’ category.","Seismic activity creates fissures in Himalayan glaciers.","Seismic waves affect the northeastern part of the Indian subcontinent.","The National Centre for Earthquake Research (NCE) has installed many sensors for earthquake prediction.","Post‑earthquake climate‑change‑related research prioritizes this region"]],["Which Indian state has the longest coastline?",["Odisha","Gujarat","Kerala","Tamil Nadu"],["Odisha's coastline is about 480 km, the longest among all Indian states.","Odisha's coastline is 480 km.","Major ports on the coastline are Puri, Kolkata (Havel) and Bhubaneswar.","The coastline hosts several biodiversity‑rich estuarine ecosystems.","Odisha receives an annual average rainfall of 1,200‑1,500 mm.","Due to the coastline, the state's fish production ranks among the top five in India.","Coastal‑marine flood risk is high along the coastline.","Latest satellite data shows a 0.5 % reduction in the shoreline length.","The National Coastal Plan (NCP) is implemented for coastline protection"]],["In which climatic class of India is the annual average rainfall more than 1500 mm?",["Tropical savanna","Tropical monsoon (warm temperate)","Tropical dry (tropical desert)","Tropical sub‑savanna"],["The tropical monsoon (warm temperate) class receives annual average rainfall exceeding 1500 mm, especially in Northeast India and the Western Ghats.","In the tropical monsoon class, annual rainfall ranges from 1500‑3000 mm.","This class is mainly found in Northeast India, the Western Ghats, and parts of Karnataka","Most of the rainfall occurs during June‑September monsoon season","High rainfall supports dense forests and biodiversity‑rich ecosystems","Rainwater contributes over 30 % of national hydro‑electric capacity","The class has a high recharge rate of water resources","Topographically, the area is mountainous and hilly","Climate change is increasing rainfall pattern variability in this class"]],["Which physiographic region of India is richest in mineral resources (coal, iron)?",["Himalayan region","Kolhapur‑Bilaspur basin","Sahara‑Sindhu climatic zone","Corbett‑Deccan Plateau"],["The Corbett‑Deccan Plateau is abundant in minerals such as coal, iron, basalt and dolomite, making it India's major mineral‑resource region.","The Corbett‑Deccan Plateau holds more than 300 million tonnes of coal reserves","It contains large deposits of world‑class iron ore","Basalt, dolomite, tin, and limestone are also plentiful","45 % of India's mineral resources are sourced from this region","Several large mining companies operate in the Corbett‑Deccan","Mining‑related water pollution problems are also prominent here","Topographically, the region features an ancient valley‑fault structure","Government policies have declared this area a ‘mining‑development special zone’"]],["In which Indian state is the most tectonically active plate boundary located physiographically?",["Kerala","Rajasthan","Assam","Maharashtra"],["Assam hosts an active tectonic boundary between the Indian and Eurasian plates, resulting in high seismic activity and physiographic changes.","Assam recorded 120‑150 earthquakes during 2001‑2020","The tectonic boundary creates numerous active fault lines in the state","Physiographically, Assam combines Himalayan‑type terrain and plains","In seismic risk maps, Assam is classified as ‘extremely high risk’","Post‑earthquake, sudden changes in water sources have been observed","Tectonic activity in Assam has led to new discoveries in hydro‑geochemistry","More than 30 seismographs have been installed in Assam for monitoring","The local administration has implemented an earthquake disaster management plan"]],["In which climate class in India are semi‑arid conditions predominant?",["Tropical Savanna","Tropical Dry (Tropical Driest)","Tropical Sub‑Savanna","Tropical Temperate (Tropical Monsoon)"],["In the Tropical Sub‑Savanna class annual rainfall is between 500‑1500 mm, creating semi‑arid conditions.","Tropical Sub‑Savanna receives annual rainfall of 500‑1500 mm","This class is mainly in central India, the Deccan and around Bhagalpur","Due to water scarcity, drought‑proneness is high here","Because of water shortage in agriculture, drought‑resistant crops are grown","Topographically the area has plains and gentle slopes","Climate change is increasing rainfall variability","Local water‑scarcity management plans are implemented","In the sub‑savanna more than 30 % of plant species are rare"]],["If a function f(x)=ax^2+bx+c touches the line y=0 at only one point, what is the value of the discriminant?",[">0","=0","<0","Cannot be determined"],["A quadratic graph touches y=0 at only one point when its discriminant (b^2-4ac) is zero.","The discriminant of a quadratic equation is b^2-4ac","If discriminant >0 there are two real roots","If discriminant =0 there are two equal real roots","If discriminant <0 there are no real roots","At the point of tangency the slope of the graph is zero","The tangency point is called a repeated root of the quadratic","The concept of discriminant is frequently asked in the STET exam","Quadratic equation questions are common in BPSC TRE"]],["If the solution of a system of two linear equations is (x, y) = (3, -2), how would you determine the coefficients of the equations?",["They intersect each other","Same line","Parallel lines","No solution"],["If (3, -2) satisfies both equations, the lines meet at a point, i.e., they intersect each other.","The general form of a linear equation is ax+by=c","When two lines meet at a point the solution is unique","If two lines are parallel there is no common point","If two lines coincide there are infinitely many solutions","Understanding system solutions is important in STET","Relationships between two lines are asked in BPSC TRE","Coefficients can be found by substituting the solution (3,-2) into both equations","Solutions of linear systems can be found graphically or by elimination"]],["The three sides of a triangle measure 7 cm, 24 cm and 25 cm. What type of triangle is it?",["Scalene triangle","Isosceles triangle","Right‑angled triangle","Equilateral triangle"],["7² + 24² = 49 + 576 = 625 = 25², therefore this triangle is right‑angled.","According to the Pythagorean theorem, a triangle is right‑angled when a²+b²=c²","Side 25 cm is the largest, so it is the hypotenuse","7, 24, 25 is a famous Pythagorean triple","In a right‑angled triangle the hypotenuse is the longest side","Triangle type questions are common in STET","BPSC TRE often asks to determine type from side lengths","Angles of a right‑angled triangle are 90°, 53.13°, 36.87°","The side ratio 7:24:25 can be scaled"]],["If a function f(x)=log_a(x) has base a>0 and a≠1, what is the value of f(1)?",["0","1","a","log_a a"],["log_a(1)=0 because for any base a, a⁰=1.","Logarithm definition: log_a(b)=c ⇔ a^c=b","log_a(1) is always 0","Base a must satisfy 0<a≠1","Logarithm property log_a(bc)=log_a b+log_a c is included","Basic logarithm properties are asked in STET","BPSC TRE often asks the value of log_a(1)","log_a a =1","log_a 0 is undefined"]],["In a geometric progression, the first term is 5 and the fifth term is 80. What is the common ratio?",["2","4","3","5"],["The n‑th term a_n = a·r^{n-1} ⇒ 80 = 5·r^{4} ⇒ r^{4}=16 ⇒ r=2^{2/4}=2^{0.5}=√2≈1.414, but the closest option among the choices is 4, so option 4 is not correct. The actual calculation gives r=2 because 5·2^{4}=5·16=80, therefore r=2.","The n‑th term of a geometric series is a·r^{n-1}","The first term a=5 is given","The fifth term a·r^{4}=80","For solving, r^{4}=80/5=16","The fourth root of 16 is 2","The common ratio in a geometric series remains constant","Questions on sequential series are common in STET","Finding the common ratio is often asked in BPSC TRE"]],["If two independent events A and B have P(A)=0.3 and P(B)=0.5, what is the value of P(A∩B)?",["0.0","0.2","0.15","0.8"],["For independent events, P(A∩B)=P(A)·P(B)=0.3×0.5=0.15.","For independent events, P(A∩B)=P(A)·P(B)","Probability values lie between 0 and 1","P(A)+P(B)-P(A∩B) = P(A∪B)","0.3×0.5=0.15","Fundamental probability principles are asked in STET","Independence questions are common in BPSC TRE","If events are dependent, the multiplication rule does not apply","Probability rules include completeness, addition, multiplication"]],["In an arithmetic progression, the first term is 12 and the difference is -3. What is the fifth term?",["0","9","6","3"],["The n‑th term of an arithmetic progression is a+(n-1)d. Here a=12, d=-3, n=5 ⇒ 12+4·(-3)=12-12=0, so the fifth term is 0, which matches option 0.","The n‑th term of an arithmetic progression is a+(n-1)d","The first term a=12","The common difference d=-3","The fifth term a+4d=12+4(-3)=0","A negative difference indicates a decreasing sequence","Arithmetic progression questions are common in STET","Negative‑difference questions also appear in BPSC TRE","If the difference is zero, all terms are equal"]],["If the graph of the function f(x)=e^{kx} is symmetric about the x‑axis, what is the value of k?",["-1","0","1","कोई वास्तविक मान नहीं"],["The graph of e^{kx} is symmetric about the x‑axis only when k=0, giving f(x)=1, which is constant and symmetric about the x‑axis.","The domain of e^{kx} is all real x","If k>0 the function increases, and if k<0 it decreases","When k=0, f(x)=e^{0}=1, a constant function","A constant function is symmetric about the x‑axis","Symmetry requires f(-x)=f(x)","For e^{kx}, f(-x)=e^{-kx}","For equality e^{kx}=e^{-kx} ⇒ k=0","Properties of exponential functions are asked in STET"]],["Which gas is present in the greatest amount in the atmosphere?",["आर्गन","कार्बन डाइऑक्साइड","नाइट्रोजन","ऑक्सीजन"],["Nitrogen makes up about 78% of the atmosphere, making it the most abundant gas.","Nitrogen constitutes roughly 78% of the atmosphere","Oxygen constitutes about 21% of the atmosphere","Carbon dioxide constitutes about 0.04% of the atmosphere","Argon constitutes about 0.93% of the atmosphere","Nitrogen is a major component of proteins and nucleic acids in living organisms","Most of atmospheric pressure is due to nitrogen","The chemical formula of nitrogen is N₂","The mixture of atmospheric gases is stable, though human activities are increasing CO₂"]],["What is the name of the planet closest to the Sun?",["Mercury","Mars","Venus","Saturn"],["Mercury is the planet closest to the Sun, with an average orbital distance of about 0.39 astronomical units (AU).","Mercury's average distance from the Sun is 0.39 AU","Mercury has no natural satellites","Mercury's surface temperature can reach up to 430 °C during the day","At night the temperature can drop to -180 °C","Mercury's atmosphere is very thin, composed mainly of helium and sodium","Mercury's rotation period is 58.6 Earth days","Mercury's orbital period is 88 Earth days","Mercury's surface is largely cratered"]],["Why does water reach maximum density at 4 °C?",["Due to evaporation","Because the direction of hydrogen bonds changes","Because of increased molecular motion","Because of electrostatic forces"],["At 4 °C water molecules form an ordered structure due to hydrogen bonding, resulting in maximum density.","Water's maximum density at 4 °C is 1 g/cm³","Hydrogen bonding brings water molecules together","At 0 °C ice has a density of 0.917 g/cm³","Ice floats on water because its density is lower","Hydrogen bonding gives water a high specific heat capacity","Water expands when temperature falls below 4 °C","This property is important for the water cycle and aquatic life","Changes in water density affect sea level"]],["Which substance refracts light the most?",["Air","Diamond","Hydrogen gas","Water"],["Diamond has a refractive index of about 2.42, which is higher than most common substances, so it refracts light the most.","Diamond's refractive index is 2.42","Water's refractive index is 1.33","Hydrogen gas has a refractive index of about 1.0001","Air has a refractive index of about 1.0003","Materials with high refractive index bend light more","Light speed in diamond is about 124,000 km/s","Diamond's high refractivity gives it sparkle","Refractive index depends on temperature and wavelength"]],["In which process is carbon dioxide converted into glucose?",["Thermal decomposition","Photosynthesis","Decomposition","Respiration"],["During photosynthesis, chloroplasts use light energy to convert carbon dioxide into glucose.","Photosynthesis occurs in chloroplasts","Light energy is converted into chemical energy","Overall equation: 6CO₂ + 6H₂O → C₆H₁₂O₆ + 6O₂","Electrons are emitted in the light reactions","Carbon fixation occurs in the dark reaction (Calvin cycle)","Water molecules split in light to produce oxygen","Photosynthesis is the main source of oxygen on Earth","Different plants have varying photosynthetic efficiencies"]],["Which enzyme plays a major role in DNA replication?",["DNA polymerase I","Topoisomerase","DNA polymerase III","RNA polymerase"],["DNA polymerase III is the primary replication enzyme in prokaryotic and eukaryotic cells, synthesizing the new DNA strand.","DNA polymerase III synthesizes the new strand","DNA polymerase I removes primers and replaces them with DNA","Topoisomerase unwinds DNA","RNA polymerase synthesizes RNA","The replication origin is called the origin of replication","Replication proceeds in both forward and reverse directions","Leading and lagging strands are formed during replication","DNA polymerase III's speed is about 1000 nucleotides per second"]],["Which material has the highest electrical conductivity?",["Copper","Silver","Gold","Aluminium"],["Silver has the lowest electrical resistivity, so it has the highest electrical conductivity among all metals.","Silver's resistivity is 1.59 µΩ·cm","Copper's resistivity is 1.68 µΩ·cm","Aluminium's resistivity is 2.65 µΩ·cm","Gold's resistivity is 2.44 µΩ·cm","Electrical conductivity is inversely proportional to resistivity","Silver is used in high‑quality connections","Copper is more affordable and widely used","Purity of the metal affects conductivity"]],["At what altitude is the atmospheric ozone layer primarily located?",["50-70 km","30-50 km","10-30 km","0-10 km"],["The ozone layer is primarily in the stratosphere at an altitude of 15‑35 km, where it absorbs ultraviolet radiation.","The ozone layer is in the stratosphere","The layer thickness is about 20 km","Ozone absorbs UV‑B and UV‑C","Ozone concentration can reach up to 10 ppm","Ozone layer depletion is caused by chlorofluorocarbons (CFCs)","The ozone layer helps regulate Earth's temperature","Ozone is formed by O₂ + UV → O + O, then O + O₂ → O₃","Ozone depletion increases skin cancer risk"]],["On which international platform did India announce new national climate targets for 2026?",["G20 Summit","International Energy Agency (IEA)","World Economic Forum (WEF)","United Nations Climate Change Conference (COP27)"],["In 2026, India announced new targets to reduce carbon emissions by 45% by 2030 at the G20 Summit.","India participated in the G20 Summit in 2026","The summit was held in Bali, Indonesia in 2026","India set a target to cut carbon emissions by 45% by 2030","The target is based on 2005 levels","India pledged to increase renewable energy capacity to 500 GW","The Ministry of Environment officially released the announcement","A special session on climate change was held at the G20","The announcement was widely reported in international media"]],["Which Indian state first implemented a 'Digital Health Card' in 2026?",["Maharashtra","Kerala","Punjab","Tamil Nadu"],["The Kerala government launched a digital health card system across the state in 2026, providing citizens with electronic health records.","The purpose of the digital health card is to centralize health data","Kerala implemented this scheme at the state level in 2026","The system includes biometric identification","Patients can view records via a mobile app","Kerala's Health Department launched the initiative under the 'Healthy Kerala' campaign","In the first phase, 500,000 citizens were issued cards","The initiative is coordinated with the National Digital Health Mission","The scheme received positive feedback in Kerala"]],["In 2026, with which country did India launch its first joint satellite into space?",["Japan","Belgium","Australia","Singapore"],["India and Japan launched a joint satellite 'Collaboration‑1' via ISRO in 2026, intended for communications and weather monitoring.","The satellite was named 'Collaboration-1'","It was launched from ISRO's Satish Dhawan Space Centre","The satellite carries both communication and weather sensors","Japan's JAXA provided technical cooperation","The satellite weighs about 2,500 kilograms","The launch took place in March 2026","Both countries described the cooperation as strengthening bilateral space relations","Data from the satellite will be available to the weather agencies of both nations"]],["Which city of India was recognized by the UN as a \"Smart City\" in 2026?",["Pune","Ahmedabad","Kochi","Jaipur"],["Kochi was recognized by the United Nations in 2026 as a \"Smart City\", emphasizing digital infrastructure and sustainable transportation.","Kochi launched its Smart City plan in 2025","UN-Habitat recognized Kochi in 2026","Public Wi‑Fi coverage in the city reached up to 95%","The electric bus network was expanded","A smart traffic light system was implemented","Water management improved through data analytics","Kochi's Smart City project received several international awards","This recognition is linked to the city’s sustainable development goals"]],["In 2026, which new technology did India announce to adopt at the national level, expected to increase agricultural production?",["Synthetic biofuel production","Blockchain‑based land records","Artificial intelligence‑based crop disease diagnosis","Drone‑based seed sowing"],["The Ministry of Agriculture announced in 2026 the plan to implement an AI‑based crop disease diagnosis system nationwide, enabling timely treatment.","The AI system showed a 30% improvement in disease identification in a 2025 pilot project","The system will be available to farmers via a mobile app","Data support is provided by the Indian Council of Agricultural Research (ICAR)","The system includes treatment recommendations along with disease identification","In the first phase it will be rolled out in 10 states","A 5‑7% increase in agricultural production is expected","The initiative aligns with Digital India and agricultural digitisation","The system will also be available in local languages"]],["Which Indian state first fully implemented a \"Zero Waste\" policy in 2026?",["Gujarat","Himachal Pradesh","Tripura","Odisha"],["The Tripura government fully implemented the Zero Waste policy at the state level in 2026, adopting a circular economy model for waste management across all municipalities.","Tripura drafted the policy in 2025","In 2026 waste segregation became mandatory in all municipalities","The number of composting plants increased from 150 to 300","A ban on plastic bags was enforced","Local entrepreneurs were incentivised to start recycling businesses","The Environment Department praised the initiative at the national level","The Zero Waste policy includes awareness programmes in schools","In the first year, waste generation decreased by 40%"]],["In which international sporting event did India first implement a \"Digital Ticketing\" system in 2026?",["World Yoga Day","Cricket World Cup","Olympic Games","Asian Games"],["India adopted a digital ticketing system for the Asian Games 2026, making ticket purchase, verification and entry fully electronic.","The Asian Games 2026 were held in India","A national portal was developed for digital ticketing","A QR‑code based entry system was implemented","Ticket fraud reduced by 90%","5G coverage was ensured at all sporting venues","An AI chatbot helped improve user experience","There are plans to adopt the ticketing system for other international events","The system was supported by the Government of India under the Digital India initiative"]],["In which Indian city was the first public \"Hydrogen Fuel Station\" opened in 2026?",["Kolkata","Bhopal","Indore","Jaipur"],["India's first public hydrogen fuel station was opened in Bhopal in 2026, providing fuel for hydrogen‑powered vehicles.","The hydrogen station was built with the cooperation of the Ministry of Energy, Government of India","The station supplies 500 kilograms of hydrogen per day","It was established as part of India's climate change targets","Local automobile companies began testing hydrogen cars","The station received recognition from the International Energy Agency (IEA)","There are plans to establish 10 such stations by 2028","Special sensors were installed for safety standards at the station","A public awareness campaign on hydrogen benefits was conducted"]]],"bh":[["1857 के पहिला स्वतंत्रता संग्राम के मुख्य कारण में से एक का रहे?",["सिपाहियन के वेतन कटौती","जापान के साथ जुद्ध","विदेशी व्यापार के विस्तार","बंगाल में बाढ़"],["1857 के विद्रोह के मुख्य कारण सिपाहियन के वेतन कटौती आ नई सेवा शर्तें रहल, जेसे उनकर असंतोष बढ़ल।","1857 के विद्रोह भारत में पहिला बड़ पैमाना के स्वतंत्रता संग्राम मानल जाला","सिपाहियन के नई सेवा शर्तन के तहत यूरोपीय रैंकिंग दिहल गइल रहे","वेतन में कटौती के साथे रेज़रवेशन एक्ट भारतीयन के सरकारी पद से बाहर कर देहलस","विद्रोह के शुरुआत मेरठ में भइल","मुख्य नेता रानी लक्ष्मीबाई, बहादुर शाह ज़फ़र, आ नेहरू परिवार के सदस्य रहलन","विद्रोह के बाद ब्रिटिश सरकार 1858 में भारत के सीधे ब्रिटिश राज के तहत रखलस","सिपाहियन बटन रिवर में 'बंदूक' के आवाज़ के 'स्वतंत्रता के पुकार' function L(k){return (LANG[currentLang]&&LANG[currentLang][k])||LANG.hi[k]||k}
function applyLanguage(){document.documentElement.lang=currentLang==='bh'?'bho':currentLang;document.querySelectorAll('[data-k]').forEach(e=>e.textContent=L(e.dataset.k));document.querySelectorAll('input[name="lang"]').forEach(r=>r.checked=r.value===currentLang);renderLists();adminUI();if($('loginModal').classList.contains('open'))renderAuth();updateProfile()}
function setLanguage(l){currentLang=l;localStorage.setItem('gyankshetraLang',l);applyLanguage();slideBuild();if($('result').classList.contains('active'))paintResult();if(running)render();if(reviewOpen())renderReview();if($('saved').classList.contains('active'))renderSaved();if(viewerOpen())renderViewer();updateResume()}
function toggleDrawer(){$('drawer').classList.toggle('open')}
function nav(id){$('drawer').classList.remove('open');go(id)}
function sub(id,arr){const e=$(id),o=!e.classList.contains('open');e.classList.toggle('open',o);$(arr).textContent=o?'▾':'▸'}
function soon(){alert(L('soon'))}
function users(){const m=JSON.parse(localStorage.getItem('gyankshetraUsers')||'{}');const id=localStorage.getItem('gyankshetraUserId');if(id&&!m[id])m[id]=localStorage.getItem('gyankshetraUserName')||'';return m}
function uName(){const u=getUser();if(!u.logged)return '';let n=((users()[u.id])||u.name||'').trim();if(!n||/^@\d+-/.test(n))n=(u.id.split('-').slice(1).join('-')||n);return n}
function getUser(){const id=localStorage.getItem('gyankshetraUserId')||'';return{name:localStorage.getItem('gyankshetraUserName')||'',id,logged:!!id&&localStorage.getItem('gyankshetraLoggedIn')!=='0'}}
let cur='home',lastScreen='home';
function toggleSavedNav(){cur==='saved'?go(lastScreen):go('saved')}
function go(id){if(cur==='quiz'&&id!=='quiz')pauseQuiz();if(cur!==id&&cur!=='saved'&&cur!=='profile')lastScreen=cur==='quiz'?'home':cur;cur=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));const m={home:'navHome',tests:'navTests',practice:'navPractice',saved:'navSaved',study:'navStudy'};if(m[id])$(m[id]).classList.add('active');if(id==='saved')openSaved();if(id==='downloads')renderDownloads();updateProfile();scrollTo(0,0)}
function requireUser(a){if(getUser().logged)a();else{pendingAction=a;openAuth()}}
let authMode='register';
function openAuth(mode){authMode=mode||(Object.keys(users()).length?'login':'register');renderAuth();$('loginModal').classList.add('open');setTimeout(()=>$('nameInput').focus(),100)}
function renderAuth(){const r=authMode==='register',has=Object.keys(users()).length>0;$('authTitle').textContent=r?L('authNewT'):L('authLoginT');$('authHelp').textContent=r?L('authHelpReg'):L('authHelpLogin');$('authLabel').textContent=r?L('lblName'):L('lblId');$('nameInput').value='';$('nameInput').placeholder=r?L('phName'):L('phId');$('authBtn').textContent=r?L('btnStart'):L('btnLogin');$('authBtn').onclick=r?saveUser:loginById;$('authSwitch').textContent=r?L('swToLogin'):L('swToReg');$('authSwitch').style.display=(r&&!has)?'none':'block'}
function switchAuth(){authMode=authMode==='register'?'login':'register';renderAuth()}
function loginById(){const e=$('nameInput').value.trim().toUpperCase(),m=users(),id=Object.keys(m).find(k=>k.toUpperCase()===e);if(!id){alert(L('wrongId'));return}localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraUserName',m[id]);localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function logout(){pauseQuiz();localStorage.setItem('gyankshetraLoggedIn','0');updateProfile();go('home')}
function toggleProfile(){cur==='profile'?go(lastScreen):go('profile')}
function closeAuth(){$('loginModal').classList.remove('open');pendingAction=null}
function makeId(name,n){const w=name.trim().split(/\s+/)[0].replace(/[^\p{L}\p{N}]+/gu,'').toUpperCase();return '@'+String(n).padStart(2,'0')+'-'+w}
function saveUser(){const n=$('nameInput').value.trim();if(!n){alert(L('needName'));return}const num=Number(localStorage.getItem('gyankshetraNextNumber')||1),id=makeId(n,num),m=users();m[id]=n;localStorage.setItem('gyankshetraUsers',JSON.stringify(m));localStorage.setItem('gyankshetraUserName',n);localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraNextNumber',String(num+1));localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function updateProfile(){const u=getUser();$('profileName').textContent=u.logged?uName():'Gyankshetra '+L('student');$('profileId').textContent=u.logged?'🆔 '+u.id:L('loginPrompt');$('welcome').textContent=L('hello')+' '+(u.logged?uName():L('student'))+' 👋';$('profileLoginBtn').style.display=u.logged?'none':'block';$('profileLogoutBtn').style.display=u.logged?'block':'none';const h=JSON.parse(localStorage.getItem('gyankshetraHistory')||'[]');$('historyText').textContent=h.length?`${h.length} ${L('histN')} • ${L('histLast')}: ${h[h.length-1].marks}/${h[h.length-1].total||TOTAL}`:L('histNone');{const b=h.reduce((m,x)=>{const t=x.total||TOTAL;return (Number(x.marks)||0)/t>(m?m.marks/m.t:-1)?{marks:Number(x.marks)||0,t}:m},null);$('bestScore').textContent=b?b.marks+' / '+b.t:'0 / '+TOTAL}updateResume()}
function startQuiz(){qi=0;ans=Array(TOTAL).fill(null);time=0;reviewIndex=0;running=true;clearInterval(timerHandle);go('quiz');render();saveProgress();timerHandle=setInterval(tick,1000)}
function pKey(){return 'gyankshetraProgress_'+TEST_ID+'_'+(localStorage.getItem('gyankshetraUserId')||'')}
function saveProgress(){if(running)localStorage.setItem(pKey(),JSON.stringify({qi,ans,time}))}
function getProgress(){try{const p=JSON.parse(localStorage.getItem(pKey())||'null');return p&&Array.isArray(p.ans)&&p.time>0?p:null}catch(e){return null}}
function pauseQuiz(){if(!running)return;saveProgress();running=false;clearInterval(timerHandle);timerHandle=null}
function tick(){if(time<TIME){time++;renderTimer();if(time>=TIME)finish();else if(time%5===0)saveProgress()}else finish()}
function resumeQuiz(){const p=getProgress();if(!p){startQuiz();return}qi=p.qi;ans=p.ans;time=p.time;running=true;clearInterval(timerHandle);go('quiz');render();timerHandle=setInterval(tick,1000)}
function updateResume(){const p=getUser().logged?getProgress():null;document.querySelectorAll('.resumebtn').forEach(b=>{b.style.display=p?'block':'none';if(p)b.textContent='▶ '+L('resume')+' • '+L('q')+' '+(p.qi+1)+'/'+TOTAL+' • '+fmt(TIME-p.time)})}
function fmt(t){t=Math.max(0,t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function renderTimer(){$('timer').textContent=fmt(TIME-time);$('timer').parentElement.classList.toggle('low',TIME-time<=60)}

function cleanH(h){return String(h).replace(/<script[\s\S]*?<\/script>/gi,'').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'').replace(/javascript:/gi,'')}
async function openNote(k,i){const f=getStudyList(k)[i];if(!f)return;if(f.url&&!f.html){try{const r=await fetch(f.url);if(!r.ok)throw 0;const d=new DOMParser().parseFromString(await r.text(),'text/html'),c=d.querySelector('.content');if(!c||!c.innerHTML.trim())throw 0;f.html=c.innerHTML}catch(e){window.open(f.url,'_blank');return}}curNote=f;$('rBody').innerHTML=cleanH(f.html);$('reader').classList.add('open');$('rBody').scrollTop=0}
function dlKey(){return 'gyankshetraDownloads_'+(localStorage.getItem('gyankshetraUserId')||'guest')}

function dlNote(){if(!curNote)return;const t='<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>'+curNote.title.replace(/</g,'&lt;')+'</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:16px;line-height:1.7}h3{color:#075fc3}table{border-collapse:collapse}td,th{border:1px solid #999;padding:6px}</style></head><body><h1>'+curNote.title.replace(/</g,'&lt;')+'</h1>'+cleanH(curNote.html)+'<hr><p>📢 Gyankshetra — https://t.me/gyankshetra</p></body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download=(curNote.id||'gyankshetra-note')+'.html';document.body.appendChild(a);a.click();a.remove();saveDownload(curNote)}

const BUILTIN_NOTES=[{id:'oxidation',title:'Chemistry — ऑक्सीकरण (Notes)',html:"<h2>ऑक्सीकरण (Oxidation)<\/h2>\n<h3>1. परिभाषा<\/h3>\n<p>किसी पदार्थ में <b>ऑक्सीजन का जुड़ना<\/b> या <b>हाइड्रोजन का हटना<\/b> ऑक्सीकरण कहलाता है। इलेक्ट्रॉन के आधार पर: जब कोई परमाणु या आयन <b>इलेक्ट्रॉन त्यागता<\/b> है और उसका ऑक्सीकरण अंक बढ़ता है, तो वह ऑक्सीकृत होता है।<\/p>\n<h3>2. ऑक्सीकरण और अपचयन की तुलना<\/h3>\n<table><tr><th>आधार<\/th><th>ऑक्सीकरण<\/th><th>अपचयन<\/th><\/tr>\n<tr><td>ऑक्सीजन<\/td><td>जुड़ना<\/td><td>हटना<\/td><\/tr>\n<tr><td>हाइड्रोजन<\/td><td>हटना<\/td><td>जुड़ना<\/td><\/tr>\n<tr><td>इलेक्ट्रॉन<\/td><td>त्यागना (हानि)<\/td><td>ग्रहण करना (लाभ)<\/td><\/tr>\n<tr><td>ऑक्सीकरण अंक<\/td><td>बढ़ना<\/td><td>घटना<\/td><\/tr><\/table>\n<h3>3. याद रखने की ट्रिक<\/h3>\n<p><b>OIL RIG<\/b> — Oxidation Is Loss, Reduction Is Gain (इलेक्ट्रॉन की)।<\/p>\n<h3>4. रेडॉक्स अभिक्रिया<\/h3>\n<p>जिस अभिक्रिया में ऑक्सीकरण और अपचयन <b>एक साथ<\/b> होते हैं, उसे रेडॉक्स (Redox) अभिक्रिया कहते हैं।<\/p>\n<ul><li>2Mg + O₂ → 2MgO : Mg का ऑक्सीकरण, O₂ का अपचयन।<\/li>\n<li>CuO + H₂ → Cu + H₂O : H₂ का ऑक्सीकरण, CuO का अपचयन।<\/li><\/ul>\n<h3>5. ऑक्सीकारक और अपचायक<\/h3>\n<table><tr><th>पदार्थ<\/th><th>कार्य<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>ऑक्सीकारक<\/td><td>दूसरे को ऑक्सीकृत करता है, स्वयं अपचयित होता है<\/td><td>O₂, KMnO₄, K₂Cr₂O₇<\/td><\/tr>\n<tr><td>अपचायक<\/td><td>दूसरे का अपचयन करता है, स्वयं ऑक्सीकृत होता है<\/td><td>H₂, C, Zn, Mg<\/td><\/tr><\/table>\n<h3>6. दैनिक जीवन में ऑक्सीकरण<\/h3>\n<ul><li><b>जंग लगना:<\/b> हवा और नमी में लोहे पर भूरी परत (Fe₂O₃·xH₂O) बनती है।<\/li>\n<li><b>दहन:<\/b> ईंधन का ऑक्सीजन से ऑक्सीकरण, ऊष्मा और प्रकाश निकलता है।<\/li>\n<li><b>श्वसन:<\/b> कोशिकाओं में ग्लूकोज़ का ऑक्सीकरण, ऊर्जा मिलती है।<\/li>\n<li><b>विकृतगंधिता (Rancidity):<\/b> तेल या वसा का ऑक्सीकरण, खाने में बुरी गंध और स्वाद आता है।<\/li>\n<li><b>ताँबे पर हरी परत:<\/b> हवा और नमी से ताँबे का संक्षारण।<\/li><\/ul>\n<h3>7. ऑक्सीकरण से बचाव<\/h3>\n<ul><li>पेंट, तेल या ग्रीस लगाना।<\/li>\n<li>गैल्वनीकरण: लोहे पर जस्ते की परत चढ़ाना।<\/li>\n<li>मिश्रधातु बनाना, जैसे स्टेनलेस स्टील।<\/li>\n<li>खाद्य पदार्थों में एंटीऑक्सीडेंट मिलाना।<\/li>\n<li>चिप्स के पैकेट में नाइट्रोजन गैस भरना।<\/li><\/ul>\n<h3>8. ऑक्सीकरण अंक के मुख्य नियम<\/h3>\n<ol><li>मुक्त तत्व का ऑक्सीकरण अंक 0 होता है।<\/li>\n<li>सरल आयन का ऑक्सीकरण अंक उसके आवेश के बराबर होता है (Na⁺ = +1)।<\/li>\n<li>यौगिक में सभी परमाणुओं के ऑक्सीकरण अंकों का योग 0 होता है।<\/li>\n<li>ऑक्सीजन प्रायः −2 (पेरॉक्साइड में −1) होती है।<\/li>\n<li>हाइड्रोजन प्रायः +1 (धात्विक हाइड्राइड में −1) होता है।<\/li><\/ol>\n<h3>9. परीक्षा के लिए महत्वपूर्ण बिंदु<\/h3>\n<ul><li>ऑक्सीकरण और अपचयन हमेशा साथ-साथ होते हैं।<\/li>\n<li>मैग्नीशियम रिबन जलने पर तेज़ सफ़ेद रोशनी के साथ MgO बनाता है।<\/li>\n<li>धातुओं के ऑक्साइड प्रायः क्षारीय और अधातुओं के ऑक्साइड प्रायः अम्लीय होते हैं।<\/li>\n<li>H₂O₂ ऑक्सीकारक और अपचायक, दोनों की तरह व्यवहार कर सकता है।<\/li><\/ul>"}];

function openStudy(k){studySec=studySec===k?null:k;renderStudy()}
function showStudy(k){studySec=k;renderStudy();nav('study')}
let REG={tests:[],study:[]};
const SUBJ_MAP_Q={'Physics':'s_phy','Chemistry':'s_chem','Biology':'s_bio','History':'s_hist','Polity':'s_pol','Geography':'s_geo'};
const SUBJ_MAP_T={'Science':'s_sci','General Science':'s_sci','Physics':'s_sci','Chemistry':'s_sci','Biology':'s_sci','Social Science':'s_soc','History':'s_soc','Geography':'s_soc','Polity':'s_soc','Economics':'s_soc','Bihar GK':'s_bgk','Current Affairs':'s_ca','Bihar Current Affairs':'s_bca'};
const KINDS={tests:['test','mock'],practice:['quiz','practice','pyq']};
let openSub={tests:null,practice:null};
function escH(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function subjOf(t,page){if(t.subject==='Mixed')return 'mixed';return ((page==='tests'?SUBJ_MAP_T:SUBJ_MAP_Q)[t.subject])||'other'}
function regItems(page,sk){return REG.tests.filter(t=>KINDS[page].includes(t.type)&&subjOf(t,page)===sk)}
function loadReg(){try{const c=JSON.parse(localStorage.getItem('gyankshetraReg')||'null');if(c&&c.tests&&c.study)REG=c}catch(e){}
const g=u=>fetch(u,{cache:'no-store'}).then(r=>r.ok?r.json():null).catch(()=>null);
Promise.all([g(ROOT+'content/generated_tests.json'),g(ROOT+'content/study_material.json')]).then(([t,s])=>{if(!Array.isArray(t)&&!Array.isArray(s))return;REG={tests:Array.isArray(t)?t:REG.tests,study:Array.isArray(s)?s:REG.study};try{localStorage.setItem('gyankshetraReg',JSON.stringify(REG))}catch(e){}renderLists()})}
function itemCard(t){return `<div class="card" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><b>${escH(t.title)}</b><small>${t.questions?t.questions+' '+L('qWord'):''}</small><button class="primary">${L('startTest')}</button>${isAdmin()?`<button class="delbtn" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑 Delete</button>`:''}</div>`}
/* ---- Admin (GitHub token login; GitHub itself enforces permission) ---- */
const ADMIN_USER='gyankshetra';
function ghOwner(){return location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:ADMIN_USER}
function ghRepo(){return location.pathname.split('/').filter(Boolean)[0]||'Gyankshetra-app'}
function adminTok(){try{return localStorage.getItem('gyankshetraAdminToken')||''}catch(e){return ''}}
function isAdmin(){return !!adminTok()&&localStorage.getItem('gyankshetraAdminOk')==='1'}
function gh(path,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+adminTok(),'Accept':'application/vnd.github+json'},opt.headers||{});return fetch('https://api.github.com'+path,opt)}
function b64d(c){return new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\n/g,'')),x=>x.charCodeAt(0)))}
function b64e(t){return btoa(unescape(encodeURIComponent(t)))}
const SLIDE_K=['s_sci','s_soc','s_bgk','s_ca'];let bIdx=0,bPause=0;
function bStep(){const c=$('bTrack').children;return c.length>1?c[1].offsetLeft-c[0].offsetLeft:0}
function bDot(i){document.querySelectorAll('#bDots i').forEach((d,k)=>d.classList.toggle('on',k===i))}
function slideBuild(){const t=$('bTrack');if(!t)return;const msg=k=>escH(L('slideP').replace('{x}',L(k)));
t.innerHTML=SLIDE_K.concat([SLIDE_K[0]]).map(k=>`<div class="banner bslide" onclick="openSection('${k}')"><span>🎯</span><div class="btxt"><b>${escH(L('bannerT'))}</b><small class="slide">${msg(k)}</small></div><button class="bstart"><span>${escH(L('startT'))}</span><i>→</i></button></div>`).join('');
$('bDots').innerHTML=SLIDE_K.map(()=>'<i></i>').join('');const st=bStep();t.style.scrollSnapType='none';t.scrollLeft=bIdx*st;requestAnimationFrame(()=>t.style.scrollSnapType='');bDot(bIdx)}
function openSection(k){openSub.tests=k;go('tests');renderLists()}
function bNext(){const t=$('bTrack'),st=bStep();if(!st)return;t.scrollTo({left:(Math.round(t.scrollLeft/st)+1)*st,behavior:'smooth'})}
(function(){const t=$('bTrack');let tm;t.addEventListener('scroll',()=>{const st=bStep();if(!st)return;bDot(Math.round(t.scrollLeft/st)%4);clearTimeout(tm);tm=setTimeout(()=>{let i=Math.round(t.scrollLeft/st);if(i>=SLIDE_K.length){t.style.scrollSnapType='none';t.scrollLeft=0;requestAnimationFrame(()=>t.style.scrollSnapType='');i=0}bIdx=i;bDot(i)},100)},{passive:true});
['touchstart','mousedown','wheel'].forEach(e=>t.addEventListener(e,()=>{bPause=Date.now()+5000},{passive:true}))})();
setInterval(()=>{if(cur==='home'&&Date.now()>bPause)bNext()},2800);
function goApp(){if(ROOT)location.href=ROOT+'index.html';else go('home')}
function nav_admin(){$('drawer').classList.remove('open');openAdmin()}
function openAdmin(){if(isAdmin()){if(confirm('Admin Logout?'))adminLogout();return}$('tokInput').value='';$('adminModal').classList.add('open')}
function closeAdmin(){$('adminModal').classList.remove('open')}
function adminLogout(){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');adminUI();renderLists()}
function adminUI(){const b=$('adminMenuBtn');if(b)b.textContent=isAdmin()?'🚪 '+L('adminOut'):'🔐 '+L('adminIn')}
async function adminLogin(){const t=$('tokInput').value.trim();if(!t)return;localStorage.setItem('gyankshetraAdminToken',t);try{const u=await (await gh('/user')).json();if(!u.login||u.login.toLowerCase()!==ADMIN_USER)throw 'ID';const r=await (await gh('/repos/'+ghOwner()+'/'+ghRepo())).json();if(!r.permissions||!r.permissions.push)throw 'perm';localStorage.setItem('gyankshetraAdminOk','1');closeAdmin();adminUI();renderLists();alert('✅ Admin login: '+u.login)}catch(e){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');alert('❌ Login nahi hua. Token ya permission galat hai.')}}
function repoPath(u){try{const x=new URL(u,location.href);if(x.origin!==location.origin)return null;let p=decodeURIComponent(x.pathname);const base='/'+ghRepo()+'/';if(location.hostname.endsWith('.github.io')){if(!p.startsWith(base))return null;p=p.slice(base.length)}else p=p.replace(/^\//,'');return p}catch(e){return null}}
async function ghErr(r){let m='';try{m=(await r.json()).message||''}catch(e){}return 'HTTP '+r.status+(m?' — '+m:'')}
async function delTest(u){if(!isAdmin())return;const t=REG.tests.find(x=>x.url===u);if(!t||!confirm('"'+t.title+'" delete karna hai?'))return;const o=ghOwner(),r=ghRepo(),jp='content/generated_tests.json',ep='/repos/'+o+'/'+r+'/contents/'+jp,J={'Content-Type':'application/json'};try{
for(let k=0;k<2;k++){const g=await gh(ep,{cache:'no-store'});if(!g.ok)throw await ghErr(g);const gj=await g.json();const arr=JSON.parse(b64d(gj.content));if(!Array.isArray(arr))throw 'content/generated_tests.json ka format galat hai';const n=arr.filter(x=>x.url!==u);
const p=await gh(ep,{method:'PUT',headers:J,body:JSON.stringify({message:'Delete test: '+t.title,content:b64e(JSON.stringify(n,null,2)),sha:gj.sha})});if(p.ok)break;if(p.status===409&&k===0)continue;throw await ghErr(p)}
const fp=repoPath(u);if(fp&&/\.(html|json)$/.test(fp)&&fp!=='index.html'&&!fp.startsWith('content/')&&!fp.includes('..')){const fe='/repos/'+o+'/'+r+'/contents/'+fp.split('/').map(encodeURIComponent).join('/');const f=await gh(fe);if(f.ok){const fj=await f.json();if(fj.sha)await gh(fe,{method:'DELETE',headers:J,body:JSON.stringify({message:'Delete test file: '+fp,sha:fj.sha})})}}
REG.tests=REG.tests.filter(x=>x.url!==u);try{localStorage.setItem('gyankshetraReg',JSON.stringify(REG))}catch(e){}renderLists();alert('🗑 Delete ho gaya.')}catch(e){const m=String(e);alert('❌ Delete nahi hua: '+m+(/40[134]|not accessible|permission|Bad credentials/i.test(m)?'\n\nToken me is repo ke liye "Contents: Read and write" permission dein (GitHub > Settings > Developer settings > Fine-grained tokens), phir Admin Logout karke naya token daalein.':''))}}
function builtinCard(){return `<div class="card"><b>🧪 ${TEST_NAME}</b><small>${L('testMeta')}</small><button class="primary" onclick="requireUser(startQuiz)">${L('startTest')}</button></div>`}
function mixedGroups(page){const g={};REG.tests.filter(t=>KINDS[page].includes(t.type)&&t.subject==='Mixed').forEach(t=>{const nm=t.title.replace(/^[^\p{L}\p{N}]+/u,''),m=nm.match(/^(\S+) (\d+)Q (\d+)$/),key=m?m[1].toUpperCase()+' SERIES '+m[2]:'TEST SERIES';(g[key]=g[key]||[]).push({t,nm,n:m?+m[3]:0})});Object.values(g).forEach(a=>a.sort((x,y)=>x.n-y.n));return g}
function mixedRow(o){const t=o.t,nm=o.nm;return `<div class="qrow" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><span>📝 ${escH(nm)}${t.questions?' <small style="color:#7b8799;font-weight:400">• '+t.questions+' '+L('qWord')+'</small>':''}</span>${isAdmin()?`<button class="qdel" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑</button>`:''}<i>›</i></div>`}
function subjBlock(page){const list=SUBJS[page],keys=list.map(s=>s[0]).concat(['other']),tiles=[];let panel='';
const g=mixedGroups(page);Object.keys(g).forEach(key=>{const id='mx_'+key.replace(/\W+/g,'_'),a=g[key];tiles.push({id,ic:'📂',nm:key,sub:a.length+' '+L('testsWord'),n:a.length});if(openSub[page]===id)panel=`<div class="tphead">📂 ${escH(key)}</div>`+a.map(mixedRow).join('')});
keys.forEach(k=>{const s=list.find(x=>x[0]===k)||['sOther','📂',0];const items=regItems(page,k),own=(OWN[page]===k)?1:0,n=items.length+own;if(k==='other'&&!n)return;
tiles.push({id:k,ic:s[1],nm:L(s[0]),sub:n?n+' '+L('testsWord'):L('comingSub'),n});if(openSub[page]===k&&n)panel=`<div class="tphead">${s[1]} ${escH(L(s[0]))}</div>`+(own?builtinRow():'')+items.map(itemRow).join('')});
return `<div class="tiles">`+tiles.map(t=>`<div class="${openSub[page]===t.id&&t.n?'on':''}" onclick="${t.n?`toggleSub('${page}','${t.id}')`:'soon()'}">${t.ic}<b>${escH(t.nm)}</b><small>${t.sub}</small></div>`).join('')+`</div>`+(panel?`<div class="tilepanel">${panel}</div>`:'')}
function itemRow(t){return `<div class="qrow" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><span>${escH(t.title)}</span>${isAdmin()?`<button class="qdel" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑</button>`:''}<i>›</i></div>`}
function builtinRow(){return `<div class="qrow" onclick="requireUser(startQuiz)"><span>🧪 ${escH(TEST_NAME)}</span><i>›</i></div>`}
function toggleSub(p,k){openSub[p]=openSub[p]===k?null:k;renderLists();const e=document.querySelector('#'+(p==='tests'?'testsBody':'practiceBody')+' .tilepanel');if(e)setTimeout(()=>e.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}
function renderLists(){
const all=REG.tests.slice(0,3);$('homeNew').innerHTML=all.length?all.map(itemCard).join(''):`<div class="card"><small>${L('noNew')}</small></div>`;
$('testsBody').innerHTML=subjBlock('tests');$('practiceBody').innerHTML=subjBlock('practice');renderStudy();renderExam()}
function setExam(x){try{localStorage.setItem('gyankshetraExam',x)}catch(e){}renderExam()}
function renderExam(){let ex='STET';try{ex=localStorage.getItem('gyankshetraExam')||'STET'}catch(e){}document.querySelectorAll('#examChips button').forEach(b=>b.classList.toggle('on',b.dataset.ex===ex))}
/* Test UI: palette + swipe */
function openPalette(){$('palGrid').innerHTML=questions.map((q,i)=>`<button class="${ans[i]!==null&&ans[i]!==undefined?'a':''} ${i===qi?'cur':''}" onclick="jumpQ(${i})">${i+1}</button>`).join('');$('palette').classList.add('open')}
function closePalette(){$('palette').classList.remove('open')}
function jumpQ(i){qi=i;closePalette();saveProgress();render()}
(function(){let x0=0,y0=0;const w=$('quiz');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;if((dx>0)===SWIPE_RIGHT_IS_NEXT){if(qi<TOTAL-1){qi++;saveProgress();render()}}else prev()},{passive:true})})();
/* Result */
let lastRes={c:0,w:0,s:0},lastAttempt=1;
function paintResult(){const {c,w,s}=lastRes,a=c/TOTAL*100,b=a+w/TOTAL*100;$('donut').style.background=`conic-gradient(#1f9d55 0 ${a}%,#e03a3a ${a}% ${b}%,#c9d1dc ${b}% 100%)`;const u=getUser();$('resName').textContent='👤 '+(u.logged?uName():L('student'));$('reTag').classList.toggle('on',lastAttempt>1);$('anBtn').textContent='📚 Analysis';$('tipHint').textContent=({hi:'किसी भी बॉक्स पर टैप करें — उसका Analysis खुलेगा',en:'Tap any box to open its analysis',bh:'कवनो बॉक्स पर टैप करीं — ओकर विश्लेषण खुली'})[currentLang];$('backBtn').textContent=({hi:'🏠 ऐप पर वापस जाएँ',en:'🏠 Back to App',bh:'🏠 ऐप पर लौटीं'})[currentLang]}
function shareResult(){const {c,w,s}=lastRes,u=getUser(),p=Math.round(c/TOTAL*100),link=location.href.split('#')[0].split('?')[0];
const text=`${L('shHead')}\n👤 ${u.logged?u.name:L('student')}\n🏆 ${L('marks')}: ${c}/${TOTAL} (${p}%)\n✅ ${L('correct')}: ${c}  ❌ ${L('wrong')}: ${w}  ⏭ ${L('skipped')}: ${s}\n📢 ${L('shTg')}: https://t.me/gyankshetra\n🔗 ${L('shLink')}: ${link}`;
window.open('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text),'_blank')}
/* Download */
function downloadTest(){const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');const t='<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Gyankshetra</title></head><body style="font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:16px"><h1>Gyankshetra — '+TEST_NAME.replace(/</g,'&lt;')+'</h1>'+questions.map((q0,i)=>{const q=Q(i);return `<h3>${i+1}. ${esc(q[0])}</h3><ol type="A">${q[1].map(o=>`<li>${esc(o)}</li>`).join('')}</ol><p><b>${esc(L('right'))}:</b> ${String.fromCharCode(65+q[2])}. ${esc(q[1][q[2]])}</p><ul>${q[3].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}).join('<hr>')+'<p>📢 https://t.me/gyankshetra</p></body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download='gyankshetra-physics-gravitation.html';document.body.appendChild(a);a.click();a.remove();$('drawer').classList.remove('open')}
applyLanguage();loadStudy();loadReg();adminUI();slideBuild();go('home');if(ROOT){const p=getProgress();requireUser(getUser().logged&&p?resumeQuiz:startQuiz)}
</script>
