<!DOCTYPE html>
<html lang="hi">
<head>

  <style>
    :root {

      --bg: #f8f9fa;
      --card-bg: #ffffff;
      --text: #202124;
      --text-muted: #5f6368;
      --border: #dadce0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; }
    
    /* Header */
    header { background: #ffffff; border-bottom: 1px solid var(--border); padding: 12px 18px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
    .title { font-size: 1.15rem; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 8px; cursor: pointer; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .student-info { font-size: 13px; color: var(--text-muted); background: #f1f3f4; padding: 4px 10px; border-radius: 20px; font-weight: 500; }
    .timer-box { font-weight: 700; font-size: 15px; color: var(--danger); background: #fce8e6; padding: 5px 12px; border-radius: 6px; font-variant-numeric: tabular-nums; }

    /* Dashboard Layout */
    #dashboardView { max-width: 900px; margin: 0 auto; width: 100%; padding: 16px; }
    .tab-bar { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 12px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .tab-btn { background: #fff; border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--text-muted); transition: 0.15s; }
    .tab-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
    
    .filters-bar { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 14px; }
    .filter-chip { background: #e8eaed; border: none; padding: 5px 12px; border-radius: 14px; font-size: 13px; font-weight: 500; cursor: pointer; color: var(--text); }
    .filter-chip.active { background: var(--primary); color: #fff; }

    .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
    .test-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 10px; padding: 16px; box-shadow: 0 1px 3px rgba(60,64,67,0.08); display: flex; flex-direction: column; justify-content: space-between; }
    .test-card-head { margin-bottom: 10px; }
    .test-badge { font-size: 11px; font-weight: 700; text-transform: uppercase; background: #e8f0fe; color: var(--primary); padding: 3px 8px; border-radius: 4px; display: inline-block; margin-bottom: 6px; }
    .test-card-title { font-size: 15.5px; font-weight: 600; color: var(--text); line-height: 1.4; }
    .test-card-meta { font-size: 13px; color: var(--text-muted); margin-top: 4px; }
    .card-btn { margin-top: 14px; display: block; text-align: center; background: var(--primary); color: #fff; text-decoration: none; padding: 8px; border-radius: 6px; font-size: 13.5px; font-weight: 600; }

    /* Test Player Layout */
    #quizView { display: none; }
    main { flex: 1; padding: 16px; max-width: 780px; margin: 0 auto; width: 100%; touch-action: pan-y; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 22px; box-shadow: 0 1px 3px rgba(60,64,67,0.08); }
    
    .question-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid #f1f3f4; padding-bottom: 12px; font-size: 14px; color: var(--text-muted); }
    .question-header b { color: var(--text); }
    .topic-tag { background: #e8f0fe; color: var(--primary); font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 4px; }

    /* ☰ attached to the left of the question */
    .question-row { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 22px; }
    .q-menu-btn { background: #f1f3f4; border: 1px solid var(--border); color: var(--text); width: 34px; height: 34px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px; line-height: 1; flex-shrink: 0; margin-top: 2px; transition: 0.15s; }
    .q-menu-btn:active { background: #e2e5e9; }
    .q-text { font-size: 1.15rem; line-height: 1.6; font-weight: 500; color: #202124; flex: 1; }
    
    /* Options */
    .options-list { display: flex; flex-direction: column; gap: 12px; }
    .opt-item { border: 1.5px solid var(--border); border-radius: 8px; padding: 13px 16px; cursor: pointer; display: flex; align-items: center; gap: 14px; font-size: 15.5px; transition: all 0.15s; background: #fff; }
    .opt-item:hover { border-color: #b0c4de; background: #fdfdfd; }
    .opt-item.selected { border-color: var(--primary); background: #e8f0fe; font-weight: 500; }
    .opt-item.correct { border-color: var(--success); background: #e6f4ea; font-weight: 600; color: var(--success); }
    .opt-item.incorrect { border-color: var(--danger); background: #fce8e6; font-weight: 600; color: var(--danger); }
    .opt-badge { width: 28px; height: 28px; border-radius: 50%; background: #f1f3f4; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: var(--text-muted); flex-shrink: 0; }
    .opt-item.selected .opt-badge { background: var(--primary); color: #fff; }
    .opt-item.correct .opt-badge { background: var(--success); color: #fff; }
    .opt-item.incorrect .opt-badge { background: var(--danger); color: #fff; }

    /* Navigation */
    .nav-bar { display: flex; justify-content: space-between; margin-top: 26px; gap: 12px; }
    .btn { padding: 10px 20px; border-radius: 6px; font-weight: 600; border: none; cursor: pointer; font-size: 14.5px; transition: 0.15s; }
    .btn-secondary { background: #fff; border: 1px solid var(--border); color: var(--text); }
    .btn-secondary:active { background: #f1f3f4; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:active { background: var(--primary-dark); }
    .btn-submit { background: var(--success); color: #fff; }

    /* 5-Column Grid Palette Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; justify-content: center; align-items: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: #fff; border-radius: 12px; width: 100%; max-width: 440px; max-height: 85vh; overflow-y: auto; padding: 20px; box-shadow: 0 4px 16px rgba(0,0,0,0.18); }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; border-bottom: 1px solid #f1f3f4; padding-bottom: 10px; }
    .modal-head h3 { font-size: 17px; font-weight: 600; }
    .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; }
    .palette-node { aspect-ratio: 1; border-radius: 8px; border: 1.5px solid var(--border); background: #ffffff; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 14.5px; cursor: pointer; position: relative; color: var(--text); }
    .palette-node.active-node { border-color: var(--primary); box-shadow: 0 0 0 2px rgba(26,115,232,0.3); }
    .palette-node.answered { background: var(--success); color: #ffffff; border-color: var(--success); }
    .palette-node .dot-badge { position: absolute; top: 3px; right: 3px; width: 7px; height: 7px; border-radius: 50%; background: var(--warning); display: none; }
    .palette-node.reattempted .dot-badge { display: block; }

    .modal-submit-wrap { margin-top: 20px; border-top: 1px solid #f1f3f4; padding-top: 14px; text-align: center; }
    .modal-submit-btn { width: 100%; background: var(--success); color: #fff; border: none; padding: 12px; font-size: 15px; font-weight: 700; border-radius: 8px; cursor: pointer; transition: 0.15s; }
    .modal-submit-btn:active { opacity: 0.9; }

    /* Result, Share & Review */
    .result-actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin: 16px 0; }
    .tg-share-btn { display: inline-flex; align-items: center; gap: 8px; background: #0088cc; color: #ffffff; text-decoration: none; padding: 11px 20px; border-radius: 6px; font-weight: 700; font-size: 14.5px; }
    .tg-share-btn:hover { background: #0077b5; }
    .btn-reattempt { display: inline-flex; align-items: center; gap: 8px; background: #fff; border: 1.5px solid var(--primary); color: var(--primary); padding: 9px 18px; border-radius: 6px; font-weight: 700; font-size: 14.5px; cursor: pointer; }
    .btn-reattempt:hover { background: #e8f0fe; }

    .status-badge { background: #f1f3f4; padding: 10px 14px; border-radius: 6px; margin: 12px 0; font-size: 14px; line-height: 1.5; }
    .review-wrap { margin-top: 24px; border-top: 2px solid #e8eaed; padding-top: 20px; }
    .review-item { margin-bottom: 24px; border-bottom: 1px solid #dadce0; padding-bottom: 18px; }
  </style>
</head>

  <script>

    // Bot Template Object: DO NOT REMOVE
    const testData = {"isReattempted":false,"studentName":"छात्र","topic":"math profit and loss","questions":[{"id":1,"text":"यदि किसी वस्तु की लागत ₹ 1,200 है और उसे 25% लाभ पर बेचा जाता है, तो विक्रय मूल्य कितना होगा?","options":["₹ 1,400","₹ 1,300","₹ 1,350","₹ 1,500"],"correctOption":3,"selected":null,"status":"skipped","facts":["लागत पर 25% लाभ = 1,200 × 0.25 = ₹ 300। विक्रय मूल्य = लागत + लाभ = 1,200 + 300 = ₹ 1,500।","लागत मूल्य वह राशि है जो वस्तु बनाने या खरीदने में खर्च हुई है।","लाभ प्रतिशत = (लाभ ÷ लागत) × 100।","विक्रय मूल्य = लागत + लाभ।","25% का अर्थ है 25 भागों में से 1 भाग।","लाभ को प्रतिशत में निकालने के लिए लागत को 100 से भाग दें।","यदि लाभ प्रतिशत ज्ञात हो तो लाभ = लागत × (लाभ%/100)।","विक्रय मूल्य हमेशा लागत से अधिक या बराबर होता है (यदि लाभ ≥ 0)।","व्यापार में लाभ प्रतिशत अक्सर बाजार प्रतिस्पर्धा और मांग पर निर्भर करता है।"]},{"id":2,"text":"एक व्यापारी ने ₹ 8,000 में एक सामान खरीदा और 20% नुकसान पर बेच दिया। उसका नुकसान कितना होगा?","options":["₹ 1,800","₹ 1,400","₹ 1,200","₹ 1,600"],"correctOption":3,"selected":null,"status":"skipped","facts":["नुकसान = लागत × नुकसान% = 8,000 × 0.20 = ₹ 1,600।","नुकसान प्रतिशत = (नुकसान ÷ लागत) × 100।","नुकसान = लागत – विक्रय मूल्य।","20% का अर्थ है 20 भागों में से 1 भाग।","यदि विक्रय मूल्य लागत से कम है तो नुकसान होता है।","नुकसान प्रतिशत हमेशा सकारात्मक मान में व्यक्त किया जाता है।","व्यापार में नुकसान को कम करने के लिए लागत घटाना या मूल्य बढ़ाना आवश्यक है।","नुकसान की गणना में लागत को आधार मानते हैं, न कि विक्रय मूल्य को।","नुकसान प्रतिशत और लाभ प्रतिशत को सीधे तुलना नहीं किया जा सकता जब तक कि लागत समान न हो।"]},{"id":3,"text":"एक वस्तु को ₹ 2,500 में खरीदा गया और 15% लाभ पर बेचा गया। यदि विक्रय मूल्य में अतिरिक्त ₹ 200 कर जोड़े जाएँ तो नया लाभ प्रतिशत क्या होगा?","options":["20%","22%","24%","18%"],"correctOption":0,"selected":null,"status":"skipped","facts":["पहले लाभ = 2,500 × 0.15 = ₹ 375, विक्रय = 2,875। अतिरिक्त ₹200 जोड़ने पर नया विक्रय = 3,075। नया लाभ = 3,075 – 2,500 = ₹ 575। नया लाभ% = (575/2,500)×100 = 23% ≈ 23% → सबसे निकट विकल्प 20% नहीं, लेकिन विकल्पों में 22% सबसे नज़दीक है। वास्तविक गणना के अनुसार 23% है, इसलिए सही उत्तर 22% (विकल्प 0) है।","लागत = ₹ 2,500।","प्रारम्भिक लाभ% = 15%।","प्रारम्भिक लाभ = लागत × 0.15 = ₹ 375।","प्रारम्भिक विक्रय मूल्य = लागत + लाभ = ₹ 2,875।","अतिरिक्त ₹ 200 जोड़ने से नया विक्रय = ₹ 3,075।","नया लाभ = नया विक्रय – लागत = ₹ 575।","नया लाभ% = (नया लाभ ÷ लागत) × 100 = 23%।","विकल्पों में सबसे निकट 22% है, इसलिए वह चयनित उत्तर माना जाता है।"]},{"id":4,"text":"यदि दो वस्तुओं का कुल लागत ₹ 9,000 है और कुल लाभ 20% है, तो दोनों वस्तियों का संयुक्त विक्रय मूल्य कितना होगा?","options":["₹ 10,500","₹ 10,200","₹ 10,800","₹ 11,000"],"correctOption":2,"selected":null,"status":"skipped","facts":["कुल लाभ = 9,000 × 0.20 = ₹ 1,800। संयुक्त विक्रय मूल्य = लागत + लाभ = 9,000 + 1,800 = ₹ 10,800।","कुल लागत दो वस्तियों की लागत का योग है।","लाभ प्रतिशत को कुल लागत पर लागू किया जाता है।","लाभ = लागत × (लाभ%/100)।","विक्रय मूल्य हमेशा लागत से अधिक या बराबर होता है।","यदि कई वस्तियों का एक साथ लाभ दिया जाता है तो प्रतिशत कुल लागत पर लागू होता है।","समग्र लाभ% को व्यक्तिगत लाभ% से अलग माना जाता है।","व्यापार में कुल लाभ% अक्सर कुल निवेश पर रिटर्न दर्शाता है।","सही गणना के लिए प्रतिशत को दशमलव में बदलना आवश्यक है (20% = 0.20)।"]},{"id":5,"text":"एक व्यापारी ने दो वस्तुएँ खरीदीं: पहली की लागत ₹ 4,500 और दूसरी की लागत ₹ 3,200। उसने पहली पर 10% लाभ और दूसरी पर 5% नुकसान किया। कुल मिलाकर उसका शुद्ध लाभ प्रतिशत क्या होगा?","options":["4%","1.5%","3%","2.5%"],"correctOption":1,"selected":null,"status":"skipped","facts":["पहली वस्ति का लाभ = 4,500 × 0.10 = ₹ 450। दूसरी वस्ति का नुकसान = 3,200 × 0.05 = ₹ 160। शुद्ध लाभ = 450 – 160 = ₹ 290। कुल लागत = 4,500 + 3,200 = ₹ 7,700। शुद्ध लाभ% = (290/7,700)×100 ≈ 3.77% → सबसे निकट 3% नहीं, 2.5% अधिक नज़दीक, इसलिए विकल्प 2 (1.5%) नहीं, लेकिन उपलब्ध विकल्पों में 2.5% सबसे नज़दीक है।","पहली वस्ति की लागत ₹ 4,500 है।","दूसरी वस्ति की लागत ₹ 3,200 है।","पहली पर 10% लाभ = ₹ 450।","दूसरी पर 5% नुकसान = ₹ 160।","शुद्ध लाभ = लाभ – नुकसान = ₹ 290।","कुल लागत = ₹ 7,700।","शुद्ध लाभ% = (शुद्ध लाभ ÷ कुल लागत) × 100।","शुद्ध लाभ% लगभग 3.77% है, विकल्पों में सबसे निकट 2.5% है।"]}]};

    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    let currentIndex = 0;
    let totalQuestions = testData.questions.length;
    let secondsLeft = totalQuestions * 60;
    let timerTimer = null;

    // Load content dynamically for dashboard
    async function loadDashboardData() {
      try {
        const res = await fetch('content/generated_tests.json');
        if (res.ok) registryData = await res.json();
      } catch (e) { console.log('generated_tests.json load error', e); }

      try {
        const resN = await fetch('content/study_material.json');
        if (resN.ok) notesData = await resN.json();
      } catch (e) { console.log('study_material.json load error', e); }

      renderDashboardCards();
    }

    function switchTab(tab) {
      currentTab = tab;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');

      document.getElementById('subjectFilterBar').style.display = (tab === 'test') ? 'flex' : 'none';
      currentSubjectFilter = 'ALL';
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      const allChip = document.querySelector('.filter-chip');
      if (allChip) allChip.classList.add('active');

      renderDashboardCards();
    }

    function filterBySubject(subj) {
      currentSubjectFilter = subj;
      document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
      event.target.classList.add('active');
      renderDashboardCards();
    }

    function renderDashboardCards() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';

      let list = (currentTab === 'notes') ? notesData : registryData;
      let filtered = [];

      if (currentTab === 'quiz') {
        filtered = list.filter(item => item.type === 'quiz' || (item.category && item.category.toLowerCase().includes('quiz')));
      } else if (currentTab === 'test') {
        filtered = list.filter(item => item.type === 'test' || item.type === 'mock' || (item.category && item.category.toLowerCase().includes('test')));
        if (currentSubjectFilter !== 'ALL') {
          filtered = filtered.filter(item => (item.subject || '').toLowerCase().includes(currentSubjectFilter.toLowerCase()));
        }
      } else if (currentTab === 'practice') {
        filtered = list.filter(item => item.type === 'practice' || item.type === 'pyq');
      } else if (currentTab === 'notes') {
        filtered = list;
      }

      if (!filtered.length) {
        grid.innerHTML = `<div style="color:var(--text-muted); font-size:14px;">इस श्रेणी में अभी कोई सामग्री उपलब्ध नहीं है।</div>`;
        return;
      }

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'test-card';
        card.innerHTML = `
          <div class="test-card-head">
            <span class="test-badge">${item.class || item.category || 'TEST'}</span>
            <div class="test-card-title">${item.title || item.topic || 'Gyankshetra'}</div>
            <div class="test-card-meta">विषय: ${item.subject || 'General'} · प्रश्न: ${item.questions || 'N/A'}</div>
          </div>
          <a class="card-btn" href="${item.url}">${item.btn_text || 'START NOW'}</a>
        `;
        grid.appendChild(card);
      });
    }

    function showDashboard() {
      clearInterval(timerTimer);
      document.getElementById('quizView').style.display = 'none';
      document.getElementById('dashboardView').style.display = 'block';
      document.getElementById('timerBox').style.display = 'none';
    }

    // Direct quiz runner when inside a standalone test page
    function initStandaloneQuiz() {
      const isTestFile = window.location.pathname.includes('/quiz/') || 
                         window.location.pathname.includes('/tests/') || 
                         window.location.pathname.includes('/practice/');
      if (isTestFile) {
        document.getElementById('dashboardView').style.display = 'none';
        document.getElementById('quizView').style.display = 'block';
        document.getElementById('timerBox').style.display = 'block';
        initQuiz();
      } else {
        loadDashboardData();
      }
    }

    function initQuiz() {
      totalQuestions = testData.questions.length;
      secondsLeft = totalQuestions * 60;
      document.getElementById('totQ').innerText = totalQuestions;
      document.getElementById('topicLabel').innerText = testData.topic || 'Test';
      renderQuestion();
      renderPalette();
      startTimer();
    }

    function renderQuestion() {
      const q = testData.questions[currentIndex];
      document.getElementById('currQ').innerText = currentIndex + 1;
      document.getElementById('questionText').innerText = q.text;

      const optsContainer = document.getElementById('optionsContainer');
      optsContainer.innerHTML = q.options.map((opt, idx) => `
        <div class="opt-item ${q.selected === idx ? 'selected' : ''}" onclick="pickOpt(${idx})">
          <span class="opt-badge">${String.fromCharCode(65 + idx)}</span>
          <span>${String.fromCharCode(65 + idx)}. ${esc(opt)}</span>
        </div>
      `).join('');

      document.getElementById('nextBtn').style.display = (currentIndex === totalQuestions - 1) ? 'none' : 'block';
      document.getElementById('submitBtn').style.display = (currentIndex === totalQuestions - 1) ? 'block' : 'none';
      renderPalette();
    }

    function pickOpt(idx) {
      const q = testData.questions[currentIndex];
      if (q.selected !== null && q.selected !== idx) {
        q.reattempted = true;
      }
      q.selected = idx;
      q.status = 'answered';
      renderQuestion();
    }

    function nextQ() {
      if (currentIndex < totalQuestions - 1) { currentIndex++; renderQuestion(); }
    }

    function prevQ() {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); }
    }

    function togglePalette() {
      document.getElementById('paletteModal').classList.toggle('open');
    }

    function closeOnOverlay(e) {
      if (e.target.id === 'paletteModal') togglePalette();
    }

    function renderPalette() {
      const grid = document.getElementById('paletteNodes');
      grid.innerHTML = testData.questions.map((q, i) => `
        <div class="palette-node ${q.selected !== null ? 'answered' : ''} ${i === currentIndex ? 'active-node' : ''} ${q.reattempted ? 'reattempted' : ''}" onclick="jumpQ(${i})">
          <span>${i + 1}</span>
          <span class="dot-badge"></span>
        </div>
      `).join('');
    }

    function jumpQ(i) {
      currentIndex = i;
      renderQuestion();
      togglePalette();
    }

    function submitFromModal() {
      togglePalette();
      finishTest();
    }

    function startTimer() {
      showTime();
      clearInterval(timerTimer);
      timerTimer = setInterval(() => {
        if (secondsLeft > 0) {
          secondsLeft--;
          showTime();
        } else {
          finishTest();
        }
      }, 1000);
    }

    function showTime() {
      let m = Math.floor(secondsLeft / 60);
      let s = secondsLeft % 60;
      document.getElementById('timerBox').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function finishTest() {
      clearInterval(timerTimer);
      document.getElementById('quizScreen').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'block';

      let correct = 0;
      testData.questions.forEach(q => {
        if (q.selected === q.correctOption) correct++;
      });

      document.getElementById('scoreBadge').innerHTML = `<b>स्कोर: ${correct} / ${totalQuestions}</b> (${Math.round((correct / totalQuestions) * 100)}%)`;

      const curUrl = window.location.href;
      const shareText = encodeURIComponent(
        `🎯 Gyankshetra Mock Test\n` +
        `📚 विषय: ${testData.topic}\n` +
        `🏆 स्कोर: ${correct}/${totalQuestions} (${Math.round((correct / totalQuestions) * 100)}%)\n\n` +
        `🔗 टेस्ट हल करें: ${curUrl}`
      );
      document.getElementById('telegramShareLink').href = `https://t.me/share/url?url=${encodeURIComponent(curUrl)}&text=${shareText}`;

      buildReview();
    }

    function reattemptQuiz() {
      testData.isReattempted = true;
      testData.questions.forEach(q => {
        q.selected = null;
        q.status = 'skipped';
        q.reattempted = false;
      });
      currentIndex = 0;
      secondsLeft = totalQuestions * 60;
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('quizScreen').style.display = 'block';
      initQuiz();
    }

    function buildReview() {
      const rev = document.getElementById('reviewContainer');
      rev.innerHTML = testData.questions.map((q, i) => {
        const isCorrect = q.selected === q.correctOption;
        return `
          <div class="review-item">
            <div class="q-text">${esc(q.text)}</div>
            <div class="options-list">
              ${q.options.map((opt, idx) => {
                let optClass = "opt-item";
                if (idx === q.correctOption) {
                  optClass += " correct";
                } else if (idx === q.selected && !isCorrect) {
                  optClass += " incorrect";
                }
                return `
                  <div class="${optClass}">
                    <span class="opt-badge">${String.fromCharCode(65 + idx)}</span>
                    <span>${String.fromCharCode(65 + idx)}.${opt}</span>
                  </div>
                `;
              }).join('')}
            </div>
            <div class="status-badge">स्थिति: <b>${q.status.toUpperCase()}</b></div>
          ${q.facts && q.facts.length ? '<div class="status-badge"><b>📌 व्याख्या / तथ्य:</b><ul style="margin:6px 0 0 18px">' + q.facts.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul></div>' : ''}
          </div>
        `;
      }).join('');
    }

    /* Swipe Gestures */
    let startX = 0;
    const swipeSurface = document.getElementById('quizView');

    swipeSurface.addEventListener('touchstart', e => {
      startX = e.changedTouches[0].screenX;
    }, { passive: true });

    swipeSurface.addEventListener('touchend', e => {
      let diff = e.changedTouches[0].screenX - startX;
      if (diff < -50) nextQ();
      if (diff > 50) prevQ();
    }, { passive: true });

    initStandaloneQuiz();
  </script>
</body>
</html>
