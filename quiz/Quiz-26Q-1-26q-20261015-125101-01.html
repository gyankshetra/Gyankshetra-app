और ऊर्जा स्तर को निर्धारित करती है; यह ही सही कथन है।","क्वांटम संख्याएँ n, l, mₗ, mₛ होती हैं।","n = 1,2,3,…; यह ऊर्जा स्तर को दर्शाता है।","l = 0…(n‑1); यह उप‑कक्षा (s, p, d, f) को दर्शाता है।","mₗ = –l … +l; यह कक्षा के अभिविन्यास को दर्शाता है।","mₛ = +½ या –½; यह इलेक्ट्रॉन के स्पिन को दर्शाता है।","ऊर्जा का क्रम n के बढ़ने से बढ़ता है।","समान n के भीतर l के मान के अनुसार ऊर्जा में छोटे अंतर होते हैं।","क्वांटम संख्याएँ परमाणु के इलेक्ट्रॉन विन्यास को पूरी तरह वर्णित करती हैं।"]],["विद्युत क्षेत्र में प्रवाहित होने पर निम्नलिखित में से कौन‑सा कण नहीं चलता है?",["प्रोटॉन","कैथोडिकरण","इलेक्ट्रॉन","न्यूट्रॉन"],3,["न्यूट्रॉन का कोई विद्युत आवेश नहीं होता, इसलिए वह विद्युत क्षेत्र में नहीं चलता।","प्रोटॉन का आवेश +1e है, वह विद्युत क्षेत्र में धनात्मक दिशा में चलता है।","इलेक्ट्रॉन का आवेश –1e है, वह विपरीत दिशा में चलता है।","कैथोडिकरण (cathodic ray) मुख्यतः इलेक्ट्रॉनों से बना होता है।","न्यूट्रॉन का आवेश शून्य होता है, इसलिए वह विद्युत बल से प्रभावित नहीं होता।","न्यूट्रॉन केवल न्यूट्रल कणों के साथ टकराव में भाग लेता है।","विद्युत क्षेत्र में कणों की गति उनके आवेश और द्रव्यमान पर निर्भर करती है।","इलेक्ट्रॉन का द्रव्यमान प्रोटॉन से लगभग 1/1836 है, इसलिए वह तेज़ी से गति करता है।","न्यूट्रॉन का उपयोग न्यूक्लियर रिएक्टर में ध्रुवीकरण के बिना किया जाता है।"]],["निम्नलिखित को आवृत्ति (ν) के क्रम में व्यवस्थित करें: (i) एक्स‑किरण, (ii) अल्ट्रावायलेट, (iii) दीर्घ रेडियो तरंग, (iv) सूक्ष्म तरंग।",["ν = 100 – 10⁴ Hz","ν = 10¹⁰ Hz","ν = 10¹⁶ Hz","ν = 10¹⁸ Hz"],3,["दीर्घ रेडियो तरंग (10² Hz) < अल्ट्रावायलेट (10¹⁶ Hz) < सूक्ष्म तरंग (10¹⁸ Hz) < एक्स‑किरण (10¹⁹ Hz‑10²⁰ Hz), इसलिए विकल्प क्रम 1‑3‑4‑2 है; सही उत्तर विकल्प 4 है।","विद्युतचुंबकीय स्पेक्ट्रम में आवृत्ति बढ़ने पर तरंगदैर्ध्य घटता है।","रेडियो तरंगों की आवृत्ति 10⁰‑10⁹ Hz के बीच होती है।","अल्ट्रावायलेट की आवृत्ति लगभग 10¹⁵‑10¹⁶ Hz होती है।","सूक्ष्म तरंग (X‑ray) की आवृत्ति 10¹⁸‑10²⁰ Hz के बीच होती है।","एक्स‑किरण की आवृत्ति सूक्ष्म तरंग से अधिक होती है, लेकिन अक्सर इन्हें अलग वर्गीकृत किया जाता है।","ऊर्जा E = hν, इसलिए उच्च आवृत्ति का अर्थ उच्च ऊर्जा।","इलेक्ट्रॉनिक माइक्रोवेव संचार में 10⁹‑10¹⁰ Hz की आवृत्ति उपयोग होती है।","स्पेक्ट्रोस्कोपी में विभिन्न आवृत्तियों का उपयोग पदार्थ की संरचना पहचानने के लिये किया जाता है।"]],["कॉलम‑I की स्पीशीज़ को कॉलम‑II के इलेक्ट्रॉनिक विन्यास से मिलाएँ: (i) Cr, (ii) Fe²⁺, (iii) Ni²⁺, (iv) Cu।",["[Ar] 3d⁸ 4s⁰","[Ar] 3d¹⁰ 4s¹","[Ar] 3d⁶ 4s⁰","[Ar] 3d⁵ 4s¹"],3,["Cr का वास्तविक विन्यास [Ar] 3d⁵ 4s¹, Fe²⁺ का [Ar] 3d⁶ 4s⁰, Ni²⁺ का [Ar] 3d⁸ 4s⁰, Cu का [Ar] 3d¹⁰ 4s¹; इसलिए क्रम क्रमशः विकल्प 4‑3‑1‑2 है, सही उत्तर विकल्प 4 है।","क्रोमियम (Cr) का ग्राउंड‑स्टेट विन्यास [Ar] 3d⁵ 4s¹ है।","आयरन (Fe) का सामान्य विन्यास [Ar] 3d⁶ 4s²; Fe²⁺ में दो 4s इलेक्ट्रॉन हटते हैं।","निकेल (Ni) का विन्यास [Ar] 3d⁸ 4s²; Ni²⁺ में दोनों 4s इलेक्ट्रॉन हटते हैं, जिससे [Ar] 3d⁸ 4s⁰ बनता है।","कॉपर (Cu) का अनोखा विन्यास [Ar] 3d¹⁰ 4s¹ है।","ट्रांज़िशन धातुओं में d‑सबशेल का अंशीय भराव अक्सर अपेक्षित क्रम से अलग होता है।","आयन बनते समय सबसे पहले 4s इलेक्ट्रॉन हटते हैं, फिर d‑इलेक्ट्रॉन।","इलेक्ट्रॉन विन्यास रासायनिक गुणों, जैसे ऑक्सीकरण अवस्था, को निर्धारित करता है।","ट्रांज़िशन धातुओं में कई स्थिर ऑक्सीकरण अवस्थाएँ देखी जाती हैं।"]],["किसी परमाणु का प्रोटॉन (अतः इलेक्ट्रॉन) की संख्या समान होती है और रासायनिक गुण इलेक्ट्रॉन की संख्या/विन्यास पर निर्भर करते हैं, इसलिए उनका रासायनिक व्यवहार समान होता है।",["A और R दोनों सत्य हैं एवं R, A की सही व्याख्या है।","A और R दोनों सत्य हैं परन्तु R, A की सही व्याख्या नहीं है।","A सत्य है परन्तु R गलत है।","A और R दोनों गलत हैं।"],0,["वक्तव्य A (परमाणु में प्रोटॉन = इलेक्ट्रॉन) सत्य है; लेकिन यह केवल तटस्थ परमाणु के लिए है, जबकि रासायनिक व्यवहार इलेक्ट्रॉन विन्यास पर निर्भर करता है, इसलिए R (रासायनिक व्यवहार समान) आवश्यक नहीं है; अतः सही विकल्प \"A सत्य है परन्तु R गलत है\" है।","परमाणु में प्रोटॉन संख्या = इलेक्ट्रॉन संख्या (तटस्थ अवस्था)।","आयन में यह समानता नहीं रहती; इलेक्ट्रॉन संख्या बदलती है।","रासायनिक गुण मुख्यतः वैलेन्स इलेक्ट्रॉनों के विन्यास पर निर्भर करते हैं।","सम‑इलेक्ट्रॉनिक आयन समान रासायनिक व्यवहार दिखा सकते हैं, पर सभी नहीं।","आवर्त सारणी में समान समूह के तत्वों के वैलेन्स इलेक्ट्रॉन समान होते हैं।","इलेक्ट्रॉन विन्यास में छोटे परिवर्तन भी बड़े रासायनिक अंतर पैदा कर सकते हैं।","आयनिक त्रिज्या और इलेक्ट्रॉन आकर्षण शक्ति रासायनिक प्रतिक्रियाओं को प्रभावित करती है।","परमाणु का आकार प्रोटॉन संख्या बढ़ने पर घटता है (संकुचन प्रभाव)।"]],["कृष्णा (ब्लैकबॉडी) एक आदर्श पिंड है जो सभी आवृत्तियों को पूर्णतः अवशोषित एवं उत्सर्जित करती है। ताप में वृद्धि होने पर पिंड द्वारा उत्सर्जित आवृत्तियों का क्रम निम्न आवृत्ति से उच्च आवृत्ति की ओर जाता है।",["A और R दोनों सत्य हैं एवं R, A की सही व्याख्या है।","A और R दोनों सत्य हैं परन्तु R, A की सही व्याख्या नहीं है।","A सत्य है परन्तु R गलत है।","A और R दोनों गलत हैं।"],1,["ब्लैकबॉडी का स्पेक्ट्रम ताप बढ़ने पर शिफ्ट होता है, इसलिए A सत्य है; परन्तु यह नहीं कहा गया कि R, A की सही व्याख्या है, इसलिए विकल्प 2 सही है।","ब्लैकबॉडी वह वस्तु है जो सभी आवृत्तियों की विद्युतचुंबकीय तरंगों को पूर्णतः अवशोषित करती है।","ब्लैकबॉडी द्वारा उत्सर्जित विकिरण का स्पेक्ट्रम प्लैंक के नियम से निर्धारित होता है।","तापमान बढ़ने पर ब्लैकबॉडी का अधिकतम तीव्रता वाले तरंगदैर्ध्य में शिफ्ट होता है (वीन का नियम)।","वीन के नियम के अनुसार, λ_max × T = 2.898 × 10⁻³ m·K।","उच्च तापमान पर ब्लैकबॉडी अधिक उच्च आवृत्ति (कम तरंगदैर्ध्य) की विकिरण उत्सर्जित करता है।","ब्लैकबॉडी का कुल उत्सर्जित शक्ति σT⁴ (स्टीफ़न‑बोल्ट्ज़मान नियम) से दी जाती है।","सूर्य को लगभग एक आदर्श ब्लैकबॉडी माना जाता है, जिसकी सतह तापमान लगभग 5,800 K है।","ब्लैकबॉडी सिद्धांत का उपयोग इन्फ्रारेड थर्मोग्राफी और एस्ट्रोफिज़िक्स में किया जाता है।"]],["किसी इलेक्ट्रॉन की सही स्थिति एवं सही संवेग का एक साथ निर्धारण असंभव है। परमाणु में इलेक्ट्रॉन का पथ स्पष्टतः परिभाषित होता है।",["A और R दोनों सत्य हैं एवं R, A की सही व्याख्या है।","A और R दोनों सत्य हैं परन्तु R, A की सही व्याख्या नहीं है।","A सत्य है परन्तु R गलत है।","A और R दोनों गलत हैं।"],2,["हाइजेनबर्ग का अनिश्चितता सिद्धांत कहता है कि इलेक्ट्रॉन की स्थिति और संवेग को एक साथ सटीक रूप से नहीं मापा जा सकता, इसलिए A सत्य है; परन्तु क्वांटम यांत्रिकी में इलेक्ट्रॉन के निश्चित पथ की कोई अवधारणा नहीं है, इसलिए R गलत है। सही विकल्प तीसरा है।","हाइजेनबर्ग का अनिश्चितता सिद्धांत: Δx·Δp ≥ ħ/2।","इलेक्ट्रॉन का कोई निश्चित क्लासिकल पथ नहीं होता, बल्कि संभाव्यता तरंग फलन द्वारा वर्णित होता है।","क्वांटम यांत्रिकी में इलेक्ट्रॉन को ऑर्बिटल्स (ऊर्जा स्तर) के रूप में समझा जाता है, न कि निश्चित कक्षा में।","ऑर्बिटल का आकार और आकार ऊर्जा क्वांटम संख्या n पर निर्भर करता है।","सभी इलेक्ट्रॉनिक अवस्था में स्पिन क्वांटम संख्या s = ½ होती है।","पॉली‑इलेक्ट्रॉन प्रभावों के कारण कई‑इलेक्ट्रॉन परमाणुओं में इलेक्ट्रॉन‑इलेक्ट्रॉन प्रतिकर्षण महत्वपूर्ण होता है।","श्रोडिंगर समीकरण इलेक्ट्रॉन की तरंग फ़ंक्शन को निर्धारित करता है।","क्वांटम टनलिंग प्रभाव के कारण इलेक्ट्रॉन संभावित बाधा को पार कर सकता है, जो क्लासिकल पथ की अवधारणा को नकारता है।"]]];
const TR={"en":[["Which of the following conclusions cannot be drawn from Rutherford's α‑particle scattering experiment?",["Most of the atom’s volume is empty space.","The atomic radius is about 10⁻¹⁰ m while the nucleus radius is 10⁻¹⁵ m.","Electrons move in circular orbits of fixed energy.","Electrons and the nucleus are held together by a constant electrostatic force."],["Rutherford's experiment demonstrated only the existence and size of the nucleus; it did not show electrons moving in circular orbits or being bound by a constant electrostatic force.","The Rutherford experiment was performed in 1909.","α‑particles were directed onto a thin gold foil.","Most α‑particles pass through without deflection.","Some α‑particles are scattered at large angles.","The scattering indicated the nucleus is very small.","The nucleus contains most of the mass and positive charge.","The majority of an atom consists of empty space.","Rutherford's experiment challenged the Planck‑Bohr model."]],["Which of the following does NOT represent a valid electronic configuration?",["1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁸ 4s²","1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁹ 4s²","1s² 2s² 2p⁶ 3s² 3p⁶ 3d¹⁰ 4s¹","1s² 2s² 2p⁶ 3s² 3p⁶ 3d⁵ 4s¹"],["Before filling the 3d orbital, the 4s orbital must be completely filled; therefore the first configuration (3d⁸ 4s²) is invalid.","The order of orbital filling (Aufbau principle) is 1s → 2s → 2p → 3s → 3p → 4s → 3d.","The 4s orbital lies lower in energy than the 3d orbital.","In the ground state, orbitals of lowest energy are filled first.","Each orbital can hold a maximum of two electrons (one spin‑up and one spin‑down).","The configuration 3d⁸ 4s² does not correspond to chromium (Cr); chromium’s configuration is 3d⁵ 4s¹.","The total number of electrons in a configuration equals the atomic number of the element.","Filling a higher‑energy orbital before a lower‑energy one is unfavorable.","Electronic configuration determines chemical properties."]],["Based on the probability density diagram for the 1s and 2s shells, which of the following statements is incorrect?",["The 1s and 2s shells have spherical shapes.","The probability of finding an electron is maximum near the nucleus.","At a given radius the probability of finding the electron is the same in all directions.","For the 2s shell the probability density decreases uniformly as the distance from the nucleus increases."],["The 2s orbital contains a radial node, so its probability density does not decrease uniformly with distance; after a maximum it falls off.","Probability density = |wavefunction|² × r² sinθ.","s‑orbitals are spherically symmetric.","The 1s orbital has its highest density near the nucleus.","The 2s orbital has a radial node where the density is zero.","Because of the node, the 2s electron can be found in two separate radial regions.","The probability‑density graph for 2s shows two peaks.","s‑orbitals have no angular dependence, giving equal probability in all directions.","Probability density is used to understand the likely positions of electrons."]],["Which of the following statements is NOT a characteristic of a cathode‑ray tube?",["They originate at the cathode and travel toward the anode.","In the absence of external electric or magnetic fields they travel in straight lines.","The characteristics of a cathode‑ray tube do not depend on the material of its electrodes.","The characteristics of a cathode‑ray tube depend on the nature of the gas present inside the tube."],["The properties of a cathode‑ray tube are independent of electrode material; they depend only on electron behavior.","High voltage causes electrons to be emitted in the tube.","Electrons are emitted from the cathode and move toward the anode.","Without external fields, electrons travel in straight lines.","Electric or magnetic fields can curve the electron path.","The tube is evacuated to a very low pressure (vacuum).","The type of gas (e.g., hydrogen) does not affect the tube’s operation.","Cathode‑ray tubes are used in CRT displays and X‑ray sources.","Electron kinetic energy is determined by the applied voltage."]],["Which of the following statements about the electron is incorrect?",["It is a negatively charged particle.","Its mass is equal to the mass of a neutron.","It is a fundamental constituent of all atoms.","It is a constituent of cathodic emission."],["The electron’s mass is only about 1/1836 of a neutron’s mass, so the second statement is false.","The electron carries a charge of –1.602 × 10⁻¹⁹ C.","The electron’s mass is 9.109 × 10⁻³¹ kg.","The neutron’s mass is approximately 1.675 × 10⁻²⁷ kg.","Electrons reside in the outer shells of atoms.","Electron motion is described by quantum mechanics.","The electron has spin ½.","The electron’s antiparticle is called the positron.","Electrons participate in various chemical bonds."]],null,null,null,null,null,["What is the total number of orbitals associated with the third energy level (n = 3)?",["2","4","9","3"],["For n = 3, ℓ = 0,1,2 corresponding to s, p, d subshells; they contain 1, 3, 5 orbitals respectively, total 1+3+5 = 9.","The principal quantum number n indicates the energy level.","The orbital quantum number ℓ can take values from 0 to n‑1.","ℓ = 0 → s‑orbital, ℓ = 1 → p‑orbital, ℓ = 2 → d‑orbital.","For each ℓ there are 2ℓ+1 allowed magnetic quantum numbers mℓ.","In n = 3, s (1), p (3), d (5) give a total of 9 orbitals.","Each orbital can accommodate two electrons.","Total capacity is 9 × 2 = 18 electrons.","The third energy level includes the 3s, 3p and 3d shells."]],["On what does the orbital angular momentum depend?",["l","n and l","n and m","m and s"],["The orbital angular momentum depends only on the orbital quantum number ℓ; its magnitude is √ℓ(ℓ+1) ħ.","The angular momentum quantum number is ℓ.","ℓ can take values 0,1,2,…, n‑1.","The magnitude of angular momentum is given by √ℓ(ℓ+1) ħ.","The spin quantum number s is defined separately.","The magnetic quantum number mℓ ranges from –ℓ to +ℓ.","The principal quantum number n determines the energy level.","ℓ and mℓ together define the directional characteristics of the orbital.","Conservation of angular momentum is fundamental in quantum mechanics."]],["What is the approximate natural abundance ratio of the two chlorine isotopes ^37Cl and ^35Cl?",["1:2","1:1","1:3","3:1"],["The correct answer is option 4 – natural chlorine consists of ^35Cl and ^37Cl in an approximate ratio of 3:1.","Chlorine is composed of two stable isotopes: ^35Cl and ^37Cl.","^35Cl has an atomic mass of about 34.97 u, ^37Cl about 36.97 u.","In natural chlorine, ^35Cl accounts for roughly 75 % and ^37Cl about 25 %.","Thus the ratio is about 3:1, i.e., 75 % : 25 %.","The average atomic mass of chlorine is 35.45 u, which results from this isotopic ratio.","Isotopic ratios can vary slightly with geographic location.","Chlorine isotopes are used as isotopic tracers.","The isotopic ratio of chlorine is not useful for radiometric dating because both isotopes are stable."]],["Which pair of ions share the same electronic configuration?",["Cr³⁺, Fe³⁺","Fe³⁺, Mn²⁺","Fe³⁺, Co³⁺","Sc³⁺, Cr³⁺"],["The correct answer is option 2 – Fe³⁺ (d⁵) and Mn²⁺ (d⁵) have the same configuration; the first option is listed as correct in the source but the actual matching pair is the second.","An ion’s electron configuration is derived from the neutral atom’s configuration by loss or gain of electrons.","Cr³⁺ has the configuration [Ar] 3d³.","Fe³⁺ has the configuration [Ar] 3d⁵.","Mn²⁺ has the configuration [Ar] 3d⁵, therefore Fe³⁺ and Mn²⁺ have the same d‑electron count.","Co³⁺ has the configuration [Ar] 3d⁶.","Sc³⁺ has the configuration [Ar] 3d⁰.","Ions with identical electron configurations often exhibit similar chemical behavior.","Differences in ionic charge affect ionic radii."]],null,["Which of the following particles will have the smallest wavelength when they travel at the same speed?",["Electron","α‑particle (He²⁺)","Neutron","Proton"],["The correct answer is option 2 (index 1) – at equal speed the particle with the larger mass (α‑particle) has the smallest wavelength.","de Broglie wavelength λ = h/(mv).","At a given speed v, λ is inversely proportional to the mass m.","An α‑particle (helium nucleus) has a mass of about 4 u, which is much larger than that of an electron (≈0.0005 u).","A neutron has a mass of about 1 u, and a proton also about 1 u.","Because the electron’s mass is very small, its wavelength is the largest.","At equal speed the α‑particle’s wavelength is the smallest.","In de Broglie wavelength experiments electron diffraction is most prominent.","As mass increases the wavelength decreases, making quantum effects less noticeable."]],["Select the pair of electrons that belong to the same subshell (same orbital class).",["n = 3, l = 2, ml = –2, ms = –½ | n = 3, l = 2, ml = +2, ms = +½","n = 3, l = 1, ml = 1, ms = +½ | n = 3, l = 2, ml = 1, ms = +½","n = 4, l = 1, ml = 1, ms = +½ | n = 3, l = 2, ml = 1, ms = +½","n = 3, l = 2, ml = +2, ms = –½ | n = 3, l = 2, ml = +2, ms = +½"],["The correct answer is option 1 (index 0) – both electrons are in n=3, l=2 (d‑subshell), therefore they are in the same subshell.","The principal quantum number n indicates the energy level.","The azimuthal quantum number l determines the subshell (s, p, d, f); l=2 corresponds to a d‑subshell.","The magnetic quantum number ml can take values from –l to +l; for a d‑subshell the possible values are –2, –1, 0, +1, +2.","The spin quantum number ms can be +½ or –½.","Two electrons can occupy the same subshell if their spins are opposite (Pauli exclusion principle).","In the first option both electrons have n=3, l=2, different ml and opposite ms.","In the second option the l values differ (1 and 2), so they are in different subshells.","In the third option the n values differ (4 and 3), so they are in different energy levels."]],["Which set of quantum numbers (n, l, ml) is valid?",["1, 1, +2","2, 1, +1","3, 2, –2","3, 4, –2"],["The correct answer is option 2 (index 1) – n=2, l=1, ml=+1 satisfy all rules.","The principal quantum number n must be a positive integer (1,2,3,…).","The azimuthal quantum number l can range from 0 to n‑1.","The magnetic quantum number ml can be any integer between –l and +l.","In the first option l=1 for n=1 is impossible (l ≤ n‑1).","In the second option n=2, l=1, ml=+1 is valid.","The third option n=3, l=2, ml=–2 is also valid, but the question requires a single correct answer, so option 2 was chosen.","In the fourth option l=4 while n=3, which violates the rules.","These rules are known as the orbital quantum number rules."]],["Which of the following pairs are isoelectronic?",["Na⁺, Mg²⁺","Al³⁺, O²⁻","Na⁺, O²⁻","N³⁻, Cl⁻"],["Na⁺ (10 e⁻) and Mg²⁺ (10 e⁻) both have the electron configuration of neon, so they are isoelectronic.","Isoelectronic pairs have the same number of electrons.","Having the same electron configuration can lead to similar ionic sizes and chemical behavior.","Na⁺ has the configuration 1s² 2s² 2p⁶.","Mg²⁺ also has the configuration 1s² 2s² 2p⁶.","Al³⁺ has the configuration 1s² 2s² 2p⁶ (Ne) and O²⁻ likewise.","N³⁻ (10 e⁻) and Cl⁻ (18 e⁻) are not isoelectronic.","Isoelectronic ions often exhibit comparable ionic radii.","The concept of isoelectronicity helps explain trends within groups of the periodic table."]],["Which of the following statements about quantum numbers are true?",["Azimuthal quantum number (l) determines the three‑dimensional shape of the subshell.","Principal quantum number (n) determines the size and energy of the subshell.","Magnetic quantum number (mₗ) determines the orientation of the subshell.","Spin quantum number (mₛ) determines the spin orientation of the electron."],["The principal quantum number n determines the size and energy level of the subshell; this is the correct statement.","Quantum numbers are n, l, mₗ, mₛ.","n = 1,2,3,…; it denotes the energy level.","l = 0…(n‑1); it denotes the subshell type (s, p, d, f).","mₗ = –l … +l; it denotes the orientation of the subshell.","mₛ = +½ or –½; it denotes the electron’s spin.","Energy increases with increasing n.","Within the same n, different l values cause small energy differences.","Quantum numbers fully describe the electron configuration of an atom."]],["Which particle does not move when an electric field is applied?",["Proton","Cathodic ray","Electron","Neutron"],["Neutrons have no electric charge, so they do not move in an electric field.","Protons have a charge of +1 e and move in the direction of the electric field.","Electrons have a charge of –1 e and move opposite to the field direction.","A cathodic ray consists primarily of electrons.","Neutrons have zero charge and are therefore not affected by electric forces.","Neutrons interact only in collisions with neutral particles.","The motion of particles in an electric field depends on their charge and mass.","An electron’s mass is about 1/1836 that of a proton, so it accelerates more rapidly.","Neutrons are used in nuclear reactors without causing polarization."]],["Arrange the following in order of increasing frequency (ν): (i) X‑rays, (ii) Ultraviolet, (iii) Long radio waves, (iv) Microwaves.",["ν = 100 – 10⁴ Hz","ν = 10¹⁰ Hz","ν = 10¹⁶ Hz","ν = 10¹⁸ Hz"],["Long radio waves (~10² Hz) < Ultraviolet (~10¹⁶ Hz) < Microwaves (~10¹⁰ Hz) < X‑rays (~10¹⁹‑10²⁰ Hz), so the correct sequence is option 4.","In the electromagnetic spectrum, frequency increases as wavelength decreases.","Radio frequencies lie between 10⁰ and 10⁹ Hz.","Ultraviolet radiation has frequencies around 10¹⁵‑10¹⁶ Hz.","Microwave frequencies are roughly 10⁹‑10¹⁰ Hz, while X‑rays are 10¹⁸‑10²⁰ Hz.","X‑rays have higher frequency than microwaves, though they are often classified separately.","Energy E = hν, so higher frequency means higher photon energy.","Electronic microwave communication uses frequencies of 10⁹‑10¹⁰ Hz.","Spectroscopy employs various frequencies to identify material structures."]],["Match the species in Column‑I with the electronic configurations in Column‑II: (i) Cr, (ii) Fe²⁺, (iii) Ni²⁺, (iv) Cu.",["[Ar] 3d⁸ 4s⁰","[Ar] 3d¹⁰ 4s¹","[Ar] 3d⁶ 4s⁰","[Ar] 3d⁵ 4s¹"],["Cr has the actual configuration [Ar] 3d⁵ 4s¹, Fe²⁺ is [Ar] 3d⁶ 4s⁰, Ni²⁺ is [Ar] 3d⁸ 4s⁰, Cu is [Ar] 3d¹⁰ 4s¹; therefore the order corresponds to options 4‑3‑1‑2, making option 4 correct.","Chromium’s ground‑state configuration is [Ar] 3d⁵ 4s¹.","Iron’s normal configuration is [Ar] 3d⁶ 4s²; removal of two 4s electrons yields Fe²⁺.","Nickel’s configuration is [Ar] 3d⁸ 4s²; removal of both 4s electrons gives Ni²⁺ as [Ar] 3d⁸ 4s⁰.","Copper’s unusual configuration is [Ar] 3d¹⁰ 4s¹.","Transition metals often have d‑subshell fillings that deviate from the expected order.","When ions form, 4s electrons are removed before 3d electrons.","Electronic configuration determines chemical properties such as oxidation states.","Transition metals exhibit multiple stable oxidation states."]],["The number of protons (and thus electrons) in an atom are equal, and chemical properties depend on the number/configuration of electrons, so their chemical behavior is the same.",["Both A and R are true and R correctly explains A.","Both A and R are true but R does not correctly explain A.","A is true but R is false.","Both A and R are false."],["Statement A (proton count equals electron count) is true for neutral atoms, but chemical behavior depends on electron configuration, so R (identical chemical behavior) is not necessarily true; therefore the correct choice is \"A is true but R is false.\"","In a neutral atom, the number of protons equals the number of electrons.","Ions do not maintain this equality; electron count changes.","Chemical properties are primarily determined by valence‑electron configuration.","Isoelectronic ions can exhibit similar chemistry, but not universally.","Elements in the same group have similar valence‑electron configurations.","Even small changes in electron configuration can lead to large chemical differences.","Ionic radius and effective nuclear charge influence reaction pathways.","Atomic size decreases with increasing proton number (contraction effect)."]],["A black body is an ideal object that absorbs and emits all frequencies completely. As temperature rises, the emitted frequencies shift from lower to higher frequencies.",["Both A and R are true and R correctly explains A.","Both A and R are true but R does not correctly explain A.","A is true but R is false.","Both A and R are false."],["The black‑body spectrum shifts with temperature, so A is true; however, it is not stated that R correctly explains A, making option 2 the correct answer.","A black body absorbs electromagnetic radiation of all frequencies completely.","The radiation emitted by a black body follows Planck’s law.","With increasing temperature, the wavelength of maximum intensity shifts according to Wien’s law.","Wien’s law: λ_max × T = 2.898 × 10⁻³ m·K.","At higher temperatures a black body emits radiation of higher frequency (shorter wavelength).","Total emitted power follows the Stefan‑Boltzmann law, P = σT⁴.","The Sun is approximated as an ideal black body with a surface temperature of about 5,800 K.","Black‑body theory underlies infrared thermography and astrophysical observations."]],["It is impossible to simultaneously determine the exact position and exact momentum of an electron. In an atom, the electron's trajectory is not definitively defined.",["Both A and R are true and R correctly explains A.","Both A and R are true but R does not correctly explain A.","A is true but R is false.","Both A and R are false."],["Heisenberg's uncertainty principle states that the position and momentum of an electron cannot be measured simultaneously with exact precision, so statement A is true; however, quantum mechanics contains no concept of a definite electron path, so statement R is false. The correct choice is the third option.","Heisenberg's uncertainty principle: Δx·Δp ≥ ħ/2.","An electron does not have a definite classical trajectory; it is described by a probability wavefunction.","In quantum mechanics the electron is understood as occupying orbitals (energy levels), not a fixed orbit.","The size and shape of an orbital depend on the energy quantum number n.","In all electronic states the spin quantum number s = ½.","Because of poly‑electron effects, electron‑electron repulsion is significant in multi‑electron atoms.","The Schrödinger equation determines the electron's wavefunction.","Due to quantum tunneling, an electron can pass through a potential barrier, which contradicts the notion of a classical path."]]]};

function uName(){const u=getUser();if(!u.logged)return '';let n=((users()[u.id])||u.name||'').trim();if(!n||/^@\d+-/.test(n))n=(u.id.split('-').slice(1).join('-')||n);return n}

function openAuth(mode){authMode=mode||(Object.keys(users()).length?'login':'register');renderAuth();$('loginModal').classList.add('open');setTimeout(()=>$('nameInput').focus(),100)}
function renderAuth(){const r=authMode==='register',has=Object.keys(users()).length>0;$('authTitle').textContent=r?L('authNewT'):L('authLoginT');$('authHelp').textContent=r?L('authHelpReg'):L('authHelpLogin');$('authLabel').textContent=r?L('lblName'):L('lblId');$('nameInput').value='';$('nameInput').placeholder=r?L('phName'):L('phId');$('authBtn').textContent=r?L('btnStart'):L('btnLogin');$('authBtn').onclick=r?saveUser:loginById;$('authSwitch').textContent=r?L('swToLogin'):L('swToReg');$('authSwitch').style.display=(r&&!has)?'none':'block'}

function loginById(){const e=$('nameInput').value.trim().toUpperCase(),m=users(),id=Object.keys(m).find(k=>k.toUpperCase()===e);if(!id){alert(L('wrongId'));return}localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraUserName',m[id]);localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}

function makeId(name,n){const w=name.trim().split(/\s+/)[0].replace(/[^\p{L}\p{N}]+/gu,'').toUpperCase();return '@'+String(n).padStart(2,'0')+'-'+w}
function saveUser(){const n=$('nameInput').value.trim();if(!n){alert(L('needName'));return}const num=Number(localStorage.getItem('gyankshetraNextNumber')||1),id=makeId(n,num),m=users();m[id]=n;localStorage.setItem('gyankshetraUsers',JSON.stringify(m));localStorage.setItem('gyankshetraUserName',n);localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraNextNumber',String(num+1));localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function updateProfile(){const u=getUser();$('profileName').textContent=u.logged?uName():'Gyankshetra '+L('student');$('profileId').textContent=u.logged?'🆔 '+u.id:L('loginPrompt');$('welcome').textContent=L('hello')+' '+(u.logged?uName():L('student'))+' 👋';$('profileLoginBtn').style.display=u.logged?'none':'block';$('profileLogoutBtn').style.display=u.logged?'block':'none';const h=getHist();$('historyText').textContent=h.length?`${h.length} ${L('histN')} • ${L('histLast')}: ${h[h.length-1].marks}/${hTot(h[h.length-1])} ▸`:L('histNone');{const b=h.reduce((m,x)=>{const t=hTot(x);return (Number(x.marks)||0)/t>(m?m.marks/m.t:-1)?{marks:Number(x.marks)||0,t}:m},null);$('bestScore').textContent=b?b.marks+' / '+b.t:'—'}updateResume()}
function startQuiz(){qi=0;ans=Array(TOTAL).fill(null);time=0;reviewIndex=0;running=true;clearInterval(timerHandle);go('quiz');render();saveProgress();timerHandle=setInterval(tick,1000)}
function pKey(){return 'gyankshetraProgress_'+TEST_ID+'_'+(localStorage.getItem('gyankshetraUserId')||'')}
function saveProgress(){if(running)localStorage.setItem(pKey(),JSON.stringify({qi,ans,time}))}
function getProgress(){try{const p=JSON.parse(localStorage.getItem(pKey())||'null');return p&&Array.isArray(p.ans)&&p.time>0?p:null}catch(e){return null}}
function pauseQuiz(){if(!running)return;saveProgress();running=false;clearInterval(timerHandle);timerHandle=null}
function tick(){if(time<TIME){time++;renderTimer();if(time>=TIME)finish();else if(time%5===0)saveProgress()}else finish()}
function resumeQuiz(){const p=getProgress();if(!p){startQuiz();return}qi=p.qi;ans=p.ans;time=p.time;running=true;clearInterval(timerHandle);go('quiz');render();timerHandle=setInterval(tick,1000)}
function updateResume(){const p=getUser().logged?getProgress():null;document.querySelectorAll('.resumebtn').forEach(b=>{b.style.display=p?'block':'none';if(p)b.textContent='▶ '+L('resume')+' • '+L('q')+' '+(p.qi+1)+'/'+TOTAL+' • '+fmt(TIME-p.time)})}
function fmt(t){t=Math.max(0,Number(t)||0);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function renderTimer(){$('timer').textContent=fmt(TIME-time);$('timer').parentElement.classList.toggle('low',TIME-time<=60)}
function render(){renderTimer();const q=Q(qi);$('qn').textContent=(qi+1)+'/'+TOTAL;$('question').textContent=q[0];$('options').innerHTML=q[1].map((o,i)=>`<div class="option ${ans[qi]===i?'sel':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join('');$('nextBtn').textContent=qi===TOTAL-1?L('submit'):L('next');$('starBtn').textContent=saved.includes(qi)?'★':'☆';$('starBtn').classList.toggle('on',saved.includes(qi));renderTimer()}

function choose(i){ans[qi]=(ans[qi]===i)?null:i;saveProgress();render()}

function prev(){if(qi>0){qi--;saveProgress();render()}}

const BUILTIN_NOTES=[{id:'oxidation',title:'Chemistry — ऑक्सीकरण (Notes)',html:"<h2>ऑक्सीकरण (Oxidation)<\/h2>\n<h3>1. परिभाषा<\/h3>\n<p>किसी पदार्थ में <b>ऑक्सीजन का जुड़ना<\/b> या <b>हाइड्रोजन का हटना<\/b> ऑक्सीकरण कहलाता है। इलेक्ट्रॉन के आधार पर: जब कोई परमाणु या आयन <b>इलेक्ट्रॉन त्यागता<\/b> है और उसका ऑक्सीकरण अंक बढ़ता है, तो वह ऑक्सीकृत होता है।<\/p>\n<h3>2. ऑक्सीकरण और अपचयन की तुलना<\/h3>\n<table><tr><th>आधार<\/th><th>ऑक्सीकरण<\/th><th>अपचयन<\/th><\/tr>\n<tr><td>ऑक्सीजन<\/td><td>जुड़ना<\/td><td>हटना<\/td><\/tr>\n<tr><td>हाइड्रोजन<\/td><td>हटना<\/td><td>जुड़ना<\/td><\/tr>\n<tr><td>इलेक्ट्रॉन<\/td><td>त्यागना (हानि)<\/td><td>ग्रहण करना (लाभ)<\/td><\/tr>\n<tr><td>ऑक्सीकरण अंक<\/td><td>बढ़ना<\/td><td>घटना<\/td><\/tr><\/table>\n<h3>3. याद रखने की ट्रिक<\/h3>\n<p><b>OIL RIG<\/b> — Oxidation Is Loss, Reduction Is Gain (इलेक्ट्रॉन की)।<\/p>\n<h3>4. रेडॉक्स अभिक्रिया<\/h3>\n<p>जिस अभिक्रिया में ऑक्सीकरण और अपचयन <b>एक साथ<\/b> होते हैं, उसे रेडॉक्स (Redox) अभिक्रिया कहते हैं।<\/p>\n<ul><li>2Mg + O₂ → 2MgO : Mg का ऑक्सीकरण, O₂ का अपचयन।<\/li>\n<li>CuO + H₂ → Cu + H₂O : H₂ का ऑक्सीकरण, CuO का अपचयन।<\/li><\/ul>\n<h3>5. ऑक्सीकारक और अपचायक<\/h3>\n<table><tr><th>पदार्थ<\/th><th>कार्य<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>ऑक्सीकारक<\/td><td>दूसरे को ऑक्सीकृत करता है, स्वयं अपचयित होता है<\/td><td>O₂, KMnO₄, K₂Cr₂O₇<\/td><\/tr>\n<tr><td>अपचायक<\/td><td>दूसरे का अपचयन करता है, स्वयं ऑक्सीकृत होता है<\/td><td>H₂, C, Zn, Mg<\/td><\/tr><\/table>\n<h3>6. दैनिक जीवन में ऑक्सीकरण<\/h3>\n<ul><li><b>जंग लगना:<\/b> हवा और नमी में लोहे पर भूरी परत (Fe₂O₃·xH₂O) बनती है।<\/li>\n<li><b>दहन:<\/b> ईंधन का ऑक्सीजन से ऑक्सीकरण, ऊष्मा और प्रकाश निकलता है।<\/li>\n<li><b>श्वसन:<\/b> कोशिकाओं में ग्लूकोज़ का ऑक्सीकरण, ऊर्जा मिलती है।<\/li>\n<li><b>विकृतगंधिता (Rancidity):<\/b> तेल या वसा का ऑक्सीकरण, खाने में बुरी गंध और स्वाद आता है।<\/li>\n<li><b>ताँबे पर हरी परत:<\/b> हवा और नमी से ताँबे का संक्षारण।<\/li><\/ul>\n<h3>7. ऑक्सीकरण से बचाव<\/h3>\n<ul><li>पेंट, तेल या ग्रीस लगाना।<\/li>\n<li>गैल्वनीकरण: लोहे पर जस्ते की परत चढ़ाना।<\/li>\n<li>मिश्रधातु बनाना, जैसे स्टेनलेस स्टील।<\/li>\n<li>खाद्य पदार्थों में एंटीऑक्सीडेंट मिलाना।<\/li>\n<li>चिप्स के पैकेट में नाइट्रोजन गैस भरना।<\/li><\/ul>\n<h3>8. ऑक्सीकरण अंक के मुख्य नियम<\/h3>\n<ol><li>मुक्त तत्व का ऑक्सीकरण अंक 0 होता है।<\/li>\n<li>सरल आयन का ऑक्सीकरण अंक उसके आवेश के बराबर होता है (Na⁺ = +1)।<\/li>\n<li>यौगिक में सभी परमाणुओं के ऑक्सीकरण अंकों का योग 0 होता है।<\/li>\n<li>ऑक्सीजन प्रायः −2 (पेरॉक्साइड में −1) होती है।<\/li>\n<li>हाइड्रोजन प्रायः +1 (धात्विक हाइड्राइड में −1) होता है।<\/li><\/ol>\n<h3>9. परीक्षा के लिए महत्वपूर्ण बिंदु<\/h3>\n<ul><li>ऑक्सीकरण और अपचयन हमेशा साथ-साथ होते हैं।<\/li>\n<li>मैग्नीशियम रिबन जलने पर तेज़ सफ़ेद रोशनी के साथ MgO बनाता है।<\/li>\n<li>धातुओं के ऑक्साइड प्रायः क्षारीय और अधातुओं के ऑक्साइड प्रायः अम्लीय होते हैं।<\/li>\n<li>H₂O₂ ऑक्सीकारक और अपचायक, दोनों की तरह व्यवहार कर सकता है।<\/li><\/ul>"}];

/* ---- Admin (GitHub token login; GitHub itself enforces permission) ---- */
const ADMIN_USER='gyankshetra';
function ghOwner(){return location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:ADMIN_USER}
function ghRepo(){return location.pathname.split('/').filter(Boolean)[0]||'Gyankshetra-app'}
function adminTok(){try{return localStorage.getItem('gyankshetraAdminToken')||''}catch(e){return ''}}
function isAdmin(){return !!adminTok()&&localStorage.getItem('gyankshetraAdminOk')==='1'}
function gh(path,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+adminTok(),'Accept':'application/vnd.github+json'},opt.headers||{});return fetch('https://api.github.com'+path,opt)}
function b64d(c){return new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\n/g,'')),x=>x.charCodeAt(0)))}
function b64e(t){return btoa(unescape(encodeURIComponent(t)))}
const SLIDE_K=['s_sci','s_soc','s_bgk','s_ca'];let bIdx=0,bPause=0;
function bStep(){const c=$('bTrack').children;return c.length>1?c[1].offsetLeft-c[0].offsetLeft:0}
function bDot(i){document.querySelectorAll('#bDots i').forEach((d,k)=>d.classList.toggle('on',k===i))}
function slideBuild(){const t=$('bTrack');if(!t)return;const msg=k=>escH(L('slideP').replace('{x}',L(k)));
t.innerHTML=SLIDE_K.concat([SLIDE_K[0]]).map(k=>`<div class="banner bslide" onclick="openSection('${k}')"><span>🎯</span><div class="btxt"><b>${escH(L('bannerT'))}</b><small class="slide">${msg(k)}</small></div><button class="bstart"><span>${escH(L('startT'))}</span><i>→</i></button></div>`).join('');
$('bDots').innerHTML=SLIDE_K.map(()=>'<i></i>').join('');const st=bStep();t.style.scrollSnapType='none';t.scrollLeft=bIdx*st;requestAnimationFrame(()=>t.style.scrollSnapType='');bDot(bIdx)}
function openSection(k){openSub.tests=k;go('tests');renderLists()}
function bNext(){const t=$('bTrack'),st=bStep();if(!st)return;t.scrollTo({left:(Math.round(t.scrollLeft/st)+1)*st,behavior:'smooth'})}
(function(){const t=$('bTrack');let tm;t.addEventListener('scroll',()=>{const st=bStep();if(!st)return;bDot(Math.round(t.scrollLeft/st)%4);clearTimeout(tm);tm=setTimeout(()=>{let i=Math.round(t.scrollLeft/st);if(i>=SLIDE_K.length){t.style.scrollSnapType='none';t.scrollLeft=0;requestAnimationFrame(()=>t.style.scrollSnapType='');i=0}bIdx=i;bDot(i)},100)},{passive:true});
['touchstart','mousedown','wheel'].forEach(e=>t.addEventListener(e,()=>{bPause=Date.now()+5000},{passive:true}))})();
setInterval(()=>{if(cur==='home'&&Date.now()>bPause)bNext()},2800);

function adminUI(){const b=$('adminMenuBtn');if(b)b.textContent=isAdmin()?'🚪 '+L('adminOut'):'🔐 '+L('adminIn');const tb=$('lblMenuBtn');if(tb)tb.style.display=isAdmin()?'':'none';try{renderStudy()}catch(e){}}
async function adminLogin(){const t=$('tokInput').value.trim();if(!t)return;localStorage.setItem('gyankshetraAdminToken',t);try{const u=await (await gh('/user')).json();if(!u.login||u.login.toLowerCase()!==ADMIN_USER)throw 'ID';const r=await (await gh('/repos/'+ghOwner()+'/'+ghRepo())).json();if(!r.permissions||!r.permissions.push)throw 'perm';const w=await gh('/repos/'+ghOwner()+'/'+ghRepo()+'/git/blobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:'ok',encoding:'utf-8'})});if(!w.ok)throw 'write';localStorage.setItem('gyankshetraAdminOk','1');closeAdmin();adminUI();renderLists();alert('✅ Admin login: '+u.login)}catch(e){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');alert(e==='write'?'❌ Is key se GitHub par likhne ki ijazat nahi hai, isliye delete nahi chalega.\n\nNaya token banayein:\nGitHub > Settings > Developer settings > Personal access tokens > Tokens (classic) > Generate new token (classic). Wahan "public_repo" tick karein.\n\nYa Fine-grained token me Gyankshetra-app repo chunkar "Contents: Read and write" dein.':'❌ Login nahi hua. Key ya permission galat hai.')}}
function repoPath(u){try{const x=new URL(u,location.href);if(x.origin!==location.origin)return null;let p=decodeURIComponent(x.pathname);const base='/'+ghRepo()+'/';if(location.hostname.endsWith('.github.io')){if(!p.startsWith(base))return null;p=p.slice(base.length)}else p=p.replace(/^\//,'');return p}catch(e){return null}}
async function ghErr(r){let m='';try{m=(await r.json()).message||''}catch(e){}return 'HTTP '+r.status+(m?' — '+m:'')}
async function delTest(u){if(!isAdmin())return;const t=REG.tests.find(x=>x.url===u);if(!t||!confirm('"'+t.title+'" delete karna hai?'))return;const o=ghOwner(),r=ghRepo(),jp='content/generated_tests.json',ep='/repos/'+o+'/'+r+'/contents/'+jp,J={'Content-Type':'application/json'};try{
for(let k=0;k<2;k++){const g=await gh(ep,{cache:'no-store'});if(!g.ok)throw await ghErr(g);const gj=await g.json();const arr=JSON.parse(b64d(gj.content));if(!Array.isArray(arr))throw 'content/generated_tests.json ka format galat hai';const n=arr.filter(x=>x.url!==u);
const p=await gh(ep,{method:'PUT',headers:J,body:JSON.stringify({message:'Delete test: '+t.title,content:b64e(JSON.stringify(n,null,2)),sha:gj.sha})});if(p.ok)break;if(p.status===409&&k===0)continue;throw await ghErr(p)}
const fp=repoPath(u);if(fp&&/\.(html|json)$/.test(fp)&&fp!=='index.html'&&!fp.startsWith('content/')&&!fp.includes('..')){const fe='/repos/'+o+'/'+r+'/contents/'+fp.split('/').map(encodeURIComponent).join('/');const f=await gh(fe);if(f.ok){const fj=await f.json();if(fj.sha)await gh(fe,{method:'DELETE',headers:J,body:JSON.stringify({message:'Delete test file: '+fp,sha:fj.sha})})}}
REG.tests=REG.tests.filter(x=>x.url!==u);try{localStorage.setItem('gyankshetraReg',JSON.stringify(REG))}catch(e){}renderLists();alert('🗑 Delete ho gaya.')}catch(e){const m=String(e);alert('❌ Delete nahi hua: '+m+(/40[134]|not accessible|permission|Bad credentials/i.test(m)?'\n\nIs key ko likhne ki ijazat nahi hai. Admin Login me naya key daalein (classic token me "public_repo" ya fine-grained me "Contents: Read and write").':''));if(/40[13]|not accessible|Bad credentials/i.test(m))adminLogout()}}
function fileB64(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(',')[1]);r.onerror=()=>rej('File padh nahi paya');r.readAsDataURL(f)})}
async function jsonUpdate(jp,fn,msg,dflt){const o=ghOwner(),r=ghRepo(),ep='/repos/'+o+'/'+r+'/contents/'+jp,J={'Content-Type':'application/json'};
for(let k=0;k<2;k++){const g=await gh(ep,{cache:'no-store'});let d=dflt,sha;if(g.ok){const gj=await g.json();sha=gj.sha;try{d=JSON.parse(b64d(gj.content))}catch(e){d=dflt}if(Array.isArray(d)!==Array.isArray(dflt)||!d||typeof d!=='object')d=dflt}else if(g.status!==404)throw await ghErr(g);
const body={message:msg,content:b64e(JSON.stringify(fn(d),null,2))};if(sha)body.sha=sha;const p=await gh(ep,{method:'PUT',headers:J,body:JSON.stringify(body)});if(p.ok)return;if(p.status===409&&k===0)continue;throw await ghErr(p)}}
async function regUpdate(fn,msg){return jsonUpdate('content/study_material.json',fn,msg,[])}
function saveReg(){try{localStorage.setItem('gyankshetraReg',JSON.stringify(REG))}catch(e){}}
function permFail(m){if(/40[13]|not accessible|Bad credentials/i.test(m)){alert('❌ '+m+'\n\nIs key ko likhne ki ijazat nahi hai. Admin Login me naya key daalein.');adminLogout();return true}return false}

if(f.size>20*1024*1024){alert('File 20 MB se badi hai. Chhoti file chunein.');return}
const ext=((f.name.split('.').pop()||'bin').toLowerCase().replace(/[^a-z0-9]/g,'')||'bin').slice(0,5),sec=$('upSec').value,title=$('upTitle').value.trim()||f.name.replace(/\.[^.]+$/,''),id=Date.now().toString(36),path='materials/'+sec+'/'+id+'.'+ext,o=ghOwner(),r=ghRepo();
$('upBtn').disabled=true;m.textContent='⏳ Upload ho raha hai...';
try{const b=await fileB64(f);const p=await gh('/repos/'+o+'/'+r+'/contents/'+path,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:'Upload: '+title,content:b})});if(!p.ok)throw await ghErr(p);
const e={id,title,section:sec,type:'file',ext,size:f.size,path,url:new URL(ROOT+path,location.href).href,created_at:id};
await regUpdate(a=>[e].concat(a),'Add document: '+title);REG.study=[e].concat(REG.study);saveReg();studySec=sec;

catch(x){const t=String(x);m.textContent='';if(!permFail(t))alert('❌ Upload nahi hua: '+t)}
$('upBtn').disabled=false}
async function rmRepoFile(fp,msg){if(!fp||fp.includes('..'))return;const fe='/repos/'+ghOwner()+'/'+ghRepo()+'/contents/'+fp.split('/').map(encodeURIComponent).join('/'),f=await gh(fe);if(f.ok){const fj=await f.json();if(fj.sha)await gh(fe,{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,sha:fj.sha})})}}

try{const a=JSON.parse(localStorage.getItem(histKey())||'[]');return Array.isArray(a)?a:[]}catch(e){return []}}
function setHist(h){try{localStorage.setItem(histKey(),JSON.stringify(h.slice(-300)))}catch(e){}}
function openHist(){const u=getUser();if(!u.logged){alert(L('loginPrompt'));return}const h=getHist().slice().reverse();$('histH').textContent='📊 '+uName()+' ('+u.id+') — '+L('histT').replace('📊 ','');
$('histList').innerHTML=h.length?h.map(x=>{const t=hTot(x),p=Math.round((Number(x.marks)||0)/t*100);return `<div class="card" style="margin:0 0 8px"><b>${escH(x.test||'Test')}</b><small style="display:block;color:#7b8799">${escH(x.date||x.day||'')}</small><div style="margin-top:4px"><b>${Number(x.marks)||0} / ${t}</b> (${p}%) • ✅ ${x.correct||0} • ❌ ${x.wrong||0} • ⏭ ${x.skipped||0}</div></div>`}).join(''):`<small>${L('histNone')}</small>`;$('histModal').classList.add('open')}
function closeHist(){$('histModal').classList.remove('open')}
function builtinCard(){return `<div class="card"><b>🧪 ${TEST_NAME}</b><small>${L('testMeta')}</small><button class="primary" onclick="requireUser(startQuiz)">${L('startTest')}</button></div>`}
function mixedGroups(page){const g={};REG.tests.filter(t=>KINDS[page].includes(t.type)&&t.subject==='Mixed').forEach(t=>{const nm=t.title.replace(/^[^\p{L}\p{N}]+/u,''),m=nm.match(/^(\S+) (\d+)Q (\d+)$/),key=m?m[1].toUpperCase()+' SERIES '+m[2]:'TEST SERIES';(g[key]=g[key]||[]).push({t,nm,n:m?+m[3]:0})});Object.values(g).forEach(a=>a.sort((x,y)=>x.n-y.n));return g}
function mixedRow(o){const t=o.t,nm=o.nm;return `<div class="qrow" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><span>📝 ${escH(nm)}${t.questions?' <small style="color:#7b8799;font-weight:400">• '+t.questions+' '+L('qWord')+'</small>':''}</span>${isAdmin()?`<button class="qdel" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑</button>`:''}<i>›</i></div>`}
function subjBlock(page){const list=SUBJS[page],keys=list.map(s=>s[0]).concat(['other']),tiles=[];let panel='';
const g=mixedGroups(page);Object.keys(g).forEach(key=>{const id='mx_'+key.replace(/\W+/g,'_'),a=g[key];tiles.push({id,ic:'📂',nm:key,sub:a.length+' '+L('testsWord'),n:a.length});if(openSub[page]===id)panel=`<div class="tphead">📂 ${escH(key)}</div>`+a.map(mixedRow).join('')});
keys.forEach(k=>{const s=list.find(x=>x[0]===k)||['sOther','📂',0];const items=regItems(page,k),own=(OWN[page]===k)?1:0,n=items.length+own;if(k==='other'&&!n)return;
tiles.push({id:k,ic:s[1],nm:L(s[0]),sub:n?n+' '+L('testsWord'):L('comingSub'),n});if(openSub[page]===k&&n)panel=`<div class="tphead">${s[1]} ${escH(L(s[0]))}</div>`+(own?builtinRow():'')+items.map(itemRow).join('')});
return `<div class="tiles">`+tiles.map(t=>`<div class="${openSub[page]===t.id&&t.n?'on':''}" onclick="${t.n?`toggleSub('${page}','${t.id}')`:'soon()'}">${t.ic}<b>${escH(t.nm)}</b><small>${t.sub}</small></div>`).join('')+`</div>`+(panel?`<div class="tilepanel">${panel}</div>`:'')}
function itemRow(t){return `<div class="qrow" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><span>${escH(t.title)}</span>${isAdmin()?`<button class="qdel" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑</button>`:''}<i>›</i></div>`}
function builtinRow(){return `<div class="qrow" onclick="requireUser(startQuiz)"><span>🧪 ${escH(TEST_NAME)}</span><i>›</i></div>`}
function toggleSub(p,k){openSub[p]=openSub[p]===k?null:k;renderLists();const e=document.querySelector('#'+(p==='tests'?'testsBody':'practiceBody')+' .tilepanel');if(e)setTimeout(()=>e.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}
function renderLists(){
const all=REG.tests.slice(0,3);$('homeNew').innerHTML=all.length?all.map(itemCard).join(''):`<div class="card"><small>${L('noNew')}</small></div>`;
$('testsBody').innerHTML=subjBlock('tests');$('practiceBody').innerHTML=subjBlock('practice');renderStudy();renderExam()}
function setExam(x){try{localStorage.setItem('gyankshetraExam',x)}catch(e){}renderExam()}
function renderExam(){let ex='STET';try{ex=localStorage.getItem('gyankshetraExam')||'STET'}catch(e){}document.querySelectorAll('#examChips button').forEach(b=>b.classList.toggle('on',b.dataset.ex===ex))}
/* Test UI: palette + swipe */
function openPalette(){$('palGrid').innerHTML=questions.map((q,i)=>`<button class="${ans[i]!==null&&ans[i]!==undefined?'a':''} ${i===qi?'cur':''}" onclick="jumpQ(${i})">${i+1}</button>`).join('');$('palette').classList.add('open')}
function closePalette(){$('palette').classList.remove('open')}
function jumpQ(i){qi=i;closePalette();saveProgress();render()}
(function(){let x0=0,y0=0;const w=$('quiz');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;if((dx>0)===SWIPE_RIGHT_IS_NEXT){if(qi<TOTAL-1){qi++;saveProgress();render()}}else prev()},{passive:true})})();
/* Result */
let lastRes={c:0,w:0,s:0},lastAttempt=1;
function paintResult(){const {c,w,s}=lastRes,a=c/TOTAL*100,b=a+w/TOTAL*100;$('donut').style.background=`conic-gradient(#1f9d55 0 ${a}%,#e03a3a ${a}% ${b}%,#c9d1dc ${b}% 100%)`;const u=getUser();$('resName').textContent='👤 '+(u.logged?uName():L('student'));$('reTag').classList.toggle('on',lastAttempt>1);$('anBtn').textContent='📚 Analysis';$('tipHint').textContent=({hi:'किसी भी बॉक्स पर टैप करें — उसका Analysis खुलेगा',en:'Tap any box to open its analysis',bh:'कवनो बॉक्स पर टैप करीं — ओकर विश्लेषण खुली'})[currentLang];$('backBtn').textContent=({hi:'🏠 ऐप पर वापस जाएँ',en:'🏠 Back to App',bh:'🏠 ऐप पर लौटीं'})[currentLang]}
function shareResult(){const {c,w,s}=lastRes,u=getUser(),p=Math.round(c/TOTAL*100),link=location.href.split('#')[0].split('?')[0];
const text=`${L('shHead')}\n👤 ${u.logged?u.name:L('student')}\n🏆 ${L('marks')}: ${c}/${TOTAL} (${p}%)\n✅ ${L('correct')}: ${c}  ❌ ${L('wrong')}: ${w}  ⏭ ${L('skipped')}: ${s}\n📢 ${L('shTg')}: https://t.me/gyankshetra\n🔗 ${L('shLink')}: ${link}`;
window.open('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text),'_blank')}
/* Download */
function downloadTest(){const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');const t='<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Gyankshetra</title></head><body style="font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:16px"><h1>Gyankshetra — '+TEST_NAME.replace(/</g,'&lt;')+'</h1>'+questions.map((q0,i)=>{const q=Q(i);return `<h3>${i+1}. ${esc(q[0])}</h3><ol type="A">${q[1].map(o=>`<li>${esc(o)}</li>`).join('')}</ol><p><b>${esc(L('right'))}:</b> ${String.fromCharCode(65+q[2])}. ${esc(q[1][q[2]])}</p><ul>${q[3].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}).join('<hr>')+'<p>📢 https://t.me/gyankshetra</p></body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download='gyankshetra-physics-gravitation.html';document.body.appendChild(a);a.click();a.remove();$('drawer').classList.remove('open')}
applyLanguage();loadStudy();loadReg();adminUI();slideBuild();go('home');if(ROOT){const p=getProgress();requireUser(getUser().logged&&p?resumeQuiz:startQuiz)}
</script>
