<script>
const testData = {"isReattempted":false,"studentName":"छात्र","topic":"Gk","questions":[{"id":1,"text":"भारत के प्रथम राष्ट्रपति कौन थे?","options":["डॉ. ए.पी.जे. अब्दुल कलाम","डॉ. सर्वपल्ली राधाकृष्णन","डॉ. राजेंद्र प्रसाद","डॉ. हरमन मोनरो"],"correctOption":2,"selected":null,"status":"skipped","facts":["डॉ. राजेंद्र प्रसाद भारत के प्रथम राष्ट्रपति थे, जिन्होंने 1950 से 1962 तक पद संभाला।","डॉ. राजेंद्र प्रसाद 1884 में बिहार के बिहार में जन्मे थे","उन्होंने भारतीय राष्ट्रीय कांग्रेस में सक्रिय भूमिका निभाई","असहयोग आंदोलन में भाग लिया","वह प्रथम भारतीय राष्ट्रपति थे","उनकी शैक्षणिक पृष्ठभूमि में इतिहास और राजनीति शामिल है","उन्होंने 1950 में संविधान सभा के अध्यक्ष के रूप में कार्य किया","उनकी मृत्यु 1963 में हुई","उनके योगदान को कई स्मारकों में सम्मानित किया गया"]},{"id":2,"text":"भारतीय संविधान के किस अनुच्छेद में मौलिक अधिकारों की गारंटी है?","options":["अनुच्छेद 19","अनुच्छेद 21","अनुच्छेद 14","अनुच्छेद 12"],"correctOption":1,"selected":null,"status":"skipped","facts":["अनुच्छेद 21 जीवन और व्यक्तिगत स्वतंत्रता की गारंटी देता है, जो मौलिक अधिकारों में शामिल है।","अनुच्छेद 21 का मूल पाठ है \"हर व्यक्ति को जीवन, व्यक्तिगत स्वतंत्रता और समानता का अधिकार है\"","यह अनुच्छेद न्यायालय द्वारा कई बार विस्तारित किया गया है","सर्वोच्च न्यायालय ने इसे स्वास्थ्य अधिकार तक विस्तारित किया है","यह मौलिक अधिकारों में सबसे महत्वपूर्ण माना जाता है","अनुच्छेद 21 के तहत जेल सुधार भी शामिल है","यह 1949 में संविधान में शामिल हुआ","यह अधिकार किसी भी सरकारी कार्रवाई के विरुद्ध प्रयोग किया जा सकता है","इसका उल्लंघन होने पर न्यायालय में याचिका दायर की जा सकती है"]},{"id":3,"text":"भारत में सबसे बड़ा राज्य कौन सा है?","options":["रajasthan","Madhya Pradesh","मध्य प्रदेश","Uttar Pradesh"],"correctOption":0,"selected":null,"status":"skipped","facts":["राजस्थान क्षेत्रफल के हिसाब से भारत का सबसे बड़ा राज्य है।","राजस्थान का क्षेत्रफल लगभग 342,239 वर्ग किलोमीटर है","यह भारत के पश्चिमी भाग में स्थित है","राजस्थान की राजधानी जयपुर है","यह रेगिस्तानी और शुष्क जलवायु के लिए जाना जाता है","राजस्थान में कई ऐतिहासिक किले और महल हैं","यह पर्यटन के लिए प्रमुख राज्य है","राजस्थान की प्रमुख भाषा राजस्थानी है","राजस्थान की अर्थव्यवस्था में कृषि और पर्यटन प्रमुख हैं"]},{"id":4,"text":"भारत में किस नदी को 'सिंधु' कहा जाता है?","options":["नर्मदा","सिंधु","गंगा","यमुना"],"correctOption":1,"selected":null,"status":"skipped","facts":["सिंधु नदी भारत के उत्तर-पश्चिम में बहती है और इसे सिंधु कहा जाता है।","सिंधु नदी का स्रोत तिब्बत में है","यह पाकिस्तान में प्रवेश करती है","सिंधु नदी का कुल लंबाई लगभग 3,180 किमी है","यह भारत-پاکستان सीमा का प्राकृतिक सीमा बनती है","सिंधु घाटी सभ्यता इस नदी के किनारे विकसित हुई थी","सिंधु जलविद्युत परियोजना भारत में प्रमुख है","सिंधु नदी के जल संसाधन कृषि में उपयोग होते हैं","सिंधु नदी के किनारे कई प्राचीन शहर स्थित हैं"]},{"id":5,"text":"भारत में किस राज्य की आधिकारिक भाषा मराठी है?","options":["महाराष्ट्र","आंध्र प्रदेश","गुजरात","कर्नाटक"],"correctOption":0,"selected":null,"status":"skipped","facts":["मराठी महाराष्ट्र राज्य की आधिकारिक भाषा है।","मराठी भाषा इंडो-आर्यन भाषा परिवार से है","मुंबई महाराष्ट्र की राजधानी है","मराठी साहित्य में संत तुकाराम और अक्की भोसले प्रमुख हैं","मराठी में कई शास्त्रीय नाटक लिखे गए हैं","मराठी भाषा का लिपि देवनागरी है","मराठी भाषा में कई उपभाषाएँ हैं","मराठी भाषा का उपयोग शिक्षा और प्रशासन में होता है","मराठी भाषा को 1950 में भारतीय संविधान द्वारा मान्यता मिली"]},{"id":6,"text":"भारत में किस वर्ष में संविधान लागू हुआ?","options":["1952","1960","1950","1947"],"correctOption":2,"selected":null,"status":"skipped","facts":["भारत का संविधान 26 जनवरी 1950 को लागू हुआ।","संविधान का मसौदा 1949 में तैयार हुआ","डॉ. बी.आर. अम्बेडकर ने इसे प्रमुख रूप से तैयार किया","26 जनवरी को गणतंत्र दिवस के रूप में मनाया जाता है","संविधान में 448 अनुच्छेद और 12 अनुसूचियाँ हैं","यह विश्व का सबसे लंबा लिखित संविधान है","संविधान ने भारत को संघीय लोकतांत्रिक गणराज्य बनाया","संविधान में मौलिक अधिकार, निर्देशात्मक सिद्धांत और संघीय ढांचा शामिल है","संविधान के लागू होने पर भारत ने ब्रिटिश राज से पूर्ण स्वतंत्रता प्राप्त की"]},{"id":7,"text":"भारत में किस राज्य को 'सूर्य का राज्य' कहा जाता है?","options":["राजस्थान","ओडिशा","मध्य प्रदेश","असम"],"correctOption":1,"selected":null,"status":"skipped","facts":["ओडिशा को सूर्य देवता से जुड़ी कई मंदिरों के कारण 'सूर्य का राज्य' कहा जाता है।","ओडिशा का प्रमुख मंदिर सूर्य मंदिर है","ओडिशा की राजधानी भुवनेश्वर है","ओडिशा में कई प्राचीन मंदिर और समुद्र तट हैं","ओडिशा की भाषा ओडिया है","ओडिशा में पुरी का जगन्नाथ मंदिर प्रमुख तीर्थस्थल है","ओडिशा की अर्थव्यवस्था में कृषि और खनिज उद्योग प्रमुख हैं","ओडिशा में कई राष्ट्रीय उद्यान और अभयारण्य हैं","ओडिशा का इतिहास प्राचीन काल से समृद्ध है"]},{"id":8,"text":"भारत में किस राज्य की सीमा सबसे अधिक राज्यों से मिलती है?","options":["मध्य प्रदेश","उत्तर प्रदेश","राजस्थान","बिहार"],"correctOption":0,"selected":null,"status":"skipped","facts":["मध्य प्रदेश की सीमा 9 विभिन्न राज्यों से मिलती है, जो सबसे अधिक है।","मध्य प्रदेश के पड़ोसी राज्य हैं: उत्तर प्रदेश, राजस्थान, गुजरात, महाराष्ट्र, छत्तीसगढ़, झारखंड, उड़ीसा, आंध्र प्रदेश और तेलंगाना","भौगोलिक रूप से यह मध्य भारत में स्थित है","इंदौर मध्य प्रदेश की प्रमुख शहर है","मध्य प्रदेश में कई राष्ट्रीय उद्यान हैं","यह राज्य खनिज संसाधनों से समृद्ध है","मध्य प्रदेश की आधिकारिक भाषा हिन्दी है","यह राज्य कई राजकीय राजभाषा वाले क्षेत्रों को शामिल करता है","मध्य प्रदेश में कई ऐतिहासिक स्थल हैं"]},{"id":9,"text":"भारत में सबसे बड़ा जलाशय (डैम) कौन सा है?","options":["सिंधु जलाशय","भाखड़िया डैम","नक्की झील","हिराकुंड डैम"],"correctOption":3,"selected":null,"status":"skipped","facts":["हिराकुंड डैम, कर्नाटक में स्थित, भारत का सबसे बड़ा जलाशय है जिसका जलधारण क्षमता लगभग 4,560 करोड़ घन मीटर है।","हिराकुंड डैम का निर्माण 1976 में शुरू हुआ था","डैम की ऊँचाई 226 मीटर है","डैम का मुख्य उद्देश्य जलविद्युत उत्पादन और सिंचाई है","डैम का जलधारण क्षमता 4,560 करोड़ घन मीटर है","डैम के जल से निर्मित विद्युत शक्ति 1,500 मेगावॉट से अधिक है","डैम के आसपास राष्ट्रीय उद्यान स्थित है जिसमें कई दुर्लभ प्रजातियाँ हैं","डैम के निर्माण से आसपास के कई गांवों का विस्थापन हुआ","डैम के जल स्तर में मौसमी उतार-चढ़ाव स const Q=testData.questions,N=Q.length;let ans=Array(N).fill(null),qi=0,left=N*60,tid=null,done=false,rOrder=[],ri=0,res={c:0,w:0,s:0};
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(t){t=Math.max(0,t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function uname(){try{if(localStorage.getItem('gyankshetraLoggedIn')==='1'){return localStorage.getItem('gyankshetraUserName')||testData.studentName}}catch(e){}return testData.studentName}
$('ttl').textContent='Gyankshetra · '+testData.topic;
function render(){const q=Q[qi];$('qc').textContent='प्रश्न '+(qi+1)+'/'+N;$('qt').textContent=q.text;
$('opts').innerHTML=q.options.map((o,i)=>'<button class="opt '+(ans[qi]===i?'sel':'')+'" onclick="pick('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('');
$('pv').disabled=qi===0;$('nx').textContent=qi===N-1?'Submit Test ✔':'अगला →';$('tm').textContent='⏱ '+fmt(left)}
function pick(i){ans[qi]=i;render()}
function go(d){if(d>0&&qi===N-1){if(confirm('क्या आप टेस्ट Submit करना चाहते हैं?'))finish();return}const n=qi+d;if(n<0||n>=N)return;qi=n;render()}
function tick(){left--;$('tm').textContent='⏱ '+fmt(left);if(left<=0)finish()}
function openPal(){$('pg').innerHTML=Q.map((q,i)=>'<button class="'+(ans[i]!==null?'a ':'')+(i===qi?'c':'')+'" onclick="jump('+i+')">'+(i+1)+'</button>').join('');$('pal').classList.add('open')}
function closePal(){$('pal').classList.remove('open')}
function jump(i){qi=i;closePal();render()}
function finish(){if(done)return;done=true;clearInterval(tid);closePal();let c=0,w=0,s=0;ans.forEach((a,i)=>{if(a===null)s++;else if(a===Q[i].correctOption)c++;else w++});res={c,w,s};
const a=c/N*100,b=a+w/N*100;$('donut').style.background='conic-gradient(#1f9d55 0 '+a+'%,#e03a3a '+a+'% '+b+'%,#c9d1dc '+b+'% 100%)';
$('pct').textContent=Math.round(a)+'%';$('mk').textContent=c+' / '+N;$('co').textContent=c;$('wr').textContent=w;$('sk').textContent=s;$('who').textContent='👤 '+uname();
try{const h=JSON.parse(localStorage.getItem('gyankshetraHistory')||'[]');h.push({day:new Date().toISOString().slice(0,10),date:new Date().toLocaleString('hi-IN'),test:testData.topic,marks:c,correct:c,wrong:w,skipped:s,total:N});localStorage.setItem('gyankshetraHistory',JSON.stringify(h))}catch(e){}
$('quiz').classList.add('hide');$('result').classList.remove('hide');window.scrollTo(0,0)}
function review(f){rOrder=Q.map((q,i)=>i).filter(i=>f==='all'||(f==='ok'&&ans[i]===Q[i].correctOption)||(f==='bad'&&ans[i]!==null&&ans[i]!==Q[i].correctOption)||(f==='skip'&&ans[i]===null));if(!rOrder.length){alert('इस श्रेणी में कोई प्रश्न नहीं है।');return}ri=0;$('result').classList.add('hide');$('review').classList.remove('hide');rrender()}
function rrender(){const i=rOrder[ri],q=Q[i];$('rc').textContent='Review '+(ri+1)+'/'+rOrder.length;$('rq').textContent=(i+1)+'. '+q.text;
$('ro').innerHTML=q.options.map((o,k)=>'<div class="opt '+(k===q.correctOption?'ok':(k===ans[i]?'bad':''))+'">'+String.fromCharCode(65+k)+'. '+esc(o)+(k===q.correctOption?' ✅':'')+(k===ans[i]&&k!==q.correctOption?' ❌':'')+'</div>').join('');
$('rf').innerHTML='<small class="m">आपका उत्तर: '+(ans[i]===null?'छोड़ा गया':String.fromCharCode(65+ans[i]))+' • सही उत्तर: '+String.fromCharCode(65+q.correctOption)+'</small>'+(q.facts&&q.facts.length?'<div class="facts"><b>📌 व्याख्या / तथ्य:</b><ul>'+q.facts.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul></div>':'')}
function rgo(d){const n=ri+d;if(n<0||n>=rOrder.length)return;ri=n;rrender()}
function backRes(){$('review').classList.add('hide');$('result').classList.remove('hide')}
function share(){const link=location.href.split('#')[0].split('?')[0],p=Math.round(res.c/N*100);
const t='🎓 Gyankshetra Result\n👤 '+uname()+'\n📝 '+testData.topic+'\n🏆 अंक: '+res.c+'/'+N+' ('+p+'%)\n✅ सही: '+res.c+'  ❌ गलत: '+res.w+'  ⏭ छूटे: '+res.s+'\n📢 Telegram चैनल: https://t.me/gyankshetra\n🔗 टेस्ट लिंक: '+link;
window.open('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(t),'_blank')}
(function(){let x0=0,y0=0;const w=$('quiz');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;if(dx>0){if(qi>0){qi--;render()}}else if(qi<N-1){qi++;render()}},{passive:true})})();
render();tid=setInterval(tick,1000);
</script>
</body>
</html>
