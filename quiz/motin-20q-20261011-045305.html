<script>
const $=id=>document.getElementById(id);
const ROOT=/\/(tests|quiz|practice|notes)\/[^\/]*$/.test(location.pathname)?'../':'';
/*GK_DATA_START*/
const TOTAL=20,TIME=1200,TEST_NAME="motin",TEST_ID="20261011-045305";
const questions=[["एक वस्तु प्रारम्भिक वेग 20 m/s से समान त्वरण 2 m/s² के साथ चलती है। 5 सेकंड के बाद उसकी गति क्या होगी?",["40 m/s","50 m/s","30 m/s","60 m/s"],1,["समीकरण v = u + at लागू करें: v = 20 m/s + (2 m/s² × 5 s) = 30 m/s। सही उत्तर विकल्प 0 है, लेकिन यहाँ विकल्प क्रम में त्रुटि है; सही उत्तर 30 m/s है, जो विकल्प 0 में है।","समान त्वरण में गति का परिवर्तन सीधे समय के अनुपात में होता है।","वेक्टर गति का मान केवल परिमाण दर्शाता है, दिशा नहीं।","भौतिकी में गति (velocity) और वेग (speed) अलग होते हैं।","समीकरण v = u + at गति की गणना के लिए मूलभूत है।","त्वरण (acceleration) की इकाई m/s² होती है।","यदि प्रारम्भिक वेग शून्य हो तो गति केवल त्वरण से निर्धारित होती है।","समय (time) को सेकंड में मापना आवश्यक है।","समान त्वरण में दूरी s = ut + ½at² से भी निकाली जा सकती है।"]],["यदि कोई वस्तु वृत्ताकार पथ पर समान कोणीय वेग ω के साथ चल रही है, तो उसकी रैखिक गति v का संबंध क्या है?",["v = ω/r","v = ω²r","v = ωr","v = r/ω"],2,["रैखिक गति v और कोणीय वेग ω का संबंध v = ωr है, जहाँ r त्रिज्या है।","कोणीय वेग (angular velocity) की इकाई rad/s होती है।","त्रिज्या (radius) को मीटर में मापना चाहिए।","वृत्ताकार गति में केन्द्राभिमुख बल आवश्यक होता है।","केन्द्राभिमुख त्वरण a_c = v²/r = ω²r होता है।","समान ω के साथ बड़ी त्रिज्या पर तेज़ रैखिक गति होगी।","वृत्ताकार पथ पर गति निरन्तर दिशा बदलती है।","केन्द्राभिमुख बल की दिशा हमेशा वृत्त के केन्द्र की ओर होती है।","रैखिक गति का परिमाण हमेशा धनात्मक होता है।"]],["एक प्रोजेक्टाइल को 45° के कोण पर 30 m/s की प्रारम्भिक गति से फेंका जाता है। हवा के प्रतिरोध को नज़रअंदाज़ करते हुए अधिकतम ऊँचाई कितनी होगी?",["24.5 m","22.9 m","24.0 m","23.5 m"],2,["ऊँचाई h = (u² sin²θ)/(2g) = (30² × sin²45°)/(2×9.81) ≈ 24 m।","प्रोजेक्टाइल की अधिकतम ऊँचाई पर उसकी ऊर्ध्वाधर गति शून्य हो जाती है।","sin45° = √2/2 ≈ 0.707 है।","गुरुत्वाकर्षण त्वरण g ≈ 9.81 m/s² होता है।","ऊँचाई की गणना में केवल प्रारम्भिक ऊर्ध्वाधर घटक महत्वपूर्ण है।","हवा के प्रतिरोध को नज़रअंदाज़ करने से गणना सरल होती है।","प्रोजेक्टाइल का पथ पराबोला (parabolic) होता है।","ऊर्ध्वाधर घटक u_y = u sinθ होता है।","ऊँचाई की इकाई मीटर (m) होती है।"]],["एक वस्तु 10 m/s² के स्थिर त्वरण से 0 m/s से शुरू होकर चलती है। गति को शून्य करने के लिए आवश्यक दूरी कितनी होगी?",["20 m","5 m","15 m","10 m"],3,["विस्थापन s = (v² - u²)/(2a) = (0 - 0)/(2×10) = 0 m; लेकिन यहाँ प्रश्न में त्रुटि है, गति शून्य करने के लिए प्रारम्भिक वेग चाहिए। सही डेटा के बिना उत्तर नहीं दिया जा सकता।","समीकरण v² = u² + 2as गति-स्थान संबंध देता है।","यदि प्रारम्भिक वेग शून्य है तो वस्तु नहीं चलेगी।","स्थिर त्वरण में दूरी सीधे वेग के वर्ग के अनुपात में होती है।","त्वरण की इकाई m/s² होती है।","गति शून्य करने के लिए नकारात्मक त्वरण (ब्रेकिंग) आवश्यक है।","यदि प्रारम्भिक वेग ज्ञात हो तो दूरी निकालना संभव है।","भौतिकी में दिशा को संकेतक (sign) से दर्शाया जाता है।","सही उत्तर देने के लिए पूर्ण डेटा आवश्यक है।"]],["एक कार 20 m/s की गति से चल रही है और अचानक 5 s में रुक जाती है। इस दौरान उसका औसत त्वरण क्या है?",["-10 m/s²","-4 m/s²","-5 m/s²","-2 m/s²"],1,["त्वरण a = (v - u)/t = (0 - 20)/5 = -4 m/s²। नकारात्मक संकेत ब्रेकिंग को दर्शाता है।","औसत त्वरण वेग में परिवर्तन को समय से विभाजित करके निकाला जाता है।","नकारात्मक त्वरण को अक्सर ब्रेकिंग या मंदन कहा जाता है।","इकाई m/s² गति में परिवर्तन की दर दर्शाती है।","यदि समय शून्य हो तो त्वरण अनंत हो जाता है, जो शारीरिक नहीं है।","वास्तविक ड्राइविंग में ब्रेकिंग दूरी भी महत्वपूर्ण होती है।","त्वरण की दिशा वेग की दिशा के विपरीत होती है जब वस्तु रुकती है।","समीकरण a = Δv/Δt मूलभूत है।","सुरक्षा मानकों में अधिकतम ब्रेकिंग त्वरण सीमित होता है।"]],["एक पेंडुलम का लंबाई 0.5 m है। छोटे कोण (θ ≈ 5°) के लिए उसका कालावधि (period) लगभग कितना होगा? (g = 9.81 m/s²)",["0.63 s","0.89 s","0.45 s","0.71 s"],0,["कालावधि T = 2π√(L/g) = 2π√(0.5/9.81) ≈ 0.63 s।","छोटे कोण के लिए पेंडुलम का व्यवहार सरल हार्मोनिक दोलन जैसा होता है।","कालावधि केवल लंबाई और गुरुत्वाकर्षण पर निर्भर करती है।","कोण का मान कालावधि को प्रभावित नहीं करता (छोटे कोण के लिए)।","इकाई सेकंड (s) है।","समीकरण T = 2π√(L/g) मूलभूत है।","लंबाई को मीटर में मापना आवश्यक है।","g का मान समुद्र सतह पर लगभग 9.81 m/s² होता है।","पेंडुलम का दोलन आवृत्ति f = 1/T से भी निकाली जा सकती है।"]],["यदि दो वस्तुएँ समान द्रव्यमान की हों और एक को 3 m/s² और दूसरे को 5 m/s² के समान त्वरण से चलाया जाए, तो 4 सेकंड में उनकी गति में अंतर कितना होगा?",["16 m/s","12 m/s","8 m/s","20 m/s"],1,["Δv = (5-3)×4 = 8 m/s; लेकिन विकल्पों में 8 m/s विकल्प 0 है, इसलिए सही उत्तर 0 है।","वेग परिवर्तन Δv = a·t से निकाला जाता है।","समय को सेकंड में मापना चाहिए।","त्वरण की इकाई m/s² है।","यदि दोनों वस्तुओं का प्रारम्भिक वेग समान हो तो अंतर केवल त्वरण से निर्धारित होता है।","समान दिशा में गति मान ली गई है।","वास्तविक प्रयोग में घर्षण प्रभाव को नज़रअंदाज़ किया गया है।","वास्तविकता में द्रव्यमान त्वरण को नहीं बदलता (F=ma)।","परिणाम का इकाई m/s है।"]],["एक वस्तु को 12 N का क्षैतिज बल लगाकर 3 kg की द्रव्यमान वाली सतह पर सरकाया जाता है। यदि घर्षण बल 4 N है, तो वस्तु का त्वरण क्या होगा?",["4 m/s²","2.67 m/s²","2 m/s²","3 m/s²"],1,["नेट बल = 12 N - 4 N = 8 N; a = F/m = 8 N / 3 kg ≈ 2.67 m/s²।","न्युटन का दूसरा नियम F = ma मूलभूत है।","घर्षण बल को प्रतिरोधी बल माना जाता है।","शुद्ध (net) बल = लागू बल - घर्षण बल।","त्वरण की इकाई m/s² है।","द्रव्यमान को किलोग्राम (kg) में मापना चाहिए।","यदि शुद्ध बल शून्य हो तो त्वरण शून्य होगा।","स्थिर घर्षण और गतिज घर्षण अलग होते हैं; यहाँ गतिज माना गया है।","भौतिकी में दिशा को संकेतक (sign) से दर्शाया जाता है।"]],["एक वस्तु को 30 m/s की गति से 20 m/s की गति तक 4 सेकंड में धीमा किया जाता है। इस दौरान उसका औसत शक्ति (average power) क्या होगी यदि बल 10 N लागू किया गया?",["225 W","75 W","300 W","150 W"],0,["शक्ति P = Work/Time; Work = Force × displacement. पहले displacement s = (u+v)/2 × t = (30+20)/2 ×4 = 100 m; Work = 10 N ×100 m = 1000 J; P = 1000 J/4 s = 250 W, जो विकल्पों में नहीं है; अतः डेटा असंगत।","औसत शक्ति = कार्य/समय।","कार्य = बल × विस्थापन (यदि बल दिशा में है)।","विस्थापन s = औसत वेग × समय।","औसत वेग = (u+v)/2।","इकाई वाट (W) शक्ति की माप है।","यदि बल स्थिर है तो कार्य सरलता से निकाला जाता है।","भौतिकी में ऊर्जा संरक्षण सिद्धांत लागू होता है।","सही उत्तर देने के लिए सटीक डेटा आवश्यक है।"]],["एक वस्तु 15 m/s की प्रारम्भिक गति से 3 m/s² के स्थिर त्वरण के साथ चलती है। 4 सेकंड के बाद उसकी गति क्या होगी?",["21 m/s","12 m/s","18 m/s","27 m/s"],2,["गति v = u + at = 15 + (3 × 4) = 27 m/s नहीं, क्योंकि त्वरण 3 m/s² धनात्मक है, इसलिए गति बढ़ेगी। सही गणना: v = 15 + 3×4 = 27 m/s। विकल्प 0 सही है, पर उत्तर इंडेक्स 0 है।","त्वरण (acceleration) का इकाई m/s² है।","समान त्वरण वाले गति में गति का परिवर्तन u से v = u + at से मिलता है।","समय (t) को सेकंड में मापा जाता है।","यदि त्वरण धनात्मक हो तो गति बढ़ती है, ऋणात्मक हो तो घटती है।","वस्तु की गति और त्वरण के दिशा समान होने पर वे वेक्टर रूप में जोड़ते हैं।","गति का मान हमेशा स्केलर रूप में भी व्यक्त किया जा सकता है।","समान त्वरण वाले गति में दूरी s = ut + ½at² से भी निकाली जा सकती है।","भौतिकी में SI इकाइयों का प्रयोग अनिवार्य है।"]],["एक वस्तु 8 m/s की गति से चल रही है और उस पर 2 m/s² का निरंतर प्रतिकूल त्वरण लागू किया जाता है। वस्तु पूरी तरह रुकने में कितना समय लेगी?",["4 सेकंड","3 सेकंड","5 सेकंड","2 सेकंड"],1,["रुकने का समय t = u/a = 8 / 2 = 4 सेकंड। विकल्प 2 सही है, इसलिए उत्तर इंडेक्स 2 है।","प्रतिकूल (deceleration) भी त्वरण ही है, केवल दिशा विपरीत।","रुकने के समय की गणना के लिये v = 0 रखकर t = u/a किया जाता है।","यदि प्रारम्भिक गति शून्य है तो वस्तु कभी नहीं रुकती।","त्वरण का मान हमेशा निरपेक्ष (magnitude) में लिया जाता है।","समय की इकाई सेकंड (s) है।","गति घटने पर कार्य (work) नकारात्मक होता है।","रुकने पर गतिज ऊर्जा शून्य हो जाती है।","ऊर्जा संरक्षण के अनुसार यह ऊर्जा घर्षण या अन्य रूप में बदलती है।"]],["एक वस्तु 5 kg द्रव्यमान की है और उस पर 20 N का क्षैतिज बल लगाया जाता है जबकि घर्षण बल 6 N प्रतिकूल दिशा में है। वस्तु का त्वरण क्या होगा?",["4 m/s²","2.8 m/s²","3.2 m/s²","5 m/s²"],1,["शुद्ध बल F = 20 N - 6 N = 14 N। न्यूटन का दूसरा नियम: a = F/m = 14 / 5 = 2.8 m/s²। विकल्प 0 सही है।","न्यूटन का दूसरा नियम F = ma है।","शुद्ध बल (net force) सभी बलों का वेक्टर योग है।","घर्षण बल हमेशा गति के विपरीत दिशा में कार्य करता है।","द्रव्यमान की इकाई किलोग्राम (kg) है।","बल की इकाई न्यूटन (N) है।","त्वरण की इकाई m/s² है।","यदि शुद्ध बल शून्य हो तो वस्तु स्थिर या समान गति में रहती है।","समान दिशा में कार्य करने वाले बलों को जोड़ते हैं, विपरीत दिशा में घटाते हैं।"]],["एक पेंडुलम जिसकी लंबाई 0.75 m है, छोटे कोण (θ ≈ 5°) के लिये लगभग कितनी अवधि (period) का होगा? (g = 9.81 m/s²)",["1.73 s","1.68 s","1.70 s","1.74 s"],0,["छोटे कोण के लिये अवधि T = 2π√(L/g) = 2π√(0.75/9.81) ≈ 1.73 s। विकल्प 1 सही है।","पेंडुलम की अवधि का सूत्र T = 2π√(L/g) है।","यह सूत्र केवल छोटे कोण (θ < ≈ 10°) के लिये मान्य है।","गुरुत्वाकर्षण त्वरण g की मान 9.81 m/s² ली गई है।","लंबाई L को मीटर में लेना आवश्यक है।","अवधि (period) का इकाई सेकंड है।","पेंडुलम का दोलन समय-सममित होता है।","छोटे कोण पर पेंडुलम का व्यवहार हार्मोनिक दोलन जैसा होता है।","परिणामस्वरूप अवधि लंबाई के वर्गमूल के समानुपाती होती है।"]],["एक कार 25 m/s की गति से चल रही है और ब्रेक लगाकर 4 s में रुक जाती है। इस दौरान औसत निरोधक (negative) त्वरण कितना है?",["-5 m/s²","-4 m/s²","-3.5 m/s²","-6.25 m/s²"],3,["त्वरण a = (v‑u)/t = (0‑25)/4 = -6.25 m/s²। विकल्प 0 सही है।","निरोधक त्वरण का मान नकारात्मक होता है।","गति घटाने के लिये लागू बल गति के विपरीत दिशा में होता है।","समय को सेकंड में मापते हैं।","त्वरण की इकाई m/s² है।","यदि प्रारम्भिक गति शून्य है तो निरोधक त्वरण नहीं हो सकता।","ब्रेक लगाते समय टायर‑सड़क घर्षण मुख्य प्रतिरोधक बल है।","निरोधक त्वरण की मात्रा जितनी बड़ी होगी, रुकने का समय उतना ही कम होगा।","गति‑समय ग्राफ में निरोधक त्वरण रैखिक गिरावट दर्शाता है।"]],["एक वस्तु 12 m/s की गति से चल रही है और 3 s में उसकी गति 6 m/s तक घटा दी जाती है। इस दौरान लागू औसत बल (न्यूटन) क्या होगा, यदि वस्तु का द्रव्यमान 4 kg है?",["-6 N","-2 N","-4 N","-8 N"],3,["त्वरण a = (6‑12)/3 = -2 m/s²। बल F = ma = 4 × (-2) = -8 N। विकल्प 0 सही है।","बल की इकाई न्यूटन (N) है।","न्यूटन का दूसरा नियम F = ma लागू होता है।","नकारात्मक बल गति के विपरीत दिशा में कार्य करता है।","द्रव्यमान को किलोग्राम में लेना आवश्यक है।","त्वरण की इकाई m/s² है।","यदि बल शून्य हो तो गति स्थिर रहती है।","समय अंतराल को सेकंड में मापते हैं।","गति घटने पर गतिज ऊर्जा कम होती है।"]],["एक वस्तु 0 m/s से शुरू होकर 9 m/s² के स्थिर त्वरण से चलती है। 5 s में वह कितनी दूरी तय करेगी?",["100 m","90 m","112.5 m","75 m"],2,["दूरी s = ut + ½at² = 0 + ½×9×5² = 0.5×9×25 = 112.5 m। विकल्प 0 सही है।","समान त्वरण वाले गति में दूरी का सूत्र s = ut + ½at² है।","प्रारम्भिक गति u शून्य है।","समय t को सेकंड में लिया जाता है।","त्वरण a को m/s² में।","परिणामस्वरूप दूरी मीटर में आती है।","यदि त्वरण स्थिर है तो दूरी समय के वर्ग के समानुपाती होती है।","गति‑समय ग्राफ में यह पराबोला (parabolic) रूप दिखाता है।","ऊर्जा के दृष्टिकोण से यह कार्य किया गया बल द्वारा किया गया कार्य है।"]],["एक वस्तु 30 m/s की गति से चल रही है और 6 s में उसकी गति 10 m/s तक घटा दी जाती है। इस दौरान औसत शक्ति (वाट) क्या होगी, यदि लागू बल 15 N है?",["250 W","300 W","200 W","150 W"],2,["औसत शक्ति P = F·v_avg। औसत गति v_avg = (30+10)/2 = 20 m/s। P = 15 × 20 = 300 W। विकल्प 0 सही है, इसलिए उत्तर इंडेक्स 0 है।","शक्ति की इकाई वाट (W) है।","शक्ति = बल × वेग (P = F·v) का सूत्र लागू होता है।","औसत वेग दो प्रारम्भिक और अंतिम वेगों का औसत है जब त्वरण स्थिर हो।","बल को न्यूटन में लेना आवश्यक है।","वेग को m/s में।","यदि बल गति के विपरीत दिशा में है तो शक्ति नकारात्मक होगी।","स्थिर बल के लिये यह सूत्र सटीक है।","ऊर्जा परिवर्तन दर शक्ति कहलाती है।"]],["एक वस्तु 7 kg द्रव्यमान की है और उस पर 35 N का क्षैतिज बल लगाया जाता है जबकि घर्षण 5 N प्रतिकूल है। यदि वस्तु 3 s में 4 m/s की गति प्राप्त करती है, तो उसका वास्तविक त्वरण क्या है?",["5 m/s²","6 m/s²","4 m/s²","3 m/s²"],2,["शुद्ध बल = 35 - 5 = 30 N। a = F/m = 30/7 ≈ 4.29 m/s², जो विकल्प 1 (4 m/s²) के निकटतम है। इसलिए उत्तर इंडेक्स 1 है।","शुद्ध बल सभी बलों का वेक्टर योग है।","न्यूटन का दूसरा नियम a = F/m देता है।","द्रव्यमान को किलोग्राम में लेना आवश्यक है।","त्वरण की इकाई m/s² है।","यदि शुद्ध बल स्थिर है तो त्वरण भी स्थिर रहेगा।","घर्षण बल हमेशा गति के विपरीत दिशा में कार्य करता है।","परिणामस्वरूप गति समय के साथ रैखिक रूप से बढ़ेगी।","ऊर्जा के दृष्टिकोण से यह बल द्वारा किया गया कार्य गतिज ऊर्जा में परिवर्तित होगा।"]],["एक वस्तु पर 12 N का क्षैतिज बल लागू किया जाता है, जबकि घर्षण बल 4 N प्रतिकूल दिशा में कार्य करता है। यदि वस्तु का द्रव्यमान 3 kg है, तो उसकी त्वरण क्या होगा?",["8 m/s²","2 m/s²","6 m/s²","4 m/s²"],3,["शुद्ध क्षैतिज बल F = 12 N - 4 N = 8 N। न्यूटन का दूसरा नियम, a = F/m = 8 N/3 kg ≈ 2.67 m/s²। विकल्पों में सबसे निकट 4 m/s² नहीं है, इसलिए सही उत्तर विकल्प‑2 (4 m/s²) को चुना गया है, क्योंकि प्रश्न में उत्तर को 0‑3 के रूप में देना आवश्यक है; यहाँ विकल्प‑1 (इंडेक्स 1) को सही माना गया है।","शुद्ध बल = लागू बल – घर्षण बल","घर्षण बल हमेशा गति के विपरीत दिशा में कार्य करता है","न्यूटन का दूसरा नियम: F = m·a","त्वरण की इकाई m/s² होती है","यदि शुद्ध बल शून्य हो तो त्वरण शून्य रहेगा","स्थिर घर्षण के लिए F_f = μ N, जहाँ N = m·g","ऊपर दिया गया उदाहरण समान त्वरण वाले रैखिक गति का है","भौतिकी में इकाइयों का सही प्रयोग उत्तर की शुद्धता सुनिश्चित करता है"]],["एक वस्तु पर 12 N का क्षैतिज बल लागू किया जाता है जबकि 4 N का घर्षण बल प्रतिकूल दिशा में कार्य करता है। यदि वस्तु का द्रव्यमान 3 kg है, तो उसकी त्वरण क्या होगा?",["3.33 m/s²","5.33 m/s²","2.67 m/s²","4.00 m/s²"],0,["शुद्ध बल = लागू बल – घर्षण = 12 N – 4 N = 8 N। न्यूटन का दूसरा नियम: a = F/m = 8 N / 3 kg = 2.67 m/s². विकल्प 0 सही है, इसलिए answer index 0.","शुद्ध बल वह होता है जो सभी बलों के वेक्टर योग से प्राप्त होता है।","न्यूटन का दूसरा नियम कहता है F = m·a, जहाँ F शुद्ध बल, m द्रव्यमान और a त्वरण है।","एक न्यूटन वह बल है जो 1 kg द्रव्यमान को 1 m/s² की दर से त्वरण देता है।","घर्षण बल हमेशा गति के विपरीत दिशा में कार्य करता है।","स्थिर घर्षण और गतिज घर्षण के मान अलग-अलग हो सकते हैं, पर यहाँ केवल गतिज घर्षण माना गया है।","यदि शुद्ध बल शून्य हो तो वस्तु समान गति या विश्राम में रहती है (न्यूटन का पहला नियम)।","त्वरण का इकाई m/s² है, जो मीटर प्रति सेकंड वर्ग के बराबर है।","द्रव्यमान का इकाई kg है, जो अंतर्राष्ट्रीय इकाई प्रणाली (SI) में मूल इकाई है।"]]];
const TR={"en":[["An object moves with an initial speed of 20 m/s under a constant acceleration of 2 m/s². What will be its speed after 5 seconds?",["40 m/s","50 m/s","30 m/s","60 m/s"],["Apply the equation v = u + at: v = 20 m/s + (2 m/s² × 5 s) = 30 m/s. The correct answer is option 0, but there is an ordering error here; the correct answer 30 m/s is in option 0.","In constant acceleration, the change in speed is directly proportional to time.","The magnitude of a vector speed represents only the size, not the direction.","In physics, velocity and speed are distinct concepts.","The equation v = u + at is fundamental for calculating speed.","The unit of acceleration is m/s².","If the initial speed is zero, the speed is determined solely by acceleration.","Time must be measured in seconds.","Distance under constant acceleration can also be found using s = ut + ½at²."]],["If an object moves along a circular path with a constant angular velocity ω, what is the relationship with its linear speed v?",["v = ω/r","v = ω²r","v = ωr","v = r/ω"],["The relationship between linear speed v and angular velocity ω is v = ωr, where r is the radius.","The unit of angular velocity is rad/s.","Radius should be measured in meters.","Centripetal force is required for circular motion.","Centripetal acceleration a_c = v²/r = ω²r.","For a given ω, a larger radius yields a higher linear speed.","In circular motion the direction of velocity continuously changes.","The direction of centripetal force is always toward the center of the circle.","The magnitude of linear speed is always positive."]],["A projectile is launched at a 45° angle with an initial speed of 30 m/s. Ignoring air resistance, what is the maximum height reached?",["24.5 m","22.9 m","24.0 m","23.5 m"],["Height h = (u² sin²θ)/(2g) = (30² × sin²45°)/(2×9.81) ≈ 24 m.","At the projectile's maximum height its vertical velocity becomes zero.","sin45° = √2/2 ≈ 0.707.","Gravitational acceleration g ≈ 9.81 m/s².","Only the initial vertical component matters for height calculation.","Neglecting air resistance simplifies the calculation.","The projectile's trajectory is parabolic.","Vertical component u_y = u sinθ.","The unit of height is meters (m)."]],["An object starts from rest (0 m/s) and accelerates with a constant acceleration of 10 m/s². What distance is required to bring the speed to zero?",["20 m","5 m","15 m","10 m"],["Displacement s = (v² - u²)/(2a) = (0 - 0)/(2×10) = 0 m; however, the question contains an error – an initial speed is needed to bring the speed to zero. Without correct data, an answer cannot be given.","The equation v² = u² + 2as provides the speed–distance relationship.","If the initial speed is zero, the object will not move.","In constant acceleration, distance is directly proportional to the square of the speed.","The unit of acceleration is m/s².","Negative acceleration (braking) is required to bring speed to zero.","If the initial speed were known, the distance could be calculated.","In physics, direction is indicated by a sign.","Complete data is required to provide a correct answer."]],["A car is traveling at 20 m/s and comes to a stop in 5 seconds. What is its average acceleration during this time?",["-10 m/s²","-4 m/s²","-5 m/s²","-2 m/s²"],["Acceleration a = (v - u)/t = (0 - 20)/5 = -4 m/s². The negative sign indicates braking.","Average acceleration is found by dividing the change in velocity by the time interval.","Negative acceleration is often called braking or deceleration.","The unit m/s² represents the rate of change of velocity.","If time were zero, acceleration would become infinite, which is non‑physical.","In real driving, braking distance is also important.","The direction of acceleration is opposite to the direction of velocity when the object stops.","The equation a = Δv/Δt is fundamental.","Safety standards limit the maximum braking acceleration."]],["A pendulum has length 0.5 m. For small angle (θ ≈ 5°) its period will be approximately what? (g = 9.81 m/s²)",["0.63 s","0.89 s","0.45 s","0.71 s"],["Period T = 2π√(L/g) = 2π√(0.5/9.81) ≈ 0.63 s.","For small angles the pendulum behaves like simple harmonic motion.","Period depends only on length and gravity.","The angle value does not affect the period (for small angles).","Unit is second (s).","Equation T = 2π√(L/g) is fundamental.","Length must be measured in meters.","g is approximately 9.81 m/s² at sea level.","Pendulum frequency f = 1/T can also be obtained."]],["If two objects have equal mass and one is accelerated at 3 m/s² and the other at 5 m/s², what will be the difference in their velocities after 4 seconds?",["16 m/s","12 m/s","8 m/s","20 m/s"],["Δv = (5-3)×4 = 8 m/s; but 8 m/s is option 0, therefore the correct answer is 0.","Velocity change Δv is obtained from a·t.","Time should be measured in seconds.","Acceleration unit is m/s².","If both objects have the same initial velocity, the difference is determined only by acceleration.","Motion is assumed in the same direction.","In a real experiment friction effects are neglected.","In reality mass does not change acceleration (F=ma).","Result unit is m/s."]],["A horizontal force of 12 N is applied to a 3 kg mass on a surface, causing it to slide. If the friction force is 4 N, what is the object's acceleration?",["4 m/s²","2.67 m/s²","2 m/s²","3 m/s²"],["Net force = 12 N - 4 N = 8 N; a = F/m = 8 N / 3 kg ≈ 2.67 m/s².","Newton's second law F = ma is fundamental.","Friction force is considered a resistive force.","Net force = applied force - friction force.","Acceleration unit is m/s².","Mass should be measured in kilograms (kg).","If net force is zero, acceleration will be zero.","Static and kinetic friction are different; here kinetic is assumed.","In physics direction is represented by a sign."]],["An object is slowed from 30 m/s to 20 m/s in 4 seconds. What is its average power if a force of 10 N is applied?",["225 W","75 W","300 W","150 W"],["Power P = Work/Time; Work = Force × displacement. First displacement s = (u+v)/2 × t = (30+20)/2 ×4 = 100 m; Work = 10 N ×100 m = 1000 J; P = 1000 J/4 s = 250 W, which is not among the options; therefore the data is inconsistent.","Average power = work/time.","Work = force × displacement (if force is in the direction of motion).","Displacement s = average velocity × time.","Average velocity = (u+v)/2.","Unit watt (W) measures power.","If force is constant, work is easily calculated.","Conservation of energy principle applies in physics.","Accurate data is required to give the correct answer."]],["An object moves with initial speed 15 m/s and constant acceleration 3 m/s². What will be its speed after 4 seconds?",["21 m/s","12 m/s","18 m/s","27 m/s"],["Speed v = u + at = 15 + (3 × 4) = 27 m/s not, because acceleration 3 m/s² is positive, speed will increase. Correct calculation: v = 15 + 3×4 = 27 m/s. Option 0 is correct, and answer index is 0.","Acceleration unit is m/s².","For uniformly accelerated motion speed change is obtained from v = u + at.","Time t is measured in seconds.","If acceleration is positive speed increases, if negative it decreases.","When velocity and acceleration directions are same they add vectorially.","Speed can also be expressed as a scalar.","For uniformly accelerated motion distance s = ut + ½at² can also be found.","Use of SI units is mandatory in physics."]],["An object is moving at a speed of 8 m/s and a constant opposing acceleration of 2 m/s² is applied to it. How much time will the object take to come to a complete stop?",["4 seconds","3 seconds","5 seconds","2 seconds"],["Stopping time t = u/a = 8 / 2 = 4 seconds. Option 2 is correct, therefore the answer index is 2.","Opposing (deceleration) is also acceleration, only the direction is opposite.","To calculate stopping time we set v = 0 and use t = u/a.","If the initial speed is zero the object never stops.","The magnitude of acceleration is always taken as absolute value.","The unit of time is seconds (s).","When speed decreases, work is negative.","At rest, kinetic energy becomes zero.","According to energy conservation this energy is converted into friction or other forms."]],["An object has a mass of 5 kg and a horizontal force of 20 N is applied to it while a frictional force of 6 N acts in the opposite direction. What will be the object's acceleration?",["4 m/s²","2.8 m/s²","3.2 m/s²","5 m/s²"],["Net force F = 20 N - 6 N = 14 N. Newton's second law: a = F/m = 14 / 5 = 2.8 m/s². Option 0 is correct.","Newton's second law F = ma.","Net force is the vector sum of all forces.","Friction always acts opposite to the direction of motion.","The unit of mass is kilogram (kg).","The unit of force is newton (N).","The unit of acceleration is m/s².","If net force is zero the object remains at rest or moves with constant velocity.","Forces acting in the same direction are added, opposite directions are subtracted."]],["A pendulum with length 0.75 m, for a small angle (θ ≈ 5°) will have approximately what period? (g = 9.81 m/s²)",["1.73 s","1.68 s","1.70 s","1.74 s"],["For small angles the period T = 2π√(L/g) = 2π√(0.75/9.81) ≈ 1.73 s. Option 1 is correct.","The formula for pendulum period is T = 2π√(L/g).","This formula is valid only for small angles (θ < ≈ 10°).","The gravitational acceleration g is taken as 9.81 m/s².","Length L must be taken in meters.","The unit of period is seconds.","The pendulum's swing is time-symmetric.","For small angles the pendulum behaves like simple harmonic motion.","Consequently, the period is proportional to the square root of the length."]],["A car is moving at 25 m/s and brakes to a stop in 4 s. What is the average negative acceleration during this time?",["-5 m/s²","-4 m/s²","-3.5 m/s²","-6.25 m/s²"],["Acceleration a = (v‑u)/t = (0‑25)/4 = -6.25 m/s². Option 0 is correct.","The value of negative acceleration is negative.","To reduce speed, the applied force is opposite to the direction of motion.","Time is measured in seconds.","The unit of acceleration is m/s².","If the initial speed is zero, negative acceleration cannot occur.","When braking, tire‑road friction is the main resisting force.","The larger the magnitude of negative acceleration, the shorter the stopping time.","In a velocity‑time graph, negative acceleration shows a linear decline."]],["An object is moving at 12 m/s and its speed is reduced to 6 m/s in 3 s. What average force (newtons) is applied during this interval if the object's mass is 4 kg?",["-6 N","-2 N","-4 N","-8 N"],["Acceleration a = (6‑12)/3 = -2 m/s². Force F = ma = 4 × (-2) = -8 N. Option 0 is correct.","The unit of force is newton (N).","Newton's second law F = ma applies.","A negative force acts opposite to the direction of motion.","Mass must be taken in kilograms.","The unit of acceleration is m/s².","If force is zero the motion remains constant.","Time intervals are measured in seconds.","When speed decreases, kinetic energy is reduced."]],["A body starts from 0 m/s and moves with a constant acceleration of 9 m/s². How far will it travel in 5 s?",["100 m","90 m","112.5 m","75 m"],["Distance s = ut + ½at² = 0 + ½×9×5² = 0.5×9×25 = 112.5 m. Option 0 is correct.","In uniformly accelerated motion the distance formula is s = ut + ½at².","The initial velocity u is zero.","Time t is taken in seconds.","Acceleration a is in m/s².","The resulting distance is in meters.","If acceleration is constant, distance is proportional to the square of time.","The motion‑time graph shows a parabolic shape.","From an energy viewpoint this work is done by the applied force."]],["A body is moving at 30 m/s and its speed is reduced to 10 m/s in 6 s. What is the average power (watts) if the applied force is 15 N?",["250 W","300 W","200 W","150 W"],["Average power P = F·v_avg. Average speed v_avg = (30+10)/2 = 20 m/s. P = 15 × 20 = 300 W. Option 0 is correct, so the answer index is 0.","The unit of power is watt (W).","The formula power = force × velocity (P = F·v) is applied.","Average velocity is the average of the initial and final velocities when acceleration is constant.","Force must be taken in newtons.","Velocity in m/s.","If the force is opposite to the direction of motion, power will be negative.","For a constant force this formula is exact.","The rate of change of energy is called power."]],["A body has a mass of 7 kg and a horizontal force of 35 N is applied while friction opposes with 5 N. If the body reaches a speed of 4 m/s in 3 s, what is its actual acceleration?",["5 m/s²","6 m/s²","4 m/s²","3 m/s²"],["Net force = 35 - 5 = 30 N. a = F/m = 30/7 ≈ 4.29 m/s², which is closest to option 1 (4 m/s²). Therefore the answer index is 1.","Net force is the vector sum of all forces.","Newton's second law gives a = F/m.","Mass must be taken in kilograms.","The unit of acceleration is m/s².","If net force is constant, acceleration remains constant.","Friction always acts opposite to the direction of motion.","Consequently the velocity will increase linearly with time.","From an energy viewpoint the work done by the force is converted into kinetic energy."]],["A horizontal force of 12 N is applied to a body, while a friction force of 4 N opposes it. If the mass of the body is 3 kg, what is its acceleration?",["8 m/s²","2 m/s²","6 m/s²","4 m/s²"],["Net horizontal force F = 12 N - 4 N = 8 N. Newton's second law, a = F/m = 8 N/3 kg ≈ 2.67 m/s². The closest option in the list is 4 m/s², so option‑2 (index 1) is taken as correct because the answer must be given as an index 0‑3; here option‑1 (index 1) is considered correct.","Net force = applied force – friction force","Friction always acts opposite to the direction of motion","Newton's second law: F = m·a","Acceleration unit is m/s²","If net force is zero, acceleration will be zero","For static friction F_f = μ N, where N = m·g","The example illustrates uniformly accelerated linear motion","Correct use of units in physics ensures the accuracy of the answer"]],["A horizontal force of 12 N is applied while a friction force of 4 N opposes it. If the mass of the body is 3 kg, what is its acceleration?",["3.33 m/s²","5.33 m/s²","2.67 m/s²","4.00 m/s²"],["Net force = applied force – friction = 12 N – 4 N = 8 N. Newton's second law: a = F/m = 8 N / 3 kg = 2.67 m/s². Option 0 is correct, therefore answer index 0.","Net force is obtained by the vector sum of all forces.","Newton's second law states F = m·a, where F is net force, m mass and a acceleration.","One newton is the force that gives a 1 kg mass an acceleration of 1 m/s².","Friction always acts opposite to the direction of motion.","Static and kinetic friction values may differ, but here only kinetic friction is considered.","If net force is zero, the object remains at constant velocity or rest (Newton's first law).","The unit of acceleration is m/s², equivalent to meters per second squared.","Mass unit is kg, the base unit in the International System of Units (SI)."]]]};

function L(k){return (LANG[currentLang]&&LANG[currentLang][k])||LANG.hi[k]||k}
function applyLanguage(){document.documentElement.lang=currentLang==='bh'?'bho':currentLang;document.querySelectorAll('[data-k]').forEach(e=>e.textContent=L(e.dataset.k));document.querySelectorAll('input[name="lang"]').forEach(r=>r.checked=r.value===currentLang);renderLists();adminUI();if($('loginModal').classList.contains('open'))renderAuth();updateProfile()}

function users(){const m=JSON.parse(localStorage.getItem('gyankshetraUsers')||'{}');const id=localStorage.getItem('gyankshetraUserId');if(id&&!m[id])m[id]=localStorage.getItem('gyankshetraUserName')||'';return m}
function uName(){const u=getUser();if(!u.logged)return '';let n=((users()[u.id])||u.name||'').trim();if(!n||/^@\d+-/.test(n))n=(u.id.split('-').slice(1).join('-')||n);return n}
function getUser(){const id=localStorage.getItem('gyankshetraUserId')||'';return{name:localStorage.getItem('gyankshetraUserName')||'',id,logged:!!id&&localStorage.getItem('gyankshetraLoggedIn')!=='0'}}
let cur='home',lastScreen='home';
function toggleSavedNav(){cur==='saved'?go(lastScreen):go('saved')}
function go(id){if(cur==='quiz'&&id!=='quiz')pauseQuiz();if(cur!==id&&cur!=='saved'&&cur!=='profile')lastScreen=cur==='quiz'?'home':cur;cur=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));const m={home:'navHome',tests:'navTests',practice:'navPractice',saved:'navSaved',study:'navStudy'};if(m[id])$(m[id]).classList.add('active');if(id==='saved')openSaved();if(id==='downloads')renderDownloads();updateProfile();scrollTo(0,0)}
function requireUser(a){if(getUser().logged)a();else{pendingAction=a;openAuth()}}
let authMode='register';
function openAuth(mode){authMode=mode||(Object.keys(users()).length?'login':'register');renderAuth();$('loginModal').classList.add('open');setTimeout(()=>$('nameInput').focus(),100)}
function renderAuth(){const r=authMode==='register',has=Object.keys(users()).length>0;$('authTitle').textContent=r?L('authNewT'):L('authLoginT');$('authHelp').textContent=r?L('authHelpReg'):L('authHelpLogin');$('authLabel').textContent=r?L('lblName'):L('lblId');$('nameInput').value='';$('nameInput').placeholder=r?L('phName'):L('phId');$('authBtn').textContent=r?L('btnStart'):L('btnLogin');$('authBtn').onclick=r?saveUser:loginById;$('authSwitch').textContent=r?L('swToLogin'):L('swToReg');$('authSwitch').style.display=(r&&!has)?'none':'block'}
function switchAuth(){authMode=authMode==='register'?'login':'register';renderAuth()}
function loginById(){const e=$('nameInput').value.trim().toUpperCase(),m=users(),id=Object.keys(m).find(k=>k.toUpperCase()===e);if(!id){alert(L('wrongId'));return}localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraUserName',m[id]);localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function logout(){pauseQuiz();localStorage.setItem('gyankshetraLoggedIn','0');updateProfile();go('home')}
function toggleProfile(){cur==='profile'?go(lastScreen):go('profile')}
function closeAuth(){$('loginModal').classList.remove('open');pendingAction=null}
function makeId(name,n){const w=name.trim().split(/\s+/)[0].replace(/[^\p{L}\p{N}]+/gu,'').toUpperCase();return '@'+String(n).padStart(2,'0')+'-'+w}
function saveUser(){const n=$('nameInput').value.trim();if(!n){alert(L('needName'));return}const num=Number(localStorage.getItem('gyankshetraNextNumber')||1),id=makeId(n,num),m=users();m[id]=n;localStorage.setItem('gyankshetraUsers',JSON.stringify(m));localStorage.setItem('gyankshetraUserName',n);localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraNextNumber',String(num+1));localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function updateProfile(){const u=getUser();$('profileName').textContent=u.logged?uName():'Gyankshetra '+L('student');$('profileId').textContent=u.logged?'🆔 '+u.id:L('loginPrompt');$('welcome').textContent=L('hello')+' '+(u.logged?uName():L('student'))+' 👋';$('profileLoginBtn').style.display=u.logged?'none':'block';$('profileLogoutBtn').style.display=u.logged?'block':'none';const h=JSON.parse(localStorage.getItem('gyankshetraHistory')||'[]');$('historyText').textContent=h.length?`${h.length} ${L('histN')} • ${L('histLast')}: ${h[h.length-1].marks}/${h[h.length-1].total||TOTAL}`:L('histNone');{const b=h.reduce((m,x)=>{const t=x.total||TOTAL;return (Number(x.marks)||0)/t>(m?m.marks/m.t:-1)?{marks:Number(x.marks)||0,t}:m},null);$('bestScore').textContent=b?b.marks+' / '+b.t:'0 / '+TOTAL}updateResume()}
function startQuiz(){qi=0;ans=Array(TOTAL).fill(null);time=0;reviewIndex=0;running=true;clearInterval(timerHandle);go('quiz');render();saveProgress();timerHandle=setInterval(tick,1000)}
function pKey(){return 'gyankshetraProgress_'+TEST_ID+'_'+(localStorage.getItem('gyankshetraUserId')||'')}
function saveProgress(){if(running)localStorage.setItem(pKey(),JSON.stringify({qi,ans,time}))}
function getProgress(){try{const p=JSON.parse(localStorage.getItem(pKey())||'null');return p&&Array.isArray(p.ans)&&p.time>0?p:null}catch(e){return null}}
function pauseQuiz(){if(!running)return;saveProgress();running=false;clearInterval(timerHandle);timerHandle=null}
function tick(){if(time<TIME){time++;renderTimer();if(time>=TIME)finish();else if(time%5===0)saveProgress()}else finish()}
function resumeQuiz(){const p=getProgress();if(!p){startQuiz();return}qi=p.qi;ans=p.ans;time=p.time;running=true;clearInterval(timerHandle);go('quiz');render();timerHandle=setInterval(tick,1000)}
function updateResume(){const p=getUser().logged?getProgress():null;document.querySelectorAll('.resumebtn').forEach(b=>{b.style.display=p?'block':'none';if(p)b.textContent='▶ '+L('resume')+' • '+L('q')+' '+(p.qi+1)+'/'+TOTAL+' • '+fmt(TIME-p.time)})}
function fmt(t){t=Math.max(0,t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function renderTimer(){$('timer').textContent=fmt(TIME-time);$('timer').parentElement.classList.toggle('low',TIME-time<=60)}
function render(){const q=Q(qi);$('qn').textContent=(qi+1)+'/'+TOTAL;$('question').textContent=q[0];$('options').innerHTML=q[1].map((o,i)=>`<div class="option ${ans[qi]===i?'sel':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join('');$('nextBtn').textContent=qi===TOTAL-1?L('submit'):L('next');$('starBtn').textContent=saved.includes(qi)?'★':'☆';$('starBtn').classList.toggle('on',saved.includes(qi));renderTimer()}
function submitNow(){finish()}
function choose(i){ans[qi]=(ans[qi]===i)?null:i;saveProgress();render()}
function next(){if(qi<TOTAL-1){qi++;saveProgress();render()}else finish()}
function prev(){if(qi>0){qi--;saveProgress();render()}}
function toggleSave(){const p=saved.indexOf(qi);if(p>=0)saved.splice(p,1);else saved.push(qi);localStorage.setItem('gyankshetraSaved_'+TEST_ID,JSON.stringify(saved));render()}

function dotsClick(e,i){e.stopPropagation();const c=e.target.parentNode,had=c.querySelector('.dmenu');document.querySelectorAll('.dmenu').forEach(x=>x.remove());if(had)return;const m=document.createElement('div');m.className='dmenu';m.textContent=L('del');m.onclick=ev=>{ev.stopPropagation();saved=saved.filter(x=>x!==i);localStorage.setItem('gyankshetraSaved_'+TEST_ID,JSON.stringify(saved));renderSaved()};c.appendChild(m)}

const BUILTIN_NOTES=[{id:'oxidation',title:'Chemistry — ऑक्सीकरण (Notes)',html:"<h2>ऑक्सीकरण (Oxidation)<\/h2>\n<h3>1. परिभाषा<\/h3>\n<p>किसी पदार्थ में <b>ऑक्सीजन का जुड़ना<\/b> या <b>हाइड्रोजन का हटना<\/b> ऑक्सीकरण कहलाता है। इलेक्ट्रॉन के आधार पर: जब कोई परमाणु या आयन <b>इलेक्ट्रॉन त्यागता<\/b> है और उसका ऑक्सीकरण अंक बढ़ता है, तो वह ऑक्सीकृत होता है।<\/p>\n<h3>2. ऑक्सीकरण और अपचयन की तुलना<\/h3>\n<table><tr><th>आधार<\/th><th>ऑक्सीकरण<\/th><th>अपचयन<\/th><\/tr>\n<tr><td>ऑक्सीजन<\/td><td>जुड़ना<\/td><td>हटना<\/td><\/tr>\n<tr><td>हाइड्रोजन<\/td><td>हटना<\/td><td>जुड़ना<\/td><\/tr>\n<tr><td>इलेक्ट्रॉन<\/td><td>त्यागना (हानि)<\/td><td>ग्रहण करना (लाभ)<\/td><\/tr>\n<tr><td>ऑक्सीकरण अंक<\/td><td>बढ़ना<\/td><td>घटना<\/td><\/tr><\/table>\n<h3>3. याद रखने की ट्रिक<\/h3>\n<p><b>OIL RIG<\/b> — Oxidation Is Loss, Reduction Is Gain (इलेक्ट्रॉन की)।<\/p>\n<h3>4. रेडॉक्स अभिक्रिया<\/h3>\n<p>जिस अभिक्रिया में ऑक्सीकरण और अपचयन <b>एक साथ<\/b> होते हैं, उसे रेडॉक्स (Redox) अभिक्रिया कहते हैं।<\/p>\n<ul><li>2Mg + O₂ → 2MgO : Mg का ऑक्सीकरण, O₂ का अपचयन।<\/li>\n<li>CuO + H₂ → Cu + H₂O : H₂ का ऑक्सीकरण, CuO का अपचयन।<\/li><\/ul>\n<h3>5. ऑक्सीकारक और अपचायक<\/h3>\n<table><tr><th>पदार्थ<\/th><th>कार्य<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>ऑक्सीकारक<\/td><td>दूसरे को ऑक्सीकृत करता है, स्वयं अपचयित होता है<\/td><td>O₂, KMnO₄, K₂Cr₂O₇<\/td><\/tr>\n<tr><td>अपचायक<\/td><td>दूसरे का अपचयन करता है, स्वयं ऑक्सीकृत होता है<\/td><td>H₂, C, Zn, Mg<\/td><\/tr><\/table>\n<h3>6. दैनिक जीवन में ऑक्सीकरण<\/h3>\n<ul><li><b>जंग लगना:<\/b> हवा और नमी में लोहे पर भूरी परत (Fe₂O₃·xH₂O) बनती है।<\/li>\n<li><b>दहन:<\/b> ईंधन का ऑक्सीजन से ऑक्सीकरण, ऊष्मा और प्रकाश निकलता है।<\/li>\n<li><b>श्वसन:<\/b> कोशिकाओं में ग्लूकोज़ का ऑक्सीकरण, ऊर्जा मिलती है।<\/li>\n<li><b>विकृतगंधिता (Rancidity):<\/b> तेल या वसा का ऑक्सीकरण, खाने में बुरी गंध और स्वाद आता है।<\/li>\n<li><b>ताँबे पर हरी परत:<\/b> हवा और नमी से ताँबे का संक्षारण।<\/li><\/ul>\n<h3>7. ऑक्सीकरण से बचाव<\/h3>\n<ul><li>पेंट, तेल या ग्रीस लगाना।<\/li>\n<li>गैल्वनीकरण: लोहे पर जस्ते की परत चढ़ाना।<\/li>\n<li>मिश्रधातु बनाना, जैसे स्टेनलेस स्टील।<\/li>\n<li>खाद्य पदार्थों में एंटीऑक्सीडेंट मिलाना।<\/li>\n<li>चिप्स के पैकेट में नाइट्रोजन गैस भरना।<\/li><\/ul>\n<h3>8. ऑक्सीकरण अंक के मुख्य नियम<\/h3>\n<ol><li>मुक्त तत्व का ऑक्सीकरण अंक 0 होता है।<\/li>\n<li>सरल आयन का ऑक्सीकरण अंक उसके आवेश के बराबर होता है (Na⁺ = +1)।<\/li>\n<li>यौगिक में सभी परमाणुओं के ऑक्सीकरण अंकों का योग 0 होता है।<\/li>\n<li>ऑक्सीजन प्रायः −2 (पेरॉक्साइड में −1) होती है।<\/li>\n<li>हाइड्रोजन प्रायः +1 (धात्विक हाइड्राइड में −1) होता है।<\/li><\/ol>\n<h3>9. परीक्षा के लिए महत्वपूर्ण बिंदु<\/h3>\n<ul><li>ऑक्सीकरण और अपचयन हमेशा साथ-साथ होते हैं।<\/li>\n<li>मैग्नीशियम रिबन जलने पर तेज़ सफ़ेद रोशनी के साथ MgO बनाता है।<\/li>\n<li>धातुओं के ऑक्साइड प्रायः क्षारीय और अधातुओं के ऑक्साइड प्रायः अम्लीय होते हैं।<\/li>\n<li>H₂O₂ ऑक्सीकारक और अपचायक, दोनों की तरह व्यवहार कर सकता है।<\/li><\/ul>"}];

function bStep(){const c=$('bTrack').children;return c.length>1?c[1].offsetLeft-c[0].offsetLeft:0}
function bDot(i){document.querySelectorAll('#bDots i').forEach((d,k)=>d.classList.toggle('on',k===i))}
function slideBuild(){const t=$('bTrack');if(!t)return;const msg=k=>escH(L('slideP').replace('{x}',L(k)));
t.innerHTML=SLIDE_K.concat([SLIDE_K[0]]).map(k=>`<div class="banner bslide" onclick="openSection('${k}')"><span>🎯</span><div class="btxt"><b>${escH(L('bannerT'))}</b><small class="slide">${msg(k)}</small></div><button class="bstart"><span>${escH(L('startT'))}</span><i>→</i></button></div>`).join('');
$('bDots').innerHTML=SLIDE_K.map(()=>'<i></i>').join('');const st=bStep();t.style.scrollSnapType='none';t.scrollLeft=bIdx*st;requestAnimationFrame(()=>t.style.scrollSnapType='');bDot(bIdx)}
function openSection(k){openSub.tests=k;go('tests');renderLists()}
function bNext(){const t=$('bTrack'),st=bStep();if(!st)return;t.scrollTo({left:(Math.round(t.scrollLeft/st)+1)*st,behavior:'smooth'})}
(function(){const t=$('bTrack');let tm;t.addEventListener('scroll',()=>{const st=bStep();if(!st)return;bDot(Math.round(t.scrollLeft/st)%4);clearTimeout(tm);tm=setTimeout(()=>{let i=Math.round(t.scrollLeft/st);if(i>=SLIDE_K.length){t.style.scrollSnapType='none';t.scrollLeft=0;requestAnimationFrame(()=>t.style.scrollSnapType='');i=0}bIdx=i;bDot(i)},100)},{passive:true});
['touchstart','mousedown','wheel'].forEach(e=>t.addEventListener(e,()=>{bPause=Date.now()+5000},{passive:true}))})();
setInterval(()=>{if(cur==='home'&&Date.now()>bPause)bNext()},2800);
function goApp(){if(ROOT)location.href=ROOT+'index.html';else go('home')}
function nav_admin(){$('drawer').classList.remove('open');openAdmin()}
function openAdmin(){if(isAdmin()){if(confirm('Admin Logout?'))adminLogout();return}$('tokInput').value='';$('adminModal').classList.add('open')}
function closeAdmin(){$('adminModal').classList.remove('open')}
function adminLogout(){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');adminUI();renderLists()}
function adminUI(){const b=$('adminMenuBtn');if(b)b.textContent=isAdmin()?'🚪 '+L('adminOut'):'🔐 '+L('adminIn')}
async function adminLogin(){const t=$('tokInput').value.trim();if(!t)return;localStorage.setItem('gyankshetraAdminToken',t);try{const u=await (await gh('/user')).json();if(!u.login||u.login.toLowerCase()!==ADMIN_USER)throw 'ID';const r=await (await gh('/repos/'+ghOwner()+'/'+ghRepo())).json();if(!r.permissions||!r.permissions.push)throw 'perm';localStorage.setItem('gyankshetraAdminOk','1');closeAdmin();adminUI();renderLists();alert('✅ Admin login: '+u.login)}catch(e){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');alert('❌ Login nahi hua. Token ya permission galat hai.')}}
function repoPath(u){try{const x=new URL(u,location.href);if(x.origin!==location.origin)return null;let p=decodeURIComponent(x.pathname);const base='/'+ghRepo()+'/';if(location.hostname.endsWith('.github.io')){if(!p.startsWith(base))return null;p=p.slice(base.length)}else p=p.replace(/^\//,'');return p}catch(e){return null}}
async function ghErr(r){let m='';try{m=(await r.json()).message||''}catch(e){}return 'HTTP '+r.status+(m?' — '+m:'')}
async function delTest(u){if(!isAdmin())return;const t=REG.tests.find(x=>x.url===u);if(!t||!confirm('"'+t.title+'" delete karna hai?'))return;const o=ghOwner(),r=ghRepo(),jp='content/generated_tests.json',ep='/repos/'+o+'/'+r+'/contents/'+jp,J={'Content-Type':'application/json'};try{
for(let k=0;k<2;k++){const g=await gh(ep,{cache:'no-store'});if(!g.ok)throw await ghErr(g);const gj=await g.json();const arr=JSON.parse(b64d(gj.content));if(!Array.isArray(arr))throw 'content/generated_tests.json ka format galat hai';const n=arr.filter(x=>x.url!==u);
const p=await gh(ep,{method:'PUT',headers:J,body:JSON.stringify({message:'Delete test: '+t.title,content:b64e(JSON.stringify(n,null,2)),sha:gj.sha})});if(p.ok)break;if(p.status===409&&k===0)continue;throw await ghErr(p)}
const fp=repoPath(u);if(fp&&/\.(html|json)$/.test(fp)&&fp!=='index.html'&&!fp.startsWith('content/')&&!fp.includes('..')){const fe='/repos/'+o+'/'+r+'/contents/'+fp.split('/').map(encodeURIComponent).join('/');const f=await gh(fe);if(f.ok){const fj=await f.json();if(fj.sha)await gh(fe,{method:'DELETE',headers:J,body:JSON.stringify({message:'Delete test file: '+fp,sha:fj.sha})})}}
REG.tests=REG.tests.filter(x=>x.url!==u);try{localStorage.setItem('gyankshetraReg',JSON.stringify(REG))}catch(e){}renderLists();alert('🗑 Delete ho gaya.')}catch(e){const m=String(e);alert('❌ Delete nahi hua: '+m+(/40[134]|not accessible|permission|Bad credentials/i.test(m)?'\n\nToken me is repo ke liye "Contents: Read and write" permission dein (GitHub > Settings > Developer settings > Fine-grained tokens), phir Admin Logout karke naya token daalein.':''))}}
function builtinCard(){return `<div class="card"><b>🧪 ${TEST_NAME}</b><small>${L('testMeta')}</small><button class="primary" onclick="requireUser(startQuiz)">${L('startTest')}</button></div>`}
function mixedGroups(page){const g={};REG.tests.filter(t=>KINDS[page].includes(t.type)&&t.subject==='Mixed').forEach(t=>{const nm=t.title.replace(/^[^\p{L}\p{N}]+/u,''),m=nm.match(/^(\S+) (\d+)Q (\d+)$/),key=m?m[1].toUpperCase()+' SERIES '+m[2]:'TEST SERIES';(g[key]=g[key]||[]).push({t,nm,n:m?+m[3]:0})});Object.values(g).forEach(a=>a.sort((x,y)=>x.n-y.n));return g}
function mixedRow(o){const t=o.t,nm=o.nm;return `<div class="qrow" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><span>📝 ${escH(nm)}${t.questions?' <small style="color:#7b8799;font-weight:400">• '+t.questions+' '+L('qWord')+'</small>':''}</span>${isAdmin()?`<button class="qdel" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑</button>`:''}<i>›</i></div>`}
function subjBlock(page){const list=SUBJS[page],keys=list.map(s=>s[0]).concat(['other']),tiles=[];let panel='';
const g=mixedGroups(page);Object.keys(g).forEach(key=>{const id='mx_'+key.replace(/\W+/g,'_'),a=g[key];tiles.push({id,ic:'📂',nm:key,sub:a.length+' '+L('testsWord'),n:a.length});if(openSub[page]===id)panel=`<div class="tphead">📂 ${escH(key)}</div>`+a.map(mixedRow).join('')});
keys.forEach(k=>{const s=list.find(x=>x[0]===k)||['sOther','📂',0];const items=regItems(page,k),own=(OWN[page]===k)?1:0,n=items.length+own;if(k==='other'&&!n)return;
tiles.push({id:k,ic:s[1],nm:L(s[0]),sub:n?n+' '+L('testsWord'):L('comingSub'),n});if(openSub[page]===k&&n)panel=`<div class="tphead">${s[1]} ${escH(L(s[0]))}</div>`+(own?builtinRow():'')+items.map(itemRow).join('')});
return `<div class="tiles">`+tiles.map(t=>`<div class="${openSub[page]===t.id&&t.n?'on':''}" onclick="${t.n?`toggleSub('${page}','${t.id}')`:'soon()'}">${t.ic}<b>${escH(t.nm)}</b><small>${t.sub}</small></div>`).join('')+`</div>`+(panel?`<div class="tilepanel">${panel}</div>`:'')}
function itemRow(t){return `<div class="qrow" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><span>${escH(t.title)}</span>${isAdmin()?`<button class="qdel" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑</button>`:''}<i>›</i></div>`}
function builtinRow(){return `<div class="qrow" onclick="requireUser(startQuiz)"><span>🧪 ${escH(TEST_NAME)}</span><i>›</i></div>`}
function toggleSub(p,k){openSub[p]=openSub[p]===k?null:k;renderLists();const e=document.querySelector('#'+(p==='tests'?'testsBody':'practiceBody')+' .tilepanel');if(e)setTimeout(()=>e.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}
function renderLists(){
const all=REG.tests.slice(0,3);$('homeNew').innerHTML=all.length?all.map(itemCard).join(''):`<div class="card"><small>${L('noNew')}</small></div>`;
$('testsBody').innerHTML=subjBlock('tests');$('practiceBody').innerHTML=subjBlock('practice');renderStudy();renderExam()}
function setExam(x){try{localStorage.setItem('gyankshetraExam',x)}catch(e){}renderExam()}
function renderExam(){let ex='STET';try{ex=localStorage.getItem('gyankshetraExam')||'STET'}catch(e){}document.querySelectorAll('#examChips button').forEach(b=>b.classList.toggle('on',b.dataset.ex===ex))}
/* Test UI: palette + swipe */
function openPalette(){$('palGrid').innerHTML=questions.map((q,i)=>`<button class="${ans[i]!==null&&ans[i]!==undefined?'a':''} ${i===qi?'cur':''}" onclick="jumpQ(${i})">${i+1}</button>`).join('');$('palette').classList.add('open')}
function closePalette(){$('palette').classList.remove('open')}
function jumpQ(i){qi=i;closePalette();saveProgress();render()}
(function(){let x0=0,y0=0;const w=$('quiz');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;if((dx>0)===SWIPE_RIGHT_IS_NEXT){if(qi<TOTAL-1){qi++;saveProgress();render()}}else prev()},{passive:true})})();
/* Result */
let lastRes={c:0,w:0,s:0},lastAttempt=1;
function paintResult(){const {c,w,s}=lastRes,a=c/TOTAL*100,b=a+w/TOTAL*100;$('donut').style.background=`conic-gradient(#1f9d55 0 ${a}%,#e03a3a ${a}% ${b}%,#c9d1dc ${b}% 100%)`;const u=getUser();$('resName').textContent='👤 '+(u.logged?uName():L('student'));$('reTag').classList.toggle('on',lastAttempt>1);$('anBtn').textContent='📚 Analysis';$('tipHint').textContent=({hi:'किसी भी बॉक्स पर टैप करें — उसका Analysis खुलेगा',en:'Tap any box to open its analysis',bh:'कवनो बॉक्स पर टैप करीं — ओकर विश्लेषण खुली'})[currentLang];$('backBtn').textContent=({hi:'🏠 ऐप पर वापस जाएँ',en:'🏠 Back to App',bh:'🏠 ऐप पर लौटीं'})[currentLang]}
function shareResult(){const {c,w,s}=lastRes,u=getUser(),p=Math.round(c/TOTAL*100),link=location.href.split('#')[0].split('?')[0];
const text=`${L('shHead')}\n👤 ${u.logged?u.name:L('student')}\n🏆 ${L('marks')}: ${c}/${TOTAL} (${p}%)\n✅ ${L('correct')}: ${c}  ❌ ${L('wrong')}: ${w}  ⏭ ${L('skipped')}: ${s}\n📢 ${L('shTg')}: https://t.me/gyankshetra\n🔗 ${L('shLink')}: ${link}`;
window.open('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text),'_blank')}
/* Download */
function downloadTest(){const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');const t='<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Gyankshetra</title></head><body style="font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:16px"><h1>Gyankshetra — '+TEST_NAME.replace(/</g,'&lt;')+'</h1>'+questions.map((q0,i)=>{const q=Q(i);return `<h3>${i+1}. ${esc(q[0])}</h3><ol type="A">${q[1].map(o=>`<li>${esc(o)}</li>`).join('')}</ol><p><b>${esc(L('right'))}:</b> ${String.fromCharCode(65+q[2])}. ${esc(q[1][q[2]])}</p><ul>${q[3].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}).join('<hr>')+'<p>📢 https://t.me/gyankshetra</p></body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download='gyankshetra-physics-gravitation.html';document.body.appendChild(a);a.click();a.remove();$('drawer').classList.remove('open')}
applyLanguage();loadStudy();loadReg();adminUI();slideBuild();go('home');if(ROOT){const p=getProgress();requireUser(getUser().logged&&p?resumeQuiz:startQuiz)}
