क प्रभावी होते हैं, जिससे बंधन शक्ति अधिक होती है।","ठोस में अणुओं का व्यवस्थित क्रिस्टलीय क्रम होता है","वैन डेर वाल्स बल दूरी के वर्ग के व्युत्क्रमानुपाती होते हैं","आयनिक बंधन में इलेक्ट्रॉनों का पूर्ण स्थानांतरण होता है","कोवैलेंट बंधन में इलेक्ट्रॉनों का साझा होना होता है","ठोस में तापीय ऊर्जा कम होती है जिससे अणु कंपन कम होते हैं","क्रिस्टल ग्रिड में अणु स्थिर स्थिति में होते हैं","भौतिक गुण जैसे कठोरता और घनत्व ठोस में अधिक होते हैं","ठोस से तरल में परिवर्तन पर बंधन ऊर्जा कम होती है"]],["गैस अवस्था में अणुओं के बीच बंधन शक्ति कम क्यों होती है?",["अणु गति तेज़ होती है","बन्धन इलेक्ट्रॉनों की संख्या घटती है","वायुमंडलीय दबाव घटता है","अणुओं के बीच दूरी बहुत अधिक होती है"],3,["गैस में अणुओं के बीच दूरी बहुत अधिक होती है, जिससे वैन डेर वाल्स बल बहुत कमजोर हो जाता है और बंधन शक्ति न्यूनतम रहती है।","गैस में अणु स्वतंत्र रूप से गति करते हैं","अणुओं के बीच औसत दूरी तरल से कई गुना अधिक होती है","वैन डेर वाल्स बल दूरी के वर्ग के व्युत्क्रमानुपाती होते हैं","गैस का आयतन तापमान के साथ बढ़ता है (चार्ल्स नियम)","गैस के अणु टकराव के बाद ऊर्जा नहीं खोते (इलेस्टिक टकराव)","आदर्श गैस नियम PV=nRT को संतुष्ट करता है","गैस में कोई निश्चित आकार या आकार नहीं होता","गैस से तरल में संघनन पर बंधन शक्ति बढ़ती है"]],["तरल अवस्था में अणुओं के बीच बंधन शक्ति मध्यवर्ती क्यों होती है?",["बन्धन केवल हाइड्रोजन बंधन से होते हैं","दाब स्थिर रहता है","अणु गति मध्यम होती है","अणु निकट होते हैं पर व्यवस्थित नहीं"],3,["तरल में अणु निकट होते हैं लेकिन व्यवस्थित क्रिस्टल ग्रिड नहीं बन पाता, इसलिए बंधन शक्ति ठोस से कम और गैस से अधिक रहती है।","तरल में अणु निकट होते हैं लेकिन क्रमबद्ध नहीं होते","वैन डेर वाल्स बल तरल में ठोस से कम पर गैस से अधिक होते हैं","तरल का आकार कंटेनर के अनुसार बदलता है","तरल में सतह तनाव मौजूद होता है","तरल में अणु गति गैस से धीमी पर ठोस से तेज़ होती है","संघनन (solidification) पर बंधन शक्ति बढ़ती है","वाष्पीकरण (evaporation) पर बंधन शक्ति घटती है","तरल में घनत्व ठोस से कम पर गैस से अधिक होता है"]],["पदार्थ के ठोस, द्रव और गैस अवस्थाओं में अणुओं के बीच बंधन शक्ति के क्रम को सही रूप से वर्णित करने वाला कथन कौन‑सा है?",["ठोस > द्रव > गैस","गैस > द्रव > ठोस","गैस > ठोस > द्रव","द्रव > ठोस > गैस"],0,["ठोस अवस्था में अणुओं के बीच बंधन शक्ति सबसे अधिक होती है, जिससे उनका स्थानिक क्रम स्थिर रहता है। द्रव में बंधन शक्ति मध्यम होती है, जिससे अणु एक‑दूसरे के पास रहते हैं पर स्वतंत्र रूप से स्थान बदल सकते हैं। गैस में बंधन शक्ति न्यूनतम होती है, अणु स्वतंत्र रूप से गति करते हैं। इसलिए क्रम ठोस > द्रव > गैस सही है।","ठोस में अणु नियत स्थानों पर व्यवस्थित होते हैं","द्रव में अणु निकटता बनाए रखते हुए स्वतंत्र रूप से प्रवाहित होते हैं","गैस में अणु बहुत दूर होते हैं और तेज़ी से गति करते हैं","बन्धन शक्ति को इंटरमॉलिक्यूलर फोर्सेज़ कहा जाता है","ठोस में बन्धन शक्ति मुख्यतः आयनिक, धात्विक या वैन‑डर‑वाल्स होती है","द्रव में बन्धन शक्ति हाइड्रोजन बन्धन, डिपोल‑डिपोल या लंदन डिस्पर्शन फोर्सेज़ हो सकती है","गैस में बन्धन शक्ति बहुत कम होने के कारण आयतन और दाब पर निर्भरता अधिक होती है","बन्धन शक्ति में अंतर पदार्थ के अवस्था परिवर्तन (पिघलना, वाष्पीकरण) को नियंत्रित करता है"]]];
const TR={"en":[["Why is the density of water maximum at 4 °C?",["Pressure increases","Molecules come closer due to hydrogen bonding","Evaporation rate decreases","Molecular motion is lowest"],["At 4 °C, hydrogen bonding causes water molecules to arrange in a specific structure that brings them closest together, resulting in maximum density.","The density of water at 4 °C is 0.999972 g/cm³.","Hydrogen bonding arranges water molecules in a triangular prism","At higher temperatures hydrogen bonds break and molecules move farther apart","When cooling, molecular motion decreases but the direction of bonding changes","Water expands below 4 °C and forms ice","Ice has lower density than water, so it floats","The energy of a hydrogen bond is about 20 kJ/mol","Maximum water density is used in climate‑science models of sea‑level"]],["Why do electron band structures form in metallic particles?",["Periodic potentials in the crystal lattice","Ionization at high temperature","Increase in atomic mass","Electron‑electron repulsion"],["In a crystal lattice many atoms are arranged at equal distances, making the electron potentials periodic and forming energy bands.","Band theory is a fundamental principle of solid‑state physics","Electrons in the valence band are in bonding states","The conduction band contains free electrons","The size of the band gap determines a material’s conductivity","Metals have a zero or very small band gap","Semiconductors have band gaps between 0.5‑3 eV","Insulators have band gaps greater than 3 eV","Band structure is measured by X‑ray diffraction and angle‑resolved photoelectron spectroscopy"]],["What effect does an increase in atmospheric water‑vapor pressure have?",["Atmospheric temperature rises","Evaporation rate decreases","Total atmospheric pressure drops","Temperature rises at high altitude"],["Increasing the partial pressure of water vapor enhances the greenhouse effect, raising atmospheric temperature.","Water vapor is the most effective natural greenhouse gas","Each 1 % increase in water vapor raises average Earth temperature by about 0.2 °C","Water‑vapor pressure rises exponentially with temperature (Clausius‑Clapeyron equation)","Higher water‑vapor pressure forms clouds that alter albedo","The impact of water vapor is especially pronounced locally, e.g., in monsoon regions","Relative humidity reaches saturation at 100 %","Total water‑vapor pressure can reach about 25 mb, roughly 3 % of total atmospheric pressure","Water vapor creates an imbalance in radiative equilibrium"]],["Why does the electronic configuration not change in metallic ionic compounds?",["The size of metal atoms does not change","Metal electron shells become fully filled","Only the covering electron participates in the ionic compound","Electron positions remain fixed in ionic bonding"],["In ionic bonding the metal atom loses its valence electron and attains a stable noble‑gas configuration; during this process the electronic configuration remains stable.","Metal ions often acquire +1, +2, or +3 charges","The electronic configuration of a metal ion matches that of a noble gas","Electron transfer in an ionic compound is essentially complete","Electrostatic attraction is the dominant force in ionic bonding","The size of a metal ion is determined by its ionization energy","Ionic compounds do not form band structures from electronic energy levels","Polarization of metal ions is low","Ionic compounds have high melting and boiling points"]],["Why is the band gap of silicon 1.12 eV in solid‑state detectors?",["Strength of silicon’s ionic bonds","Energy level of silicon’s valence electrons","Electron‑electron repulsion in the crystal lattice","Effect of silicon’s atomic size"],["Silicon’s valence band consists of 3s and 3p electrons; the energy difference between them is 1.12 eV, giving the band gap.","Silicon is the most widely used element among group‑14 elements","A band gap of 1.12 eV makes silicon temperature‑sensitive","Silicon’s crystal structure is diamond‑cubic","The band gap size can be altered by doping","Photons generate photo‑electrons in silicon detectors","Silicon’s thermal conductivity is 150 W/m·K","Silicon’s electron mobility is 1400 cm²/V·s","Silicon’s coefficient of thermal expansion is 2.6×10⁻⁶ K⁻¹"]],["Why is the electron in quantum dots considered quantized?",["The dot size is at the nanometer scale","Ionic bonding dominates in the dot","The dot has a high temperature","The electron mass in the dot decreases"],["Because of the nano‑size the electron’s motion is confined, making energy levels discrete (quantized).","Quantum dots are called artificial atoms","The dot diameter is 2‑10 nm","Quantization energy is inversely proportional to the square of the dot size","Electron‑hole pair recombination in the dot emits light","The dot’s spectral line is very narrow","Dots are used in LEDs, bio‑imaging and quantum computing","A passivating layer on the dot surface reduces electron traps","Dot size is controlled by solution‑phase sol‑gel growth"]],["What is the main function of the atmospheric ozone layer?",["Blocking ultraviolet‑B (UV‑B)","Absorbing solar energy","Stabilizing atmospheric pressure","Decomposing hydrocarbons"],["The ozone layer effectively absorbs UV‑B (280‑315 nm), protecting living organisms from harmful radiation.","The ozone layer is located at about 15‑30 km altitude","Maximum ozone concentration can reach up to 10 ppm","Ozone is formed by O₂ + UV‑C → O + O, then O + O₂ → O₃","Ozone lifetime ranges from minutes to several hours","Thinning of the ozone layer is called an ‘ozone hole’","Ozone holes are mainly observed in the Antarctic spring","Chlorofluorocarbons (CFCs) are major agents in ozone depletion","The Montreal Protocol is implemented to protect the ozone layer"]],["Why does a dipole moment arise in a polar molecule?",["The molecule’s shape is spherical","The molecule has unequal electron density","The atomic masses are equal","Electrons are distributed uniformly"],["Unequal electron density creates a separation of positive and negative charge, generating a dipole moment.","Dipole moment µ = q·d is the definition","Hydrogen chloride (HCl) has a dipole moment of 1.08 D","The unit of dipole moment is the debye (D), 1 D = 3.33564×10⁻³⁰ C·m","Interactions in polar molecules include induced dipole, dipole‑dipole and hydrogen bonding","Increasing dipole moment raises the boiling point","Polar molecules show high solubility in water","Dipole moments can be measured by rotational spectroscopy","Polar molecule interactions are important in biomolecular recognition"]],["Why does entropy increase during the solid‑liquid transition?",["Thermal energy decreases","Particle ordering decreases","Particle motion decreases","Pressure increases"],["In solids particles are ordered, while in liquids their order is reduced, increasing entropy (disorder).","Entropy change ΔS = Q_rev/T is used for calculation","Entropy increase for solid‑to‑liquid is about 30‑100 J/K·mol","The rise in entropy is due to greater molecular motion and spatial freedom","In liquids molecules have three translational degrees of freedom","Solids have only two or fewer degrees of freedom","Entropy change can be measured by calorimetric experiments","Entropy increase reflects the system’s increased indistinguishability","Higher entropy at the same temperature does not make a substance more stable, but allows more possible states"]],["What are the main components of the Earth's atmosphere?",["Nitrogen, oxygen, carbon dioxide, methane","Oxygen, nitrogen, nitrous oxide, sulfur dioxide","Nitrogen, oxygen, argon, helium","Oxygen, nitrogen, carbon dioxide, water vapor"],["The Earth's atmosphere contains about 78% nitrogen, 21% oxygen, 0.04% carbon dioxide and variable water vapor.","Nitrogen is the dominant atmospheric component","Oxygen is essential for respiration of living organisms","Carbon dioxide is used by plants in photosynthesis","Water vapor controls the atmospheric water cycle","Argon makes up about 0.93% of the atmosphere","Helium is present in the atmosphere in very small amounts","The proportion of atmospheric components changes slightly with altitude","The mixture of atmospheric components is balanced for life on Earth"]],["What is the main cause of the electron band structure in solid metals?",["Electron‑photon interaction near the nucleus","Balance of electron‑electron repulsion and nuclear attraction near the nucleus","Electron‑nucleus attraction near the nucleus","Electron‑electron repulsion near the nucleus"],["In metals, extended electron wave‑functions form between neighboring atoms, creating energy bands.","Metals have a sea of free electrons.","Electron energies are distributed in continuous bands.","Band structure determines electrical conductivity.","Band gap is zero or very small.","Crystal lattice symmetry stabilizes the band structure.","Band theory is based on quantum mechanics.","Band structure changes slightly with temperature.","Different metals have different band structures."]],["What effect does hydrogen bonding have in a water molecule?",["Molecular polarity increases","Molecular size increases","Molecular size decreases","Molecular polarity decreases"],["Hydrogen bonding increases intermolecular attraction, raising the molecule's polarity.","A water molecule consists of two hydrogens and one oxygen.","Oxygen is more electronegative.","Hydrogen bonds link molecules together.","Hydrogen bonding causes water's high boiling point.","Hydrogen bonding gives water high surface tension.","Hydrogen bonding determines the crystal structure of ice.","Because of hydrogen bonding, water density is maximum at 4 °C.","Hydrogen bonding is crucial in many biological processes."]],["What effect occurs when atmospheric water‑vapor pressure increases?",["Atmospheric temperature rises","Atmospheric temperature falls","Atmospheric pressure rises","Atmospheric pressure falls"],["Higher water‑vapor pressure enhances the greenhouse effect, raising surface temperature.","Water vapor is the most effective greenhouse gas.","Water‑vapor pressure increases with temperature.","Water vapor controls the atmospheric water cycle.","Increased vapor pressure alters precipitation patterns.","Water vapor contributes to atmospheric energy balance.","Higher vapor pressure reduces atmospheric stability.","Vapor pressure influences cloud formation.","Increased water vapor enhances thermal convection."]],["Why does the electronic configuration remain stable in metallic ionic compounds?",["Electrons are completely transferred in ionic bonding","Electrons are only partially shared in ionic bonding","No electron transfer occurs in ionic bonding","Electron energy levels do not change in ionic bonding"],["In an ionic compound, the metal atom loses electrons completely, attaining a noble‑gas configuration that remains unchanged.","Metal atoms lose electrons to become cations.","Non‑metal atoms gain electrons to become anions.","Electron transfer is complete in ionic compounds.","In classic NaCl, Na⁺ and Cl⁻ are present.","Ionic bonds are formed by electrostatic attraction.","The electronic configuration becomes stable like a noble gas.","Ionic compounds have high bond energy.","Ionic compounds typically have high melting points."]],["Why is silicon's 1.12 eV band gap important in solid‑state detectors?",["It makes electrical conductivity zero","It absorbs all wavelengths of light","It provides sensitivity in the infrared region","It remains stable at high temperatures"],["A 1.12 eV band gap allows silicon to absorb infrared photons and generate electron‑hole pairs, making the detector sensitive.","Silicon is a semiconductor.","A 1.12 eV band gap corresponds to infrared energy.","Infrared photons have energy greater than the band gap.","Silicon detectors use the photoelectric effect.","The band gap decreases slightly with temperature.","Silicon has high electron mobility.","Cooling silicon detectors reduces noise.","Silicon's band gap determines detector sensitivity."]],["What is the ratio of an object's mass to its volume called?",["Density","Pressure","Viscosity","Diffusion"],["Density is obtained by dividing the mass of an object by its volume, i.e., ρ = m/V.","The unit of density in SI is kg/m³","Water has maximum density at 4°C","The density of metals is generally higher than that of water","Atmospheric gases have very low density","Density changes with temperature","Density depends on the material's structure","A pycnometer is used for density measurement","Density is used in classification of physical properties"]],["Which state of a substance is the lightest?",["Solid","Liquid","Atmospheric gas","Plasma"],["Under normal conditions most substances have the lowest density and lightness in the gas state.","Molecules/atoms in a gas are farther apart","Gas pressure depends on temperature","Gas volume can change as volume","Gas molecules move independently","Binding energy in a gas is minimal","Gas density decreases as temperature rises","Gas can be compressed to form liquid or solid","Gas properties are described by the ideal gas law"]],["What effect does an increase in atmospheric water‑vapor pressure have?",["Atmospheric pressure decreases","Temperature remains constant","Atmospheric pressure increases","Atmospheric density decreases"],["An increase in water‑vapor pressure reduces the total atmospheric pressure because the water‑vapor fraction rises.","The water‑vapor fraction can reach up to 3% of atmospheric pressure","Water‑vapor pressure depends on temperature","High water‑vapor pressure affects atmospheric stability","Water vapor plays a crucial role in atmospheric thermal balance","Relative humidity measures water‑vapor content","Water vapor causes local variations in atmospheric pressure","Condensation of water vapor forms clouds","Water‑vapor pressure is a key parameter in meteorology"]],["What are the main components of the atmosphere?",["Oxygen, nitrogen, nitrogen oxide, sulfur dioxide","Oxygen, nitrogen, carbon dioxide, water vapor","Nitrogen, oxygen, argon, carbon dioxide","Hydrogen, helium, methane, nitrous oxide"],["The main components of the atmosphere are nitrogen (≈78%), oxygen (≈21%), argon (≈0.93%) and carbon dioxide (≈0.04%).","Nitrogen makes up the majority of atmospheric pressure","Oxygen is essential for respiration of living organisms","Argon is an inert gas and constitutes a small part of atmospheric pressure","Carbon dioxide plays a major role in climate change","Other gases in the atmosphere are called trace gases","Atmospheric composition changes with altitude","The mixture of atmospheric gases is described by the ideal gas law","The proportion of atmospheric components changes slightly over time"]],["At what temperature does a substance have its maximum density?",["At the highest temperature","At the lowest temperature","At the melting point","At a specific temperature where the coefficient of thermal expansion is zero"],["In most substances volume expands with temperature, but in some (like water) the coefficient of thermal expansion becomes zero at 4°C, giving maximum density.","Water has maximum density at 4°C","The coefficient of thermal expansion varies with temperature","When the expansion coefficient is zero the material's volume remains constant","For most substances volume increases as temperature rises","Density = mass/volume","Pycnometers or hydrometers are used for density measurement","The temperature‑density relationship is expressed by the thermal expansion equation","Due to irregularities in real materials the exact point may shift slightly"]],["What effect does an increase in atmospheric water vapor pressure have?",["Atmospheric pressure remains constant","Temperature decreases","Number of clouds increases","Number of clouds decreases"],["When water vapor pressure increases, the atmosphere contains more moisture, increasing the likelihood of cloud formation.","Water vapor pressure rises with temperature","Saturation point is required for cloud formation","Higher moisture increases the chance of precipitation","Condensation of water vapor creates clouds","Water vapor pressure affects atmospheric stability","Atmospheric moisture is measured as relative humidity","Water vapor pressure is a major parameter in meteorology","Condensation of water vapor releases latent heat"]],["Why is the bonding strength between molecules highest in the solid state of a substance?",["Electronic shielding between molecules increases","Bonding breaks at high temperatures","Distance between molecules is reduced","Molecular motion is slower"],["In solids, the distance between molecules is minimal, making van der Waals forces, ionic or covalent bonds more effective, resulting in higher bonding strength.","Solids have an ordered crystalline arrangement of molecules","Van der Waals forces are inversely proportional to the square of distance","Ionic bonding involves complete transfer of electrons","Covalent bonding involves sharing of electrons","Thermal energy is lower in solids, so molecular vibrations are reduced","Molecules in a crystal lattice occupy stable positions","Physical properties such as hardness and density are higher in solids","Bonding energy decreases when a solid melts into a liquid"]],["Why is the bonding strength between molecules low in the gaseous state?",["Molecular motion is fast","Number of bonding electrons decreases","Atmospheric pressure decreases","Distance between molecules is very large"],["In gases, the distance between molecules is very large, making van der Waals forces extremely weak and bonding strength minimal.","Gas molecules move independently","Average intermolecular distance in a gas is many times that in a liquid","Van der Waals forces are inversely proportional to the square of distance","Gas volume increases with temperature (Charles's law)","Gas molecules do not lose energy after collisions (elastic collisions)","Ideal gas law PV=nRT ure more influential","Differences in bonding strength control phase changes (melting, evaporation)"]]]};

function makeId(name,n){const w=name.trim().split(/\s+/)[0].replace(/[^\p{L}\p{N}]+/gu,'').toUpperCase();return '@'+String(n).padStart(2,'0')+'-'+w}
function saveUser(){const n=$('nameInput').value.trim();if(!n){alert(L('needName'));return}const num=Number(localStorage.getItem('gyankshetraNextNumber')||1),id=makeId(n,num),m=users();m[id]=n;localStorage.setItem('gyankshetraUsers',JSON.stringify(m));localStorage.setItem('gyankshetraUserName',n);localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraNextNumber',String(num+1));localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}

function startQuiz(){qi=0;ans=Array(TOTAL).fill(null);time=0;reviewIndex=0;running=true;clearInterval(timerHandle);go('quiz');render();saveProgress();timerHandle=setInterval(tick,1000)}
function pKey(){return 'gyankshetraProgress_'+TEST_ID+'_'+(localStorage.getItem('gyankshetraUserId')||'')}
function saveProgress(){if(running)localStorage.setItem(pKey(),JSON.stringify({qi,ans,time}))}
function getProgress(){try{const p=JSON.parse(localStorage.getItem(pKey())||'null');return p&&Array.isArray(p.ans)&&p.time>0?p:null}catch(e){return null}}
function pauseQuiz(){if(!running)return;saveProgress();running=false;clearInterval(timerHandle);timerHandle=null}
function tick(){if(time<TIME){time++;renderTimer();if(time>=TIME)finish();else if(time%5===0)saveProgress()}else finish()}
function resumeQuiz(){const p=getProgress();if(!p){startQuiz();return}qi=p.qi;ans=p.ans;time=p.time;running=true;clearInterval(timerHandle);go('quiz');render();timerHandle=setInterval(tick,1000)}
function updateResume(){const p=getUser().logged?getProgress():null;document.querySelectorAll('.resumebtn').forEach(b=>{b.style.display=p?'block':'none';if(p)b.textContent='▶ '+L('resume')+' • '+L('q')+' '+(p.qi+1)+'/'+TOTAL+' • '+fmt(TIME-p.time)})}
function fmt(t){t=Math.max(0,t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function renderTimer(){$('timer').textContent=fmt(TIME-time);$('timer').parentElement.classList.toggle('low',TIME-time<=60)}
function render(){const q=Q(qi);$('qn').textContent=(qi+1)+'/'+TOTAL;$('question').textContent=q[0];$('options').innerHTML=q[1].map((o,i)=>`<div class="option ${ans[qi]===i?'sel':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join('');$('nextBtn').textContent=qi===TOTAL-1?L('submit'):L('next');$('starBtn').textContent=saved.includes(qi)?'★':'☆';$('starBtn').classList.toggle('on',saved.includes(qi));renderTimer()}

const BUILTIN_NOTES=[{id:'oxidation',title:'Chemistry — ऑक्सीकरण (Notes)',html:"<h2>ऑक्सीकरण (Oxidation)<\/h2>\n<h3>1. परिभाषा<\/h3>\n<p>किसी पदार्थ में <b>ऑक्सीजन का जुड़ना<\/b> या <b>हाइड्रोजन का हटना<\/b> ऑक्सीकरण कहलाता है। इलेक्ट्रॉन के आधार पर: जब कोई परमाणु या आयन <b>इलेक्ट्रॉन त्यागता<\/b> है और उसका ऑक्सीकरण अंक बढ़ता है, तो वह ऑक्सीकृत होता है।<\/p>\n<h3>2. ऑक्सीकरण और अपचयन की तुलना<\/h3>\n<table><tr><th>आधार<\/th><th>ऑक्सीकरण<\/th><th>अपचयन<\/th><\/tr>\n<tr><td>ऑक्सीजन<\/td><td>जुड़ना<\/td><td>हटना<\/td><\/tr>\n<tr><td>हाइड्रोजन<\/td><td>हटना<\/td><td>जुड़ना<\/td><\/tr>\n<tr><td>इलेक्ट्रॉन<\/td><td>त्यागना (हानि)<\/td><td>ग्रहण करना (लाभ)<\/td><\/tr>\n<tr><td>ऑक्सीकरण अंक<\/td><td>बढ़ना<\/td><td>घटना<\/td><\/tr><\/table>\n<h3>3. याद रखने की ट्रिक<\/h3>\n<p><b>OIL RIG<\/b> — Oxidation Is Loss, Reduction Is Gain (इलेक्ट्रॉन की)।<\/p>\n<h3>4. रेडॉक्स अभिक्रिया<\/h3>\n<p>जिस अभिक्रिया में ऑक्सीकरण और अपचयन <b>एक साथ<\/b> होते हैं, उसे रेडॉक्स (Redox) अभिक्रिया कहते हैं।<\/p>\n<ul><li>2Mg + O₂ → 2MgO : Mg का ऑक्सीकरण, O₂ का अपचयन।<\/li>\n<li>CuO + H₂ → Cu + H₂O : H₂ का ऑक्सीकरण, CuO का अपचयन।<\/li><\/ul>\n<h3>5. ऑक्सीकारक और अपचायक<\/h3>\n<table><tr><th>पदार्थ<\/th><th>कार्य<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>ऑक्सीकारक<\/td><td>दूसरे को ऑक्सीकृत करता है, स्वयं अपचयित होता है<\/td><td>O₂, KMnO₄, K₂Cr₂O₇<\/td><\/tr>\n<tr><td>अपचायक<\/td><td>दूसरे का अपचयन करता है, स्वयं ऑक्सीकृत होता है<\/td><td>H₂, C, Zn, Mg<\/td><\/tr><\/table>\n<h3>6. दैनिक जीवन में ऑक्सीकरण<\/h3>\n<ul><li><b>जंग लगना:<\/b> हवा और नमी में लोहे पर भूरी परत (Fe₂O₃·xH₂O) बनती है।<\/li>\n<li><b>दहन:<\/b> ईंधन का ऑक्सीजन से ऑक्सीकरण, ऊष्मा और प्रकाश निकलता है।<\/li>\n<li><b>श्वसन:<\/b> कोशिकाओं में ग्लूकोज़ का ऑक्सीकरण, ऊर्जा मिलती है।<\/li>\n<li><b>विकृतगंधिता (Rancidity):<\/b> तेल या वसा का ऑक्सीकरण, खाने में बुरी गंध और स्वाद आता है।<\/li>\n<li><b>ताँबे पर हरी परत:<\/b> हवा और नमी से ताँबे का संक्षारण।<\/li><\/ul>\n<h3>7. ऑक्सीकरण से बचाव<\/h3>\n<ul><li>पेंट, तेल या ग्रीस लगाना।<\/li>\n<li>गैल्वनीकरण: लोहे पर जस्ते की परत चढ़ाना।<\/li>\n<li>मिश्रधातु बनाना, जैसे स्टेनलेस स्टील।<\/li>\n<li>खाद्य पदार्थों में एंटीऑक्सीडेंट मिलाना।<\/li>\n<li>चिप्स के पैकेट में नाइट्रोजन गैस भरना।<\/li><\/ul>\n<h3>8. ऑक्सीकरण अंक के मुख्य नियम<\/h3>\n<ol><li>मुक्त तत्व का ऑक्सीकरण अंक 0 होता है।<\/li>\n<li>सरल आयन का ऑक्सीकरण अंक उसके आवेश के बराबर होता है (Na⁺ = +1)।<\/li>\n<li>यौगिक में सभी परमाणुओं के ऑक्सीकरण अंकों का योग 0 होता है।<\/li>\n<li>ऑक्सीजन प्रायः −2 (पेरॉक्साइड में −1) होती है।<\/li>\n<li>हाइड्रोजन प्रायः +1 (धात्विक हाइड्राइड में −1) होता है।<\/li><\/ol>\n<h3>9. परीक्षा के लिए महत्वपूर्ण बिंदु<\/h3>\n<ul><li>ऑक्सीकरण और अपचयन हमेशा साथ-साथ होते हैं।<\/li>\n<li>मैग्नीशियम रिबन जलने पर तेज़ सफ़ेद रोशनी के साथ MgO बनाता है।<\/li>\n<li>धातुओं के ऑक्साइड प्रायः क्षारीय और अधातुओं के ऑक्साइड प्रायः अम्लीय होते हैं।<\/li>\n<li>H₂O₂ ऑक्सीकारक और अपचायक, दोनों की तरह व्यवहार कर सकता है।<\/li><\/ul>"}];

function adminLogout(){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');adminUI();renderLists()}
function adminUI(){const b=$('adminMenuBtn');if(b)b.textContent=isAdmin()?'🚪 '+L('adminOut'):'🔐 '+L('adminIn')}
async function adminLogin(){const t=$('tokInput').value.trim();if(!t)return;localStorage.setItem('gyankshetraAdminToken',t);try{const u=await (await gh('/user')).json();if(!u.login||u.login.toLowerCase()!==ADMIN_USER)throw 'ID';const r=await (await gh('/repos/'+ghOwner()+'/'+ghRepo())).json();if(!r.permissions||!r.permissions.push)throw 'perm';const w=await gh('/repos/'+ghOwner()+'/'+ghRepo()+'/git/blobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:'ok',encoding:'utf-8'})});if(!w.ok)throw 'write';localStorage.setItem('gyankshetraAdminOk','1');closeAdmin();adminUI();renderLists();alert('✅ Admin login: '+u.login)}catch(e){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');alert(e==='write'?'❌ Is key se GitHub par likhne ki ijazat nahi hai, isliye delete nahi chalega.\n\nNaya token banayein:\nGitHub > Settings > Developer settings > Personal access tokens > Tokens (classic) > Generate new token (classic). Wahan "public_repo" tick karein.\n\nYa Fine-grained token me Gyankshetra-app repo chunkar "Contents: Read and write" dein.':'❌ Login nahi hua. Key ya permission galat hai.')}}
function repoPath(u){try{const x=new URL(u,location.href);if(x.origin!==location.origin)return null;let p=decodeURIComponent(x.pathname);const base='/'+ghRepo()+'/';if(location.hostname.endsWith('.github.io')){if(!p.startsWith(base))return null;p=p.slice(base.length)}else p=p.replace(/^\//,'');return p}catch(e){return null}}
async function ghErr(r){let m='';try{m=(await r.json()).message||''}catch(e){}return 'HTTP '+r.status+(m?' — '+m:'')}
async function delTest(u){if(!isAdmin())return;const t=REG.tests.find(x=>x.url===u);if(!t||!confirm('"'+t.title+'" delete karna hai?'))return;const o=ghOwner(),r=ghRepo(),jp='content/generated_tests.json',ep='/repos/'+o+'/'+r+'/contents/'+jp,J={'Content-Type':'application/json'};try{
for(let k=0;k<2;k++){const g=await gh(ep,{cache:'no-store'});if(!g.ok)throw await ghErr(g);const gj=await g.json();const arr=JSON.parse(b64d(gj.content));if(!Array.isArray(arr))throw 'content/generated_tests.json ka format galat hai';const n=arr.filter(x=>x.url!==u);
const p=await gh(ep,{method:'PUT',headers:J,body:JSON.stringify({message:'Delete test: '+t.title,content:b64e(JSON.stringify(n,null,2)),sha:gj.sha})});if(p.ok)break;if(p.status===409&&k===0)continue;throw await ghErr(p)}
const fp=repoPath(u);if(fp&&/\.(html|json)$/.test(fp)&&fp!=='index.html'&&!fp.startsWith('content/')&&!fp.includes('..')){const fe='/repos/'+o+'/'+r+'/contents/'+fp.split('/').map(encodeURIComponent).join('/');const f=await gh(fe);if(f.ok){const fj=await f.json();if(fj.sha)await gh(fe,{method:'DELETE',headers:J,body:JSON.stringify({message:'Delete test file: '+fp,sha:fj.sha})})}}
REG.tests=REG.tests.filter(x=>x.url!==u);try{localStorage.setItem('gyankshetraReg',JSON.stringify(REG))}catch(e){}renderLists();alert('🗑 Delete ho gaya.')}catch(e){const m=String(e);alert('❌ Delete nahi hua: '+m+(/40[134]|not accessible|permission|Bad credentials/i.test(m)?'\n\nIs key ko likhne ki ijazat nahi hai. Admin Login me naya key daalein (classic token me "public_repo" ya fine-grained me "Contents: Read and write").':''));if(/40[13]|not accessible|Bad credentials/i.test(m))adminLogout()}}
function builtinCard(){return `<div class="card"><b>🧪 ${TEST_NAME}</b><small>${L('testMeta')}</small><button class="primary" onclick="requireUser(startQuiz)">${L('startTest')}</button></div>`}
function mixedGroups(page){const g={};REG.tests.filter(t=>KINDS[page].includes(t.type)&&t.subject==='Mixed').forEach(t=>{const nm=t.title.replace(/^[^\p{L}\p{N}]+/u,''),m=nm.match(/^(\S+) (\d+)Q (\d+)$/),key=m?m[1].toUpperCase()+' SERIES '+m[2]:'TEST SERIES';(g[key]=g[key]||[]).push({t,nm,n:m?+m[3]:0})});Object.values(g).forEach(a=>a.sort((x,y)=>x.n-y.n));return g}
function mixedRow(o){const t=o.t,nm=o.nm;return `<div class="qrow" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><span>📝 ${escH(nm)}${t.questions?' <small style="color:#7b8799;font-weight:400">• '+t.questions+' '+L('qWord')+'</small>':''}</span>${isAdmin()?`<button class="qdel" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑</button>`:''}<i>›</i></div>`}
function subjBlock(page){const list=SUBJS[page],keys=list.map(s=>s[0]).concat(['other']),tiles=[];let panel='';
const g=mixedGroups(page);Object.keys(g).forEach(key=>{const id='mx_'+key.replace(/\W+/g,'_'),a=g[key];tiles.push({id,ic:'📂',nm:key,sub:a.length+' '+L('testsWord'),n:a.length});if(openSub[page]===id)panel=`<div class="tphead">📂 ${escH(key)}</div>`+a.map(mixedRow).join('')});
keys.forEach(k=>{const s=list.find(x=>x[0]===k)||['sOther','📂',0];const items=regItems(page,k),own=(OWN[page]===k)?1:0,n=items.length+own;if(k==='other'&&!n)return;
tiles.push({id:k,ic:s[1],nm:L(s[0]),sub:n?n+' '+L('testsWord'):L('comingSub'),n});if(openSub[page]===k&&n)panel=`<div class="tphead">${s[1]} ${escH(L(s[0]))}</div>`+(own?builtinRow():'')+items.map(itemRow).join('')});
return `<div class="tiles">`+tiles.map(t=>`<div class="${openSub[page]===t.id&&t.n?'on':''}" onclick="${t.n?`toggleSub('${page}','${t.id}')`:'soon()'}">${t.ic}<b>${escH(t.nm)}</b><small>${t.sub}</small></div>`).join('')+`</div>`+(panel?`<div class="tilepanel">${panel}</div>`:'')}
function itemRow(t){return `<div class="qrow" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><span>${escH(t.title)}</span>${isAdmin()?`<button class="qdel" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑</button>`:''}<i>›</i></div>`}
function builtinRow(){return `<div class="qrow" onclick="requireUser(startQuiz)"><span>🧪 ${escH(TEST_NAME)}</span><i>›</i></div>`}
function toggleSub(p,k){openSub[p]=openSub[p]===k?null:k;renderLists();const e=document.querySelector('#'+(p==='tests'?'testsBody':'practiceBody')+' .tilepanel');if(e)setTimeout(()=>e.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}
function renderLists(){
const all=REG.tests.slice(0,3);$('homeNew').innerHTML=all.length?all.map(itemCard).join(''):`<div class="card"><small>${L('noNew')}</small></div>`;
$('testsBody').innerHTML=subjBlock('tests');$('practiceBody').innerHTML=subjBlock('practice');renderStudy();renderExam()}
function setExam(x){try{localStorage.setItem('gyankshetraExam',x)}catch(e){}renderExam()}
function renderExam(){let ex='STET';try{ex=localStorage.getItem('gyankshetraExam')||'STET'}catch(e){}document.querySelectorAll('#examChips button').forEach(b=>b.classList.toggle('on',b.dataset.ex===ex))}
/* Test UI: palette + swipe */
function openPalette(){$('palGrid').innerHTML=questions.map((q,i)=>`<button class="${ans[i]!==null&&ans[i]!==undefined?'a':''} ${i===qi?'cur':''}" onclick="jumpQ(${i})">${i+1}</button>`).join('');$('palette').classList.add('open')}
function closePalette(){$('palette').classList.remove('open')}
function jumpQ(i){qi=i;closePalette();saveProgress();render()}
(function(){let x0=0,y0=0;const w=$('quiz');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;if((dx>0)===SWIPE_RIGHT_IS_NEXT){if(qi<TOTAL-1){qi++;saveProgress();render()}}else prev()},{passive:true})})();
/* Result */
let lastRes={c:0,w:0,s:0},lastAttempt=1;
function paintResult(){const {c,w,s}=lastRes,a=c/TOTAL*100,b=a+w/TOTAL*100;$('donut').style.background=`conic-gradient(#1f9d55 0 ${a}%,#e03a3a ${a}% ${b}%,#c9d1dc ${b}% 100%)`;const u=getUser();$('resName').textContent='👤 '+(u.logged?uName():L('student'));$('reTag').classList.toggle('on',lastAttempt>1);$('anBtn').textContent='📚 Analysis';$('tipHint').textContent=({hi:'किसी भी बॉक्स पर टैप करें — उसका Analysis खुलेगा',en:'Tap any box to open its analysis',bh:'कवनो बॉक्स पर टैप करीं — ओकर विश्लेषण खुली'})[currentLang];$('backBtn').textContent=({hi:'🏠 ऐप पर वापस जाएँ',en:'🏠 Back to App',bh:'🏠 ऐप पर लौटीं'})[currentLang]}
function shareResult(){const {c,w,s}=lastRes,u=getUser(),p=Math.round(c/TOTAL*100),link=location.href.split('#')[0].split('?')[0];
const text=`${L('shHead')}\n👤 ${u.logged?u.name:L('student')}\n🏆 ${L('marks')}: ${c}/${TOTAL} (${p}%)\n✅ ${L('correct')}: ${c}  ❌ ${L('wrong')}: ${w}  ⏭ ${L('skipped')}: ${s}\n📢 ${L('shTg')}: https://t.me/gyankshetra\n🔗 ${L('shLink')}: ${link}`;
window.open('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text),'_blank')}
/* Download */
function downloadTest(){const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');const t='<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Gyankshetra</title></head><body style="font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:16px"><h1>Gyankshetra — '+TEST_NAME.replace(/</g,'&lt;')+'</h1>'+questions.map((q0,i)=>{const q=Q(i);return `<h3>${i+1}. ${esc(q[0])}</h3><ol type="A">${q[1].map(o=>`<li>${esc(o)}</li>`).join('')}</ol><p><b>${esc(L('right'))}:</b> ${String.fromCharCode(65+q[2])}. ${esc(q[1][q[2]])}</p><ul>${q[3].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}).join('<hr>')+'<p>📢 https://t.me/gyankshetra</p></body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download='gyankshetra-physics-gravitation.html';document.body.appendChild(a);a.click();a.remove();$('drawer').classList.remove('open')}
applyLanguage();loadStudy();loadReg();adminUI();slideBuild();go('home');if(ROOT){const p=getProgress();requireUser(getUser().logged&&p?resumeQuiz:startQuiz)}
</script>
