<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>9th chemistry atom | Gyankshetra</title>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --card-border: #334155;
      --accent: #2563eb;
      --accent-hover: #1d4ed8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --success: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --correct: rgba(34, 197, 94, 0.15);
      --wrong: rgba(239, 68, 68, 0.15);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
    
    header { background-color: rgba(30, 41, 59, 0.95); backdrop-filter: blur(10px); border-bottom: 1px solid var(--card-border); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .title { font-size: 1.15rem; font-weight: 700; color: #fff; letter-spacing: -0.02em; display: flex; align-items: center; gap: 8px; }
    .header-right { display: flex; align-items: center; gap: 12px; }
    .student-badge { background: #334155; color: var(--text-muted); font-size: 0.8rem; padding: 4px 10px; border-radius: 999px; }
    .timer-badge { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); font-weight: 700; font-size: 0.95rem; padding: 4px 12px; border-radius: 8px; font-variant-numeric: tabular-nums; }
    
    .menu-btn { background: #334155; color: #fff; border: 1px solid var(--card-border); width: 38px; height: 38px; border-radius: 8px; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 20px; line-height: 1; transition: 0.2s; }
    .menu-btn:hover { background: #475569; }

    main { flex: 1; padding: 16px; max-width: 760px; margin: 0 auto; width: 100%; touch-action: pan-y; }
    .quiz-card { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; padding: 22px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3); }
    
    .q-meta { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; border-bottom: 1px solid var(--card-border); padding-bottom: 12px; }
    .q-count { font-size: 0.9rem; color: var(--text-muted); }
    .q-count b { color: #fff; }
    .topic-pill { background: rgba(37, 99, 235, 0.15); color: #60a5fa; font-size: 0.8rem; font-weight: 600; padding: 4px 10px; border-radius: 6px; }

    .q-text { font-size: 1.15rem; line-height: 1.6; font-weight: 600; margin-bottom: 20px; color: #f8fafc; }
    .options-grid { display: flex; flex-direction: column; gap: 12px; }
    .opt-btn { background: #0f172a; border: 1.5px solid var(--card-border); border-radius: 10px; padding: 14px 16px; color: var(--text); text-align: left; font-size: 1rem; cursor: pointer; display: flex; align-items: center; gap: 14px; transition: all 0.2s; }
    .opt-btn:hover { border-color: var(--accent); background: rgba(37, 99, 235, 0.05); }
    .opt-btn.active { border-color: #60a5fa; background: rgba(37, 99, 235, 0.2); font-weight: 600; }
    .opt-badge { width: 28px; height: 28px; border-radius: 50%; background: #334155; display: inline-flex; align-items: center; justify-content: center; font-size: 0.85rem; font-weight: 700; flex-shrink: 0; }
    .opt-btn.active .opt-badge { background: var(--accent); color: #fff; }

    .action-bar { display: flex; justify-content: space-between; margin-top: 24px; gap: 12px; }
    .btn { padding: 10px 20px; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer; border: none; transition: 0.2s; }
    .btn-secondary { background: #334155; color: #fff; }
    .btn-secondary:hover { background: #475569; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-primary:hover { background: var(--accent-hover); }
    .btn-submit { background: var(--success); color: #fff; }

    /* Palette Drawer Modal */
    .modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 200; justify-content: center; align-items: center; padding: 16px; }
    .modal-overlay.open { display: flex; }
    .modal-box { background: var(--card); border: 1px solid var(--card-border); border-radius: 16px; width: 100%; max-width: 450px; max-height: 80vh; overflow-y: auto; padding: 20px; }
    .modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .palette-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 10px; margin-bottom: 12px; }
    .node { aspect-ratio: 1; border-radius: 10px; border: 1px solid var(--card-border); background: #0f172a; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 0.95rem; cursor: pointer; position: relative; }
    .node.active-q { border: 2px solid var(--accent); background: rgba(37, 99, 235, 0.2); }
    .node.filled { background: var(--success); color: #fff; border-color: var(--success); }
    .node .dot-badge { position: absolute; top: 4px; right: 4px; width: 8px; height: 8px; border-radius: 50%; background: var(--warning); display: none; }
    .node.reattempt .dot-badge { display: block; }

    /* Result & Review */
    .status-badge { background: #0f172a; border: 1px solid var(--card-border); padding: 10px 14px; border-radius: 8px; margin: 12px 0; font-size: 0.95rem; }
    .tg-share-btn { display: inline-flex; align-items: center; gap: 8px; background: #0088cc; color: #fff; text-decoration: none; padding: 12px 22px; border-radius: 8px; font-weight: 700; margin: 16px 0; transition: background 0.2s; }
    .tg-share-btn:hover { background: #0077b5; }
    .review-wrap { margin-top: 20px; border-top: 1px solid var(--card-border); padding-top: 16px; }
  </style>
</head>
<body>

  <header>
    <div class="title">Gyankshetra · 9th chemistry atom</div>
    <div class="header-right">
      <div class="student-badge">विद्यार्थी: छात्र</div>
      <div class="timer-badge" id="timerBox">00:00</div>
      <button class="menu-btn" onclick="togglePalette()" title="Question Palette">☰</button>
    </div>
  </header>

  <main id="touchContainer">
    <div id="quizScreen" class="quiz-card">
      <div class="q-meta">
        <span class="q-count">प्रश्न <b id="currQ">1</b> / <span id="totQ">1</span></span>
        <span class="topic-pill" id="topicLabel">Test</span>
      </div>
      <div id="qArea"></div>
      <div class="action-bar">
        <button class="btn btn-secondary" onclick="prevQ()">पिछला</button>
        <button class="btn btn-primary" id="nextBtn" onclick="nextQ()">अगला</button>
        <button class="btn btn-submit" id="submitBtn" onclick="finishTest()" style="display:none;">सबमिट करें</button>
      </div>
    </div>

    <div id="resultScreen" class="quiz-card" style="display:none;">
      <h2 style="margin-bottom:8px;">🏆 टेस्ट समाप्त!</h2>
      <div class="status-badge" id="scoreBadge"></div>
      <a id="telegramShareLink" href="#" target="_blank" class="tg-share-btn">✈ Share on Telegram</a>
      <div id="reviewContainer" class="review-wrap"></div>
    </div>
  </main>

  <div class="modal-overlay" id="paletteModal" onclick="closeOnOverlay(event)">
    <div class="modal-box">
      <div class="modal-head">
        <h3>प्रश्नावली पैलेट</h3>
        <button class="btn btn-secondary" onclick="togglePalette()">✕</button>
      </div>
      <div class="palette-grid" id="paletteNodes"></div>
    </div>
  </div>

  <script>
    const testData = {"isReattempted":false,"studentName":"छात्र","topic":"9th chemistry atom","questions":[{"id":1,"text":"किसी तत्व के परमाणु में सबसे बाहरी शेल (valence shell) में इलेक्ट्रॉन की संख्या निर्धारित करती है:","options":["इलेक्ट्रॉन घनत्व","आयनन ऊर्जा","परमाणु क्रमांक","परमाणु द्रव्यमान"],"correctOption":2,"selected":null,"status":"skipped","facts":["परमाणु क्रमांक (Z) सीधे इलेक्ट्रॉन की कुल संख्या देता है, और वैलेन्स शेल की इलेक्ट्रॉन संख्या समूह के अनुसार निर्धारित होती है।","परमाणु क्रमांक इलेक्ट्रॉन की कुल संख्या के बराबर होता है","वैलेन्स शेल में इलेक्ट्रॉन की संख्या समूह सिद्धांत से निर्धारित होती है","समान समूह के तत्वों में वैलेन्स इलेक्ट्रॉन समान होते हैं","परमाणु द्रव्यमान में न्यूट्रॉन की संख्या अधिक होती है","आयनन ऊर्जा इलेक्ट्रॉन हटाने की ऊर्जा दर्शाती है","इलेक्ट्रॉन घनत्व इलेक्ट्रॉन वितरण का माप है","वैलेन्स शेल की भराव स्थिति रासायनिक गुण निर्धारित करती है","परमाणु क्रमांक बढ़ने पर शेल क्रमशः भरते हैं"]},{"id":2,"text":"निम्नलिखित में से कौन-सा ऑर्बिटल सबसे अधिक ऊर्जा (सबसे उच्च ऊर्जा) रखता है जब n=3 है?","options":["3s","3p","3f","3d"],"correctOption":2,"selected":null,"status":"skipped","facts":["n=3 के लिए उपलब्ध ऑर्बिटल 3s, 3p, 3d होते हैं; 3f नहीं होता, इसलिए सबसे उच्च ऊर्जा वाला 3d है।","n=3 में उपलब्ध ऑर्बिटल 3s, 3p, 3d हैं","ऑर्बिटल की ऊर्जा क्रम s < p < d होता है","फ (f) ऑर्बिटल n=4 से शुरू होते हैं","ऑर्बिटल ऊर्जा क्वांटम संख्याओं l से निर्धारित होती है","l मान 0,1,2 क्रमशः s,p,d को दर्शाते हैं","ऊर्जा में अंतर शील्डिंग प्रभाव से भी प्रभावित होता है","समान n में l बड़ा होने पर ऊर्जा अधिक होती है","ऑर्बिटल आकार l के साथ बढ़ता है"]},{"id":3,"text":"एक परमाणु में इलेक्ट्रॉन शील्डिंग प्रभाव बढ़ने पर कौन-सा परिवर्तन होता है?","options":["आयनन ऊर्जा घटती है","आयनन ऊर्जा बढ़ती है","इलेक्ट्रॉन आकर्षण बढ़ता है","इलेक्ट्रॉन आकर्षण घटता है"],"correctOption":0,"selected":null,"status":"skipped","facts":["शिल्डिंग प्रभाव बढ़ने से बाहरी इलेक्ट्रॉन पर प्रभावी नाभिकीय आकर्षण घटता है, जिससे आयनन ऊर्जा कम होती है।","शिल्डिंग प्रभाव आंतरिक इलेक्ट्रॉन द्वारा बाहरी इलेक्ट्रॉन को ढालता है","अधिक शिल्डिंग से नाभिकीय आकर्षण कम होता है","आयनन ऊर्जा वह ऊर्जा है जो इलेक्ट्रॉन हटाने में लगती है","कम नाभिकीय आकर्षण से इलेक्ट्रॉन हटाना आसान होता है","इसलिए आयनन ऊर्जा घटती है","शिल्डिंग प्रभाव समूह में बढ़ता है","पिरियडिक टेबल में दाएँ जाने पर शिल्डिंग कम होती है","शिल्डिंग प्रभाव इलेक्ट्रॉन कॉन्फ़िगरेशन से जुड़ा है"]},{"id":4,"text":"किसी तत्व का इलेक्ट्रॉनिक कॉन्फ़िगरेशन 1s² 2s² 2p⁶ 3s² 3p⁵ है, वह किस समूह (Group) में आता है?","options":["Halogens (7)","Noble gases (18)","Chalcogens (16)","Alkali metals (1)"],"correctOption":0,"selected":null,"status":"skipped","facts":["यह कॉन्फ़िगरेशन ब्रोमीन (Br) का है, जो Halogens समूह (Group 17) में आता है।","1s² 2s² 2p⁶ 3s² 3p⁵ कुल 35 इलेक्ट्रॉन दर्शाता है","35 क्रमांक ब्रोमीन का परमाणु क्रमांक है","ब्रोमीन Halogen समूह में है","Halogen समूह के तत्वों में 7 वैलेन्स इलेक्ट्रॉन होते हैं","वैलेन्स इलेक्ट्रॉन 3s² 3p⁵ से मिलते हैं","Halogen समूह में अत्यधिक इलेक्ट्रॉन आकर्षण होता है","इनकी इलेक्ट्रॉनिक कॉन्फ़िगरेशन ns² np⁵ होती है","Halogen समूह में F, Cl, Br, I, At शामिल हैं"]},{"id":5,"text":"निम्नलिखित में से कौन-सा सिद्धांत बताता है कि किसी परमाणु के केंद्र (nucleus) के निकट इलेक्ट्रॉनों की ऊर्जा सबसे कम और बाहरी शेल की ओर बढ़ते हुए ऊर्जा बढ़ती है?","options":["हाइड्रोजनिक मॉडल","ऑक्टेट नियम","ऑर्डरिंग सिद्धांत","बॉर्न-ओपेनहेमर सिद्धांत"],"correctOption":3,"selected":null,"status":"skipped","facts":["बॉर्न-ओपेनहेमर मॉडल में इलेक्ट्रॉनों को विशिष्ट ऊर्जा स्तरों (क्वांटम शेल) में व्यवस्थित किया गया है, जहाँ निचले स्तर (न्यूक्लियस के निकट) की ऊर्जा कम और उच्च स्तरों की ऊर्जा अधिक होती है।","बॉर्न मॉडल ने इलेक्ट्रॉन को निश्चित वृत्ताकार कक्षा में मान लिया था","ओपेनहेमर ने क्वांटम सिद्धांत को विस्तारित किया","ऊर्जा स्तरों को मुख्य क्वांटम संख्या n से दर्शाया जाता है","n बढ़ने पर शेल का आकार और ऊर्जा दोनों बढ़ते हैं","न्यूक्लियस के निकट इलेक्ट्रॉनों को शील्डिंग कम मिलती है","ऊर्जा स्तरों के बीच अंतर फोटॉनों के उत्सर्जन/अवशोषण से जुड़ा है","बॉर्न-ओपेनहेमर मॉडल ने हाइड्रोजन स्पेक्ट्रा को सही रूप से समझाया","यह मॉडल कई-इलेक्ट्रॉन परमाणुओं में सीमित रूप से लागू होता है"]}]};

    function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
    let currentIndex = 0;
    const totalQuestions = testData.questions.length;
    let secondsLeft = totalQuestions * 60;
    let timerTimer = null;

    function initQuiz() {
      document.getElementById('totQ').innerText = totalQuestions;
      document.getElementById('topicLabel').innerText = testData.topic || 'Test';
      renderQuestion();
      renderPalette();
      startTimer();
    }

    function renderQuestion() {
      const q = testData.questions[currentIndex];
      document.getElementById('currQ').innerText = currentIndex + 1;
      const area = document.getElementById('qArea');

      let opts = q.options.map((opt, idx) => `
        <div class="opt-btn ${q.selected === idx ? 'active' : ''}" onclick="pickOpt(${idx})">
          <span class="opt-badge">${String.fromCharCode(65 + idx)}</span>
          <span>${String.fromCharCode(65 + idx)}. ${esc(opt)}</span>
        </div>
      `).join('');

      area.innerHTML = `
        <div class="q-text">${esc(q.text)}</div>
        <div class="options-grid">${opts}</div>
      `;

      document.getElementById('nextBtn').style.display = (currentIndex === totalQuestions - 1) ? 'none' : 'block';
      document.getElementById('submitBtn').style.display = (currentIndex === totalQuestions - 1) ? 'block' : 'none';
      renderPalette();
    }

    function pickOpt(idx) {
      const q = testData.questions[currentIndex];
      if (q.selected !== null && q.selected !== idx) {
        q.reattempted = true;
      }
      q.selected = idx;
      q.status = 'answered';
      renderQuestion();
    }

    function nextQ() {
      if (currentIndex < totalQuestions - 1) { currentIndex++; renderQuestion(); }
    }

    function prevQ() {
      if (currentIndex > 0) { currentIndex--; renderQuestion(); }
    }

    function togglePalette() {
      document.getElementById('paletteModal').classList.toggle('open');
    }

    function closeOnOverlay(e) {
      if (e.target.id === 'paletteModal') togglePalette();
    }

    function renderPalette() {
      const grid = document.getElementById('paletteNodes');
      grid.innerHTML = testData.questions.map((q, i) => `
        <div class="node ${q.selected !== null ? 'filled' : ''} ${i === currentIndex ? 'active-q' : ''} ${q.reattempted ? 'reattempt' : ''}" onclick="jumpQ(${i})">
          <span>${i + 1}</span>
          <span class="dot-badge"></span>
        </div>
      `).join('');
    }

    function jumpQ(i) {
      currentIndex = i;
      renderQuestion();
      togglePalette();
    }

    function startTimer() {
      showTime();
      timerTimer = setInterval(() => {
        if (secondsLeft > 0) {
          secondsLeft--;
          showTime();
        } else {
          finishTest();
        }
      }, 1000);
    }

    function showTime() {
      let m = Math.floor(secondsLeft / 60);
      let s = secondsLeft % 60;
      document.getElementById('timerBox').innerText = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }

    function finishTest() {
      clearInterval(timerTimer);
      document.getElementById('quizScreen').style.display = 'none';
      document.getElementById('resultScreen').style.display = 'block';

      let correct = 0;
      testData.questions.forEach(q => {
        if (q.selected === q.correctOption) correct++;
      });

      document.getElementById('scoreBadge').innerHTML = `<b>स्कोर: ${correct} / ${totalQuestions}</b> (${Math.round((correct/totalQuestions)*100)}%)`;

      const curUrl = window.location.href;
      const shareText = encodeURIComponent(
        `🎯 Gyankshetra Mock Test\n` +
        `📚 विषय: ${testData.topic}\n` +
        `🏆 स्कोर: ${correct}/${totalQuestions} (${Math.round((correct/totalQuestions)*100)}%)\n\n` +
        `🔗 टेस्ट हल करें: ${curUrl}`
      );
      document.getElementById('telegramShareLink').href = `https://t.me/share/url?url=${encodeURIComponent(curUrl)}&text=${shareText}`;

      buildReview();
    }

    function buildReview() {
      const rev = document.getElementById('reviewContainer');
      rev.innerHTML = testData.questions.map((q, i) => `
        <div style="margin-bottom: 24px; border-bottom: 1px solid var(--card-border); padding-bottom: 16px;">
          <div class="q-text">${q.text}</div>
          <div class="options-grid">
            ${q.options.map((opt, idx) => `
              <div class="opt-btn ${idx === q.correctOption ? 'active' : ''}">
                <span class="opt-badge">${String.fromCharCode(65 + idx)}</span>
                <span>${String.fromCharCode(65 + idx)}.${opt}</span>
              </div>
            `).join('')}
          </div>
          <div class="status-badge">स्थिति: <b>${q.status.toUpperCase()}</b></div>
          ${q.facts && q.facts.length ? '<div class="status-badge"><b>📌 व्याख्या / तथ्य:</b><ul style="margin:6px 0 0 18px">' + q.facts.map(f => '<li>' + esc(f) + '</li>').join('') + '</ul></div>' : ''}
        </div>
      `).join('');
    }

    /* Swipe Gestures */
    let startX = 0;
    const swipeSurface = document.getElementById('touchContainer');

    swipeSurface.addEventListener('touchstart', e => {
      startX = e.changedTouches[0].screenX;
    }, { passive: true });

    swipeSurface.addEventListener('touchend', e => {
      let diff = e.changedTouches[0].screenX - startX;
      if (diff < -50) nextQ();
      if (diff > 50) prevQ();
    }, { passive: true });

    initQuiz();
  </script>
</body>
</html>
