लीय जलवायु क्षेत्रों की विविधता है, जिससे यह जलवायु विविधता में अग्रणी है।","उत्तराखंड में 3 प्रमुख जलवायु क्षेत्र हैं: हिमालयी, मध्य-हिमालयी और उपजलीय","हिमालयी क्षेत्र में शीतकालीन तापमान -20°C तक गिर सकता है","उपजलीय क्षेत्र में गर्मी के महीने में तापमान 35°C तक पहुँचता है","उत्तराखंड में 5 प्रमुख नदियों का स्रोत है, जैसे गंगा, यमुना, सतलुज","राज्य में 7 राष्ट्रीय उद्यान और कई वन्यजीव अभयारण्य हैं","वर्षा के समय यहाँ के बर्फीले क्षेत्रों में जलस्रोतों का पुनर्भरण होता है","उत्तराखंड में जलवायु परिवर्तन के प्रभावों का अध्ययन कई अंतरराष्ट्रीय परियोजनाओं में किया जाता है","राज्य की जलवायु विविधता कृषि, पर्यटन और जल संसाधन प्रबंधन को प्रभावित करती है"]],["भारत के कौन से राज्य में सतह पर सबसे अधिक भू-आकृतिक विविधता पाई जाती है, जिसमें पर्वत, पठार, मैदानी क्षेत्र और नदियों का जटिल नेटवर्क शामिल है?",["महाराष्ट्र","झारखंड","छत्तीसगढ़","उत्ताखंड"],3,["उत्ताखंड में हिमालयी पर्वत, मध्यहिमालयी पठार, गढ़वाल की घाटियाँ और कई प्रमुख नदियों का जटिल नेटवर्क है, जिससे इसकी भू-आकृतिक विविधता अत्यधिक है।","उत्ताखंड में गढ़वाल, कुमाऊँ और हिमाचल की विभिन्न भू-आकृतिक इकाइयाँ हैं","यह राज्य उत्तराखंड के उत्तर में हिमालय की मुख्य शृंखलाएँ स्थित हैं","कुंडा, अल्मोड़ा, बर्मू आदि प्रमुख नदियों के जलस्रोत यहाँ हैं","कुंडा घाटी में कई छोटे-छोटे उप-घाटी और वैली हैं","कुंडा और अल्मोड़ा के बीच मध्यहिमालयी पठार फैला है","उत्ताखंड में कई ग्लेशियर और बर्फीले शिखर हैं","भू-आकृतिक विविधता के कारण यहाँ विभिन्न जलवायु क्षेत्रों का मिश्रण है","पर्यटन, जलविद्युत और जलस्रोत प्रबंधन में यह विविधता महत्वपूर्ण भूमिका निभाती है"]],["भारत में कौन सा राज्य सबसे अधिक सतही जलस्रोत (नदियों) की घनत्व के कारण जल संसाधन प्रबंधन में चुनौतीपूर्ण माना जाता है?",["बिहार","मध्य प्रदेश","असम","गुजरात"],0,["बिहार में गंगा, कोसी, घाघरा, बागमती आदि कई प्रमुख नदियों का संधि क्षेत्र है, जिससे जल संसाधन प्रबंधन, बाढ़ नियंत्रण और जल गुणवत्ता की चुनौतियाँ अधिक हैं।","बिहार में गंगा, कोसी, घाघरा, बागमती, सोन आदि प्रमुख नदियाँ बहती हैं","कोसी नदी का जल प्रवाह अत्यधिक परिवर्तनशील है, जिससे बाढ़ का जोखिम बढ़ता है","गंगा के कई शाखाएँ बिहार में बहती हैं, जिससे जलस्रोत घनत्व अधिक है","बिहार में वार्षिक औसत वर्षा 1,000 mm से अधिक है","नदियों के संधि क्षेत्रों में जल प्रदूषण की समस्या गंभीर है","बिहार में जलस्रोतों की निकटता से कृषि और जल शक्ति उत्पादन पर निर्भरता है","बाढ़ प्रबंधन के लिए कई बांध और जलाशय बनाए गए हैं","जल संसाधन प्रबंधन में जल अधिकार और जल वितरण की जटिलता है"]]];
const TR={"en":[["What is the name of the largest island group of India?",["Gujarat Islands","Sundarbans Islands","Lakshadweep group","Andaman and Nicobar Islands"],["The Andaman and Nicobar Islands are the largest island group of India by total area.","The Andaman and Nicobar Islands consist of 572 islands.","Their total area is about 5,043 square kilometres.","India incorporated them after independence in 1947.","They suffered severe damage from the 2004 tsunami.","They have strategic importance for India's maritime boundary.","Several national parks and sanctuaries are located on these islands.","In 2006 UNESCO declared these islands a World Heritage site for biodiversity.","The main languages on these islands are English and Hindi."]],["Which is the highest waterfall located in the Himalayas?",["Denali Waterfall","Jogi Waterfall","Kejri Waterfall","Juhu Waterfall"],["Denali Waterfall drops from a height of 1,585 metres and is considered India's highest waterfall.","Denali Waterfall is located in Ladakh.","It falls from a height of 1,585 metres.","The waterfall is part of the Himalayan watercourse.","It is a major attraction for tourism.","It offers hydro‑electric potential in the region.","The source of the Denali River is this waterfall.","The waterfall remains icy in winter.","Local people call it 'Denali Falls'."]],["What is the largest inland water source in India?",["Narmada River","Yamuna River","Ganga River","Godavari River"],["The Narmada River has the largest total water storage and drainage basin among inland water sources in India.","The source of the Narmada River is at Amarkantak.","It is 1,312 km long.","It flows through several central Indian states.","It is a key component of Narmada hydro‑electric projects.","It is a major irrigation source for agriculture.","The Narmada Dam (Sardar Sarovar) is the largest reservoir in India.","Several national parks are situated along the banks of the Narmada River.","The average discharge of the Narmada water source is 2,000 cubic metres per second."]],["Which district receives the highest rainfall in India?",["Kodaikanal (Tamil Nadu)","Mau (Madhya Pradesh)","Assam (Assam)","Silchar (Odisha)"],["Kodaikanal receives an annual average rainfall of more than 7,500 mm, making it the highest‑rainfall district in India.","Kodaikanal is located in the Southern Western Ghats.","In 2019 it recorded over 8,000 mm of rainfall.","The area is known for fog and strong winds.","Its forest region hosts many rare species.","Tea plantations are prominent in Kodaikanal.","The local watercourses are sources for several rivers.","It is popular for tourism, especially waterfalls and wildlife safaris.","The local population primarily speaks Tamil and Malayalam."]],["What is the largest inland lake in India?",["Silver Lake","Volta Lake","Chilka Lake","Pichla Lake"],["Volta Lake, located in Karnataka, is the largest inland lake in India with a surface area of about 1,300 square kilometres.","Volta Lake was created in 1959 by a dam.","It is situated in the Belagavi district of Karnataka.","The lake water is primarily used for agricultural irrigation.","Various species of fish are found in its waters.","The maximum storage capacity of the Volta reservoir is 95 million cubic metres.","Several religious sites are located on the lake's banks.","The surrounding area includes several wildlife sanctuaries.","The lake water level varies seasonally."]],["Which state in India has the highest landslide risk?",["Maharashtra","Himachal Pradesh","Assam","Uttarakhand"],["Uttarakhand has the highest landslide risk due to its Himalayan geophysics and heavy rainfall.","More than 2,000 landslides occurred in Uttarakhand in 2013.","The hilly regions here have steep slopes.","Heavy monsoon rainfall triggers landslides.","Landslides have caused many villages to face floods and displacement.","The state established a landslide warning system in 2015.","Several national highways were closed because of landslides.","Local people often adopt measures to reduce risk while building infrastructure in mountainous areas.","After landslides, rehabilitation work receives support from government and NGOs."]],["Which is the largest desert national park in India?",["Desert National Park","Ravli National Park","Vainad National Park","Saberkanth National Park"],["Desert National Park, located in Rajasthan, is the largest desert national park in India, covering an area of about 3,162 square kilometers.","Desert National Park was established in 1980.","It is situated within the Thar Desert.","The park hosts many adapted flora and fauna.","Key species include the Indian gazelle, desert fox, and various reptiles.","Water sources in the park are very scarce.","The climate features extreme temperature variations.","The park offers safari and trekking opportunities for tourists.","Local tribal communities play an important role in the park's conservation."]],["Which state in India has the longest coastline?",["Gujarat","Andhra Pradesh","Tamil Nadu","Kerala"],["Gujarat's coastline is about 1,600 kilometers, the longest among all Indian states.","Gujarat's coast lies along the Arabian Sea.","Several major ports such as Mumbra and Kaver are on the coast.","The coastline includes many saline lakes and marshes.","The coast serves as a breeding ground for numerous marine species.","Several oil and gas fields are located near the coast.","Gujarat hosts many tourist spots along the coast like Dwarka and Sauren Island.","Many fishing villages are situated along the shoreline.","Due to its extensive coastline, Gujarat experiences a tropical climate."]],["Which is the largest inland water reservoir (dam) in India?",["Bakhra Dam","Bakhra Dam","Bakhra Watercourse","Bakhra Reservoir"],["Bakhra Dam (Bakhra Reservoir) in Madhya Pradesh is the largest inland water reservoir in India, with a total storage capacity of 95 million cubic meters.","Bakhra Dam was completed in 2002.","It is located in Indore district of Madhya Pradesh.","The main purposes of the dam are irrigation and hydroelectric power.","The surface area of Bakhra Reservoir is about 1,300 square kilometers.","Several wildlife sanctuaries are situated around the dam.","The dam's water provides drinking water to many villages.","Agricultural production in the region increased by 30% after the dam's construction.","The area around the dam offers boating and trekking sites for tourism."]],["What is the name of India's largest river basin?",["Indus Basin","Brahmaputra Basin","Ganga Basin","Narmada Basin"],["The Ganga Basin is the largest river basin in India, covering an area of about 1,018,000 square kilometers and encompassing many major rivers.","The Ganga Basin includes major rivers such as the Ganga, Yamuna, and Godavari.","The total water resources of the Ganga Basin are about 1,200 cubic kilometers.","The basin spans Uttarakhand, Himachal Pradesh, Uttar Pradesh, Bihar, Jharkhand, West Bengal, Assam, and parts of Bangladesh.","Approximately 60% of India's agricultural production comes from the Ganga Basin.","Major hydroelectric projects like Hemkund and Bahrampur are located in the Ganga Basin.","The basin exhibits diverse climates, from Himalayan snow regions to wetlands and plains.","Overuse and pollution of water resources are major issues in the Ganga Basin.","Management of the basin's water resources is prominently mentioned in the National Water Policy."]],["Which state in India has the largest marine water source (coastline)?",["Gujarat","Karnataka","Andhra Pradesh","Tamil Nadu"],["Gujarat has the longest coastline in India, with a total length of about 1,600 kilometres, which is roughly 30% of the country's total coastline.","Gujarat's coastline is more than 1,600 km","Major ports such as Mumba, Kachchh, and Hazira Bagh are located in Gujarat","Gujarat's coastal region is important for industry, fisheries and tourism","Coastal districts in Gujarat include Dwarka, Kachchh and Saurashtra","Several natural saline water sources exist along Gujarat's coast","Aerial salt production also takes place on Gujarat's seashore","Many marine national parks and protected areas are found on Gujarat's coast","Management of marine storms and cyanide risks is carried out on Gujarat's coast"]],["Which state in India has the greatest geomorphological diversity?",["Karnataka","Uttarakhand","Jharkhand","Maharashtra"],["Uttarakhand is considered the state with the highest geomorphological diversity, featuring Himalayan peaks, valleys, hills, plains and sub‑tropical zones.","Uttarakhand has Himalayan peaks such as Nanda Devi and Trishul","Uttarakhand includes diverse regions like Kumaon, Garhwal and hill areas","Several major river sources are located in Uttarakhand, such as the Ganga, Yamuna and Saraswati","Uttarakhand has various climatic zones ranging from cold Himalayan to sub‑tropical","Uttarakhand contains many national parks and protected areas, such as Kanger Valley National Park","Because of its geomorphological diversity, agricultural patterns in Uttarakhand are also varied","Uttarakhand offers many tourist destinations, such as Nainital, Almora and Ranikhet","The geomorphological diversity in Uttarakhand makes water‑resource management challenging"]],["Which is the largest inland climatic zone (biodiversity) in India?",["Andaman and Nicobar Islands","Sahyadri forest region","Sandhya Van","Sahyadri hill region"],["The Sahyadri forest region is the largest inland climatic zone in India, containing extremely high biodiversity and many endemic species.","The Sahyadri forest region hosts more than 7,500 wildlife species","It includes several threatened species such as tigers, elephants and gaurs","The region encompasses various climate types, including sub‑tropical, arid and temperate","Many national parks and protected areas are located in the Sahyadri forest region","The Sahyadri forest region has diverse water resources such as rivers, streams and reservoirs","Local tribal communities exhibit cultural diversity in the Sahyadri forest region","Several schemes are implemented for wildlife conservation in the Sahyadri forest region","Studies on the impacts of climate change are being conducted in the Sahyadri forest region"]],["Which state in India faces the greatest inland climate‑change risk?",["Himachal Pradesh","Madhya Pradesh","Odisha","Jharkhand"],["Jharkhand is considered the highest‑risk state due to climate‑change impacts caused by mining, industrial activities and deforestation.","Jharkhand has large‑scale coal mining","Industrial pollution and water pollution are major problems in Jharkhand","Deforestation in Jharkhand is increasing climate‑change impacts","Many water sources in Jharkhand are drying up","Both flood and drought events have increased in Jharkhand because of climate change","Several state schemes have been implemented to mitigate climate‑change impacts in Jharkhand","Multiple research institutes are working on climate‑change studies in Jharkhand","Climate change has also affected biodiversity in Jharkhand"]],["Which state in India has the most varied inland rainfall pattern?",["Madhya Pradesh","Assam","Maharashtra","Kerala"],["Maharashtra exhibits an extremely varied rainfall pattern due to the Western Ghats, with very high rainfall on the coastal side and much lower rainfall in the interior.","In the Western Ghats, areas such as Mumbai and Pune receive an annual average rainfall of over 3,000 mm","The interior parts of Maharashtra receive an annual average rainfall of 600–800 mm","Maharashtra experiences heavy monsoon rains and flood problems","Rainfall has led to the development of hydro‑electric projects in Maharashtra","Maharashtra has a diverse set of water resources, such as the Narmada, Krishna and Godavari rivers","Rainfall also creates diverse agricultural patterns in Maharashtra","Rainfall causes water‑scarcity and water‑resource management challenges in Maharashtra","Several meteorological centers monitor the impacts of rainfall in Maharashtra"]],["Which state in India has the largest intra‑regional climate (temperature) difference?",["Rajasthan","Kerala","Uttarakhand","Himachal Pradesh"],["Rajasthan experiences extreme temperature differences due to its desert and arid regions, where daytime temperatures can exceed 45°C and night temperatures can drop to 5°C.","Rajasthan is home to the Thar Desert","Daytime temperatures in Rajasthan can exceed 45°C","Nighttime temperatures in Rajasthan can drop to 5°C","The climate in Rajasthan is dry and semi‑dry","Rajasthan has a scarcity of water resources","Due to climate change, temperature differences in Rajasthan are increasing","Climate impacts create agricultural challenges in Rajasthan","Several meteorological stations have been established in Rajasthan for climate monitoring"]],["Which state in India has the highest intra‑regional climate (wind) speed?",["Madhya Pradesh","Punjab","Odisha","Gujarat"],["Gujarat experiences strong wind speeds during the monsoon season because of its coastal location, with some areas recording speeds above 80 km/h.","Strong monsoon winds occur in Gujarat","Wind speeds in Gujarat's coastal areas can exceed 80 km/h","Wind causes aerial salt production along Gujarat's coastline","Wind has led to the development of wind‑energy projects in Gujarat","Coastal erosion is a problem in Gujarat due to wind","Wind impacts are studied in Gujarat for climate‑change research","Tourism along Gujarat's coast is also affected by wind","Several meteorological centers monitor winds in Gujarat"]],["What is the name of India's largest surface water source (river)?",["Yamuna","Brahmaputra","Ganga","Narmada"],["The Ganga is India's longest river with the largest water discharge, draining a total basin area of about 1,08,000 square kilometres.","The total length of the Ganga is 2,525 km","The Ganga basin spans Uttarakhand, Himachal Pradesh, Uttar Pradesh, Bihar, Jharkhand and West Bengal","The primary source of the Ganga is the Gangotri Glacier","The Ganga is called the lifeline of India","Major tributaries of the Ganga include the Yamuna, Godavari, Kaveri, Saraswati, etc.","Several large dams and hydro‑electric projects are situated on the Ganga","Water purification and pollution control of the Ganga are top priorities of the Indian government","The Ganga's waters host a variety of aquatic life and microorganisms"]],["In which state is the largest surface water source (lake) in India located?",["Vikramshagar (Assam)","Sindhu (Punjab)","Udhanpur (Rajasthan)","Vikaswadi (Madhya Pradesh)"],["Vikramshagar in Assam is a large reservoir created by a dam on the Brahmaputra River and is one of India's biggest surface water lakes.","Vikramshagar was constructed in 1975 as part of the Brahmaputra hydro‑electric project","The lake's surface area is about 1,360 square kilometres","Its main purpose is hydro‑electric power generation and flood control","The lake is situated in Assam's Dibrugarh district","Several national parks and wildlife sanctuaries surround Vikramshagar","Various species of fish are found in the lake","The water level of Vikramshagar varies seasonally","The reservoir plays a crucial role in Assam's water supply and irrigation"]],["Which state in India has the greatest intra‑regional climate diversity?",["Madhya Pradesh","Chhattisgarh","Uttarakhand","Maharashtra"],["Madhya Pradesh hosts multiple climate types such as arid, tropical and winter, making it a leader in climate diversity.","Northern Madhya Pradesh experiences winter climate while the south has tropical climate","Average annual rainfall on the surface ranges from 800 to 1,200 mm","Major rivers like the Iti, Sagir and Narmada flow through Madhya Pradesh","The state contains various forest types including tiger reserves, savanna and dry forest","Madhya Pradesh has several national parks and wildlife sanctuaries","The climate influences agricultural production in diverse ways","Different climate zones allow cultivation of a variety of crops","Research institutes study climate‑change impacts in Madhya Pradesh"]],["What is the name of the largest inland water resource (dam) in India?",["Bhujbhujia Dam","Bakhadiya Dam","Hirakund Dam","Bhuj Dam"],["Bakhadiya Dam is located in Madhya Pradesh and is one of the largest inland water resource dams in India, with a very high water storage capacity.","Construction of Bakhadiya Dam was completed in 1995.","The dam is situated on the Narmada River.","The dam’s water storage capacity is about 2,500 crore cubic meters.","The main purposes of the dam are water supply, irrigation and hydro‑electric power generation.","Several water conservation projects are ongoing around Bakhadiya Dam.","The dam’s construction has led to changes in the local climate.","The dam’s water level experiences seasonal fluctuations.","Studies are conducted on climate‑change impacts in the areas surrounding the dam."]],["Which state in India has the highest inland climate‑change risk?",["Punjab","Tamil Nadu","Gujarat","Madhya Pradesh"],["Madhya Pradesh faces the highest risk due to rising temperatures, altered rainfall patterns and increased pressure on water resources caused by climate change.","Average temperature in Madhya Pradesh has risen by 1.2 °C over the past 30 years.","Rainfall patterns have become more irregular.","Water storage capacity has declined.","Climate change has adversely affected agricultural production.","Several water‑scarcity situations have emerged in the state.","The government has launched a climate‑adaptation plan.","Risk assessments have been carried out using various climate‑modeling approaches.","Training programmes are being run to raise community awareness about climate change."]],["Which state in India has the most diverse inland rainfall pattern?",["West Bengal","Chhattisgarh","Rajasthan","Madhya Pradesh"],["West Bengal exhibits highly diverse rainfall distribution, with Himalayan precipitation in the north and heavy monsoon rains in the south.","Annual average rainfall in West Bengal ranges from 1,200 to 5,000 mm.","The northern part receives rain influenced by the Himalayas.","The southern part gets heavy monsoon rainfall from the Bay of Bengal.","Rainfall raises water levels in many rivers.","Flood probability is higher during the rainy season.","Agricultural patterns are varied due to the state’s multiple climate zones.","Changes in rainfall patterns have made water‑resource management challenging.","The government has initiated several projects for rain‑water harvesting."]],["Which state in India has the greatest inland temperature variation?",["Kerala","Madhya Pradesh","Uttarakhand","Himachal Pradesh"],["In Himachal Pradesh, winter temperatures drop to –20 °C in the north while the southern part reaches up to 40 °C in summer, resulting in the largest temperature range.","Winter average minimum temperatures in Himachal Pradesh range from –20 °C to –5 °C.","Summer maximum temperatures reach 35 °C to 40 °C.","The state features climate diversity across different elevations.","Temperature changes sharply with altitude.","Studies have examined temperature differences across Himachal’s districts.","Temperature variation influences crop selection.","The government has formulated climate‑adaptation plans based on temperature changes.","Local communities have been sensitised about temperature changes."]],["Which state in India has the highest inland wind speed?",["Punjab","Odisha","Gujarat","Rajasthan"],["Gujarat experiences higher speeds of westerly curved winds (lorry), especially in coastal areas, making it the leading state in wind speed.","Annual average wind speed along Gujarat’s coastline is 12–15 km/h.","Wind speed shows seasonal variations.","Wind speed affects agriculture and energy production.","Several wind‑energy projects have been installed in Gujarat.","Coastal erosion occurs due to wind action.","Studies have examined climate‑change impacts related to wind.","The government has created policies to promote wind energy.","Local populations have been made aware of wind‑related health effects."]],["Which is the largest surface water body (river) in India?",["Brahmaputra","Yamuna","Narmada","Ganga"],["The Ganga is the longest and largest watercourse in India, with the most extensive drainage basin, and is one of the country's major water resources.","The total length of the Ganga is about 2,525 km.","The Ganga's drainage basin exceeds 108,000 square km.","The Ganga originates in Gangotri, Uttarakhand.","The Ganga flows through many major Indian states.","The Ganga's water is widely used for agriculture, drinking water, and industry.","Several large dams and hydro‑electric projects are located on the Ganga.","Water quality of the Ganga needs improvement in many regions.","A national mission 'Namami Gange' is being run to clean the Ganga."]],["Which state in India has the largest interior rainfall pattern?",["Madhya Pradesh","Uttarakhand","Jharkhand","Maharashtra"],["Rainfall distribution in Jharkhand is highly varied, with high rainfall in the eastern part and lower rainfall in the western part, making it distinctive in rainfall patterns.","Jharkhand's average annual rainfall is about 1,300 mm.","Areas such as Kodarma and Ranchi receive heavy rain during the monsoon.","Climate‑change impacts are more evident in the eastern part of Jharkhand due to coal mining.","Jharkhand has many water bodies, such as coal reservoirs.","The region has a higher likelihood of landslides due to rainfall.","Jharkhand is the source of several major rivers, such as the Coal and Bhandra rivers.","Agricultural production increases during the rainy season.","The effects of climate change in Jharkhand are studied by several research institutes."]],["Which state in India has the greatest interior climate diversity?",["Maharashtra","Rajasthan","Uttarakhand","Kerala"],["Uttarakhand has Himalayan, mid‑Himalayan, sub‑tropical and sub‑alpine climate zones, making it a leader in climate diversity.","Uttarakhand has three major climate zones: Himalayan, mid‑Himalayan and sub‑alpine.","In the Himalayan zone winter temperatures can drop to -20°C.","In the sub‑alpine zone summer temperatures can reach 35°C.","Uttarakhand is the source of five major rivers, such as the Ganga, Yamuna and Satluj.","The state has seven national parks and several wildlife sanctuaries.","During the rainy season the snow‑covered areas replenish water resources.","Uttarakhand's climate‑change impacts are studied in many international projects.","The state's climate diversity influences agriculture, tourism and water‑resource management."]],["In which Indian state is the greatest surface geomorphological diversity found, including mountains, plateaus, plains and a complex river network?",["Maharashtra","Jharkhand","Chhattisgarh","Uttarakhand"],["Uttarakhand features Himalayan mountains, mid‑Himalayan plateaus, Garhwal valleys and a complex network of major rivers, giving it extremely high geomorphological diversity.","Uttarakhand includes the Garhwal, Kumaon and Himachal geomorphological units.","The main Himalayan ranges lie north of Uttarakhand.","Major rivers such as the Kunda, Almora and Barmu originate here.","The Kunda valley contains many small sub‑valleys and folds.","A mid‑Himalayan plateau stretches between the Kunda and Almora rivers.","Uttarakhand has many glaciers and snow‑capped peaks.","Because of its geomorphological diversity, the state mixes several climate zones.","This diversity plays an important role in tourism, hydro‑electric power and water‑resource management."]],["Which Indian state is considered most challenging for water‑resource management due to the high density of surface water bodies (rivers)?",["Bihar","Madhya Pradesh","Assam","Gujarat"],["Bihar has a confluence zone of several major rivers such as the Ganga, Kosi, Ghaghara and Bagmati, leading to greater challenges in water‑resource management, flood control and water quality.","Major rivers flowing through Bihar include the Ganga, Kosi, Ghaghara, Bagmati and Son.","The Kosi River has highly variable flow, increasing flood risk.","Many branches of the Ganga flow through Bihar, raising river‑density.","Bihar receives an average annual rainfall of more than 1,000 mm.","Pollution problems are severe in river confluence areas.","Proximity of water bodies makes agriculture and hydropower heavily dependent on them.","Several dams and reservoirs have been built for flood management.","Water‑resource management involves complex issues of water rights and distribution."]]],"bh":[["भारत के सबसे बड़का द्वीप समूह के नाम का ह?",["गुजरात द्वीपसमूह","संद्यावन द्वीपसमूह","लक्षद्वीप समूह","अंडमान अउर निकोबार द्वीपसमूह"],["अंडमान अउर निकोबार द्वीपसमूह कुल क्षेत्रफल के हिसाब से भारत के सबसे बड़का द्वीप समूह बा।","अंडमान अउर निकोबार द्वीपसमूह में 572 द्वीप बा","इनकर कुल क्षेत्रफल लगभग 5,043 वर्ग किलोमीटर बा","इन्हें 1947 में भारत ने आज़ादी के बाद अपना बना लिहलस","इन्हें 2004 के सूनामी से गंभीर नुकसान भइल","इन्हें भारत के समुद्री सीमा खातिर रणनीतिक महत्व रखेला","एह द्वीपन पर कई राष्ट्रीय उद्यान अउर अभयारण्य बा","इन्हें 2006 में यूनेस्को द्वारा जैव विविधता खातिर विश्व धरोहर घोषित कइल गइल","एह द्वीपन पर प्रमुख भाषा अंग्रेजी अउर हिंदी बा"]],["हिमालय में स्थित सबसे ऊँचा जलप्रपात कौन ह?",["डेनाली जलप्रपात","जोगी जलप्रपात","केजरी जलप्रपात","जुहू जलप्रपात"],["डेनाली जलप्रपात 1,585 मीटर के ऊँचाई से गिरता आ एकर भारत के सबसे ऊँचा जलप्रपात मानल जाला।","डेनाली जलप्रपात लद्दाख में स्थित बा","ई 1,585 मीटर के ऊँचाई से गिरता","ई जलप्रपात हिमालय के जलधारा के हिस्सा बा","ई पर्यटन खातिर प्रमुख आकर्षण बा","ई इलाका में जलविद्युत के संभावना देला","डेनाली नदी के स्रोत ई जलप्रपात से ही बा","ई जलप्रपात सर्दी में बर्फीला रहेला","स्थानीय लोग एकरा के 'डेनाली फॉल्स' कहेला"]],["भारत में सबसे बड़का अंतर्देशीय जलस्रोत कौन ह?",["नर्मदा नदी","यमुना नदी","गंगा नदी","गोदावरी नदी"],["नर्मदा नदी के कुल जलसंचय आ प्रवाह क्षेत्रफल भारत में सबसे बड़का अंतर्देशीय जलस्रोत ह।","नर्मदा नदी के स्रोत अमरकंटक में बा","ई function L(k){return (LANG[currentLang]&&LANG[currentLang][k])||LANG.hi[k]||k}

function users(){const m=JSON.parse(localStorage.getItem('gyankshetraUsers')||'{}');const id=localStorage.getItem('gyankshetraUserId');if(id&&!m[id])m[id]=localStorage.getItem('gyankshetraUserName')||'';return m}
function uName(){const u=getUser();if(!u.logged)return '';let n=((users()[u.id])||u.name||'').trim();if(!n||/^@\d+-/.test(n))n=(u.id.split('-').slice(1).join('-')||n);return n}
function getUser(){const id=localStorage.getItem('gyankshetraUserId')||'';return{name:localStorage.getItem('gyankshetraUserName')||'',id,logged:!!id&&localStorage.getItem('gyankshetraLoggedIn')!=='0'}}
let cur='home',lastScreen='home';

function requireUser(a){if(getUser().logged)a();else{pendingAction=a;openAuth()}}
let authMode='register';
function openAuth(mode){authMode=mode||(Object.keys(users()).length?'login':'register');renderAuth();$('loginModal').classList.add('open');setTimeout(()=>$('nameInput').focus(),100)}
function renderAuth(){const r=authMode==='register',has=Object.keys(users()).length>0;$('authTitle').textContent=r?L('authNewT'):L('authLoginT');$('authHelp').textContent=r?L('authHelpReg'):L('authHelpLogin');$('authLabel').textContent=r?L('lblName'):L('lblId');$('nameInput').value='';$('nameInput').placeholder=r?L('phName'):L('phId');$('authBtn').textContent=r?L('btnStart'):L('btnLogin');$('authBtn').onclick=r?saveUser:loginById;$('authSwitch').textContent=r?L('swToLogin'):L('swToReg');$('authSwitch').style.display=(r&&!has)?'none':'block'}
function switchAuth(){authMode=authMode==='register'?'login':'register';renderAuth()}
function loginById(){const e=$('nameInput').value.trim().toUpperCase(),m=users(),id=Object.keys(m).find(k=>k.toUpperCase()===e);if(!id){alert(L('wrongId'));return}localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraUserName',m[id]);localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function logout(){pauseQuiz();localStorage.setItem('gyankshetraLoggedIn','0');updateProfile();go('home')}
function toggleProfile(){cur==='profile'?go(lastScreen):go('profile')}
function closeAuth(){$('loginModal').classList.remove('open');pendingAction=null}
function makeId(name,n){const w=name.trim().split(/\s+/)[0].replace(/[^\p{L}\p{N}]+/gu,'').toUpperCase();return '@'+String(n).padStart(2,'0')+'-'+w}
function saveUser(){const n=$('nameInput').value.trim();if(!n){alert(L('needName'));return}const num=Number(localStorage.getItem('gyankshetraNextNumber')||1),id=makeId(n,num),m=users();m[id]=n;localStorage.setItem('gyankshetraUsers',JSON.stringify(m));localStorage.setItem('gyankshetraUserName',n);localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraNextNumber',String(num+1));localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function updateProfile(){const u=getUser();$('profileName').textContent=u.logged?uName():'Gyankshetra '+L('student');$('profileId').textContent=u.logged?'🆔 '+u.id:L('loginPrompt');$('welcome').textContent=L('hello')+' '+(u.logged?uName():L('student'))+' 👋';$('profileLoginBtn').style.display=u.logged?'none':'block';$('profileLogoutBtn').style.display=u.logged?'block':'none';const h=JSON.parse(localStorage.getItem('gyankshetraHistory')||'[]');$('historyText').textContent=h.length?`${h.length} ${L('histN')} • ${L('histLast')}: ${h[h.length-1].marks}/${h[h.length-1].total||TOTAL}`:L('histNone');{const b=h.reduce((m,x)=>{const t=x.total||TOTAL;return (Number(x.marks)||0)/t>(m?m.marks/m.t:-1)?{marks:Number(x.marks)||0,t}:m},null);$('bestScore').textContent=b?b.marks+' / '+b.t:'0 / '+TOTAL}updateResume()}
function startQuiz(){qi=0;ans=Array(TOTAL).fill(null);time=0;reviewIndex=0;running=true;clearInterval(timerHandle);go('quiz');render();saveProgress();timerHandle=setInterval(tick,1000)}
function pKey(){return 'gyankshetraProgress_'+TEST_ID+'_'+(localStorage.getItem('gyankshetraUserId')||'')}
function saveProgress(){if(running)localStorage.setItem(pKey(),JSON.stringify({qi,ans,time}))}
function getProgress(){try{const p=JSON.parse(localStorage.getItem(pKey())||'null');return p&&Array.isArray(p.ans)&&p.time>0?p:null}catch(e){return null}}
function pauseQuiz(){if(!running)return;saveProgress();running=false;clearInterval(timerHandle);timerHandle=null}
function tick(){if(time<TIME){time++;renderTimer();if(time>=TIME)finish();else if(time%5===0)saveProgress()}else finish()}
function resumeQuiz(){const p=getProgress();if(!p){startQuiz();return}qi=p.qi;ans=p.ans;time=p.time;running=true;clearInterval(timerHandle);go('quiz');render();timerHandle=setInterval(tick,1000)}
function updateResume(){const p=getUser().logged?getProgress():null;document.querySelectorAll('.resumebtn').forEach(b=>{b.style.display=p?'block':'none';if(p)b.textContent='▶ '+L('resume')+' • '+L('q')+' '+(p.qi+1)+'/'+TOTAL+' • '+fmt(TIME-p.time)})}
function fmt(t){t=Math.max(0,t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function renderTimer(){$('timer').textContent=fmt(TIME-time);$('timer').parentElement.classList.toggle('low',TIME-time<=60)}
function render(){const q=Q(qi);$('qn').textContent=(qi+1)+'/'+TOTAL;$('question').textContent=q[0];$('options').innerHTML=q[1].map((o,i)=>`<div class="option ${ans[qi]===i?'sel':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join('');$('nextBtn').textContent=qi===TOTAL-1?L('submit'):L('next');$('starBtn').textContent=saved.includes(qi)?'★':'☆';$('starBtn').classList.toggle('on',saved.includes(qi));renderTimer()}

let curNote=null;
function cleanH(h){return String(h).replace(/<script[\s\S]*?<\/script>/gi,'').replace(/\son\w+\s*=\s*("[^"]*"|'[^']*'|[^\s>]+)/gi,'').replace(/javascript:/gi,'')}
async function openNote(k,i){const f=getStudyList(k)[i];if(!f)return;if(f.url&&!f.html){try{const r=await fetch(f.url);if(!r.ok)throw 0;const d=new DOMParser().parseFromString(await r.text(),'text/html'),c=d.querySelector('.content');if(!c||!c.innerHTML.trim())throw 0;f.html=c.innerHTML}catch(e){window.open(f.url,'_blank');return}}curNote=f;$('rBody').innerHTML=cleanH(f.html);$('reader').classList.add('open');$('rBody').scrollTop=0}
function dlKey(){return 'gyankshetraDownloads_'+(localStorage.getItem('gyankshetraUserId')||'guest')}
function getDl(){try{return JSON.parse(localStorage.getItem(dlKey())||'[]')}catch(e){return []}}
function saveDownload(n){try{const id=n.id||n.title,a=getDl().filter(x=>x.id!==id);a.unshift({id,title:n.title,html:cleanH(n.html),at:Date.now()});localStorage.setItem(dlKey(),JSON.stringify(a.slice(0,30)))}catch(e){}if($('dlBody'))renderDownloads()}
function renderDownloads(){const a=getDl();$('dlBody').innerHTML=a.length?a.map((f,n)=>`<div class="card dlrow"><div style="flex:1;color:#075fc3;font-weight:700" onclick="openDl(${n})">📄 ${escH(f.title)}<small style="display:block;color:#7b8799;font-weight:400">${new Date(f.at).toLocaleDateString()}</small></div><button class="qdel" onclick="rmDl(${n})">🗑</button></div>`).join(''):`<div class="card"><small>${L('noDl')}</small></div>`}
function openDl(n){const f=getDl()[n];if(!f)return;curNote=f;$('rBody').innerHTML=cleanH(f.html);$('reader').classList.add('open');$('rBody').scrollTop=0}

function dlNote(){if(!curNote)return;const t='<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>'+curNote.title.replace(/</g,'&lt;')+'</title><style>body{font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:16px;line-height:1.7}h3{color:#075fc3}table{border-collapse:collapse}td,th{border:1px solid #999;padding:6px}</style></head><body><h1>'+curNote.title.replace(/</g,'&lt;')+'</h1>'+cleanH(curNote.html)+'<hr><p>📢 Gyankshetra — https://t.me/gyankshetra</p></body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download=(curNote.id||'gyankshetra-note')+'.html';document.body.appendChild(a);a.click();a.remove();saveDownload(curNote)}

const BUILTIN_NOTES=[{id:'oxidation',title:'Chemistry — ऑक्सीकरण (Notes)',html:"<h2>ऑक्सीकरण (Oxidation)<\/h2>\n<h3>1. परिभाषा<\/h3>\n<p>किसी पदार्थ में <b>ऑक्सीजन का जुड़ना<\/b> या <b>हाइड्रोजन का हटना<\/b> ऑक्सीकरण कहलाता है। इलेक्ट्रॉन के आधार पर: जब कोई परमाणु या आयन <b>इलेक्ट्रॉन त्यागता<\/b> है और उसका ऑक्सीकरण अंक बढ़ता है, तो वह ऑक्सीकृत होता है।<\/p>\n<h3>2. ऑक्सीकरण और अपचयन की तुलना<\/h3>\n<table><tr><th>आधार<\/th><th>ऑक्सीकरण<\/th><th>अपचयन<\/th><\/tr>\n<tr><td>ऑक्सीजन<\/td><td>जुड़ना<\/td><td>हटना<\/td><\/tr>\n<tr><td>हाइड्रोजन<\/td><td>हटना<\/td><td>जुड़ना<\/td><\/tr>\n<tr><td>इलेक्ट्रॉन<\/td><td>त्यागना (हानि)<\/td><td>ग्रहण करना (लाभ)<\/td><\/tr>\n<tr><td>ऑक्सीकरण अंक<\/td><td>बढ़ना<\/td><td>घटना<\/td><\/tr><\/table>\n<h3>3. याद रखने की ट्रिक<\/h3>\n<p><b>OIL RIG<\/b> — Oxidation Is Loss, Reduction Is Gain (इलेक्ट्रॉन की)।<\/p>\n<h3>4. रेडॉक्स अभिक्रिया<\/h3>\n<p>जिस अभिक्रिया में ऑक्सीकरण और अपचयन <b>एक साथ<\/b> होते हैं, उसे रेडॉक्स (Redox) अभिक्रिया कहते हैं।<\/p>\n<ul><li>2Mg + O₂ → 2MgO : Mg का ऑक्सीकरण, O₂ का अपचयन।<\/li>\n<li>CuO + H₂ → Cu + H₂O : H₂ का ऑक्सीकरण, CuO का अपचयन।<\/li><\/ul>\n<h3>5. ऑक्सीकारक और अपचायक<\/h3>\n<table><tr><th>पदार्थ<\/th><th>कार्य<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>ऑक्सीकारक<\/td><td>दूसरे को ऑक्सीकृत करता है, स्वयं अपचयित होता है<\/td><td>O₂, KMnO₄, K₂Cr₂O₇<\/td><\/tr>\n<tr><td>अपचायक<\/td><td>दूसरे का अपचयन करता है, स्वयं ऑक्सीकृत होता है<\/td><td>H₂, C, Zn, Mg<\/td><\/tr><\/table>\n<h3>6. दैनिक जीवन में ऑक्सीकरण<\/h3>\n<ul><li><b>जंग लगना:<\/b> हवा और नमी में लोहे पर भूरी परत (Fe₂O₃·xH₂O) बनती है।<\/li>\n<li><b>दहन:<\/b> ईंधन का ऑक्सीजन से ऑक्सीकरण, ऊष्मा और प्रकाश निकलता है।<\/li>\n<li><b>श्वसन:<\/b> कोशिकाओं में ग्लूकोज़ का ऑक्सीकरण, ऊर्जा मिलती है।<\/li>\n<li><b>विकृतगंधिता (Rancidity):<\/b> तेल या वसा का ऑक्सीकरण, खाने में बुरी गंध और स्वाद आता है।<\/li>\n<li><b>ताँबे पर हरी परत:<\/b> हवा और नमी से ताँबे का संक्षारण।<\/li><\/ul>\n<h3>7. ऑक्सीकरण से बचाव<\/h3>\n<ul><li>पेंट, तेल या ग्रीस लगाना।<\/li>\n<li>गैल्वनीकरण: लोहे पर जस्ते की परत चढ़ाना।<\/li>\n<li>मिश्रधातु बनाना, जैसे स्टेनलेस स्टील।<\/li>\n<li>खाद्य पदार्थों में एंटीऑक्सीडेंट मिलाना।<\/li>\n<li>चिप्स के पैकेट में नाइट्रोजन गैस भरना।<\/li><\/ul>\n<h3>8. ऑक्सीकरण अंक के मुख्य नियम<\/h3>\n<ol><li>मुक्त तत्व का ऑक्सीकरण अंक 0 होता है।<\/li>\n<li>सरल आयन का ऑक्सीकरण अंक उसके आवेश के बराबर होता है (Na⁺ = +1)।<\/li>\n<li>यौगिक में सभी परमाणुओं के ऑक्सीकरण अंकों का योग 0 होता है।<\/li>\n<li>ऑक्सीजन प्रायः −2 (पेरॉक्साइड में −1) होती है।<\/li>\n<li>हाइड्रोजन प्रायः +1 (धात्विक हाइड्राइड में −1) होता है।<\/li><\/ol>\n<h3>9. परीक्षा के लिए महत्वपूर्ण बिंदु<\/h3>\n<ul><li>ऑक्सीकरण और अपचयन हमेशा साथ-साथ होते हैं।<\/li>\n<li>मैग्नीशियम रिबन जलने पर तेज़ सफ़ेद रोशनी के साथ MgO बनाता है।<\/li>\n<li>धातुओं के ऑक्साइड प्रायः क्षारीय और अधातुओं के ऑक्साइड प्रायः अम्लीय होते हैं।<\/li>\n<li>H₂O₂ ऑक्सीकारक और अपचायक, दोनों की तरह व्यवहार कर सकता है।<\/li><\/ul>"}];

function ghOwner(){return location.hostname.endsWith('.github.io')?location.hostname.split('.')[0]:ADMIN_USER}
function ghRepo(){return location.pathname.split('/').filter(Boolean)[0]||'Gyankshetra-app'}
function adminTok(){try{return localStorage.getItem('gyankshetraAdminToken')||''}catch(e){return ''}}
function isAdmin(){return !!adminTok()&&localStorage.getItem('gyankshetraAdminOk')==='1'}
function gh(path,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+adminTok(),'Accept':'application/vnd.github+json'},opt.headers||{});return fetch('https://api.github.com'+path,opt)}
function b64d(c){return new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\n/g,'')),x=>x.charCodeAt(0)))}
function b64e(t){return btoa(unescape(encodeURIComponent(t)))}
const SLIDE_K=['s_sci','s_soc','s_bgk','s_ca'];let bIdx=0,bPause=0;
function bStep(){const c=$('bTrack').children;return c.length>1?c[1].offsetLeft-c[0].offsetLeft:0}
function bDot(i){document.querySelectorAll('#bDots i').forEach((d,k)=>d.classList.toggle('on',k===i))}
function slideBuild(){const t=$('bTrack');if(!t)return;const msg=k=>escH(L('slideP').replace('{x}',L(k)));
t.innerHTML=SLIDE_K.concat([SLIDE_K[0]]).map(k=>`<div class="banner bslide" onclick="openSection('${k}')"><span>🎯</span><div class="btxt"><b>${escH(L('bannerT'))}</b><small class="slide">${msg(k)}</small></div><button class="bstart"><span>${escH(L('startT'))}</span><i>→</i></button></div>`).join('');
$('bDots').innerHTML=SLIDE_K.map(()=>'<i></i>').join('');const st=bStep();t.style.scrollSnapType='none';t.scrollLeft=bIdx*st;requestAnimationFrame(()=>t.style.scrollSnapType='');bDot(bIdx)}
function openSection(k){openSub.tests=k;go('tests');renderLists()}
function bNext(){const t=$('bTrack'),st=bStep();if(!st)return;t.scrollTo({left:(Math.round(t.scrollLeft/st)+1)*st,behavior:'smooth'})}
(function(){const t=$('bTrack');let tm;t.addEventListener('scroll',()=>{const st=bStep();if(!st)return;bDot(Math.round(t.scrollLeft/st)%4);clearTimeout(tm);tm=setTimeout(()=>{let i=Math.round(t.scrollLeft/st);if(i>=SLIDE_K.length){t.style.scrollSnapType='none';t.scrollLeft=0;requestAnimationFrame(()=>t.style.scrollSnapType='');i=0}bIdx=i;bDot(i)},100)},{passive:true});
['touchstart','mousedown','wheel'].forEach(e=>t.addEventListener(e,()=>{bPause=Date.now()+5000},{passive:true}))})();
setInterval(()=>{if(cur==='home'&&Date.now()>bPause)bNext()},2800);
function goApp(){if(ROOT)location.href=ROOT+'index.html';else go('home')}
function nav_admin(){$('drawer').classList.remove('open');openAdmin()}
function openAdmin(){if(isAdmin()){if(confirm('Admin Logout?'))adminLogout();return}$('tokInput').value='';$('adminModal').classList.add('open')}
function closeAdmin(){$('adminModal').classList.remove('open')}
function adminLogout(){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');adminUI();renderLists()}
function adminUI(){const b=$('adminMenuBtn');if(b)b.textContent=isAdmin()?'🚪 '+L('adminOut'):'🔐 '+L('adminIn')}
async function adminLogin(){const t=$('tokInput').value.trim();if(!t)return;localStorage.setItem('gyankshetraAdminToken',t);try{const u=await (await gh('/user')).json();if(!u.login||u.login.toLowerCase()!==ADMIN_USER)throw 'ID';const r=await (await gh('/repos/'+ghOwner()+'/'+ghRepo())).json();if(!r.permissions||!r.permissions.push)throw 'perm';localStorage.setItem('gyankshetraAdminOk','1');closeAdmin();adminUI();renderLists();alert('✅ Admin login: '+u.login)}catch(e){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');alert('❌ Login nahi hua. Token ya permission galat hai.')}}
function repoPath(u){try{const x=new URL(u,location.href);if(x.origin!==location.origin)return null;let p=decodeURIComponent(x.pathname);const base='/'+ghRepo()+'/';if(location.hostname.endsWith('.github.io')){if(!p.startsWith(base))return null;p=p.slice(base.length)}else p=p.replace(/^\//,'');return p}catch(e){return null}}
async function ghErr(r){let m='';try{m=(await r.json()).message||''}catch(e){}return 'HTTP '+r.status+(m?' — '+m:'')}
async function delTest(u){if(!isAdmin())return;const t=REG.tests.find(x=>x.url===u);if(!t||!confirm('"'+t.title+'" delete karna hai?'))return;const o=ghOwner(),r=ghRepo(),jp='content/generated_tests.json',ep='/repos/'+o+'/'+r+'/contents/'+jp,J={'Content-Type':'application/json'};try{
for(let k=0;k<2;k++){const g=await gh(ep,{cache:'no-store'});if(!g.ok)throw await ghErr(g);const gj=await g.json();const arr=JSON.parse(b64d(gj.content));if(!Array.isArray(arr))throw 'content/generated_tests.json ka format galat hai';const n=arr.filter(x=>x.url!==u);
const p=await gh(ep,{method:'PUT',headers:J,body:JSON.stringify({message:'Delete test: '+t.title,content:b64e(JSON.stringify(n,null,2)),sha:gj.sha})});if(p.ok)break;if(p.status===409&&k===0)continue;throw await ghErr(p)}
const fp=repoPath(u);if(fp&&/\.(html|json)$/.test(fp)&&fp!=='index.html'&&!fp.startsWith('content/')&&!fp.includes('..')){const fe='/repos/'+o+'/'+r+'/contents/'+fp.split('/').map(encodeURIComponent).join('/');const f=await gh(fe);if(f.ok){const fj=await f.json();if(fj.sha)await gh(fe,{method:'DELETE',headers:J,body:JSON.stringify({message:'Delete test file: '+fp,sha:fj.sha})})}}
REG.tests=REG.tests.filter(x=>x.url!==u);try{localStorage.setItem('gyankshetraReg',JSON.stringify(REG))}catch(e){}renderLists();alert('🗑 Delete ho gaya.')}catch(e){const m=String(e);alert('❌ Delete nahi hua: '+m+(/40[134]|not accessible|permission|Bad credentials/i.test(m)?'\n\nToken me is repo ke liye "Contents: Read and write" permission dein (GitHub > Settings > Developer settings > Fine-grained tokens), phir Admin Logout karke naya token daalein.':''))}}
function builtinCard(){return `<div class="card"><b>🧪 ${TEST_NAME}</b><small>${L('testMeta')}</small><button class="primary" onclick="requireUser(startQuiz)">${L('startTest')}</button></div>`}
function mixedGroups(page){const g={};REG.tests.filter(t=>KINDS[page].includes(t.type)&&t.subject==='Mixed').forEach(t=>{const nm=t.title.replace(/^[^\p{L}\p{N}]+/u,''),m=nm.match(/^(\S+) (\d+)Q (\d+)$/),key=m?m[1].toUpperCase()+' SERIES '+m[2]:'TEST SERIES';(g[key]=g[key]||[]).push({t,nm,n:m?+m[3]:0})});Object.values(g).forEach(a=>a.sort((x,y)=>x.n-y.n));return g}
function mixedRow(o){const t=o.t,nm=o.nm;return `<div class="qrow" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><span>📝 ${escH(nm)}${t.questions?' <small style="color:#7b8799;font-weight:400">• '+t.questions+' '+L('qWord')+'</small>':''}</span>${isAdmin()?`<button class="qdel" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑</button>`:''}<i>›</i></div>`}
function subjBlock(page){const list=SUBJS[page],keys=list.map(s=>s[0]).concat(['other']),tiles=[];let panel='';
const g=mixedGroups(page);Object.keys(g).forEach(key=>{const id='mx_'+key.replace(/\W+/g,'_'),a=g[key];tiles.push({id,ic:'📂',nm:key,sub:a.length+' '+L('testsWord'),n:a.length});if(openSub[page]===id)panel=`<div class="tphead">📂 ${escH(key)}</div>`+a.map(mixedRow).join('')});
keys.forEach(k=>{const s=list.find(x=>x[0]===k)||['sOther','📂',0];const items=regItems(page,k),own=(OWN[page]===k)?1:0,n=items.length+own;if(k==='other'&&!n)return;
tiles.push({id:k,ic:s[1],nm:L(s[0]),sub:n?n+' '+L('testsWord'):L('comingSub'),n});if(openSub[page]===k&&n)panel=`<div class="tphead">${s[1]} ${escH(L(s[0]))}</div>`+(own?builtinRow():'')+items.map(itemRow).join('')});
return `<div class="tiles">`+tiles.map(t=>`<div class="${openSub[page]===t.id&&t.n?'on':''}" onclick="${t.n?`toggleSub('${page}','${t.id}')`:'soon()'}">${t.ic}<b>${escH(t.nm)}</b><small>${t.sub}</small></div>`).join('')+`</div>`+(panel?`<div class="tilepanel">${panel}</div>`:'')}
function itemRow(t){return `<div class="qrow" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><span>${escH(t.title)}</span>${isAdmin()?`<button class="qdel" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑</button>`:''}<i>›</i></div>`}
function builtinRow(){return `<div class="qrow" onclick="requireUser(startQuiz)"><span>🧪 ${escH(TEST_NAME)}</span><i>›</i></div>`}
function toggleSub(p,k){openSub[p]=openSub[p]===k?null:k;renderLists();const e=document.querySelector('#'+(p==='tests'?'testsBody':'practiceBody')+' .tilepanel');if(e)setTimeout(()=>e.scrollIntoView({behavior:'smooth',block:'nearest'}),50)}
function renderLists(){
const all=REG.tests.slice(0,3);$('homeNew').innerHTML=all.length?all.map(itemCard).join(''):`<div class="card"><small>${L('noNew')}</small></div>`;
$('testsBody').innerHTML=subjBlock('tests');$('practiceBody').innerHTML=subjBlock('practice');renderStudy();renderExam()}
function setExam(x){try{localStorage.setItem('gyankshetraExam',x)}catch(e){}renderExam()}
function renderExam(){let ex='STET';try{ex=localStorage.getItem('gyankshetraExam')||'STET'}catch(e){}document.querySelectorAll('#examChips button').forEach(b=>b.classList.toggle('on',b.dataset.ex===ex))}
/* Test UI: palette + swipe */
function openPalette(){$('palGrid').innerHTML=questions.map((q,i)=>`<button class="${ans[i]!==null&&ans[i]!==undefined?'a':''} ${i===qi?'cur':''}" onclick="jumpQ(${i})">${i+1}</button>`).join('');$('palette').classList.add('open')}
function closePalette(){$('palette').classList.remove('open')}
function jumpQ(i){qi=i;closePalette();saveProgress();render()}
(function(){let x0=0,y0=0;const w=$('quiz');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;if((dx>0)===SWIPE_RIGHT_IS_NEXT){if(qi<TOTAL-1){qi++;saveProgress();render()}}else prev()},{passive:true})})();
/* Result */
let lastRes={c:0,w:0,s:0},lastAttempt=1;
function paintResult(){const {c,w,s}=lastRes,a=c/TOTAL*100,b=a+w/TOTAL*100;$('donut').style.background=`conic-gradient(#1f9d55 0 ${a}%,#e03a3a ${a}% ${b}%,#c9d1dc ${b}% 100%)`;const u=getUser();$('resName').textContent='👤 '+(u.logged?uName():L('student'));$('reTag').classList.toggle('on',lastAttempt>1);$('anBtn').textContent='📚 Analysis';$('tipHint').textContent=({hi:'किसी भी बॉक्स पर टैप करें — उसका Analysis खुलेगा',en:'Tap any box to open its analysis',bh:'कवनो बॉक्स पर टैप करीं — ओकर विश्लेषण खुली'})[currentLang];$('backBtn').textContent=({hi:'🏠 ऐप पर वापस जाएँ',en:'🏠 Back to App',bh:'🏠 ऐप पर लौटीं'})[currentLang]}
function shareResult(){const {c,w,s}=lastRes,u=getUser(),p=Math.round(c/TOTAL*100),link=location.href.split('#')[0].split('?')[0];
const text=`${L('shHead')}\n👤 ${u.logged?u.name:L('student')}\n🏆 ${L('marks')}: ${c}/${TOTAL} (${p}%)\n✅ ${L('correct')}: ${c}  ❌ ${L('wrong')}: ${w}  ⏭ ${L('skipped')}: ${s}\n📢 ${L('shTg')}: https://t.me/gyankshetra\n🔗 ${L('shLink')}: ${link}`;
window.open('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text),'_blank')}
/* Download */
function downloadTest(){const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');const t='<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Gyankshetra</title></head><body style="font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:16px"><h1>Gyankshetra — '+TEST_NAME.replace(/</g,'&lt;')+'</h1>'+questions.map((q0,i)=>{const q=Q(i);return `<h3>${i+1}. ${esc(q[0])}</h3><ol type="A">${q[1].map(o=>`<li>${esc(o)}</li>`).join('')}</ol><p><b>${esc(L('right'))}:</b> ${String.fromCharCode(65+q[2])}. ${esc(q[1][q[2]])}</p><ul>${q[3].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}).join('<hr>')+'<p>📢 https://t.me/gyankshetra</p></body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download='gyankshetra-physics-gravitation.html';document.body.appendChild(a);a.click();a.remove();$('drawer').classList.remove('open')}
applyLanguage();loadStudy();loadReg();adminUI();slideBuild();go('home');if(ROOT){const p=getProgress();requireUser(getUser().logged&&p?resumeQuiz:startQuiz)}
</script>
