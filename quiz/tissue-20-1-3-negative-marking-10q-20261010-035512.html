<script>
const testData = {"isReattempted":false,"studentName":"छात्र","topic":"tissue 20 1/3 negative marking","questions":[{"id":1,"text":"एपिथीलियल टिश्यू के वर्गीकरण में कौन-सा टिश्यू बहुस्तरीय (stratified) और क्यूटेनस (keratinized) नहीं होता?","options":["सिंगल लेयर स्क्वैमस एपिथीलियम","स्ट्रैटिफाइड स्क्वैमस एपिथीलियम","स्ट्रैटिफाइड क्यूटेनस एपिथीलियम","ट्रांसिशनल एपिथीलियम"],"correctOption":3,"selected":null,"status":"skipped","facts":["ट्रांसिशनल एपिथीलियम बहुस्तरीय लेकिन क्यूटेनस नहीं होता; यह मूत्राशय और मूत्रमार्ग में पाया जाता है।","एपिथीलियल टिश्यू को उनके लेयर की संख्या और सतह विशेषताओं के आधार पर वर्गीकृत किया जाता है।","स्ट्रैटिफाइड क्यूटेनस एपिथीलियम त्वचा की बाहरी परत बनाता है।","सिंगल लेयर स्क्वैमस एपिथीलियम अधिकांश आंतरिक अंगों की सतह पर पाया जाता है।","ट्रांसिशनल एपिथीलियम स्ट्रेचिंग के कारण आकार बदलता है।","ट्रांसिशल एपिथीलियम में कई लेयर की कोशिकाएँ होती हैं परन्तु क्यूटेनस लेयर नहीं बनती।","क्यूटेनस लेयर की अनुपस्थिति का अर्थ है कि टिश्यू जलरोधक नहीं होता।","ट्रांसिशनल एपिथीलियम में बेसल लेयर से लेकर सुपरफिशियल लेयर तक विभिन्न चरणों की कोशिकाएँ होती हैं।","टिश्यू की संरचना उसके कार्य को निर्धारित करती है।"]},{"id":2,"text":"कंकालीय मसल (skeletal muscle) के फाइबर में कौन-सा प्रोटीन माइलिन शीथ के निर्माण में मुख्य भूमिका निभाता है?","options":["अक्टिन","कैरोटिन","मायोसिन","सारकोमेयरिन"],"correctOption":1,"selected":null,"status":"skipped","facts":["कैरोटिन माइलिन शीथ के मुख्य घटक होते हैं, जो न्यूरोमस्कुलर जंक्शन के आसपास लिपिड और प्रोटीन से बनते हैं।","कंकालीय मसल फाइबर बहु-कोर वाले होते हैं।","माइलिन शीथ नर्व फाइबर को इन्सुलेट करती है, मसल फाइबर नहीं।","कैरोटिन प्रोटीन माइलिन में 40% से अधिक बनाता है।","अक्टिन और मायोसिन मसल संकुचन के मुख्य प्रोटीन हैं।","सारकोमेयरिन कैल्शियम बाइंडिंग प्रोटीन है, माइलिन में नहीं।","माइलिन शीथ नर्व इम्पल्स की गति बढ़ाती है।","कंकालीय मसल में माइलिन शीथ नहीं, बल्कि ट्यूब्यूलर सिस्टम होता है।","न्यूरोमस्कुलर जंक्शन में एसीटाइलकोलाइन रिलीज़ होता है।"]},{"id":3,"text":"कोलेजन टाइप I और टाइप III के बीच मुख्य अंतर क्या है?","options":["टाइप I अधिक लचीला है","टाइप III केवल हड्डी में पाया जाता है","टाइप III अधिक टेंसर है","टाइप I फाइब्रिलर है, टाइप III नेटवर्क बनाता है"],"correctOption":3,"selected":null,"status":"skipped","facts":["कोलेजन टाइप I फाइब्रिलर रूप में बनता है और टेंडन व लिगामेंट में प्रमुख है, जबकि टाइप III अधिक जालाकार (network) रूप में बनता है और अंगों की संरचना में सहायक होता है।","कोलेजन शरीर में सबसे अधिक मात्रा में पाया जाने वाला प्रोटीन है।","टाइप I कोलेजन फाइबर्स मोटे और मजबूत होते हैं।","टाइप III कोलेजन फाइबर्स पतले और जालाकार होते हैं।","टाइप I हड्डी, टेंडन, लिगामेंट में प्रमुख है।","टाइप III त्वचा, रक्त वाहिकाओं, अंगों के इंटरस्टिशियल टिश्यू में पाया जाता है।","कोलेजन फाइबर्स का क्रॉस‑लिंकिंग टिश्यू की शक्ति को बढ़ाता है।","कोलेजन का विघटन मेटालोप्रोटीनेज़ द्वारा होता है।","कोलेजन सिंथेसिस विटामिन C पर निर्भर करती है।"]},{"id":4,"text":"हड्डी के रीमॉडलिंग में कौन-से कोशिकाएँ ऑस्टियोब्लास्ट के रूप में कार्य करती हैं?","options":["ऑस्टियोब्लास्ट","ऑस्टियोक्लास्ट","ऑस्टियोसाइट","ऑस्टियोफाइब्रोब्लास्ट"],"correctOption":0,"selected":null,"status":"skipped","facts":["ऑस्टियोब्लास्ट नई हड्डी मैट्रिक्स का निर्माण करते हैं और रीमॉडलिंग में प्रमुख भूमिका निभाते हैं।","ऑस्टियोब्लास्ट हड्डी की सतह पर स्थित होते हैं।","ऑस्टियोसाइट हड्डी मैट्रिक्स में एन्क्लोज्ड होते हैं।","ऑस्टियोक्लास्ट हड्डी को रिसॉर्स करते हैं।","ऑस्टियोफाइब्रोब्लास्ट हड्डी के फाइब्रोस टिश्यू में मौजूद होते हैं।","रीमॉडलिंग में निर्माण और विघटन दोनों प्रक्रियाएँ शामिल हैं।","हॉर्मोन जैसे पेराथायरॉइड हार्मोन रीमॉडलिंग को नियंत्रित करता है।","विटामिन D कैल्शियम अवशोषण में मदद करता है, जो हड्डी निर्माण के लिए आवश्यक है।","ऑस्टियोब्लास्ट कोलाजेन टाइप I का उत्पादन करते हैं।"]},{"id":5,"text":"एंडोथेलियल टिश्यू में कौन-सा मार्कर विशेष रूप से वास्कुलर एन्डोथेलियम को पहचानता है?","options":["इकोसिन‑1","विमर‑1","स्लिट‑डायमर प्रोटीन","कडेरिन‑5"],"correctOption":1,"selected":null,"status":"skipped","facts":["विमर‑1 (वेसिकल इंटेग्रेटिंग मोलेक्यूलर रिसेप्टर‑1) एन्डोथेलियल कोशिकाओं में विशेष रूप से अभिव्यक्त होता है और वास्कुलर एन्डोथेलियम का मार्कर माना जाता है।","एंडोथेलियल टिश्यू रक्त वाहिकाओं को लाइन करता है।","विमर‑1 इंटेग्रिन‑लिगैंड बाइंडिंग में मदद करता है।","कडेरिन‑5 एपिथीलियल टिश्यू में पाया जाता है, लेकिन विशेष रूप से वास्कुलर नहीं।","इकोसिन‑1 इंटेस्टाइनल एपिथीलियम में अभिव्यक्त होता है।","स्लिट‑डायमर प्रोटीन टाइट जंक्शन में महत्वपूर्ण है।","एंडोथेलियल कोशिकाओं में नाइट्रिक ऑक्साइड सिंथेज़ (NOS) भी मौजूद होता है।","वेस्कुलर एन्डोथेलियम रक्त‑रोक प्रतिरोध को नियंत्रित करता है।","एंडोथेलियल डिसफंक्शन कई रोगों में योगदान देता है।"]},{"id":6,"text":"हड्डी के विकास में इंट्रामेम्ब्रेनस ossification किस चरण में शुरू होता है?","options":["कैल्सीफिकेशन के तुरंत बाद","हड्डी के रीमॉडलिंग के दौरान","कार्टिलेज मॉडल के बनने के बाद","ऑस्टियोब्लास्ट के सक्रियण के साथ"],"correctOption":2,"selected":null,"status":"skipped","facts":["इंट्रामेम्ब्रेनस ossification कार्टिलेज मॉडल के बनने के बाद, उसके भीतर कैल्सीफिकेशन और ऑस्टियोब्लास्ट द्वारा हड्डी निर्माण से शुरू होता है।","इंट्रामेम्ब्रेनस ossification लंबी हड्डियों में प्रमुख है।","इंट्रामेम्ब्रेनस ossification में कार्टिलेज मॉडल पहले बनता है।","कैल्सीफिकेशन कार्टिलेज मैट्रिक्स में कैल्शियम लवण जमा होने से होता है।","ऑस्टियोब्लास्ट कार्टिलेज को हड्डी में बदलते हैं।","इंट्रामेम्ब्रेनस ossification फेमर और टिबिया में देखा जाता है।","इंट्रामेम्ब्रेनस ossification के बाद एपिफिसियल प्लेग में एपिफिसियल ossification होती है।","विकास के दौरान हॉर्मोनल नियंत्रण महत्वपूर्ण है।","विटामिन D और कैल्शियम की पर्याप्त मात्रा आवश्यक है।"]},{"id":7,"text":"कंकालीय मसल फाइबर में ट्यूब्यूलर प्रणाली (T‑system) का मुख्य कार्य क्या है?","options":["इलेक्ट्रिकल इम्पल्स का तेज़ प्रसारण","ऑक्सीजन का परिवहन","न्यूरोमस्कुलर जंक्शन से एसीटाइलकोलाइन का रिसेप्शन","माइटोकॉन्ड्रिया की ऊर्जा उत्पादन"],"correctOption":0,"selected":null,"status":"skipped","facts":["ट्यूब्यूलर प्रणाली (T‑system) मसल फाइबर में सतह के पास इन्फिल्ट्रेटेड ट्यूब्यूल बनाती है, जिससे इम्पल्स का तेज़ प्रसारण और डिपोलराइज़ेशन समान रूप से वितरित होता है।","T‑system मसल फाइबर की सतह के भीतर इन्फिल्ट्रेटे const Q=testData.questions,N=Q.length;let ans=Array(N).fill(null),qi=0,left=N*60,tid=null,done=false,rOrder=[],ri=0,res={c:0,w:0,s:0};
const $=id=>document.getElementById(id);
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function fmt(t){t=Math.max(0,t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function uname(){try{if(localStorage.getItem('gyankshetraLoggedIn')==='1'){return localStorage.getItem('gyankshetraUserName')||testData.studentName}}catch(e){}return testData.studentName}
$('ttl').textContent='Gyankshetra · '+testData.topic;
function render(){const q=Q[qi];$('qc').textContent='प्रश्न '+(qi+1)+'/'+N;$('qt').textContent=q.text;
$('opts').innerHTML=q.options.map((o,i)=>'<button class="opt '+(ans[qi]===i?'sel':'')+'" onclick="pick('+i+')">'+String.fromCharCode(65+i)+'. '+esc(o)+'</button>').join('');
$('pv').disabled=qi===0;$('nx').textContent=qi===N-1?'Submit Test ✔':'अगला →';$('tm').textContent='⏱ '+fmt(left)}
function pick(i){ans[qi]=i;render()}
function go(d){if(d>0&&qi===N-1){if(confirm('क्या आप टेस्ट Submit करना चाहते हैं?'))finish();return}const n=qi+d;if(n<0||n>=N)return;qi=n;render()}
function tick(){left--;$('tm').textContent='⏱ '+fmt(left);if(left<=0)finish()}
function openPal(){$('pg').innerHTML=Q.map((q,i)=>'<button class="'+(ans[i]!==null?'a ':'')+(i===qi?'c':'')+'" onclick="jump('+i+')">'+(i+1)+'</button>').join('');$('pal').classList.add('open')}
function closePal(){$('pal').classList.remove('open')}
function jump(i){qi=i;closePal();render()}
function finish(){if(done)return;done=true;clearInterval(tid);closePal();let c=0,w=0,s=0;ans.forEach((a,i)=>{if(a===null)s++;else if(a===Q[i].correctOption)c++;else w++});res={c,w,s};
const a=c/N*100,b=a+w/N*100;$('donut').style.background='conic-gradient(#1f9d55 0 '+a+'%,#e03a3a '+a+'% '+b+'%,#c9d1dc '+b+'% 100%)';
$('pct').textContent=Math.round(a)+'%';$('mk').textContent=c+' / '+N;$('co').textContent=c;$('wr').textContent=w;$('sk').textContent=s;$('who').textContent='👤 '+uname();
try{const h=JSON.parse(localStorage.getItem('gyankshetraHistory')||'[]');h.push({day:new Date().toISOString().slice(0,10),date:new Date().toLocaleString('hi-IN'),test:testData.topic,marks:c,correct:c,wrong:w,skipped:s,total:N});localStorage.setItem('gyankshetraHistory',JSON.stringify(h))}catch(e){}
$('quiz').classList.add('hide');$('result').classList.remove('hide');window.scrollTo(0,0)}
function review(f){rOrder=Q.map((q,i)=>i).filter(i=>f==='all'||(f==='ok'&&ans[i]===Q[i].correctOption)||(f==='bad'&&ans[i]!==null&&ans[i]!==Q[i].correctOption)||(f==='skip'&&ans[i]===null));if(!rOrder.length){alert('इस श्रेणी में कोई प्रश्न नहीं है।');return}ri=0;$('result').classList.add('hide');$('review').classList.remove('hide');rrender()}
function rrender(){const i=rOrder[ri],q=Q[i];$('rc').textContent='Review '+(ri+1)+'/'+rOrder.length;$('rq').textContent=(i+1)+'. '+q.text;
$('ro').innerHTML=q.options.map((o,k)=>'<div class="opt '+(k===q.correctOption?'ok':(k===ans[i]?'bad':''))+'">'+String.fromCharCode(65+k)+'. '+esc(o)+(k===q.correctOption?' ✅':'')+(k===ans[i]&&k!==q.correctOption?' ❌':'')+'</div>').join('');
$('rf').innerHTML='<small class="m">आपका उत्तर: '+(ans[i]===null?'छोड़ा गया':String.fromCharCode(65+ans[i]))+' • सही उत्तर: '+String.fromCharCode(65+q.correctOption)+'</small>'+(q.facts&&q.facts.length?'<div class="facts"><b>📌 व्याख्या / तथ्य:</b><ul>'+q.facts.map(f=>'<li>'+esc(f)+'</li>').join('')+'</ul></div>':'')}
function rgo(d){const n=ri+d;if(n<0||n>=rOrder.length)return;ri=n;rrender()}
function backRes(){$('review').classList.add('hide');$('result').classList.remove('hide')}
function share(){const link=location.href.split('#')[0].split('?')[0],p=Math.round(res.c/N*100);
const t='🎓 Gyankshetra Result\n👤 '+uname()+'\n📝 '+testData.topic+'\n🏆 अंक: '+res.c+'/'+N+' ('+p+'%)\n✅ सही: '+res.c+'  ❌ गलत: '+res.w+'  ⏭ छूटे: '+res.s+'\n📢 Telegram चैनल: https://t.me/gyankshetra\n🔗 टेस्ट लिंक: '+link;
window.open('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(t),'_blank')}
(function(){let x0=0,y0=0;const w=$('quiz');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});
w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;if(dx>0){if(qi>0){qi--;render()}}else if(qi<N-1){qi++;render()}},{passive:true})})();
render();tid=setInterval(tick,1000);
</script>
