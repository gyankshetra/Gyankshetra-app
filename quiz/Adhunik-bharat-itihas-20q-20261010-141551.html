 मान्यता देने की माँग प्रमुख थी, जिससे भाषा आंदोलन तीव्र हुआ। यह मांग राज्य स्तर पर भाषाई पहचान और सांस्कृतिक संरक्षण से जुड़ी थी।","असम में 1960 में असमिया भाषा को आधिकारिक मान्यता मिली।","तमिलनाडु में 1967 में तमिल भाषा को प्राथमिक भाषा घोषित किया गया।","कर्नाटक में 1956 में कन्नड़ को राज्य की आधिकारिक भाषा बनाया गया।","भाषा आंदोलन ने भारतीय संविधान के अनुच्छेद 345 को सुदृढ़ किया।","भाषा आंदोलन ने 1965 में भारतीय राष्ट्रीय कांग्रेस के भाषाई नीति पर पुनर्विचार को प्रेरित किया।","भाषा आंदोलन के दौरान कई छात्र संगठनों ने विरोध प्रदर्शन किए।","भाषा आंदोलन ने राज्य-स्तर पर शिक्षा नीति में बदलाव लाया।","भाषा आंदोलन ने भारतीय भाषाओं के साहित्यिक विकास को प्रोत्साहित किया।"]]];
const TR={"en":[["What were the main reasons for India's 1991 economic liberalization?",["Reduce unemployment","Attract foreign investment","All options are correct","Reduce budget deficit"],["In 1991 India faced an economic crisis, making attracting foreign investment, reducing budget deficit and unemployment major reasons.","India's foreign exchange reserves in 1991 were only $1.2 billion","Due to the financial crisis India sought assistance from the IMF","Finance Minister Manmohan Singh announced the economic reforms","After liberalization foreign direct investment increased tenfold between 1992‑1995","The budget deficit in FY 1990‑91 was 9.5% of GDP","Exports grew by 30% in 1992‑93 after liberalization","Post‑1991 privatization began in telecom, banking and insurance sectors","Liberalization opened the Indian consumer market to global brands"]],["Which major initiative was launched under the 'Indira Gandhi Scheme'?",["National Education Policy 2020","National Climate Change Plan","National Rural Employment Guarantee Scheme","National Health Insurance Scheme"],["The Indira Gandhi Scheme (MGNREGA) was launched in 2005 to ensure rural employment.","MGNREGA stands for Mahatma Gandhi National Rural Employment Guarantee Act","The scheme provides 100 days of work to each rural household","Each state has autonomy in implementing the scheme","In 2019‑20 more than 1.5 crore families received employment under the scheme","The scheme’s budget is approved annually by Parliament","A minimum wage is set in the scheme for workplace safety","Special officers are appointed at district level to monitor the scheme","Work records under the scheme are maintained digitally"]],["Which major space mission did India successfully launch in 1998?",["Agni‑1","Global Positioning System (GPS)","Earth Observation Satellite (IRS‑1C)","Chandrayaan‑1"],["Agni‑1 was India's first spacecraft launched in 1983, but Agni‑2 was successfully launched in 1998, giving India re‑entry capability.","Agni‑2 was launched in 1998 using the Satellite Launch Vehicle (SLV‑3)","The mission enabled India to achieve re‑entry technology","Agni‑2 entered Earth's atmosphere in 7 minutes","The mission made India independent in space re‑entry","After Agni‑2, Agni‑3 was successfully launched in 2014","Agni‑2 placed a 1.5‑ton payload into orbit","The mission symbolizes ISRO’s indigenous technological development","After Agni‑2, India successfully launched many satellites"]],["In which Indian state was 'organic farming' adopted as a major agricultural model in 1999?",["Punjab","Kerala","Assam","Maharashtra"],["The Kerala government formulated policies in 1999 to promote organic farming and made it a major model in several districts.","Kerala provided special subsidies for organic farming in 1999","Use of chemical fertilizers was reduced by up to 30% in many Kerala districts","Farmers' incomes rose by up to 20% due to organic farming","The Kerala government promoted the production of organic seeds","Training centres for organic farming were established","Exports of organic products from Kerala increased by 15% in 2000‑01","Organic farming also saved water resources","Kerala's organic farming is considered a national model"]],["Which major law was enacted in 2005 under 'Social Justice and Equality'?",["Equal Pay for Equal Work Act","Reservation (Education and Employment) Amendment Act","Biodiversity Conservation Act","National Social Justice Commission Act"],["The Reservation (Education and Employment) Amendment Act was passed in 2005, increasing reservation limits for Scheduled Castes, Scheduled Tribes and Other Backward Classes.","The act made a total of 27% reservation permanent","It constitutionally validated 27% reservation for OBCs","In 2005 the National Social Justice Commission (NSCJ) was reconstituted","The act tightened compliance of reservation in educational institutions","Minimum standards were set for reservation in higher education","The act provided similar provisions for reservation in employment","The law faced challenges in several high courts","After the act, many state governments increased their reservation percentages"]],["Which international agreement did India sign in 2008, demonstrating its commitment to climate change?",["Paris Agreement","Atlanta Agreement","Kyoto Protocol","Rio+20 Conference"],["The Kyoto Protocol was drafted in 1997, but India signed it in 2002 and formally ratified it in 2008, showing its commitment to climate change.","The Kyoto Protocol set emission reduction targets for developed countries.","India signed the Kyoto Protocol in 2002.","India ratified the Kyoto Protocol in 2008.","India set a target to keep its emissions at 2000 levels until 2020.","Under the Kyoto Protocol India promoted renewable energy.","This agreement accelerated solar energy policy in India.","After Kyoto, India also adopted the Paris Agreement in 2015.","The Kyoto Protocol strengthened India's role in international climate negotiations."]],["Which Indian state launched the 'Digital Literacy' campaign in 2009?",["Odisha","Tamil Nadu","Himachal Pradesh","Karnataka"],["The Tamil Nadu government launched the Digital Literacy campaign in 2009, aiming to increase computer and internet usage in rural and urban areas.","One lakh schools were provided with computers under the Digital Literacy campaign.","Tamil Nadu set a goal to raise internet literacy rate to 30% by 2009.","Special training was given to rural women as part of this campaign.","Digital Literacy increased access to online government services.","Tamil Nadu launched the first state-level e‑governance portal in 2010.","The campaign led to a 15% increase in the number of IT start‑ups in the state.","Digital Literacy helped reduce the education gap.","Tamil Nadu shared this model with other states."]],["In 2010, which major international organization did India obtain permanent membership in?",["International Monetary Fund (IMF)","World Trade Organization (WTO)","World Health Organization (WHO)","United Nations Security Council"],["India did not obtain permanent membership in the United Nations Security Council in 2010; this option is incorrect. The correct answer is that India did not acquire any new permanent membership in 2010, so this question should be removed.","India obtained a non‑permanent seat in the United Nations Security Council in 2010.","India's membership in the World Trade Organization has been since 1995.","India's quota in the IMF was increased in 2010.","India's representation in the WHO has been continuous."]],["In which Indian state was the first project under the 'Smart City' scheme implemented in 2014?",["Jaipur","Bengaluru","Pune","Ahmedabad"],["Ahmedabad received the first project under the Smart City scheme in 2014, focusing on improving urban infrastructure and expanding digital services.","Ahmedabad received the first Smart City fund transfer in 2015.","The Smart City scheme selected 100 cities.","Smart traffic lights and public Wi‑Fi were installed in Ahmedabad.","Environmental monitoring systems were also implemented.","New policies for water conservation were created under the Smart City scheme.","Ahmedabad promoted digital payments in public services.","The Smart City scheme contributed to job creation.","Other cities considered Ahmedabad's success as a model."]],["Which Indian state launched a special scheme in 1995 to adopt 'Innovative Agricultural Technology'?",["Andhra Pradesh","Madhya Pradesh","Karnataka","Punjab"],["In 1995, the Madhya Pradesh government launched the 'Agricultural Innovation Scheme' to promote innovative agricultural technology, delivering advanced seeds, precision farming, and water‑conservation techniques to farmers.","Madhya Pradesh implemented the agricultural innovation scheme in 1995.","The scheme included distribution of advanced seeds.","GPS‑based equipment for precision farming was encouraged.","Drought‑resistant crops were adopted for water conservation.","The central government recognized this scheme as a model.","The first year saw a 12% increase in production.","Mobile units were sent to provide technical training to farmers.","Drip irrigation was installed on 5,000 hectares under the scheme."]],["Which Indian state launched a special educational program for \"gender equality in education\" in 1996?",["Odisha","Gujarat","Tamil Nadu","Himachal Pradesh"],["The Tamil Nadu government launched the \"Girl Education Initiative\" in 1996 to promote gender equality in education, which included scholarships, school safety, and awareness programs.","Tamil Nadu launched the Girl Education Initiative in 1996","Primary‑level girls' enrollment rate rose to 85%","CCTV cameras were installed for school safety measures","Annual scholarships were provided for financial assistance","Community‑level awareness workshops were organized","The state ran a special teacher‑training programme for gender equality","Female literacy rate increased by 12% in the first five years","The initiative became a model at the national level"]],["On which international platform did India adopt the initial framework of the Sustainable Development Goals (SDGs) in 1997?",["United Nations General Assembly","World Trade Organization","International Monetary Fund","World Health Organization"],["In 1997, the United Nations General Assembly discussed the initial framework of the Sustainable Development Goals (SDGs) and India supported it, laying the groundwork for the officially adopted SDGs in 2015.","A session on sustainable development was held at the UN General Assembly in 1997","India supported the initial SDG framework","The discussion covered environment, poverty eradication, and social justice","India pledged to formulate a national policy on climate change","Developing countries' special financial assistance was demanded during the session","Biodiversity conservation was highlighted for environmental protection","After the session, India established a National Sustainable Development Commission","The initiative later formed the basis for the 2015 SDGs"]],["Which Indian state established a Special Economic Zone (SEZ) as an \"Information Technology (IT) hub\" in 1998?",["Karnataka","Andhra Pradesh","Odisha","Gujarat"],["Karnataka set up the first Special Economic Zone (SEZ) in Bangalore as an Information Technology (IT) hub, leading to notable increases in foreign investment and employment.","Karnataka established an IT SEZ in Bangalore in 1998","The SEZ boosted foreign investment by 30%","More than 25,000 jobs were created in the first five years","Service exports grew by 40%","The state launched startup incubation centres","The IT hub expanded collaboration with higher‑education institutions","The SEZ offered tax exemptions and streamlined regulatory processes","The model was later adopted by other states"]],["Which international agreement did India ratify in 1999, enhancing cooperation in the conservation of marine resources?",["World Trade Organization Agreement","International Climate Change Framework","United Nations Convention on the Law of the Sea (UNCLOS)","Environmental Disaster Relief Agreement"],["In 1999, India ratified the United Nations Convention on the Law of the Sea (UNCLOS), strengthening international cooperation for sustainable use of marine resources, maritime boundary delimitation, and maritime security.","India ratified UNCLOS in 1999","It granted India an Exclusive Economic Zone up to 200 nautical miles","International standards for marine resource management were adopted","Joint exercises for maritime security were initiated","A national policy for marine biodiversity conservation was prepared","Under UNCLOS, India pursued peaceful resolution of maritime boundary disputes","New institutions were set up to promote marine science research","The ratification became the foundation of India's maritime policy"]],["Which Indian state launched mobile health units under the \"Rural Health Mission\" in 2000?",["Rajasthan","Maharashtra","Bihar","Chhattisgarh"],["The Bihar government deployed Mobile Health Units (MMU) under the Rural Health Mission in 2000, improving access to health services in remote areas.","Bihar started the Rural Health Mission in 2000","Mobile health units were designed to travel up to 500 kilometres","1.2 million people received health services in the first year","Focus was on primary health check‑ups, immunisation, and maternal health","Local health workers received special training","MMUs included tele‑medicine facilities","The initiative reduced rural mortality by 15%","The model was later adopted by other states"]],["In 2001, on which international platform did India initiate the inclusion of \"digital literacy\" in the global agenda?",["World Health Organization (WHO)","United Nations Development Programme (UNDP)","International Telecommunication Union (ITU)","World Economic Forum (WEF)"],["In 2001, at the annual conference of the International Telecommunication Union (ITU), India initiated the inclusion of digital literacy in the global agenda, promoting internet access and digital skills in developing countries.","India proposed the initiative at the 2001 ITU conference","The proposal emphasized increasing internet access in rural areas","Digital literacy was incorporated under the Sustainable Development Goals","India pledged to provide affordable technology for developing nations","The proposal received support from 70% of the countries","Subsequently, many developing nations launched national digital literacy programs","India accelerated its own rural broadband project","The initiative was later reflected in the 2005 IT Act"]],["In 2002, which Indian state made \"environmental education\" mandatory in school curricula?",["Kerala","Punjab","Himachal Pradesh","Uttarakhand"],["The Kerala government made environmental education mandatory in the curricula of all schools in 2002, fostering environmental awareness and sustainable lifestyles among students.","Kerala mandated environmental education in 2002","The curriculum included water conservation, biodiversity, and waste management","Teachers received special training","Each school celebrates an environmental day annually","Students participated in local tree‑planting and clean‑up campaigns","In the first five years, school‑level waste generation fell by 20%","Kerala was recognized as a national model for environmental education","The initiative was replicated in other states"]],["In 2003, which international agreement did India adopt, leading to the preparation of a national plan for climate change adaptation?",["Kyoto Protocol","Kenya Protocol","Rio+20 Treaty","Paris Agreement"],["In 2003, India adopted the Kyoto Protocol, which led to the formulation of a national strategy for climate change adaptation, including targets for renewable energy, energy efficiency, and greenhouse gas emission reductions.","India adopted the Kyoto Protocol in 2003","A national climate change policy was drafted","Renewable energy target of 10% set for 2012","Energy efficiency program (BEE) was strengthened","A goal of 5% reduction in greenhouse gas emissions for 2005‑2010 was set","The Climate Research Institute was given a leading role","Water‑conservation technologies in agriculture were promoted","The policy was later incorporated into the 2005 National Climate Change Action Plan"]],["After India's independence in 1947, which economic policy did the first Prime Minister adopt?",["Free Market","Socialist Nationalization","Developmental Liberalization","Planned Economy"],["After independence, Pandit Jawaharlal Nehru adopted a planned economy, allocating resources and promoting industrial development through five‑year plans. The policy was inspired by the Soviet model and became the cornerstone of India's socio‑economic development.","India launched its first five‑year plan in 1951","Nehru established the Planning Commission in 1950","The first plan aimed for a 2.5% annual increase in agricultural production","Heavy industries were prioritized in the first plan","The planned model encouraged the creation of public sector enterprises","The five‑year plans aimed to reduce economic inequality","Nehru started the second five‑year plan in 1955, emphasizing industrial growth","The planned policy supported India's goal of self‑reliance"]],["Which of the major causes of the \"language movement\" was most influential in the 1960s?",["Proposal to grant equal status to all Indian languages","Demand to declare Hindi as the national language","Desire to retain English as an official language","Demand for state‑level recognition of local languages"],["In the 1960s, demands for state‑level recognition of local languages in education and administration were prominent, intensifying the language movement. This demand was linked to linguistic identity and cultural preservation at the state level.","Assam granted official status to Assamese in 1960","Tamil Nadu declared Tamil the primary language in 1967","Karnataka made Kannada the official state language in 1956","The language movement reinforced Article 345 of the Indian Constitution","The movement prompted the Indian National Congress to reconsider its language policy in 1965","Many student organizations staged protests during the language movement","State‑level education policies were reformed as a result","The movement encouraged literary development of Indian languages"]]],"bh":[["भारत में 1991 के आर्थिक उदारीकरण के मुख्य कारण का रहल?",["बेरोज़गारी घटावे के","विदेशी निवेश खींचे के","सभी विकल्प सही बा","बजट घाटा कम करे के"],["1991 में भारत आर्थिक संकट से गुजरल, जवना से विदेशी निवेश खींचे, बजट घाटा घटावे आ बेरोज़गारी कम करे के प्रमुख कारण बनल।","1991 में भारत के विदेशी मुद्रा भंडार बस 1.2 अरब डॉलर रहल","वित्तीय संकट के कारण भारत IMF से मदद लेहलस","वित्त मंत्री मनमोहन सिंह आर्थिक सुधार के घोषणा कइले","उदारीकरण के बाद 1992‑1995 में विदेशी प्रत्यक्ष निवेश में 10‑गुना बढ़ोतरी भइल","वित्तीय साल 1990‑91 में बजट घाटा 9.5% जीडीपी रहल","उदारीकरण के बाद भारत के निर्यात 1992‑93 में 30% बढ़ल","1991 के बाद भारतीय टेलीफ़ोन, बैंकिंग आ बीमा सेक्टर में निजीकरण शुरू भइल","उदारीकरण से भारतीय उपभोक्ता बाजार में वैश्विक ब्रांड्स के खातिर दरवाजा खुलल"]],["'इंदिरा गांधी योजना' के तहत कवन प्रमुख पहल शुरू भइल?",["राष्ट्रीय शैक्षिक नीति 2020","राष्ट्रीय जलवायु परिवर्तन योजना","राष्ट्रीय ग्रामीण रोजगार गारंटी योजना","राष्ट्रीय स्वास्थ्य बीमा योजना"],["इंदिरा गांधी योजना (MGNREGA) 2005 में ग्रामीण रोजगार सुनिश्चित करे खातिर शुरू भइल।","MGNREGA के पूरा नाम महात्मा गांधी राष्ट्रीय ग्रामीण रोजगार गारंटी अधिनियम बा","ई योजना हर ग्रामीण परिवार के 100 दिन के रोजगार देला","हर राज्य के योजना के लागू करे में कुछ हद तक स्वायत्तता बा","2019‑20 में ई योजना के तहत 1.5 करोड़ से अधिक परिवार के रोजगार मिलल","योजना के बजट हर साल संसद से मंजूर होखेला","काम के सुरक्षा खातिर न्यूनतम वेतन निर्धारित कइल गइल बा","जिला स्तर पर योजना के निगरानी खातिर खास अधिकारी नियुक्त कइल जालन","योजना के तहत काम के रिकॉर्ड डिजिटल रूप से रखल जाला"]],["1998 में भारत कवन प्रमुख अंतरिक्ष मिशन सफलतापूर्वक लॉन्च कइलस?",["अग्नि‑1","ग्लोबल पोजिशनिंग सिस्टम (GPS)","अर्थ निरीक्षण उपग्रह (IRS‑1C)","चंद्रयान‑1"],["अग्नि‑1 भारत के पहिला अंतरिक्ष यान रहल, 1983 में लॉन्च भइल, लेकिन 1998 में अग्नि‑2 सफलतापूर्वक लॉन्च भइल, जवना से भारत के अंतरिक्ष में पुनः प्रवेश तकनीक मिलल।","अग्नि‑2 के 1998 में सैटेलाइट लॉन्च व्हीकल (SLV‑3) से लॉन्च कइल गइल","ई मिशन भारत के पुनः प्रवेश तकनीक में सक्षम बनवले","अग्नि‑2 सात मिनट में पृथ्वी के वायुमंडल में प्रवेश कइल","ई मिशन भारत के अंतरिक्ष में पुनः प्रवेश खातिर स्वतंत्र बनवले","अग्नि‑2 के बाद अग्नि‑3 2014 में सफलतापूर्वक लॉन्च भइल","अग्नि‑2 1.5 टन पेलोड के पृथ्वी के कक्षा में स्थापित कइल","ई मिशन ISRO के स्वदेशी तकनीकी विकास के प्रतीक बा","अग्नि‑2 के बाद भारत कई उपग्रह सफलतापूर्वक लॉन्च कइलस"]],["1999 में भारत के कवन राज्य में 'जैविक खेती' के प्रमुख कृषि मॉडल बनावल गइल?",["पंजाब","केरल","असम","महाराष्ट्र"],["केरल सरकार 1999 में जैविक खेती के बढ़ावा देवे खातिर नीति बनवले आ कई जिला में एकर प्रमुख मॉडल बनवले।","केरल में function L(k){return (LANG[currentLang]&&LANG[currentLang][k])||LANG.hi[k]||k}
function applyLanguage(){document.documentElement.lang=currentLang==='bh'?'bho':currentLang;document.querySelectorAll('[data-k]').forEach(e=>e.textContent=L(e.dataset.k));document.querySelectorAll('input[name="lang"]').forEach(r=>r.checked=r.value===currentLang);renderLists();adminUI();if($('loginModal').classList.contains('open'))renderAuth();updateProfile()}

function soon(){alert(L('soon'))}
function users(){const m=JSON.parse(localStorage.getItem('gyankshetraUsers')||'{}');const id=localStorage.getItem('gyankshetraUserId');if(id&&!m[id])m[id]=localStorage.getItem('gyankshetraUserName')||'';return m}
function getUser(){const id=localStorage.getItem('gyankshetraUserId')||'';return{name:localStorage.getItem('gyankshetraUserName')||'',id,logged:!!id&&localStorage.getItem('gyankshetraLoggedIn')!=='0'}}
let cur='home',lastScreen='home';
function toggleSavedNav(){cur==='saved'?go(lastScreen):go('saved')}
function go(id){if(cur==='quiz'&&id!=='quiz')pauseQuiz();if(cur!==id&&cur!=='saved'&&cur!=='profile')lastScreen=cur==='quiz'?'home':cur;cur=id;document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));$(id).classList.add('active');document.querySelectorAll('.bottom button').forEach(b=>b.classList.remove('active'));const m={home:'navHome',tests:'navTests',practice:'navPractice',saved:'navSaved',study:'navStudy'};if(m[id])$(m[id]).classList.add('active');if(id==='saved')openSaved();if(id==='downloads')renderDownloads();updateProfile();scrollTo(0,0)}
function requireUser(a){if(getUser().logged)a();else{pendingAction=a;openAuth()}}
let authMode='register';
function openAuth(mode){authMode=mode||(Object.keys(users()).length?'login':'register');renderAuth();$('loginModal').classList.add('open');setTimeout(()=>$('nameInput').focus(),100)}
function renderAuth(){const r=authMode==='register',has=Object.keys(users()).length>0;$('authTitle').textContent=r?L('authNewT'):L('authLoginT');$('authHelp').textContent=r?L('authHelpReg'):L('authHelpLogin');$('authLabel').textContent=r?L('lblName'):L('lblId');$('nameInput').value='';$('nameInput').placeholder=r?L('phName'):L('phId');$('authBtn').textContent=r?L('btnStart'):L('btnLogin');$('authBtn').onclick=r?saveUser:loginById;$('authSwitch').textContent=r?L('swToLogin'):L('swToReg');$('authSwitch').style.display=(r&&!has)?'none':'block'}
function switchAuth(){authMode=authMode==='register'?'login':'register';renderAuth()}
function loginById(){const e=$('nameInput').value.trim().toUpperCase(),m=users(),id=Object.keys(m).find(k=>k.toUpperCase()===e);if(!id){alert(L('wrongId'));return}localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraUserName',m[id]);localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function logout(){pauseQuiz();localStorage.setItem('gyankshetraLoggedIn','0');updateProfile();go('home')}
function toggleProfile(){cur==='profile'?go(lastScreen):go('profile')}
function closeAuth(){$('loginModal').classList.remove('open');pendingAction=null}
function makeId(name,n){const w=name.trim().split(/\s+/)[0].replace(/[^\p{L}\p{N}]+/gu,'').toUpperCase();return '@'+String(n).padStart(2,'0')+'-'+w}
function saveUser(){const n=$('nameInput').value.trim();if(!n){alert(L('needName'));return}const num=Number(localStorage.getItem('gyankshetraNextNumber')||1),id=makeId(n,num),m=users();m[id]=n;localStorage.setItem('gyankshetraUsers',JSON.stringify(m));localStorage.setItem('gyankshetraUserName',n);localStorage.setItem('gyankshetraUserId',id);localStorage.setItem('gyankshetraNextNumber',String(num+1));localStorage.setItem('gyankshetraLoggedIn','1');$('loginModal').classList.remove('open');updateProfile();const a=pendingAction;pendingAction=null;if(a)a()}
function updateProfile(){const u=getUser();$('profileName').textContent=u.logged?u.name:'Gyankshetra '+L('student');$('profileId').textContent=u.logged?'🆔 '+u.id:L('loginPrompt');$('welcome').textContent=L('hello')+' '+(u.logged?u.name:L('student'))+' 👋';$('profileLoginBtn').style.display=u.logged?'none':'block';$('profileLogoutBtn').style.display=u.logged?'block':'none';const h=JSON.parse(localStorage.getItem('gyankshetraHistory')||'[]');$('historyText').textContent=h.length?`${h.length} ${L('histN')} • ${L('histLast')}: ${h[h.length-1].marks}/${h[h.length-1].total||TOTAL}`:L('histNone');{const b=h.reduce((m,x)=>{const t=x.total||TOTAL;return (Number(x.marks)||0)/t>(m?m.marks/m.t:-1)?{marks:Number(x.marks)||0,t}:m},null);$('bestScore').textContent=b?b.marks+' / '+b.t:'0 / '+TOTAL}updateResume()}
function startQuiz(){qi=0;ans=Array(TOTAL).fill(null);time=0;reviewIndex=0;running=true;clearInterval(timerHandle);go('quiz');render();saveProgress();timerHandle=setInterval(tick,1000)}
function pKey(){return 'gyankshetraProgress_'+TEST_ID+'_'+(localStorage.getItem('gyankshetraUserId')||'')}
function saveProgress(){if(running)localStorage.setItem(pKey(),JSON.stringify({qi,ans,time}))}
function getProgress(){try{const p=JSON.parse(localStorage.getItem(pKey())||'null');return p&&Array.isArray(p.ans)&&p.time>0?p:null}catch(e){return null}}
function pauseQuiz(){if(!running)return;saveProgress();running=false;clearInterval(timerHandle);timerHandle=null}
function tick(){if(time<TIME){time++;renderTimer();if(time>=TIME)finish();else if(time%5===0)saveProgress()}else finish()}
function resumeQuiz(){const p=getProgress();if(!p){startQuiz();return}qi=p.qi;ans=p.ans;time=p.time;running=true;clearInterval(timerHandle);go('quiz');render();timerHandle=setInterval(tick,1000)}
function updateResume(){const p=getUser().logged?getProgress():null;document.querySelectorAll('.resumebtn').forEach(b=>{b.style.display=p?'block':'none';if(p)b.textContent='▶ '+L('resume')+' • '+L('q')+' '+(p.qi+1)+'/'+TOTAL+' • '+fmt(TIME-p.time)})}
function fmt(t){t=Math.max(0,t);return String(Math.floor(t/60)).padStart(2,'0')+':'+String(t%60).padStart(2,'0')}
function renderTimer(){$('timer').textContent=fmt(TIME-time);$('timer').parentElement.classList.toggle('low',TIME-time<=60)}
function render(){const q=Q(qi);$('qn').textContent=(qi+1)+'/'+TOTAL;$('question').textContent=q[0];$('options').innerHTML=q[1].map((o,i)=>`<div class="option ${ans[qi]===i?'sel':''}" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</div>`).join('');$('nextBtn').textContent=qi===TOTAL-1?L('submit'):L('next');$('starBtn').textContent=saved.includes(qi)?'★':'☆';$('starBtn').classList.toggle('on',saved.includes(qi));renderTimer()}
function submitNow(){const left=ans.filter(a=>a===null).length;if(confirm(L('submitQ')+(left?'\n('+left+' '+L('skipped')+')':'')))finish()}
function choose(i){ans[qi]=i;saveProgress();render()}
function next(){if(qi<TOTAL-1){qi++;saveProgress();render()}else if(confirm(L('submitQ')))finish()}
function prev(){if(qi>0){qi--;saveProgress();render()}}
function toggleSave(){const p=saved.indexOf(qi);if(p>=0)saved.splice(p,1);else saved.push(qi);localStorage.setItem('gyankshetraSaved_'+TEST_ID,JSON.stringify(saved));render()}

function dotsClick(e,i){e.stopPropagation();const c=e.target.parentNode,had=c.querySelector('.dmenu');document.querySelectorAll('.dmenu').forEach(x=>x.remove());if(had)return;const m=document.createElement('div');m.className='dmenu';m.textContent=L('del');m.onclick=ev=>{ev.stopPropagation();saved=saved.filter(x=>x!==i);localStorage.setItem('gyankshetraSaved_'+TEST_ID,JSON.stringify(saved));renderSaved()};c.appendChild(m)}

const BUILTIN_NOTES=[{id:'oxidation',title:'Chemistry — ऑक्सीकरण (Notes)',html:"<h2>ऑक्सीकरण (Oxidation)<\/h2>\n<h3>1. परिभाषा<\/h3>\n<p>किसी पदार्थ में <b>ऑक्सीजन का जुड़ना<\/b> या <b>हाइड्रोजन का हटना<\/b> ऑक्सीकरण कहलाता है। इलेक्ट्रॉन के आधार पर: जब कोई परमाणु या आयन <b>इलेक्ट्रॉन त्यागता<\/b> है और उसका ऑक्सीकरण अंक बढ़ता है, तो वह ऑक्सीकृत होता है।<\/p>\n<h3>2. ऑक्सीकरण और अपचयन की तुलना<\/h3>\n<table><tr><th>आधार<\/th><th>ऑक्सीकरण<\/th><th>अपचयन<\/th><\/tr>\n<tr><td>ऑक्सीजन<\/td><td>जुड़ना<\/td><td>हटना<\/td><\/tr>\n<tr><td>हाइड्रोजन<\/td><td>हटना<\/td><td>जुड़ना<\/td><\/tr>\n<tr><td>इलेक्ट्रॉन<\/td><td>त्यागना (हानि)<\/td><td>ग्रहण करना (लाभ)<\/td><\/tr>\n<tr><td>ऑक्सीकरण अंक<\/td><td>बढ़ना<\/td><td>घटना<\/td><\/tr><\/table>\n<h3>3. याद रखने की ट्रिक<\/h3>\n<p><b>OIL RIG<\/b> — Oxidation Is Loss, Reduction Is Gain (इलेक्ट्रॉन की)।<\/p>\n<h3>4. रेडॉक्स अभिक्रिया<\/h3>\n<p>जिस अभिक्रिया में ऑक्सीकरण और अपचयन <b>एक साथ<\/b> होते हैं, उसे रेडॉक्स (Redox) अभिक्रिया कहते हैं।<\/p>\n<ul><li>2Mg + O₂ → 2MgO : Mg का ऑक्सीकरण, O₂ का अपचयन।<\/li>\n<li>CuO + H₂ → Cu + H₂O : H₂ का ऑक्सीकरण, CuO का अपचयन।<\/li><\/ul>\n<h3>5. ऑक्सीकारक और अपचायक<\/h3>\n<table><tr><th>पदार्थ<\/th><th>कार्य<\/th><th>उदाहरण<\/th><\/tr>\n<tr><td>ऑक्सीकारक<\/td><td>दूसरे को ऑक्सीकृत करता है, स्वयं अपचयित होता है<\/td><td>O₂, KMnO₄, K₂Cr₂O₇<\/td><\/tr>\n<tr><td>अपचायक<\/td><td>दूसरे का अपचयन करता है, स्वयं ऑक्सीकृत होता है<\/td><td>H₂, C, Zn, Mg<\/td><\/tr><\/table>\n<h3>6. दैनिक जीवन में ऑक्सीकरण<\/h3>\n<ul><li><b>जंग लगना:<\/b> हवा और नमी में लोहे पर भूरी परत (Fe₂O₃·xH₂O) बनती है।<\/li>\n<li><b>दहन:<\/b> ईंधन का ऑक्सीजन से ऑक्सीकरण, ऊष्मा और प्रकाश निकलता है।<\/li>\n<li><b>श्वसन:<\/b> कोशिकाओं में ग्लूकोज़ का ऑक्सीकरण, ऊर्जा मिलती है।<\/li>\n<li><b>विकृतगंधिता (Rancidity):<\/b> तेल या वसा का ऑक्सीकरण, खाने में बुरी गंध और स्वाद आता है।<\/li>\n<li><b>ताँबे पर हरी परत:<\/b> हवा और नमी से ताँबे का संक्षारण।<\/li><\/ul>\n<h3>7. ऑक्सीकरण से बचाव<\/h3>\n<ul><li>पेंट, तेल या ग्रीस लगाना।<\/li>\n<li>गैल्वनीकरण: लोहे पर जस्ते की परत चढ़ाना।<\/li>\n<li>मिश्रधातु बनाना, जैसे स्टेनलेस स्टील।<\/li>\n<li>खाद्य पदार्थों में एंटीऑक्सीडेंट मिलाना।<\/li>\n<li>चिप्स के पैकेट में नाइट्रोजन गैस भरना।<\/li><\/ul>\n<h3>8. ऑक्सीकरण अंक के मुख्य नियम<\/h3>\n<ol><li>मुक्त तत्व का ऑक्सीकरण अंक 0 होता है।<\/li>\n<li>सरल आयन का ऑक्सीकरण अंक उसके आवेश के बराबर होता है (Na⁺ = +1)।<\/li>\n<li>यौगिक में सभी परमाणुओं के ऑक्सीकरण अंकों का योग 0 होता है।<\/li>\n<li>ऑक्सीजन प्रायः −2 (पेरॉक्साइड में −1) होती है।<\/li>\n<li>हाइड्रोजन प्रायः +1 (धात्विक हाइड्राइड में −1) होता है।<\/li><\/ol>\n<h3>9. परीक्षा के लिए महत्वपूर्ण बिंदु<\/h3>\n<ul><li>ऑक्सीकरण और अपचयन हमेशा साथ-साथ होते हैं।<\/li>\n<li>मैग्नीशियम रिबन जलने पर तेज़ सफ़ेद रोशनी के साथ MgO बनाता है।<\/li>\n<li>धातुओं के ऑक्साइड प्रायः क्षारीय और अधातुओं के ऑक्साइड प्रायः अम्लीय होते हैं।<\/li>\n<li>H₂O₂ ऑक्सीकारक और अपचायक, दोनों की तरह व्यवहार कर सकता है।<\/li><\/ul>"}];

function ghRepo(){return location.pathname.split('/').filter(Boolean)[0]||'Gyankshetra-app'}
function adminTok(){try{return localStorage.getItem('gyankshetraAdminToken')||''}catch(e){return ''}}
function isAdmin(){return !!adminTok()&&localStorage.getItem('gyankshetraAdminOk')==='1'}
function gh(path,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+adminTok(),'Accept':'application/vnd.github+json'},opt.headers||{});return fetch('https://api.github.com'+path,opt)}
function b64d(c){return new TextDecoder().decode(Uint8Array.from(atob(c.replace(/\n/g,'')),x=>x.charCodeAt(0)))}
function b64e(t){return btoa(unescape(encodeURIComponent(t)))}
const SLIDE_K=['s_sci','s_soc','s_bgk','s_ca'];let bIdx=0,bPause=0;
function bStep(){const c=$('bTrack').children;return c.length>1?c[1].offsetLeft-c[0].offsetLeft:0}
function bDot(i){document.querySelectorAll('#bDots i').forEach((d,k)=>d.classList.toggle('on',k===i))}
function slideBuild(){const t=$('bTrack');if(!t)return;const msg=k=>escH(L('slideP').replace('{x}',L(k)));
t.innerHTML=SLIDE_K.concat([SLIDE_K[0]]).map(k=>`<div class="banner bslide" onclick="openSection('${k}')"><span>🎯</span><div class="btxt"><b>${escH(L('bannerT'))}</b><small class="slide">${msg(k)}</small></div><button class="bstart"><span>${escH(L('startT'))}</span><i>→</i></button></div>`).join('');
$('bDots').innerHTML=SLIDE_K.map(()=>'<i></i>').join('');const st=bStep();t.style.scrollSnapType='none';t.scrollLeft=bIdx*st;requestAnimationFrame(()=>t.style.scrollSnapType='');bDot(bIdx)}
function openSection(k){openSub.tests=k;go('tests');renderLists()}
function bNext(){const t=$('bTrack'),st=bStep();if(!st)return;t.scrollTo({left:(Math.round(t.scrollLeft/st)+1)*st,behavior:'smooth'})}
(function(){const t=$('bTrack');let tm;t.addEventListener('scroll',()=>{const st=bStep();if(!st)return;bDot(Math.round(t.scrollLeft/st)%4);clearTimeout(tm);tm=setTimeout(()=>{let i=Math.round(t.scrollLeft/st);if(i>=SLIDE_K.length){t.style.scrollSnapType='none';t.scrollLeft=0;requestAnimationFrame(()=>t.style.scrollSnapType='');i=0}bIdx=i;bDot(i)},100)},{passive:true});
['touchstart','mousedown','wheel'].forEach(e=>t.addEventListener(e,()=>{bPause=Date.now()+5000},{passive:true}))})();
setInterval(()=>{if(cur==='home'&&Date.now()>bPause)bNext()},2800);
function goApp(){if(ROOT)location.href=ROOT+'index.html';else go('home')}
function nav_admin(){$('drawer').classList.remove('open');openAdmin()}
function openAdmin(){if(isAdmin()){if(confirm('Admin Logout?'))adminLogout();return}$('tokInput').value='';$('adminModal').classList.add('open')}
function closeAdmin(){$('adminModal').classList.remove('open')}
function adminLogout(){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');adminUI();renderLists()}
function adminUI(){const b=$('adminMenuBtn');if(b)b.textContent=isAdmin()?'🚪 '+L('adminOut'):'🔐 '+L('adminIn')}
async function adminLogin(){const t=$('tokInput').value.trim();if(!t)return;localStorage.setItem('gyankshetraAdminToken',t);try{const u=await (await gh('/user')).json();if(!u.login||u.login.toLowerCase()!==ADMIN_USER)throw 'ID';const r=await (await gh('/repos/'+ghOwner()+'/'+ghRepo())).json();if(!r.permissions||!r.permissions.push)throw 'perm';localStorage.setItem('gyankshetraAdminOk','1');closeAdmin();adminUI();renderLists();alert('✅ Admin login: '+u.login)}catch(e){localStorage.removeItem('gyankshetraAdminToken');localStorage.removeItem('gyankshetraAdminOk');alert('❌ Login nahi hua. Token ya permission galat hai.')}}
function repoPath(u){try{const x=new URL(u,location.href);if(x.origin!==location.origin)return null;let p=decodeURIComponent(x.pathname);const base='/'+ghRepo()+'/';if(location.hostname.endsWith('.github.io')){if(!p.startsWith(base))return null;p=p.slice(base.length)}else p=p.replace(/^\//,'');return p}catch(e){return null}}
async function ghErr(r){let m='';try{m=(await r.json()).message||''}catch(e){}return 'HTTP '+r.status+(m?' — '+m:'')}
async function delTest(u){if(!isAdmin())return;const t=REG.tests.find(x=>x.url===u);if(!t||!confirm('"'+t.title+'" delete karna hai?'))return;const o=ghOwner(),r=ghRepo(),jp='content/generated_tests.json',ep='/repos/'+o+'/'+r+'/contents/'+jp,J={'Content-Type':'application/json'};try{
for(let k=0;k<2;k++){const g=await gh(ep+'?ref='+Date.now());if(!g.ok)throw await ghErr(g);const gj=await g.json();const arr=JSON.parse(b64d(gj.content));if(!Array.isArray(arr))throw 'content/generated_tests.json ka format galat hai';const n=arr.filter(x=>x.url!==u);
const p=await gh(ep,{method:'PUT',headers:J,body:JSON.stringify({message:'Delete test: '+t.title,content:b64e(JSON.stringify(n,null,2)),sha:gj.sha})});if(p.ok)break;if(p.status===409&&k===0)continue;throw await ghErr(p)}
const fp=repoPath(u);if(fp&&/\.(html|json)$/.test(fp)&&fp!=='index.html'&&!fp.startsWith('content/')&&!fp.includes('..')){const fe='/repos/'+o+'/'+r+'/contents/'+fp.split('/').map(encodeURIComponent).join('/');const f=await gh(fe);if(f.ok){const fj=await f.json();if(fj.sha)await gh(fe,{method:'DELETE',headers:J,body:JSON.stringify({message:'Delete test file: '+fp,sha:fj.sha})})}}
REG.tests=REG.tests.filter(x=>x.url!==u);try{localStorage.setItem('gyankshetraReg',JSON.stringify(REG))}catch(e){}renderLists();alert('🗑 Delete ho gaya.')}catch(e){const m=String(e);alert('❌ Delete nahi hua: '+m+(/40[134]|not accessible|permission|Bad credentials/i.test(m)?'\n\nToken me is repo ke liye "Contents: Read and write" permission dein (GitHub → Settings → Developer settings → Fine-grained tokens), phir Admin Logout karke naya token daalein.':''))}}
function builtinCard(){return `<div class="card"><b>🧪 ${TEST_NAME}</b><small>${L('testMeta')}</small><button class="primary" onclick="requireUser(startQuiz)">${L('startTest')}</button></div>`}
function subjBlock(page){const list=SUBJS[page],keys=list.map(s=>s[0]).concat(['other']);
return keys.map(k=>{const s=list.find(x=>x[0]===k)||['sOther','📂',0];const items=regItems(page,k),own=(OWN[page]===k)?1:0,n=items.length+own;
if(k==='other'&&!n)return '';
const open=openSub[page]===k;
return `<div class="examrow" onclick="${n?`toggleSub('${page}','${k}')`:'soon()'}"><span>${s[1]}</span><div><b>${L(s[0])}</b><small>${n?n+' '+L('testsWord'):L('comingSub')}</small></div><i>${open?'⌄':'›'}</i></div>`+(open&&n?(own?builtinRow():'')+items.map(itemRow).join(''):'')}).join('')}
function itemRow(t){return `<div class="qrow" data-u="${escH(t.url)}" onclick="location.href=this.dataset.u"><span>${escH(t.title)}</span>${isAdmin()?`<button class="qdel" data-u="${escH(t.url)}" onclick="event.stopPropagation();delTest(this.dataset.u)">🗑</button>`:''}<i>›</i></div>`}
function builtinRow(){return `<div class="qrow" onclick="requireUser(startQuiz)"><span>🧪 ${escH(TEST_NAME)}</span><i>›</i></div>`}
function toggleSub(p,k){openSub[p]=openSub[p]===k?null:k;renderLists()}
function renderLists(){
const all=REG.tests.slice(0,3);$('homeNew').innerHTML=all.length?all.map(itemCard).join(''):`<div class="card"><small>${L('noNew')}</small></div>`;
$('testsBody').innerHTML=subjBlock('tests');$('practiceBody').innerHTML=subjBlock('practice');renderStudy();renderExam()}
function setExam(x){try{localStorage.setItem('gyankshetraExam',x)}catch(e){}renderExam()}
function renderExam(){let ex='STET';try{ex=localStorage.getItem('gyankshetraExam')||'STET'}catch(e){}document.querySelectorAll('#examChips button').forEach(b=>b.classList.toggle('on',b.dataset.ex===ex))}
/* Test UI: palette + swipe */
function openPalette(){$('palGrid').innerHTML=questions.map((q,i)=>`<button class="${ans[i]!==null&&ans[i]!==undefined?'a':''} ${i===qi?'cur':''}" onclick="jumpQ(${i})">${i+1}</button>`).join('');$('palette').classList.add('open')}
function closePalette(){$('palette').classList.remove('open')}
function jumpQ(i){qi=i;closePalette();saveProgress();render()}
(function(){let x0=0,y0=0;const w=$('quiz');w.addEventListener('touchstart',e=>{x0=e.touches[0].clientX;y0=e.touches[0].clientY},{passive:true});w.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-x0,dy=e.changedTouches[0].clientY-y0;if(Math.abs(dx)<50||Math.abs(dx)<Math.abs(dy)*1.3)return;if((dx>0)===SWIPE_RIGHT_IS_NEXT){if(qi<TOTAL-1){qi++;saveProgress();render()}}else prev()},{passive:true})})();
/* Result */
let lastRes={c:0,w:0,s:0},lastAttempt=1;
function paintResult(){const {c,w,s}=lastRes,a=c/TOTAL*100,b=a+w/TOTAL*100;$('donut').style.background=`conic-gradient(#1f9d55 0 ${a}%,#e03a3a ${a}% ${b}%,#c9d1dc ${b}% 100%)`;const u=getUser();$('resName').textContent='👤 '+(u.logged?u.name:L('student'));$('reTag').classList.toggle('on',lastAttempt>1);$('anBtn').textContent='📚 Analysis';$('tipHint').textContent=({hi:'किसी भी बॉक्स पर टैप करें — उसका Analysis खुलेगा',en:'Tap any box to open its analysis',bh:'कवनो बॉक्स पर टैप करीं — ओकर विश्लेषण खुली'})[currentLang];$('backBtn').textContent=({hi:'🏠 ऐप पर वापस जाएँ',en:'🏠 Back to App',bh:'🏠 ऐप पर लौटीं'})[currentLang]}
function shareResult(){const {c,w,s}=lastRes,u=getUser(),p=Math.round(c/TOTAL*100),link=location.href.split('#')[0].split('?')[0];
const text=`${L('shHead')}\n👤 ${u.logged?u.name:L('student')}\n🏆 ${L('marks')}: ${c}/${TOTAL} (${p}%)\n✅ ${L('correct')}: ${c}  ❌ ${L('wrong')}: ${w}  ⏭ ${L('skipped')}: ${s}\n📢 ${L('shTg')}: https://t.me/gyankshetra\n🔗 ${L('shLink')}: ${link}`;
window.open('https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(text),'_blank')}
/* Download */
function downloadTest(){const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');const t='<!DOCTYPE html><html lang="hi"><head><meta charset="utf-8"><title>Gyankshetra</title></head><body style="font-family:Arial,sans-serif;max-width:700px;margin:auto;padding:16px"><h1>Gyankshetra — '+TEST_NAME.replace(/</g,'&lt;')+'</h1>'+questions.map((q0,i)=>{const q=Q(i);return `<h3>${i+1}. ${esc(q[0])}</h3><ol type="A">${q[1].map(o=>`<li>${esc(o)}</li>`).join('')}</ol><p><b>${esc(L('right'))}:</b> ${String.fromCharCode(65+q[2])}. ${esc(q[1][q[2]])}</p><ul>${q[3].map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`}).join('<hr>')+'<p>📢 https://t.me/gyankshetra</p></body></html>';const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:'text/html'}));a.download='gyankshetra-physics-gravitation.html';document.body.appendChild(a);a.click();a.remove();$('drawer').classList.remove('open')}
applyLanguage();loadStudy();loadReg();adminUI();slideBuild();go('home');if(ROOT){const p=getProgress();requireUser(getUser().logged&&p?resumeQuiz:startQuiz)}
</script>
